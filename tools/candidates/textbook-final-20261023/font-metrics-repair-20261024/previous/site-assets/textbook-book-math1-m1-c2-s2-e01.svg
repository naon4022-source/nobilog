<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" font-size="40" fill="#203348"><text x="90" y="100" font-size="48">分数の形の式 × 数｜4と8で約分</text><text x="800" y="215" text-anchor="middle">4等分の1切れを8倍 → 2枚分</text><circle cx="325" cy="455" r="140" fill="#faf1df" stroke="#203348" stroke-width="4"/><path d="M325 455V315A140 140 0 0 1 465 455Z" fill="#7fa88f" stroke="#203348" stroke-width="4"/><path d="M185 455H465M325 315V595" stroke="#203348" stroke-width="4"/><circle cx="1000" cy="455" r="140" fill="#faf1df" stroke="#203348" stroke-width="4"/><circle cx="1000" cy="455" r="135" fill="#7fa88f"/><path d="M860 455H1140M1000 315V595" stroke="#203348" stroke-width="4"/><circle cx="1370" cy="455" r="140" fill="#faf1df" stroke="#203348" stroke-width="4"/><circle cx="1370" cy="455" r="135" fill="#7fa88f"/><path d="M1230 455H1510M1370 315V595" stroke="#203348" stroke-width="4"/><path d="M530 455H790l-25 -18m25 18l-25 18" fill="none" stroke="#386a9a" stroke-width="6"/><text x="650" y="390" text-anchor="middle">×8</text><g data-stacked-fraction="(3x−1)/4×8＝2(3x−1)" aria-label="(3x−1)/4×8＝2(3x−1)" role="img" font-size="56" text-anchor="start"><title>(3x−1)/4×8＝2(3x−1)</title><text x="651.7656250000001" y="699.28" font-size="41.44" text-anchor="middle">(3x−1)</text><line x1="591.8353125000001" x2="711.6959375" y1="716" y2="716" stroke="rgb(32, 51, 72)" stroke-width="2.52"/><text x="651.7656250000001" y="759.72" font-size="41.44" text-anchor="middle">4</text><text x="718.4159375" y="730" font-size="56" text-anchor="start">×8＝2(3x−1)</text></g><text x="800" y="840" text-anchor="middle">分子は、かっこでひとまとめにしたまま。</text></g></svg>
