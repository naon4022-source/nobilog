<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>この節の地図</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="588.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">何が一定か で 仕分ける</text><rect x="80.0" y="160.0" width="690.0" height="560.0" rx="24" fill="white" stroke="#1f5fa8" stroke-width="5"/><rect x="80.0" y="160.0" width="690.0" height="70.0" rx="24" fill="#1f5fa8" stroke="none" stroke-width="4"/><rect x="80.0" y="200.0" width="690.0" height="30.0" rx="0" fill="#1f5fa8" stroke="none" stroke-width="4"/><text x="425.0" y="210.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">比例 y＝ax</text><text x="425.0" y="310.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">1あたりが一定</text><text x="425.0" y="390.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">・紙 1枚の重さ</text><text x="425.0" y="470.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">・歩く速さ（道のり）</text><text x="425.0" y="550.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">・1冊の値段（代金）</text><rect x="830.0" y="160.0" width="690.0" height="560.0" rx="24" fill="white" stroke="#e07a1f" stroke-width="5"/><rect x="830.0" y="160.0" width="690.0" height="70.0" rx="24" fill="#e07a1f" stroke="none" stroke-width="4"/><rect x="830.0" y="200.0" width="690.0" height="30.0" rx="0" fill="#e07a1f" stroke="none" stroke-width="4"/><g data-stacked-fraction="反比例 y＝a/x" aria-label="反比例 y＝a/x" role="img" font-size="40" fill="white" font-weight="800" text-anchor="start"><title>反比例 y＝a/x</title><text x="1076.3559375" y="204" font-size="36" text-anchor="start">反比例 y＝</text><text x="1260.5" y="183.68" font-size="26.64" text-anchor="middle">a</text><line x1="1251.6759375" x2="1269.3240625" y1="195" y2="195" stroke="rgb(255, 255, 255)" stroke-width="1.6199999999999999"/><text x="1260.5" y="223.32" font-size="26.64" text-anchor="middle">x</text></g><text x="1175.0" y="310.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">全体の量が一定</text><text x="1175.0" y="390.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">・同じ道のりの速さと時間</text><text x="1175.0" y="470.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">・仕事の人数と時間</text><text x="1175.0" y="550.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">・かみ合う歯車</text></g></svg>
