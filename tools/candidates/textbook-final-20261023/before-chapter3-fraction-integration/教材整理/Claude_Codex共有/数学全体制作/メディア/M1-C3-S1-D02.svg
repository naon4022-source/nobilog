<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>反対の計算の早見表</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="808.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">反対の計算で x を ひとりにする</text><rect x="80.0" y="150.0" width="1440.0" height="90.0" rx="16" fill="#1f5fa8" stroke="none" stroke-width="4"/><text x="300.0" y="210.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">方程式</text><text x="700.0" y="210.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">x についている計算</text><text x="1080.0" y="210.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">反対の計算</text><text x="1380.0" y="210.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">答え</text><rect x="80.0" y="255.0" width="1440.0" height="125.0" rx="14" fill="white" stroke="#c9d6e8" stroke-width="3"/><text x="300.0" y="335.0" font-size="46" fill="#203348" text-anchor="middle" font-weight="700">x−8＝−3</text><text x="700.0" y="335.0" font-size="46" fill="#c0392b" text-anchor="middle" font-weight="700">−8</text><text x="1080.0" y="335.0" font-size="44" fill="#2a8a5b" text-anchor="middle" font-weight="700">両辺に ＋8</text><rect x="1290.0" y="280.0" width="180.0" height="75.0" rx="12" fill="#e8f0fa" stroke="#9aa9bb" stroke-width="3" stroke-dasharray="10 8"/><text x="1380.0" y="335.0" font-size="40" fill="#9aa9bb" text-anchor="middle" font-weight="700">x＝</text><rect x="80.0" y="395.0" width="1440.0" height="125.0" rx="14" fill="white" stroke="#c9d6e8" stroke-width="3"/><text x="300.0" y="475.0" font-size="46" fill="#203348" text-anchor="middle" font-weight="700">x＋15＝6</text><text x="700.0" y="475.0" font-size="46" fill="#c0392b" text-anchor="middle" font-weight="700">＋15</text><text x="1080.0" y="475.0" font-size="44" fill="#2a8a5b" text-anchor="middle" font-weight="700">両辺に −15</text><rect x="1290.0" y="420.0" width="180.0" height="75.0" rx="12" fill="#e8f0fa" stroke="#9aa9bb" stroke-width="3" stroke-dasharray="10 8"/><text x="1380.0" y="475.0" font-size="40" fill="#9aa9bb" text-anchor="middle" font-weight="700">x＝</text><rect x="80.0" y="535.0" width="1440.0" height="125.0" rx="14" fill="white" stroke="#c9d6e8" stroke-width="3"/><text x="300.0" y="615.0" font-size="46" fill="#203348" text-anchor="middle" font-weight="700">x/6＝−2</text><text x="700.0" y="615.0" font-size="46" fill="#c0392b" text-anchor="middle" font-weight="700">÷6</text><text x="1080.0" y="615.0" font-size="44" fill="#2a8a5b" text-anchor="middle" font-weight="700">両辺に ×6</text><rect x="1290.0" y="560.0" width="180.0" height="75.0" rx="12" fill="#e8f0fa" stroke="#9aa9bb" stroke-width="3" stroke-dasharray="10 8"/><text x="1380.0" y="615.0" font-size="40" fill="#9aa9bb" text-anchor="middle" font-weight="700">x＝</text><rect x="80.0" y="675.0" width="1440.0" height="125.0" rx="14" fill="white" stroke="#c9d6e8" stroke-width="3"/><text x="300.0" y="755.0" font-size="46" fill="#203348" text-anchor="middle" font-weight="700">−9x＝63</text><text x="700.0" y="755.0" font-size="46" fill="#c0392b" text-anchor="middle" font-weight="700">×(−9)</text><text x="1080.0" y="755.0" font-size="44" fill="#2a8a5b" text-anchor="middle" font-weight="700">両辺を ÷(−9)</text><rect x="1290.0" y="700.0" width="180.0" height="75.0" rx="12" fill="#e8f0fa" stroke="#9aa9bb" stroke-width="3" stroke-dasharray="10 8"/><text x="1380.0" y="755.0" font-size="40" fill="#9aa9bb" text-anchor="middle" font-weight="700">x＝</text></g></svg>