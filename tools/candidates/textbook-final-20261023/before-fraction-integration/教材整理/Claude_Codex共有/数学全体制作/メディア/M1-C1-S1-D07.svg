<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>数のなかま分け</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="896.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">数を「正・0・負」と「整数か」で分ける</text><rect x="300.0" y="120.0" width="400.0" height="80.0" rx="0" fill="#e3e9f1" stroke="#203348" stroke-width="2"/><text x="500.0" y="174.0" font-size="40" fill="#c0392b" text-anchor="middle" font-weight="800">負の数</text><rect x="700.0" y="120.0" width="400.0" height="80.0" rx="0" fill="#e3e9f1" stroke="#203348" stroke-width="2"/><text x="900.0" y="174.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="800">0</text><rect x="1100.0" y="120.0" width="400.0" height="80.0" rx="0" fill="#e3e9f1" stroke="#203348" stroke-width="2"/><text x="1300.0" y="174.0" font-size="40" fill="#1f5fa8" text-anchor="middle" font-weight="800">正の数</text><rect x="40.0" y="200.0" width="260.0" height="200.0" rx="0" fill="#e3e9f1" stroke="#203348" stroke-width="2"/><text x="170.0" y="314.0" font-size="36" fill="#203348" text-anchor="middle" font-weight="700">整数</text><rect x="40.0" y="400.0" width="260.0" height="200.0" rx="0" fill="#e3e9f1" stroke="#203348" stroke-width="2"/><text x="170.0" y="514.0" font-size="36" fill="#203348" text-anchor="middle" font-weight="700">整数でない</text><rect x="300.0" y="200.0" width="400.0" height="200.0" rx="0" fill="white" stroke="#203348" stroke-width="2"/><text x="500.0" y="314.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">−4、−1</text><rect x="700.0" y="200.0" width="400.0" height="200.0" rx="0" fill="white" stroke="#203348" stroke-width="2"/><text x="900.0" y="314.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">0</text><rect x="1100.0" y="200.0" width="400.0" height="200.0" rx="0" fill="white" stroke="#203348" stroke-width="2"/><text x="1300.0" y="314.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">+2、5</text><rect x="300.0" y="400.0" width="400.0" height="200.0" rx="0" fill="white" stroke="#203348" stroke-width="2"/><text x="500.0" y="514.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">−0.5、−⅓</text><rect x="700.0" y="400.0" width="400.0" height="200.0" rx="0" fill="white" stroke="#203348" stroke-width="2"/><text x="900.0" y="514.0" font-size="40" fill="#9aa9bb" text-anchor="middle" font-weight="700">（なし）</text><rect x="1100.0" y="400.0" width="400.0" height="200.0" rx="0" fill="white" stroke="#203348" stroke-width="2"/><text x="1300.0" y="514.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">0.5、⅓</text><rect x="1108.0" y="208.0" width="384.0" height="184.0" rx="14" fill="none" stroke="#2a8a5b" stroke-width="6" stroke-dasharray="14 10"/><text x="1300.0" y="376.0" font-size="32" fill="#2a8a5b" text-anchor="middle" font-weight="800">自然数</text><text x="800.0" y="720.0" font-size="38" fill="#2a8a5b" text-anchor="middle" font-weight="700">自然数 ＝ 正の整数（0 は入らない）</text><text x="800.0" y="790.0" font-size="32" fill="#9aa9bb" text-anchor="middle" font-weight="700">+6/3 は 2 と同じなので 整数</text></g></svg>