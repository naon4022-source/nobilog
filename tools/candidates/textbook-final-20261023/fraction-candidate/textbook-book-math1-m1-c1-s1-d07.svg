<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>数のなかま分け</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="896.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">数を「正・0・負」と「整数か」で分ける</text><rect x="300.0" y="120.0" width="400.0" height="80.0" rx="0" fill="#e3e9f1" stroke="#203348" stroke-width="2"/><text x="500.0" y="174.0" font-size="40" fill="#c0392b" text-anchor="middle" font-weight="800">負の数</text><rect x="700.0" y="120.0" width="400.0" height="80.0" rx="0" fill="#e3e9f1" stroke="#203348" stroke-width="2"/><text x="900.0" y="174.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="800">0</text><rect x="1100.0" y="120.0" width="400.0" height="80.0" rx="0" fill="#e3e9f1" stroke="#203348" stroke-width="2"/><text x="1300.0" y="174.0" font-size="40" fill="#1f5fa8" text-anchor="middle" font-weight="800">正の数</text><rect x="40.0" y="200.0" width="260.0" height="200.0" rx="0" fill="#e3e9f1" stroke="#203348" stroke-width="2"/><text x="170.0" y="314.0" font-size="36" fill="#203348" text-anchor="middle" font-weight="700">整数</text><rect x="40.0" y="400.0" width="260.0" height="200.0" rx="0" fill="#e3e9f1" stroke="#203348" stroke-width="2"/><text x="170.0" y="514.0" font-size="36" fill="#203348" text-anchor="middle" font-weight="700">整数でない</text><rect x="300.0" y="200.0" width="400.0" height="200.0" rx="0" fill="white" stroke="#203348" stroke-width="2"/><text x="500.0" y="314.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">−4、−1</text><rect x="700.0" y="200.0" width="400.0" height="200.0" rx="0" fill="white" stroke="#203348" stroke-width="2"/><text x="900.0" y="314.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">0</text><rect x="1100.0" y="200.0" width="400.0" height="200.0" rx="0" fill="white" stroke="#203348" stroke-width="2"/><text x="1300.0" y="314.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">+2、5</text><rect x="300.0" y="400.0" width="400.0" height="200.0" rx="0" fill="white" stroke="#203348" stroke-width="2"/><g data-stacked-fraction="−0.5、−⅓" aria-label="−0.5、−⅓" role="img" font-size="40" fill="#203348" font-weight="700" text-anchor="start"><title>−0.5、−⅓</title><text x="417.596875" y="514" font-size="40" text-anchor="start">−0.5、−</text><text x="567.796875" y="492.2" font-size="29.6" text-anchor="middle">1</text><line x1="557.9906249999999" x2="577.603125" y1="504" y2="504" stroke="rgb(32, 51, 72)" stroke-width="1.7999999999999998"/><text x="567.796875" y="534.8" font-size="29.6" text-anchor="middle">3</text></g><rect x="700.0" y="400.0" width="400.0" height="200.0" rx="0" fill="white" stroke="#203348" stroke-width="2"/><text x="900.0" y="514.0" font-size="40" fill="#52657b" text-anchor="middle" font-weight="700">（なし）</text><rect x="1100.0" y="400.0" width="400.0" height="200.0" rx="0" fill="white" stroke="#203348" stroke-width="2"/><g data-stacked-fraction="0.5、⅓" aria-label="0.5、⅓" role="img" font-size="40" fill="#203348" font-weight="700" text-anchor="start"><title>0.5、⅓</title><text x="1240.39375" y="514" font-size="40" text-anchor="start">0.5、</text><text x="1345" y="492.2" font-size="29.6" text-anchor="middle">1</text><line x1="1335.19375" x2="1354.80625" y1="504" y2="504" stroke="rgb(32, 51, 72)" stroke-width="1.7999999999999998"/><text x="1345" y="534.8" font-size="29.6" text-anchor="middle">3</text></g><rect x="1108.0" y="208.0" width="384.0" height="184.0" rx="14" fill="none" stroke="#2a8a5b" stroke-width="6" stroke-dasharray="14 10"/><text x="1300.0" y="376.0" font-size="32" fill="#2a8a5b" text-anchor="middle" font-weight="800">自然数</text><text x="800.0" y="720.0" font-size="38" fill="#2a8a5b" text-anchor="middle" font-weight="700"