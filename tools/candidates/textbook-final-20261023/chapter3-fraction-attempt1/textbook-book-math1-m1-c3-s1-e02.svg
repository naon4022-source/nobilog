<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>分数・小数・かっこを整える</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="544.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">係数を整数に そろえる</text><rect x="70.0" y="150.0" width="700.0" height="600.0" rx="24" fill="white" stroke="#1f5fa8" stroke-width="5"/><rect x="70.0" y="150.0" width="700.0" height="70.0" rx="24" fill="#1f5fa8" stroke="none" stroke-width="4"/><rect x="70.0" y="190.0" width="700.0" height="30.0" rx="0" fill="#1f5fa8" stroke="none" stroke-width="4"/><text x="420.0" y="200.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">分数 → ×12</text><rect x="830.0" y="150.0" width="700.0" height="600.0" rx="24" fill="white" stroke="#e07a1f" stroke-width="5"/><rect x="830.0" y="150.0" width="700.0" height="70.0" rx="24" fill="#e07a1f" stroke="none" stroke-width="4"/><rect x="830.0" y="190.0" width="700.0" height="30.0" rx="0" fill="#e07a1f" stroke="none" stroke-width="4"/><text x="1180.0" y="200.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">小数 → ×10</text><g data-stacked-fraction="(x＋1)/4 ＝ (2/3)x − 1" aria-label="(x＋1)/4 ＝ (2/3)x − 1" role="img" font-size="44" fill="#203348" font-weight="700" text-anchor="start"><title>(x＋1)/4 ＝ (2/3)x − 1</title><text x="316.2440625" y="305.72" font-size="32.56" text-anchor="middle">(x＋1)</text><line x1="270.19781249999994" x2="362.2903125" y1="319" y2="319" stroke="rgb(32, 51, 72)" stroke-width="1.98"/><text x="316.2440625" y="353.28" font-size="32.56" text-anchor="middle">4</text><text x="367.5703125" y="330" font-size="44" text-anchor="start"> ＝ (</text><text x="453.2871875" y="305.72" font-size="32.56" text-anchor="middle">2</text><line x1="442.5065625" x2="464.06781250000006" y1="319" y2="319" stroke="rgb(32, 51, 72)" stroke-width="1.98"/><text x="453.2871875" y="353.28" font-size="32.56" text-anchor="middle">3</text><text x="469.34781250000003" y="330" font-size="44" text-anchor="start">)x − 1</text></g><text x="420.0" y="420.0" font-size="38" fill="#1f5fa8" text-anchor="middle" font-weight="700">×12   ×12   ×12</text><line x1="420.0" y1="450.0" x2="420.0" y2="520.0" stroke="#1f5fa8" stroke-width="6" stroke-linecap="round"/><polygon points="420.0,520.0 412.2,503.8 427.8,503.8" fill="#1f5fa8" stroke="none" stroke-width="4" stroke-linejoin="round"/><text x="420.0" y="600.0" font-size="46" fill="#203348" text-anchor="middle" font-weight="700">3(x＋1) ＝ 8x − 12</text><text x="420.0" y="690.0" font-size="36" fill="#1f5fa8" text-anchor="middle" font-weight="700">すべての項にかける</text><text x="1180.0" y="330.0" font-size="44" fill="#203348" text-anchor="middle" font-weight="700">0.6x − 1.5 ＝ 0.1x ＋ 1</text><text x="1180.0" y="420.0" font-size="38" fill="#e07a1f" text-anchor="middle" font-weight="700">×10  ×10   ×10  ×10</text><line x1="1180.0" y1="450.0" x2="1180.0" y2="520.0" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/><polygon points="1180.0,520.0 1172.2,503.8 1187.8,503.8" fill="#e07a1f" stroke="none" stroke-width="4" stroke-linejoin="round"/><text x="1180.0" y="600.0" font-size="46" fill="#203348" text-anchor="middle" font-weight="700">6x − 15 ＝ x ＋ 10</text><text x="1180.0" y="690.0" font-size="36" fill="#e07a1f" text-anchor="middle" font-weight="700">整数だけの式になる</text></g></svg>
