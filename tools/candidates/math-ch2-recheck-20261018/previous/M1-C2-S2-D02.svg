<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348" font-size="40"><text x="90" y="100" font-size="48">式どうしをひくときは、式を丸ごとかっこに入れる</text><rect x="100" y="230" width="1400" height="210" rx="22" fill="white" stroke="#397052" stroke-width="5"/><text x="200" y="355" font-size="65" fill="#397052">○</text><text x="850" y="355" text-anchor="middle" font-size="60">(3x−8)−(−5x+2)</text><rect x="100" y="505" width="1400" height="200" rx="22" fill="white" stroke="#ac4e41" stroke-width="5" stroke-dasharray="15 9"/><text x="200" y="630" font-size="65" fill="#ac4e41">✗</text><text x="850" y="630" text-anchor="middle" font-size="60">3x−8−(−5x)+2</text><ellipse cx="1115" cy="614" rx="105" ry="66" stroke="#ac4e41" stroke-width="5" fill="none"/><text x="800" y="820" text-anchor="middle">+2 も、ひく式にふくまれる。かっこを忘れない。</text></g></svg>