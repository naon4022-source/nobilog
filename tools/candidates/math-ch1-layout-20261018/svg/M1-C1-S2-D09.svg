<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>四則と集合の○×表</title><desc>自然数・整数・数全体の3行と、加法・減法・乗法・除法の4列。解答欄はすべて空白。</desc><rect width="1600" height="900" fill="#f6f8fc" /><g font-family="Hiragino Sans,sans-serif" fill="#203348"><rect x="45" y="35" width="1510" height="120" rx="24" fill="#e8f0fa" /><text x="90" y="113" font-size="48" font-weight="700">四則と集合の○×表</text><text x="800" y="200" font-size="40" text-anchor="middle">「いつでもできるか」の調べ方</text><text x="800" y="245" font-size="36" text-anchor="middle">その集合の数を2つ選んで、計算してみる。</text><text x="800" y="287" font-size="34" text-anchor="middle">（0 でわることは除く）</text><rect x="470" y="310" width="230" height="110" fill="#e8f0fa" stroke="#203348" stroke-width="4" /><text x="585" y="380" font-size="44" text-anchor="middle">加法</text><rect x="700" y="310" width="230" height="110" fill="#e8f0fa" stroke="#203348" stroke-width="4" /><text x="815" y="380" font-size="44" text-anchor="middle">減法</text><rect x="930" y="310" width="230" height="110" fill="#e8f0fa" stroke="#203348" stroke-width="4" /><text x="1045" y="380" font-size="44" text-anchor="middle">乗法</text><rect x="1160" y="310" width="230" height="110" fill="#e8f0fa" stroke="#203348" stroke-width="4" /><text x="1275" y="380" font-size="44" text-anchor="middle">除法</text><rect x="115" y="420" width="355" height="150" fill="#edf1f5" stroke="#203348" stroke-width="4" /><text x="292" y="515" font-size="44" text-anchor="middle">自然数</text><rect x="470" y="420" width="230" height="150" fill="white" stroke="#203348" stroke-width="4" /><rect x="700" y="420" width="230" height="150" fill="white" stroke="#203348" stroke-width="4" /><rect x="930" y="420" width="230" height="150" fill="white" stroke="#203348" stroke-width="4" /><rect x="1160" y="420" width="230" height="150" fill="white" stroke="#203348" stroke-width="4" /><rect x="115" y="570" width="355" height="150" fill="#edf1f5" stroke="#203348" stroke-width="4" /><text x="292" y="665" font-size="44" text-anchor="middle">整数</text><rect x="470" y="570" width="230" height="150" fill="white" stroke="#203348" stroke-width="4" /><rect x="700" y="570" width="230" height="150" fill="white" stroke="#203348" stroke-width="4" /><rect x="930" y="570" width="230" height="150" fill="white" stroke="#203348" stroke-width="4" /><rect x="1160" y="570" width="230" height="150" fill="white" stroke="#203348" stroke-width="4" /><rect x="115" y="720" width="355" height="150" fill="#edf1f5" stroke="#203348" stroke-width="4" /><text x="292" y="815" font-size="44" text-anchor="middle">数全体</text><rect x="470" y="720" width="230" height="150" fill="white" stroke="#203348" stroke-width="4" /><rect x="700" y="720" width="230" height="150" fill="white" stroke="#203348" stroke-width="4" /><rect x="930" y="720" width="230" height="150" fill="white" stroke="#203348" stroke-width="4" /><rect x="1160" y="720" width="230" height="150" fill="white" stroke="#203348" stroke-width="4" /></g></svg>