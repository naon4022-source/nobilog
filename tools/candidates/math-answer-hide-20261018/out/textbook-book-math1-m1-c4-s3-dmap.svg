<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>この節の地図</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="544.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">比例と反比例をくらべる</text><rect x="150.0" y="160.0" width="340.0" height="100.0" rx="0" fill="#e8f0fa" stroke="#203348" stroke-width="2"/><text x="320.0" y="225.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700"></text><rect x="490.0" y="160.0" width="520.0" height="100.0" rx="0" fill="#1f5fa8" stroke="#203348" stroke-width="2"/><text x="750.0" y="225.0" font-size="40" fill="white" text-anchor="middle" font-weight="700">比例 y＝ax</text><rect x="1010.0" y="160.0" width="520.0" height="100.0" rx="0" fill="#e07a1f" stroke="#203348" stroke-width="2"/><text x="1270.0" y="225.0" font-size="40" fill="white" text-anchor="middle" font-weight="700">反比例 y＝a/x</text><rect x="150.0" y="260.0" width="340.0" height="140.0" rx="0" fill="white" stroke="#203348" stroke-width="2"/><text x="320.0" y="345.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">x が2倍</text><rect x="490.0" y="260.0" width="520.0" height="140.0" rx="0" fill="white" stroke="#203348" stroke-width="2"/><text x="750.0" y="345.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">y も2倍</text><rect x="1010.0" y="260.0" width="520.0" height="140.0" rx="0" fill="white" stroke="#203348" stroke-width="2"/><text x="1270.0" y="345.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">y は½倍</text><rect x="150.0" y="400.0" width="340.0" height="140.0" rx="0" fill="white" stroke="#203348" stroke-width="2"/><text x="320.0" y="485.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">