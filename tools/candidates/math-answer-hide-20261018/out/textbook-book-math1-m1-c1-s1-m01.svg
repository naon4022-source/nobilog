<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>よくあるまちがいと正しい考え方</title><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348"><text x="90" y="100" font-size="44" font-weight="700">よくあるまちがい</text><rect x="65" y="155" width="710" height="625" rx="26" fill="white" stroke="#ac4e41" stroke-width="6" stroke-dasharray="16 8"/><rect x="825" y="155" width="710" height="625" rx="26" fill="white" stroke="#397052" stroke-width="6"/><text x="420" y="265" font-size="65" fill="#ac4e41" text-anchor="middle">✗</text><text x="1180" y="265" font-size="65" fill="#397052" text-anchor="middle">○</text><text x="420" y="375" text-anchor="middle" font-size="40">0 を正の数に入れる</text><ellipse cx="420" cy="422" rx="295" ry="113" stroke="#ac4e41" stroke-width="5" fill="none"/><text x="420" y="595" font-size="44" fill="#ac4e41" text-anchor="middle">ここ！</text><rect x="870" y="318" width="620" height="100" rx="16" fill="#edf5ef"/><text x="1180" y="382" font-size="40" text-anchor="middle">0 は正でも負でもない</text><rect x="870" y="468" width="620" height="100" rx="16" fill="#edf5ef"/><text x="1180" y="532" font-size="40" text-anchor="middle">（さかい目）</text><path d="M1180 425V455l-14 -17M1180 455l14 -17" fill="none" stroke="#397052" stroke-width="6"/><text x="800" y="852" font-size="40" text-anchor="middle">✗の考え方を、○の手順で直そう。</text></g></svg>