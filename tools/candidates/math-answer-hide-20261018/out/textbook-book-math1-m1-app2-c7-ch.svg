<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>平均と合計</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="676.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">6人目が入ると 平均が上がる</text><rect x="200.0" y="400.0" width="100.0" height="360.0" rx="0" fill="#8ec1ec" stroke="#203348" stroke-width="3"/><text x="250.0" y="800.0" font-size="28" fill="#203348" text-anchor="middle" font-weight="700">1人目</text><rect x="350.0" y="310.0" width="100.0" height="450.0" rx="0" fill="#8ec1ec" stroke="#203348" stroke-width="3"/><text x="400.0" y="800.0" font-size="28" fill="#203348" text-anchor="middle" font-weight="700">2人目</text><rect x="500.0" y="340.0" width="100.0" height="420.0" rx="0" fill="#8ec1ec" stroke="#203348" stroke-width="3"/><text x="550.0" y="800.0" font-size="28" fill="#203348" text-anchor="middle" font-weight="700">3人目</text><rect x="650.0" y="280.0" width="100.0" height="480.0" rx="0" fill="#8ec1ec" stroke="#203348" stroke-width="3"/><text x="700.0" y="800.0" font-size="28" fill="#203348" text-anchor="middle" font-weight="700">4人目</text><rect x="800.0" y="370.0" width="100.0" height="390.0" rx="0" fill="#8ec1ec" stroke="#203348" stroke-width="3"/><text x="850.0" y="800.0" font-size="28" fill="#203348" text-anchor="middle" font-weight="700">5人目</text><rect x="950.0" y="200.0" width="100.0" height="560.0" rx="0" fill="none" stroke="#e07a1f" stroke-width="4" stroke-dasharray="14 10"/><text x="1000.0" y="500.0" font-size="80" fill="#e07a1f" text-anchor="middle" font-weight="900">?</text><text x="1000.0" y="800.0" font-size="28" fill="#e07a1f" text-anchor="middle" font-weight="700">6人目</text><line x1="170.0" y1="340.0" x2="930.0" y2="340.0" stroke="#1f5fa8" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 8"/><text x="160.0" y="350.0" font-size="34" fill="#1f5fa8" text-anchor="end" font-weight="700">70</text><line x1="170.0" y1="328.0" x2="1070.0" y2="328.0" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/><text x="1080.0" y="338.0" font-size="34" fill="#c0392b" text-anchor="start" font-weight="700">72</text><text x="1240.0" y="320.0" font-size="40" fill="#1f5fa8" text-anchor="start" font-weight="800">5人の平均 70点</text><text x="1240.0" y="400.0" font-size="40" fill="#c0392b" text-anchor="start" font-weight="800">6人の平均 72点</text><text x="1240.0" y="500.0" font-size="36" fill="#203348" text-anchor="start" font-weight="700">合計は どう変わる？</text></g></svg>