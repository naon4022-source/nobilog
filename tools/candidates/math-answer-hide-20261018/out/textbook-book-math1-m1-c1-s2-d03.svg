<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>かっこを外してから仕分ける図</title><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348"><rect x="45" y="35" width="1510" height="120" rx="24" fill="#e8f0fa"/><text x="90" y="113" font-size="48" font-weight="700">かっこを外してから仕分ける</text><text x="800" y="255" font-size="52" text-anchor="middle">6−(−9)+(−13)−4</text><path d="M800 295V355l-16 -20M800 355l16 -20" stroke="#1f5fa8" stroke-width="6" fill="none"/><text x="800" y="423" font-size="52" text-anchor="middle">6+9−13−4</text><path d="M650 460L460 520M950 460L1140 520" stroke="#1f5fa8" stroke-width="5" fill="none"/><rect x="130" y="535" width="650" height="230" rx="24" fill="white" stroke="#1f5fa8" stroke-width="5"/><rect x="820" y="535" width="650" height="230" rx="24" fill="white" stroke="#203348" stroke-width="5" stroke-dasharray="14 8"/><text x="455" y="609" font-size="44" text-anchor="middle">正の項</text><text x="1145" y="609" font-size="44" text-anchor="middle">負の項</text><text x="455" y="704" font-size="54" text-anchor="middle">+6　+9</text><text x="1145" y="704" font-size="54" text-anchor="middle">−13　−4</text><text x="800" y="848" font-size="40" text-anchor="middle">符号を確かめてから、同じチームに分ける。</text></g></svg>