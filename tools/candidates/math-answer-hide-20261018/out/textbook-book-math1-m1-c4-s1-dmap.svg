<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>この節の地図</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="280.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">関数の地図</text><rect x="80.0" y="160.0" width="440.0" height="300.0" rx="24" fill="white" stroke="#1f5fa8" stroke-width="5"/><rect x="80.0" y="160.0" width="440.0" height="70.0" rx="24" fill="#1f5fa8" stroke="none" stroke-width="4"/><rect x="80.0" y="200.0" width="440.0" height="30.0" rx="0" fill="#1f5fa8" stroke="none" stroke-width="4"/><text x="300.0" y="210.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">変数</text><text x="300.0" y="320.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">いろいろな値を</text><text x="300.0" y="371.3" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">とる文字 x、y</text><rect x="580.0" y="160.0" width="440.0" height="300.0" rx="24" fill="white" stroke="#e07a1f" stroke-width="5"/><rect x="580.0" y="160.0" width="440.0" height="70.0" rx="24" fill="#e07a1f" stroke="none" stroke-width="4"/><rect x="580.0" y="200.0" width="440.0" height="30.0" rx="0" fill="#e07a1f" stroke="none" stroke-width="4"/><text x="800.0" y="210.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">関数</text><text x="800.0" y="300.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">x を決めると</text><text x="800.0" y="351.3" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">y が1つに決まる</text><rect x="1080.0" y="160.0" width="440.0" height="300.0" rx="24" fill="white" stroke="#2a8a5b" stroke-width="5"/><rect x="1080.0" y="160.0" width="440.0" height="70.0" rx="24" fill="#2a8a5b" stroke="none" stroke-width="4"/><rect x="1080.0" y="200.0" width="440.0" height="30.0" rx="0" fill="#2a8a5b" stroke="none" stroke-width="4"/><text x="1300.0" y="210.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">変域</text><text x="1300.0" y="300.0" font-size="36" fill="#203348" text-anchor="middle" font-weight="700">変数のとる</text><text x="1300.0" y="350.0" font-size="36" fill="#203348" text-anchor="middle" font-weight="700">値の範囲</text><text x="1300.0" y="400.0" font-size="36" fill="#203348" text-anchor="middle" font-weight="700">（不等号で表す）</text><rect x="180.0" y="540.0" width="560.0" height="200.0" rx="18" fill="#edf5ef" stroke="#2a8a5b" stroke-width="4"/><text x="460.0" y="610.0" font-size="42" fill="#2a8a5b" text-anchor="middle" font-weight="700">○ 関数</text><text x="460.0" y="680.0" font-size="36" fill="#203348" text-anchor="middle" font-weight="700">正方形の1辺 → 周の長さ</text><rect x="860.0" y="540.0" width="560.0" height="200.0" rx="18" fill="white" stroke="#c0392b" stroke-width="4" stroke-dasharray="12 8"/><text x="1140.0" y="610.0" font-size="42" fill="#c0392b" text-anchor="middle" font-weight="700">✗ 関数ではない</text><text x="1140.0" y="680.0" font-size="36" fill="#203348" text-anchor="middle" font-weight="700">身長 → 体重</text></g></svg>