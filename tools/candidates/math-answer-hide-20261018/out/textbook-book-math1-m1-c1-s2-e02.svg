<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>かっこの入れ子</title><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348"><rect x="45" y="35" width="1510" height="120" rx="24" fill="#e8f0fa"/><text x="90" y="113" font-size="48" font-weight="700">かっこを、入れ子の箱で見る</text><text x="800" y="250" font-size="50" text-anchor="middle">10−{6−(−2)}×2</text><rect x="400" y="340" width="745" height="310" rx="24" fill="white" stroke="#1f5fa8" stroke-width="6"/><text x="525" y="530" font-size="60" text-anchor="middle">6−</text><rect x="640" y="405" width="400" height="180" rx="20" fill="#edf5ef" stroke="#397052" stroke-width="5" stroke-dasharray="14 8"/><text x="840" y="518" font-size="60" text-anchor="middle">−2</text><text x="260" y="530" font-size="60" text-anchor="middle">10−</text><text x="1280" y="530" font-size="60" text-anchor="middle">×2</text><text x="840" y="373" font-size="48" text-anchor="middle">① ( )</text><text x="460" y="321" font-size="48" text-anchor="middle">② { }</text><text x="800" y="758" font-size="42" text-anchor="middle">① 内側の( ) → ② 外側の{ }</text><text x="800" y="853" font-size="40" text-anchor="middle">内側の箱から、中身を確かめていこう。</text></g></svg>