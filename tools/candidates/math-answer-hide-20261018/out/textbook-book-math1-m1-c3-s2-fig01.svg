<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>過不足の線分図</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="676.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">配り方を変えても、全体は同じ</text><rect x="200.0" y="300.0" width="720.0" height="90.0" rx="4" fill="#8ec1ec" stroke="#203348" stroke-width="4"/><rect x="920.0" y="300.0" width="150.0" height="90.0" rx="4" fill="#f6dcb8" stroke="#203348" stroke-width="4"/><text x="560.0" y="360.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">6枚ずつ配った分 6x</text><text x="995.0" y="360.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">余り 15</text><rect x="200.0" y="480.0" width="960.0" height="90.0" rx="4" fill="#8ec1ec" stroke="#203348" stroke-width="4"/><rect x="1070.0" y="480.0" width="90.0" height="90.0" rx="4" fill="white" stroke="#c0392b" stroke-width="4" stroke-dasharray="12 8"/><text x="635.0" y="540.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">8枚ずつ配る分 8x</text><text x="1115.0" y="620.0" font-size="38" fill="#c0392b" text-anchor="middle" font-weight="700">足りない 9</text><line x1="1070.0" y1="250.0" x2="1070.0" y2="600.0" stroke="#1f5fa8" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 10"/><line x1="200.0" y1="250.0" x2="200.0" y2="600.0" stroke="#1f5fa8" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 10"/><path d="M200 250 Q200 220 230 220 L605.0 220 L635.0 190 L665.0 220 L1040 220 Q1070 220 1070 250" fill="none" stroke="#1f5fa8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="635.0" y="175.0" font-size="44" fill="#1f5fa8" text-anchor="middle" font-weight="800">折り紙の全体</text><text x="1300.0" y="380.0" font-size="48" fill="#203348" text-anchor="middle" font-weight="700">6x ＋ 15</text><text x="1300.0" y="450.0" font-size="48" fill="#203348" text-anchor="middle" font-weight="700">＝</text><text x="1300.0" y="520.0" font-size="48" fill="#203348" text-anchor="middle" font-weight="700">8x − 9</text><text x="800.0" y="760.0" font-size="42" fill="#e07a1f" text-anchor="middle" font-weight="700">全体の右端が上下でそろう → 等しい関係</text></g></svg>