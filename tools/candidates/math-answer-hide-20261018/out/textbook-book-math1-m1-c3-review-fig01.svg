<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>行きと帰りの道のり</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="676.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">同じ道のりを 2通りの見方で</text><text x="180.0" y="324.0" font-size="44" fill="#203348" text-anchor="end" font-weight="700">家</text><text x="1420.0" y="324.0" font-size="44" fill="#203348" text-anchor="start" font-weight="700">図書館</text><line x1="220.0" y1="310.0" x2="1390.0" y2="310.0" stroke="#1f5fa8" stroke-width="8" stroke-linecap="round"/><polygon points="1390.0,310.0 1373.8,317.8 1373.8,302.2" fill="#1f5fa8" stroke="none" stroke-width="4" stroke-linejoin="round"/><text x="805.0" y="270.0" font-size="40" fill="#1f5fa8" text-anchor="middle" font-weight="800">行き：分速 60m</text><text x="805.0" y="380.0" font-size="38" fill="#1f5fa8" text-anchor="middle" font-weight="700">(t＋10) 分</text><line x1="1390.0" y1="660.0" x2="220.0" y2="660.0" stroke="#e07a1f" stroke-width="8" stroke-linecap="round"/><polygon points="220.0,660.0 236.2,652.2 236.2,667.8" fill="#e07a1f" stroke="none" stroke-width="4" stroke-linejoin="round"/><text x="805.0" y="620.0" font-size="40" fill="#e07a1f" text-anchor="middle" font-weight="800">帰り：分速 90m</text><text x="805.0" y="730.0" font-size="38" fill="#e07a1f" text-anchor="middle" font-weight="700">t 分</text><line x1="220.0" y1="440.0" x2="220.0" y2="550.0" stroke="#9aa9bb" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/><line x1="1390.0" y1="440.0" x2="1390.0" y2="550.0" stroke="#9aa9bb" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/><text x="805.0" y="505.0" font-size="38" fill="#2a8a5b" text-anchor="middle" font-weight="800">道のりは 同じ</text><text x="800.0" y="820.0" font-size="32" fill="#203348" text-anchor="middle" font-weight="700">方法1：道のりを x　方法2：帰りの時間を t → 同じ答えになるか確かめる</text></g></svg>