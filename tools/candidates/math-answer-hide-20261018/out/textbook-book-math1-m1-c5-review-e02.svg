<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>作図できる角の早見図</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="324.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">作図できる角</text><path d="M70 520 L270.0 520.0 A200 200 0 0 0 70.0 320.0 Z" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="170.0" y="590.0" font-size="52" fill="#1f5fa8" text-anchor="middle" font-weight="800">90°</text><text x="170.0" y="650.0" font-size="32" fill="#203348" text-anchor="middle" font-weight="700">垂線</text><path d="M380 520 L580.0 520.0 A200 200 0 0 0 480.0 346.8 Z" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="480.0" y="590.0" font-size="52" fill="#1f5fa8" text-anchor="middle" font-weight="800">60°</text><text x="480.0" y="650.0" font-size="32" fill="#203348" text-anchor="middle" font-weight="700">正三角形</text><path d="M690 520 L890.0 520.0 A200 200 0 0 0 831.4 378.6 Z" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="790.0" y="590.0" font-size="52" fill="#1f5fa8" text-anchor="middle" font-weight="800">45°</text><text x="790.0" y="650.0" font-size="32" fill="#203348" text-anchor="middle" font-weight="700">90°を二等分</text><path d="M1000 520 L1200.0 520.0 A200 200 0 0 0 1173.2 420.0 Z" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1100.0" y="590.0" font-size="52" fill="#1f5fa8" text-anchor="middle" font-weight="800">30°</text><text x="1100.0" y="650.0" font-size="32" fill="#203348" text-anchor="middle" font-weight="700">60°を二等分</text><path d="M1310 520 L1510.0 520.0