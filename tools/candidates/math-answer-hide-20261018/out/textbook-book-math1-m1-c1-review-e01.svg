<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">忘れにくくなる復習のタイミング</title><desc id="desc">学んだ日、1日後、3日後、7日後の四つの復習カード。下の模式図は思い出すたびに線が持ち上がり、その後の下がり方が緩やかになる。</desc><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#8da8c7" stroke-width="2"/></pattern></defs><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348"><rect x="45" y="35" width="1510" height="112" rx="24" fill="#e8f0fa"/><text x="85" y="110" font-size="48" font-weight="700">忘れにくくなる復習のタイミング</text>
<g font-size="40" text-anchor="middle"><g transform="translate(70 185)"><rect width="335" height="150" rx="18" fill="white" stroke="#1f5fa8" stroke-width="4"/><path d="M0 45H335" stroke="#1f5fa8" stroke-width="4"/><text x="167" y="105">学んだ日 ●</text></g><g transform="translate(445 185)"><rect width="335" height="150" rx="18" fill="white" stroke="#1f5fa8" stroke-width="4"/><path d="M0 45H335" stroke="#1f5fa8" stroke-width="4"/><text x="167" y="105">1日後 ●</text></g><g transform="translate(820 185)"><rect width="335" height="150" rx="18" fill="white" stroke="#1f5fa8" stroke-width="4"/><path d="M0 45H335" stroke="#1f5fa8" stroke-width="4"/><text x="167" y="105">3日後 ●</text></g><g transform="translate(1195 185)"><rect width="335" height="150" rx="18" fill="white" stroke="#1f5fa8" stroke-width="4"/><path d="M0 45H335" stroke="#1f5fa8" stroke-width="4"/><text x="167" y="105">7日後 ●</text></g></g>
<rect x="65" y="375" width="1470" height="410" rx="24" fill="white"/><text x="105" y="430" font-size="40">覚えている量</text><text x="1400" y="430" font-size="40" text-anchor="end">変化の模式図</text><path d="M240 460V720H1410" fill="none" stroke="#203348" stroke-width="4"/><path d="M250 470 Q300 535 465 605 L465 480 Q470 540 670 580 L670 480 Q870 520 1220 552 L1220 480 Q1300 488 1400 505" stroke="#1f5fa8" stroke-width="8" fill="none"/>
<g font-size="40" text-anchor="middle"><text x="250" y="762">学んだ日</text><text x="465" y="762">1日後</text><text x="670" y="762">3日後</text><text x="1220" y="762">7日後</text></g><g fill="#1f5fa8" stroke="white" stroke-width="3"><circle cx="250" cy="470" r="10"/><circle cx="465" cy="480" r="10"/><circle cx="670" cy="480" r="10"/><circle cx="1220" cy="480" r="10"/></g><text x="780" y="660" font-size="40" font-weight="700" text-anchor="middle">見ずに思い出す → 確かめる</text><text x="800" y="847" font-size="40" text-anchor="middle">丸をつけた日に、短くもう一度。</text></g></svg>
