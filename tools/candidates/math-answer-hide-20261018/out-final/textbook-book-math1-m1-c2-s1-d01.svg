<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><title>パン5個と牛乳1本の代金</title><defs><pattern id="milk" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 16L16 0" stroke="#487654" stroke-width="3"/></pattern></defs><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" font-size="40" fill="#203348"><text x="90" y="100" font-size="48">代金を、つながった帯で見る</text><text x="650" y="260" text-anchor="middle">パン5個</text><text x="1300" y="260" text-anchor="middle">牛乳1本</text><rect x="150" y="340" width="200" height="170" fill="#edf3fa" stroke="#386a9a" stroke-width="4"/><text x="250" y="440" text-anchor="middle">x 円</text><rect x="350" y="340" width="200" height="170" fill="#edf3fa" stroke="#386a9a" stroke-width="4"/><text x="450" y="440" text-anchor="middle">x 円</text><rect x="550" y="340" width="200" height="170" fill="#edf3fa" stroke="#386a9a" stroke-width="4"/><text x="650" y="440" text-anchor="middle">x 円</text><rect x="750" y="340" width="200" height="170" fill="#edf3fa" stroke="#386a9a" stroke-width="4"/><text x="850" y="440" text-anchor="middle">x 円</text><rect x="950" y="340" width="200" height="170" fill="#edf3fa" stroke="#386a9a" stroke-width="4"/><text x="1050" y="440" text-anchor="middle">x 円</text><rect x="1150" y="340" width="300" height="170" fill="url(#milk)" stroke="#397052" stroke-width="4"/><rect x="1180" y="385" width="240" height="80" fill="white"/><text x="1300" y="440" text-anchor="middle">120円</text><path d="M150 545V580H1450V545M800 580V620" fill="none" stroke="#203348" stroke-width="5"/><text x="800" y="710" text-anchor="middle" font-size="60">5x+120（円）</text><text x="800" y="830" text-anchor="middle">模式図：帯の長さは、実際の値段の比ではない。</text></g></svg>