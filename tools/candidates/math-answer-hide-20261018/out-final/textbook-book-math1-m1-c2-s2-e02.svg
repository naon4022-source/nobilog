<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" font-size="40" fill="#203348"><text x="90" y="100" font-size="48">等式と不等式のてんびん</text><path d="M290 380L225 680H355Z" fill="#a3b5c6"/><path d="M130 380L450 380" stroke="#203348" stroke-width="7"/><path d="M70 380V540H190V380" fill="none" stroke="#203348" stroke-width="4"/><rect x="100" y="480" width="60" height="55" rx="8" fill="#8caf9d"/><path d="M390 380V540H510V380" fill="none" stroke="#203348" stroke-width="4"/><rect x="420" y="480" width="60" height="55" rx="8" fill="#8caf9d"/><text x="290" y="280" text-anchor="middle" font-size="70">＝</text><text x="290" y="760" text-anchor="middle">同じ</text><path d="M800 380L735 680H865Z" fill="#a3b5c6"/><path d="M640 325L960 435" stroke="#203348" stroke-width="7"/><path d="M580 325V485H700V325" fill="none" stroke="#203348" stroke-width="4"/><rect x="610" y="425" width="60" height="55" rx="8" fill="#8caf9d"/><path d="M900 435V595H1020V435" fill="none" stroke="#203348" stroke-width="4"/><rect x="930" y="535" width="60" height="55" rx="8" fill="#8caf9d"/><text x="800" y="280" text-anchor="middle" font-size="70">＜</text><text x="800" y="760" text-anchor="middle">右が重い</text><path d="M1310 380L1245 680H1375Z" fill="#a3b5c6"/><path d="M1150 435L1470 325" stroke="#203348" stroke-width="7"/><path d="M1090 435V595H1210V435" fill="none" stroke="#203348" stroke-width="4"/><rect x="1120" y="535" width="60" height="55" rx="8" fill="#8caf9d"/><path d="M1410 325V485H1530V325" fill="none" stroke="#203348" stroke-width="4"/><rect x="1440" y="425" width="60" height="55" rx="8" fill="#8caf9d"/><text x="1310" y="280" text-anchor="middle" font-size="70">＞</text><text x="1310" y="760" text-anchor="middle">左が重い</text><text x="800" y="855" text-anchor="middle">不等号の口は、大きいほうに開く。</text></g></svg>