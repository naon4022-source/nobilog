<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<title id="title">わり算はかけ算の逆であることを、□を使った2つの式で対応させる</title><desc id="desc">□×(−4)＝−12 の□は3なので、−12÷(−4)＝3。□×4＝−12 の□は−3なので、−12÷4＝−3。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#222"/></marker></defs><rect width="1000" height="700" fill="white"/><g font-family="system-ui,sans-serif" fill="#222">
<rect x="25" y="100" width="950" height="220" rx="12" fill="white" stroke="#222" stroke-width="2" />
<text x="55" y="170" font-size="32" text-anchor="start" data-factor="-4" data-operation="multiply">□×(−4)＝−12</text>
<text x="570" y="170" font-size="32" text-anchor="start" data-factor="-4" data-operation="divide">(−12)÷(−4)＝□</text>
<line x1="440" y1="160" x2="535" y2="160" stroke="#222" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" data-relation="same"/>
<text x="500" y="270" font-size="40" text-anchor="middle" data-answer="3">□＝3</text>
<rect x="25" y="360" width="950" height="220" rx="12" fill="white" stroke="#222" stroke-width="2" />
<text x="55" y="430" font-size="32" text-anchor="start" data-factor="4" data-operation="multiply">□×4＝−12</text>
<text x="570" y="430" font-size="32" text-anchor="start" data-factor="4" data-operation="divide">(−12)÷4＝□</text>
<line x1="440" y1="420" x2="535" y2="420" stroke="#222" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" data-relation="same"/>
<text x="500" y="530" font-size="40" text-anchor="middle" data-answer="-3">□＝−3</text>
</g></svg>