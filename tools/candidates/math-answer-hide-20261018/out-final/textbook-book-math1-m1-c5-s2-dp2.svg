<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>2回折り返すと平行移動</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="720.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">ℓ で折り返し、m で折り返す</text><line x1="640.0" y1="140.0" x2="640.0" y2="760.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 10"/><line x1="1020.0" y1="140.0" x2="1020.0" y2="760.0" stroke="#2a8a5b" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 10"/><text x="654.0" y="180.0" font-size="46" fill="#e07a1f" text-anchor="start" font-weight="700" font-style="italic">ℓ</text><text x="1034.0" y="180.0" font-size="46" fill="#2a8a5b" text-anchor="start" font-weight="700" font-style="italic">m</text><line x1="380.0" y1="560.0" x2="380.0" y2="360.0" stroke="#203348" stroke-width="6" stroke-linecap="round"/><polygon points="380.0,360.0 520.0,400.0 380.0,440.0" fill="#1f5fa8" stroke="#203348" stroke-width="4" stroke-linejoin="round"/><line x1="900.0" y1="560.0" x2="900.0" y2="360.0" stroke="#203348" stroke-width="6" stroke-linecap="round"/><polygon points="900.0,360.0 760.0,400.0 900.0,440.0" fill="#f6dcb8" stroke="#203348" stroke-width="4" stroke-linejoin="round"/><line x1="1140.0" y1="560.0" x2="1140.0" y2="360.0" stroke="#203348" stroke-width="6" stroke-linecap="round"/><polygon points="1140.0,360.0 1280.0,400.0 1140.0,440.0" fill="#1f5fa8" stroke="#203348" stroke-width="4" stroke-linejoin="round"/><text x="380.0" y="620.0" font-size="44" fill="#203348" text-anchor="middle" font-weight="700">①</text><text x="900.0" y="620.0" font-size="44" fill="#203348" text-anchor="middle" font-weight="700">②</text><text x="1140.0" y="620.0" font-size="44" fill="#203348" text-anchor="middle" font-weight="700">③</text><line x1="380.0" y1="700.0" x2="1140.0" y2="700.0" stroke="#c0392b" stroke-width="7" stroke-linecap="round"/><polygon points="1140.0,700.0 1123.8,707.8 1123.8,692.2" fill="#c0392b" stroke="none" stroke-width="4" stroke-linejoin="round"/><text x="760.0" y="760.0" font-size="36" fill="#c0392b" text-anchor="middle" font-weight="700">①→③ は 同じ向きに ずれただけ（平行移動）</text></g></svg>