<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>この節の地図</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="588.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">「等しい関係」の見つけ方</text><rect x="60.0" y="160.0" width="470.0" height="270.0" rx="24" fill="white" stroke="#1f5fa8" stroke-width="5"/><rect x="60.0" y="160.0" width="470.0" height="70.0" rx="24" fill="#1f5fa8" stroke="none" stroke-width="4"/><rect x="60.0" y="200.0" width="470.0" height="30.0" rx="0" fill="#1f5fa8" stroke="none" stroke-width="4"/><text x="295.0" y="210.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">代金</text><text x="295.0" y="340.0" font-size="32" fill="#203348" text-anchor="middle" font-weight="700">払った額−代金＝おつり</text><rect x="570.0" y="160.0" width="470.0" height="270.0" rx="24" fill="white" stroke="#e07a1f" stroke-width="5"/><rect x="570.0" y="160.0" width="470.0" height="70.0" rx="24" fill="#e07a1f" stroke="none" stroke-width="4"/><rect x="570.0" y="200.0" width="470.0" height="30.0" rx="0" fill="#e07a1f" stroke="none" stroke-width="4"/><text x="805.0" y="210.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">過不足</text><text x="805.0" y="340.0" font-size="32" fill="#203348" text-anchor="middle" font-weight="700">配り方を変えても全体は同じ</text><rect x="1080.0" y="160.0" width="470.0" height="270.0" rx="24" fill="white" stroke="#2a8a5b" stroke-width="5"/><rect x="1080.0" y="160.0" width="470.0" height="70.0" rx="24" fill="#2a8a5b" stroke="none" stroke-width="4"/><rect x="1080.0" y="200.0" width="470.0" height="30.0" rx="0" fill="#2a8a5b" stroke="none" stroke-width="4"/><text x="1315.0" y="210.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">速さ</text><text x="1315.0" y="340.0" font-size="32" fill="#203348" text-anchor="middle" font-weight="700">追いつく → 道のりが等しい</text><rect x="60.0" y="480.0" width="470.0" height="270.0" rx="24" fill="white" stroke="#8a5cc2" stroke-width="5"/><rect x="60.0" y="480.0" width="470.0" height="70.0" rx="24" fill="#8a5cc2" stroke="none" stroke-width="4"/><rect x="60.0" y="520.0" width="470.0" height="30.0" rx="0" fill="#8a5cc2" stroke="none" stroke-width="4"/><text x="295.0" y="530.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">割合</text><text x="295.0" y="660.0" font-size="32" fill="#203348" text-anchor="middle" font-weight="700">全体＝部分の合計</text><rect x="570.0" y="480.0" width="470.0" height="270.0" rx="24" fill="white" stroke="#c0392b" stroke-width="5"/><rect x="570.0" y="480.0" width="470.0" height="70.0" rx="24" fill="#c0392b" stroke="none" stroke-width="4"/><rect x="570.0" y="520.0" width="470.0" height="30.0" rx="0" fill="#c0392b" stroke="none" stroke-width="4"/><text x="805.0" y="530.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">比例式</text><text x="805.0" y="660.0" font-size="32" fill="#203348" text-anchor="middle" font-weight="700">比が等しい → ad＝bc</text><rect x="1080.0" y="480.0" width="470.0" height="270.0" rx="24" fill="white" stroke="#203348" stroke-width="5"/><rect x="1080.0" y="480.0" width="470.0" height="70.0" rx="24" fill="#203348" stroke="none" stroke-width="4"/><rect x="1080.0" y="520.0" width="470.0" height="30.0" rx="0" fill="#203348" stroke="none" stroke-width="4"/><text x="1315.0" y="530.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">手順</text><text x="1315.0" y="600.0" font-size="32" fill="#203348" text-anchor="middle" font-weight="700">① x を決める</text><text x="1315.0" y="646.0" font-size="32" fill="#203348" text-anchor="middle" font-weight="700">② 式にする</text><text x="1315.0" y="692.0" font-size="32" fill="#203348" text-anchor="middle" font-weight="700">③ 解いて確かめる</text></g></svg>