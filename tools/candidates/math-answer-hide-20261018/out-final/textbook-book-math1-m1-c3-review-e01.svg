<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>答えの意味を考える</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="456.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">答えが負の数のとき</text><line x1="140.0" y1="420.0" x2="1470.0" y2="420.0" stroke="#203348" stroke-width="4" stroke-linecap="round"/><line x1="1450.0" y1="420.0" x2="1480.0" y2="420.0" stroke="#203348" stroke-width="4" stroke-linecap="round"/><polygon points="1480.0,420.0 1465.6,427.0 1465.6,413.0" fill="#203348" stroke="none" stroke-width="4" stroke-linejoin="round"/><line x1="160.0" y1="406.0" x2="160.0" y2="434.0" stroke="#203348" stroke-width="3" stroke-linecap="round"/><text x="160.0" y="478.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">−5</text><line x1="288.0" y1="406.0" x2="288.0" y2="434.0" stroke="#203348" stroke-width="3" stroke-linecap="round"/><text x="288.0" y="478.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">−4</text><line x1="416.0" y1="406.0" x2="416.0" y2="434.0" stroke="#203348" stroke-width="3" stroke-linecap="round"/><text x="416.0" y="478.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">−3</text><line x1="544.0" y1="406.0" x2="544.0" y2="434.0" stroke="#203348" stroke-width="3" stroke-linecap="round"/><text x="544.0" y="478.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">−2</text><line x1="672.0" y1="406.0" x2="672.0" y2="434.0" stroke="#203348" stroke-width="3" stroke-linecap="round"/><text x="672.0" y="478.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">−1</text><line x1="800.0" y1="406.0" x2="800.0" y2="434.0" stroke="#203348" stroke-width="3" stroke-linecap="round"/><text x="800.0" y="478.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">0</text><line x1="928.0" y1="406.0" x2="928.0" y2="434.0" stroke="#203348" stroke-width="3" stroke-linecap="round"/><text x="928.0" y="478.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">1</text><line x1="1056.0" y1="406.0" x2="1056.0" y2="434.0" stroke="#203348" stroke-width="3" stroke-linecap="round"/><text x="1056.0" y="478.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">2</text><line x1="1184.0" y1="406.0" x2="1184.0" y2="434.0" stroke="#203348" stroke-width="3" stroke-linecap="round"/><text x="1184.0" y="478.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">3</text><line x1="1312.0" y1="406.0" x2="1312.0" y2="434.0" stroke="#203348" stroke-width="3" stroke-linecap="round"/><text x="1312.0" y="478.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">4</text><line x1="1440.0" y1="406.0" x2="1440.0" y2="434.0" stroke="#203348" stroke-width="3" stroke-linecap="round"/><text x="1440.0" y="478.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">5</text><text x="800.0" y="330.0" font-size="44" fill="#1f5fa8" text-anchor="middle" font-weight="800">今</text><line x1="800.0" y1="360.0" x2="800.0" y2="395.0" stroke="#1f5fa8" stroke-width="5" stroke-linecap="round"/><polygon points="800.0,395.0 792.2,378.8 807.8,378.8" fill="#1f5fa8" stroke="none" stroke-width="4" stroke-linejoin="round"/><text x="1248.0" y="330.0" font-size="40" fill="#2a8a5b" text-anchor="middle" font-weight="700">未来 →</text><text x="352.0" y="330.0" font-size="40" fill="#8a5cc2" text-anchor="middle" font-weight="700">← 過去</text><path d="M800.0 470 Q672.0 560 544.0 470" fill="none" stroke="#e07a1f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><line x1="556.8" y1="495.0" x2="544.0" y2="470.0" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/><polygon points="544.0,470.0 560.0,