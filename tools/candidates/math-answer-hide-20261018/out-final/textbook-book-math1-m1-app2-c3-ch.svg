<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>解を代入する</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="632.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">解を代入して a を求める</text><text x="470.0" y="300.0" font-size="80" fill="#203348" text-anchor="middle" font-weight="800">3</text><text x="560.0" y="300.0" font-size="80" fill="#e07a1f" text-anchor="middle" font-weight="800" font-style="italic">x</text><rect x="510.0" y="205.0" width="100.0" height="125.0" rx="14" fill="none" stroke="#e07a1f" stroke-width="6" stroke-dasharray="12 8"/><rect x="518.0" y="430.0" width="84.0" height="90.0" rx="12" fill="#fff7ec" stroke="#e07a1f" stroke-width="5"/><text x="560.0" y="495.0" font-size="58" fill="#e07a1f" text-anchor="middle" font-weight="900">4</text><line x1="560.0" y1="425.0" x2="560.0" y2="345.0" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/><polygon points="560.0,345.0 567.8,361.2 552.2,361.2" fill="#e07a1f" stroke="none" stroke-width="4" stroke-linejoin="round"/><text x="660.0" y="300.0" font-size="80" fill="#203348" text-anchor="middle" font-weight="800">−</text><text x="740.0" y="300.0" font-size="80" fill="#203348" text-anchor="middle" font-weight="800" font-style="italic">a</text><text x="830.0" y="300.0" font-size="80" fill="#203348" text-anchor="middle" font-weight="800">＝</text><text x="920.0" y="300.0" font-size="80" fill="#203348" text-anchor="middle" font-weight="800">2</text><text x="1010.0" y="300.0" font-size="80" fill="#e07a1f" text-anchor="middle" font-weight="800" font-style="italic">x</text><rect x="960.0" y="205.0" width="100.0" height="125.0" rx="14" fill="none" stroke="#e07a1f" stroke-width="6" stroke-dasharray="12 8"/><rect x="968.0" y="430.0" width="84.0" height="90.0" rx="12" fill="#fff7ec" stroke="#e07a1f" stroke-width="5"/><text x="1010.0" y="495.0" font-size="58" fill="#e07a1f" text-anchor="middle" font-weight="900">4</text><line x1="1010.0" y1="425.0" x2="1010.0" y2="345.0" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/><polygon points="1010.0,345.0 1017.8,361.2 1002.2,361.2" fill="#e07a1f" stroke="none" stroke-width="4" stroke-linejoin="round"/><text x="1110.0" y="300.0" font-size="80" fill="#203348" text-anchor="middle" font-weight="800">＋</text><text x="1190.0" y="300.0" font-size="80" fill="#203348" text-anchor="middle" font-weight="800">5</text><text x="800.0" y="640.0" font-size="44" fill="#203348" text-anchor="middle" font-weight="700">x の場所に 4 を入れると、a だけの式になる</text><text x="800.0" y="740.0" font-size="52" fill="#1f5fa8" text-anchor="middle" font-weight="700">3 × 4 − a ＝ 2 × 4 ＋ 5</text></g></svg>