<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>中学1年の数学の地図</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="500.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">中学1年の数学の地図</text><line x1="330.0" y1="330.0" x2="1170.0" y2="330.0" stroke="#c9a46a" stroke-width="12" stroke-linecap="round" stroke-dasharray="4 14"/><line x1="330.0" y1="330.0" x2="330.0" y2="690.0" stroke="#c9a46a" stroke-width="12" stroke-linecap="round" stroke-dasharray="4 14"/><line x1="1170.0" y1="330.0" x2="1170.0" y2="690.0" stroke="#c9a46a" stroke-width="12" stroke-linecap="round" stroke-dasharray="4 14"/><line x1="330.0" y1="690.0" x2="1170.0" y2="690.0" stroke="#c9a46a" stroke-width="12" stroke-linecap="round" stroke-dasharray="4 14"/><line x1="330.0" y1="330.0" x2="1170.0" y2="690.0" stroke="#c9a46a" stroke-width="12" stroke-linecap="round" stroke-dasharray="4 14"/><ellipse cx="330.0" cy="330.0" rx="320.0" ry="140.0" fill="white" stroke="#1f5fa8" stroke-width="6"/><text x="330.0" y="310.0" font-size="40" fill="#1f5fa8" text-anchor="middle" font-weight="800">数と式（1〜3章）</text><text x="330.0" y="370.0" font-size="28" fill="#203348" text-anchor="middle" font-weight="700">x を決めて 等しい関係</text><ellipse cx="1170.0" cy="330.0" rx="320.0" ry="140.0" fill="white" stroke="#e07a1f" stroke-width="6"/><text x="1170.0" y="310.0" font-size="40" fill="#e07a1f" text-anchor="middle" font-weight="800">関数（4章）</text><text x="1170.0" y="370.0" font-size="28" fill="#203348" text-anchor="middle" font-weight="700">ともなって変わる y＝ax・y＝a/x</text><ellipse cx="330.0" cy="690.0" rx="320.0" ry="140.0" fill="white" stroke="#2a8a5b" stroke-width="6"/><text x="330.0" y="670.0" font-size="40" fill="#2a8a5b" text-anchor="middle" font-weight="800">図形（5・6章）</text><text x="330.0" y="730.0" font-size="28" fill="#203348" text-anchor="middle" font-weight="700">移動・作図・空間の見方</text><ellipse cx="1170.0" cy="690.0" rx="320.0" ry="140.0" fill="white" stroke="#8a5cc2" stroke-width="6"/><text x="1170.0" y="670.0" font-size="40" fill="#8a5cc2" text-anchor="middle" font-weight="800">データ（7章）</text><text x="1170.0" y="730.0" font-size="28" fill="#203348" text-anchor="middle" font-weight="700">代表値と相対度数で判断</text></g></svg>