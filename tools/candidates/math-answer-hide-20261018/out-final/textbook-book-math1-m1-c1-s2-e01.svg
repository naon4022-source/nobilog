<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>計算の順序の信号</title><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348"><rect x="45" y="35" width="1510" height="120" rx="24" fill="#e8f0fa"/><text x="90" y="113" font-size="48" font-weight="700">計算の順序を、信号で見る</text><rect x="65" y="205" width="430" height="185" rx="20" fill="white"/><circle cx="280" cy="270" r="53" fill="#98513f"/><text x="280" y="290" font-size="52" fill="white" text-anchor="middle">①</text><text x="280" y="361" font-size="40" text-anchor="middle">累乗・かっこ</text><rect x="585" y="205" width="430" height="185" rx="20" fill="white"/><circle cx="800" cy="270" r="53" fill="#a07d26"/><text x="800" y="290" font-size="52" fill="white" text-anchor="middle">②</text><text x="800" y="361" font-size="40" text-anchor="middle">かけ算・わり算</text><rect x="1105" y="205" width="430" height="185" rx="20" fill="white"/><circle cx="1320" cy="270" r="53" fill="#397052"/><text x="1320" y="290" font-size="52" fill="white" text-anchor="middle">③</text><text x="1320" y="361" font-size="40" text-anchor="middle">たし算・ひき算</text><text x="500" y="622" font-size="64" text-anchor="middle">7</text><text x="620" y="622" font-size="64" text-anchor="middle">−</text><text x="800" y="622" font-size="64" text-anchor="middle">(−4)</text><text x="990" y="622" font-size="64" text-anchor="middle">×</text><text x="1100" y="622" font-size="64" text-anchor="middle">3</text><text x="620" y="510" font-size="50" text-anchor="middle">③</text><text x="990" y="510" font-size="50" text-anchor="middle">②</text><path d="M735 673H865" stroke="#98513f" stroke-width="5" stroke-dasharray="10 7"/><text x="800" y="741" font-size="40" text-anchor="middle">(−4) の中に計算はない。この式では②から。</text><text x="800" y="850" font-size="40" text-anchor="middle">かっこ・累乗 → ×÷ → ＋− の順に確かめる。</text></g></svg>