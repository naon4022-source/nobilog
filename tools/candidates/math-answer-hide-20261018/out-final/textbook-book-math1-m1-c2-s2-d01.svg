<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><title>同じ種類の項を分ける</title><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348" font-size="40"><text x="90" y="100" font-size="48">同じ文字の項と、数の項を分ける</text><text x="275" y="340" font-size="60" text-anchor="middle">0.3a</text><path d="M160 375H390" stroke="#386a9a" stroke-width="6"/><text x="590" y="340" font-size="60" text-anchor="middle">−1.1a</text><path d="M475 375H705" stroke="#386a9a" stroke-width="6"/><text x="935" y="340" font-size="60" text-anchor="middle">+2.5</text><path d="M820 375q29 -20 58 0t58 0t58 0t58 0" fill="none" stroke="#397052" stroke-width="6"/><text x="1260" y="340" font-size="60" text-anchor="middle">−0.9</text><path d="M1145 375q29 -20 58 0t58 0t58 0t58 0" fill="none" stroke="#397052" stroke-width="6"/><path d="M275 410L425 550M590 410L525 550M935 410L1050 550M1260 410L1170 550" stroke="#203348" stroke-width="4"/><rect x="160" y="550" width="620" height="180" rx="20" fill="white" stroke="#386a9a" stroke-width="5"/><text x="470" y="615" text-anchor="middle">a の項（下線）</text><text x="470" y="690" text-anchor="middle">0.3a　−1.1a</text><rect x="820" y="550" width="620" height="180" rx="20" fill="white" stroke="#397052" stroke-width="5" stroke-dasharray="15 10"/><text x="1130" y="615" text-anchor="middle">数の項（波線）</text><text x="1130" y="690" text-anchor="middle">+2.5　−0.9</text><text x="800" y="840" text-anchor="middle">項の前の符号も、いっしょに動かす。</text></g></svg>