<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348" font-size="40"><text x="90" y="100" font-size="48">「試す」と「文字で説明する」のちがい</text><rect x="65" y="200" width="710" height="520" rx="25" fill="white" stroke="#386a9a" stroke-width="4" stroke-dasharray="14 8"/><rect x="825" y="200" width="710" height="520" rx="25" fill="white" stroke="#397052" stroke-width="4"/><text x="420" y="290" text-anchor="middle" font-size="48">試す</text><text x="1180" y="290" text-anchor="middle" font-size="48">文字で説明する</text><text x="420" y="425" text-anchor="middle">5 → 最後は2</text><text x="420" y="510" text-anchor="middle">−4 → 最後は2</text><text x="420" y="635" text-anchor="middle">試した数について確かめる</text><text x="1180" y="430" text-anchor="middle">n → 3n → 3n+6</text><text x="1180" y="510" text-anchor="middle">→ n+2 → 2</text><text x="1180" y="635" text-anchor="middle">nが消える理由を説明する</text><text x="800" y="840" text-anchor="middle">いくつかの例で試すだけでは、すべての数の説明にはならない。</text></g></svg>