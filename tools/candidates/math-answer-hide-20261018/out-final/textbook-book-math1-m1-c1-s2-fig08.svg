<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">素因数分解の木（分け方を変えても同じ素数になる）</title><desc id="desc">60を6と10に分けても、4と15に分けても、最後は2、2、3、5になり、60＝2²×3×5。</desc><rect width="1000" height="700" fill="white"/><g font-family="system-ui,sans-serif" fill="#222">
<g data-tree="left">
<line x1="260" y1="157" x2="140" y2="252" stroke="#222" stroke-width="2" data-parent="0" data-child="1"/>
<line x1="260" y1="157" x2="390" y2="252" stroke="#222" stroke-width="2" data-parent="0" data-child="2"/>
<line x1="140" y1="307" x2="70" y2="412" stroke="#222" stroke-width="2" data-parent="1" data-child="3"/>
<line x1="140" y1="307" x2="210" y2="412" stroke="#222" stroke-width="2" data-parent="1" data-child="4"/>
<line x1="390" y1="307" x2="320" y2="412" stroke="#222" stroke-width="2" data-parent="2" data-child="5"/>
<line x1="390" y1="307" x2="460" y2="412" stroke="#222" stroke-width="2" data-parent="2" data-child="6"/>
<text x="260" y="140" font-size="36" text-anchor="middle" data-node="0">60</text>
<text x="140" y="290" font-size="36" text-anchor="middle" data-node="1">6</text>
<text x="390" y="290" font-size="36" text-anchor="middle" data-node="2">10</text>
<circle cx="70" cy="438" r="34" fill="white" stroke="#222" stroke-width="3" data-prime="2"/>
<text x="70" y="450" font-size="36" text-anchor="middle" data-node="3">2</text>
<circle cx="210" cy="438" r="34" fill="white" stroke="#222" stroke-width="3" data-prime="3"/>
<text x="210" y="450" font-size="36" text-anchor="middle" data-node="4">3</text>
<circle cx="320" cy="438" r="34" fill="white" stroke="#222" stroke-width="3" data-prime="2"/>
<text x="320" y="450" font-size="36" text-anchor="middle" data-node="5">2</text>
<circle cx="460" cy="438" r="34" fill="white" stroke="#222" stroke-width="3" data-prime="5"/>
<text x="460" y="450" font-size="36" text-anchor="middle" data-node="6">5</text>
</g>
<g data-tree="right">
<line x1="740" y1="157" x2="620" y2="252" stroke="#222" stroke-width="2" data-parent="0" data-child="1"/>
<line x1="740" y1="157" x2="870" y2="252" stroke="#222" stroke-width="2" data-parent="0" data-child="2"/>
<line x1="620" y1="307" x2="550" y2="412" stroke="#222" stroke-width="2" data-parent="1" data-child="3"/>
<line x1="620" y1="307" x2="690" y2="412" stroke="#222" stroke-width="2" data-parent="1" data-child="4"/>
<line x1="870" y1="307" x2="800" y2="412" stroke="#222" stroke-width="2" data-parent="2" data-child="5"/>
<line x1="870" y1="307" x2="940" y2="412" stroke="#222" stroke-width="2" data-parent="2" data-child="6"/>
<text x="740" y="140" font-size="36" text-anchor="middle" data-node="0">60</text>
<text x="620" y="290" font-size="36" text-anchor="middle" data-node="1">4</text>
<text x="870" y="290" font-size="36" text-anchor="middle" data-node="2">15</text>
<circle cx="550" cy="438" r="34" fill="white" stroke="#222" stroke-width="3" data-prime="2"/>
<text x="550" y="450" font-size="36" text-anchor="middle" data-node="3">2</text>
<circle cx="690" cy="438" r="34" fill="white" stroke="#222" stroke-width="3" data-prime="2"/>
<text x="690" y="450" font-size="36" text-anchor="middle" data-node="4">2</text>
<circle cx="800" cy="438" r="34" fill="white" stroke="#222" stroke-width="3" data-prime="3"/>
<text x="800" y="450" font-size="36" text-anchor="middle" data-node="5">3</text>
<circle cx="940" cy="438" r="34" fill="white" stroke="#222" stroke-width="3" data-prime="5"/>
<text x="940" y="450" font-size="36" text-anchor="middle" data-node="6">5</text>
</g>
<rect x="65" y="580" width="870" height="85" rx="16" fill="white" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="500" y="635" font-size="40" text-anchor="middle" data-factorization="true">2×2×3×5＝2²×3×5</text>
</g></svg>