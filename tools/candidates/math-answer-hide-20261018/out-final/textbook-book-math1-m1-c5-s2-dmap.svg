<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>この節の地図</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="412.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">移動と作図の地図</text><rect x="60.0" y="150.0" width="700.0" height="330.0" rx="24" fill="white" stroke="#1f5fa8" stroke-width="5"/><rect x="60.0" y="150.0" width="700.0" height="70.0" rx="24" fill="#1f5fa8" stroke="none" stroke-width="4"/><rect x="60.0" y="190.0" width="700.0" height="30.0" rx="0" fill="#1f5fa8" stroke="none" stroke-width="4"/><text x="410.0" y="200.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">3つの移動</text><text x="410.0" y="280.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">平行移動：ずらす</text><text x="410.0" y="338.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">回転移動：まわす</text><text x="410.0" y="396.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">対称移動：折り返す</text><rect x="840.0" y="150.0" width="700.0" height="330.0" rx="24" fill="white" stroke="#e07a1f" stroke-width="5"/><rect x="840.0" y="150.0" width="700.0" height="70.0" rx="24" fill="#e07a1f" stroke="none" stroke-width="4"/><rect x="840.0" y="190.0" width="700.0" height="30.0" rx="0" fill="#e07a1f" stroke="none" stroke-width="4"/><text x="1190.0" y="200.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">3つの基本の作図</text><text x="1190.0" y="280.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">垂直二等分線</text><text x="1190.0" y="338.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">角の二等分線</text><text x="1190.0" y="396.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">垂線</text><rect x="420.0" y="560.0" width="760.0" height="220.0" rx="18" fill="#fff7ec" stroke="#e07a1f" stroke-width="5"/><text x="800.0" y="640.0" font-size="48" fill="#e07a1f" text-anchor="middle" font-weight="800">理由はぜんぶ ひし形</text><text x="800.0" y="710.0" font-size="34" fill="#203348" text-anchor="middle" font-weight="700">対角線は 垂直に2等分し合い、角を2等分する</text><line x1="1190.0" y1="490.0" x2="1000.0" y2="550.0" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/><polygon points="1000.0,550.0 1013.1,537.7 1017.8,552.6" fill="#e07a1f" stroke="none" stroke-width="4" stroke-linejoin="round"/><text x="800.0" y="850.0" font-size="36" fill="#203348" text-anchor="middle" font-weight="700">形と大きさを変えずに動かす ／ 定規とコンパスだけでかく</text></g></svg>