<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>この節の地図</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="500.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">方程式の解き方の地図</text><rect x="70.0" y="230.0" width="330.0" height="330.0" rx="24" fill="white" stroke="#1f5fa8" stroke-width="5"/><rect x="70.0" y="230.0" width="330.0" height="70.0" rx="24" fill="#1f5fa8" stroke="none" stroke-width="4"/><rect x="70.0" y="270.0" width="330.0" height="30.0" rx="0" fill="#1f5fa8" stroke="none" stroke-width="4"/><text x="235.0" y="280.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">1. 整える</text><text x="235.0" y="420.0" font-size="34" fill="#203348" text-anchor="middle" font-weight="700">分数・小数・かっこ</text><line x1="410.0" y1="395.0" x2="442.0" y2="395.0" stroke="#203348" stroke-width="6" stroke-linecap="round"/><polygon points="442.0,395.0 425.8,402.8 425.8,387.2" fill="#203348" stroke="none" stroke-width="4" stroke-linejoin="round"/><rect x="450.0" y="230.0" width="330.0" height="330.0" rx="24" fill="white" stroke="#e07a1f" stroke-width="5"/><rect x="450.0" y="230.0" width="330.0" height="70.0" rx="24" fill="#e07a1f" stroke="none" stroke-width="4"/><rect x="450.0" y="270.0" width="330.0" height="30.0" rx="0" fill="#e07a1f" stroke="none" stroke-width="4"/><text x="615.0" y="280.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">2. 集める</text><text x="615.0" y="420.0" font-size="34" fill="#203348" text-anchor="middle" font-weight="700">移項して ax＝b</text><line x1="790.0" y1="395.0" x2="822.0" y2="395.0" stroke="#203348" stroke-width="6" stroke-linecap="round"/><polygon points="822.0,395.0 805.8,402.8 805.8,387.2" fill="#203348" stroke="none" stroke-width="4" stroke-linejoin="round"/><rect x="830.0" y="230.0" width="330.0" height="330.0" rx="24" fill="white" stroke="#2a8a5b" stroke-width="5"/><rect x="830.0" y="230.0" width="330.0" height="70.0" rx="24" fill="#2a8a5b" stroke="none" stroke-width="4"/><rect x="830.0" y="270.0" width="330.0" height="30.0" rx="0" fill="#2a8a5b" stroke="none" stroke-width="4"/><text x="995.0" y="280.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">3. わる</text><text x="995.0" y="420.0" font-size="34" fill="#203348" text-anchor="middle" font-weight="700">両辺を a でわる</text><line x1="1170.0" y1="395.0" x2="1202.0" y2="395.0" stroke="#203348" stroke-width="6" stroke-linecap="round"/><polygon points="1202.0,395.0 1185.8,402.8 1185.8,387.2" fill="#203348" stroke="none" stroke-width="4" stroke-linejoin="round"/><rect x="1210.0" y="230.0" width="330.0" height="330.0" rx="24" fill="white" stroke="#8a5cc2" stroke-width="5"/><rect x="1210.0" y="230.0" width="330.0" height="70.0" rx="24" fill="#8a5cc2" stroke="none" stroke-width="4"/><rect x="1210.0" y="270.0" width="330.0" height="30.0" rx="0" fill="#8a5cc2" stroke="none" stroke-width="4"/><text x="1375.0" y="280.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">4. 確かめる</text><text x="1375.0" y="420.0" font-size="34" fill="#203348" text-anchor="middle" font-weight="700">もとの式に入れる</text><text x="800.0" y="680.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">等式の性質（両辺に同じ計算をしても等式は成り立つ）が土台</text><text x="800.0" y="760.0" font-size="40" fill="#e07a1f" text-anchor="middle" font-weight="700">比例式 a：b＝c：d は ad＝bc で1次方程式になる</text></g></svg>