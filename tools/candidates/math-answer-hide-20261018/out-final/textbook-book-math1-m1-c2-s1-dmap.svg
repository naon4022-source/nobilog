<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348" font-size="40"><text x="90" y="100" font-size="48">文字式｜パン屋からつながる3つの考え方</text><rect x="80" y="230" width="440" height="470" rx="24" fill="white" stroke="#386a9a" stroke-width="5"/><text x="300" y="325" text-anchor="middle">1. 数量を式に</text><text x="300" y="450" text-anchor="middle">パン5個と牛乳1本</text><text x="300" y="590" text-anchor="middle">x×5+120</text><path d="M532 490h45l-16 -14m16 14l-16 14" fill="none" stroke="#386a9a" stroke-width="5"/><rect x="590" y="230" width="440" height="470" rx="24" fill="white" stroke="#386a9a" stroke-width="5"/><text x="810" y="325" text-anchor="middle">2. 書き方</text><text x="810" y="450" text-anchor="middle">数を前へ。×を省く。</text><text x="810" y="590" text-anchor="middle">5x+120</text><path d="M1042 490h45l-16 -14m16 14l-16 14" fill="none" stroke="#386a9a" stroke-width="5"/><rect x="1100" y="230" width="440" height="470" rx="24" fill="white" stroke="#386a9a" stroke-width="5"/><text x="1320" y="325" text-anchor="middle">3. 式の値</text><text x="1320" y="450" text-anchor="middle">x＝150 を入れる</text><text x="1320" y="590" text-anchor="middle">5×150+120</text><text x="800" y="830" text-anchor="middle">変わる値を文字に → きまりに合わせる → 数で確かめる</text></g></svg>