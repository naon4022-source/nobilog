f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="810.1" y="433.2" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t21">同じ大きさの実像</text><rect x="560.0" y="445.0" width="130.3" height="27.7" rx="0" fill="#e8f0fa" stroke="#c9d6e8" stroke-width="1.5"/><text x="625.1" y="460.9" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t30">2FとFの間</text><rect x="690.3" y="445.0" width="239.7" height="27.7" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="810.1" y="460.9" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t31">大きい実像</text><rect x="560.0" y="472.7" width="130.3" height="27.7" rx="0" fill="#e8f0fa" stroke="#c9d6e8" stroke-width="1.5"/><text x="625.1" y="488.5" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t40">Fの位置</text><rect x="690.3" y="472.7" width="239.7" height="27.7" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="810.1" y="488.5" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t41">できない</text><rect x="560.0" y="500.3" width="130.3" height="27.7" rx="0" fill="#e8f0fa" stroke="#c9d6e8" stroke-width="1.5"/><text x="625.1" y="516.2" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t50">Fより内側</text><rect x="690.3" y="500.3" width="239.7" height="27.7" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="810.1" y="516.2" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t51">大きい虚像（同じ向き）</text></svg>
