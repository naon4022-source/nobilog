<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="凸レンズの作図"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">凸レンズの作図：3本の光と実像（物体が焦点距離の2倍より遠いとき）</text><line x1="30.0" y1="272.0" x2="930.0" y2="272.0" stroke="#8a96a3" stroke-width="2"/><text x="925.0" y="264.0" font-size="14" font-weight="600" fill="#8a96a3" text-anchor="end">光軸</text><ellipse cx="470.0" cy="272.0" rx="14.0" ry="150.0" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><circle cx="370.0" cy="272.0" r="5.0" fill="#1d2b3a"/><text x="370.0" y="298.0" font-size="15" font-weight="800" fill="#1d2b3a" text-anchor="middle">焦点 F</text><circle cx="270.0" cy="272.0" r="5.0" fill="#1d2b3a"/><text x="270.0" y="298.0" font-size="15" font-weight="800" fill="#1d2b3a" text-anchor="middle">2F</text><circle cx="570.0" cy="272.0" r="5.0" fill="#1d2b3a"/><text x="570.0" y="298.0" font-size="15" font-weight="800" fill="#1d2b3a" text-anchor="middle">焦点 F</text><circle cx="670.0" cy="272.0" r="5.0" fill="#1d2b3a"/><text x="670.0" y="298.0" font-size="15" font-weight="800" fill="#1d2b3a" text-anchor="middle">2F</text><line x1="170.0" y1="272.0" x2="170.0" y2="193.2" stroke="#2a8a5b" stroke-width="5" stroke-linecap="round"/><polygon points="170.0,182.0 176.1,194.6 163.9,194.6" fill="#2a8a5b"/><text x="170.0" y="170.0" font-size="18" font-weight="800" fill="#2a8a5b" text-anchor="middle">物体</text><line x1="620.0" y1="272.0" x2="620.0" y2="305.8" stroke="#c8414f" stroke-width="5" stroke-linecap="round"/><polygon points="620.0,317.0 613.9,304.4 626.1,304.4" fill="#c8414f"/><text x="630.0" y="347.0" font-size="17" font-weight="800" fill="#c8414f" text-anchor="start">実像（さかさま・小さい）</text><line x1="170.0" y