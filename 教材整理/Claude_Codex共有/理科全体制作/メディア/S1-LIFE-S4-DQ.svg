<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：動物の特徴と分類"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：動物の特徴と分類</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="42.3" rx="14" fill="#1f5fa8"/><rect x="30.0" y="102.3" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="87.8" font-size="18" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">セキツイ動物の5つのなかま</text><text x="40.0" y="139.0" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="139.0" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">魚類：えら呼吸、</text><text x="60.0" y="166.0" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">うろこ、卵生（水中に</text><text x="60.0" y="193.0" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">殻のない卵）。</text><text x="40.0" y="227.0" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="227.0" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">両生類：子はえら、</text><text x="60.0" y="254.0" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">親は肺と皮膚、しめっ</text><text x="60.0" y="281.0" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">た皮膚、卵生（殻のな</text><text x="60.0" y="308.0" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">い卵）。</text><text x="40.0" y="342.0" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="342.0" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">は虫類：肺呼吸、</text><text x="60.0" y="369.0" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">うろこ、卵生（殻のあ</text><text x="60.0" y="396.0" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">る卵）。</text><text x="40.0" y="430.0" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="430.0" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">鳥類：肺呼吸、羽毛、</text><text x="60.0" y="457.0" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">卵生（殻のある卵）。</text></g><g data-id="b24"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b24">無セキツイ動物</text><text x="346.0" y="191.4" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b24">・</text><text x="365.0" y="191.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">節足動物：体とあしに節</text><text x="365.0" y="217.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">があり、外骨格でおおわ</text><text x="365.0" y="242.7" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">れる（昆虫類・甲殻類な</text><text x="365.0" y="268.3" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">ど）。</text><text x="346.0" y="300.6" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b24">・</text><text x="365.0" y="300.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">昆虫類：体が頭部・</text><text x="365.0" y="326.3" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">胸部・腹部、あし（？）。</text><text x="346.0" y="358.6" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b24">・</text><text x="365.0" y="358.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">（？）：外とう膜で内臓</text><text x="365.0" y="384.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">が包まれている（イカ・</text><text x="365.0" y="409.9" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">タコ・貝）。</text></g><g data-id="b42"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b42">食べ物と体のつくり</text><text x="652.0" y="226.3" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b42">・</text><text x="673.0" y="226.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">肉食動物：目が前向き</text><text x="673.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">→立体的に見えて距離</text><text x="673.0" y="283.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">がわかる。</text><text x="652.0" y="318.7" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b42">・</text><text x="673.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">草食動物：目が横向き</text><text x="673.0" y="347.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">→広い範囲を見わたせ</text><text x="673.0" y="375.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">る。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><defs><radialGradient id="nb1b" cx="35%" cy="25%" r="75%"><stop offset="0" stop-color="#d9f7df"/><stop offset=".55" stop-color="#a9e4b6"/><stop offset="1" stop-color="#7fcf93"/></radialGradient><linearGradient id="nb1l" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4fb562"/><stop offset="1" stop-color="#8be09a"/></linearGradient><radialGradient id="nb1c"><stop offset="0" stop-color="#ff8096" stop-opacity=".75"/><stop offset="1" stop-color="#ff8096" stop-opacity="0"/></radialGradient></defs><g transform="translate(40,520) scale(0.25)"><ellipse cx="0" cy="54" rx="50" ry="9" fill="#285a3c" fill-opacity=".13"/><ellipse cx="-20" cy="46" rx="15" ry="9" fill="#6cbf80" stroke="#3e8f55" stroke-width="3"/><ellipse cx="20" cy="46" rx="15" ry="9" fill="#6cbf80" stroke="#3e8f55" stroke-width="3"/><g transform="rotate(0 0 -44)"><path d="M0,-38 Q2,-54 0,-66" fill="none" stroke="#3e8f55" stroke-width="5" stroke-linecap="round"/><g transform="translate(0,-64) rotate(-54)"><path d="M0,0 C-22,-6 -24,-34 0,-42 C16,-32 12,-8 0,0Z" fill="url(#nb1l)" stroke="#3e8f55" stroke-width="3"/><path d="M0,-3 Q-4,-20 0,-36" fill="none" stroke="#2e7846" stroke-opacity=".55" stroke-width="2"/><ellipse cx="-6" cy="-28" rx="3.5" ry="6" fill="#fff" fill-opacity=".55" transform="rotate(-23 -6 -28)"/></g><g transform="translate(0,-64) rotate(54)"><path d="M0,0 C22,-6 24,-34 0,-42 C-16,-32 -12,-8 0,0Z" fill="url(#nb1l)" stroke="#3e8f55" stroke-width="3"/><path d="M0,-3 Q4,-20 0,-36" fill="none" stroke="#2e7846" stroke-opacity=".55" stroke-width="2"/><ellipse cx="6" cy="-28" rx="3.5" ry="6" fill="#fff" fill-opacity=".55" transform="rotate(23 6 -28)"/></g></g><ellipse cx="0" cy="14" rx="10" ry="16" fill="#9edbae" stroke="#3e8f55" stroke-width="3" transform="translate(-50,10) rotate(26)"/><ellipse cx="0" cy="14" rx="10" ry="16" fill="#9edbae" stroke="#3e8f55" stroke-width="3" transform="translate(50,10) rotate(-26)"/><path d="M0,-46 C40,-46 60,-18 60,12 C60,40 34,50 0,50 C-34,50 -60,40 -60,12 C-60,-18 -40,-46 0,-46Z" fill="url(#nb1b)" stroke="#3e8f55" stroke-width="3.5"/><ellipse cx="-30" cy="-22" rx="9" ry="5" fill="#fff" fill-opacity=".7" transform="rotate(-34 -30 -22)"/><circle cx="-17" cy="-31" r="2.6" fill="#fff" fill-opacity=".7"/><circle cx="-33" cy="16" r="13" fill="url(#nb1c)"/><circle cx="33" cy="16" r="13" fill="url(#nb1c)"/><ellipse cx="-19" cy="4" rx="9" ry="11.5" fill="#2b2f45"/><ellipse cx="-19.0" cy="7.0" rx="6.5" ry="7.0" fill="#6e96eb" fill-opacity=".55"/><circle cx="-22" cy="-0.5" r="3.6" fill="#fff"/><circle cx="-15.6" cy="8.0" r="1.7" fill="#fff"/><ellipse cx="19" cy="4" rx="9" ry="11.5" fill="#2b2f45"/><ellipse cx="19.0" cy="7.0" rx="6.5" ry="7.0" fill="#6e96eb" fill-opacity=".55"/><circle cx="16" cy="-0.5" r="3.6" fill="#fff"/><circle cx="22.4" cy="8.0" r="1.7" fill="#fff"/><path d="M-8,18 Q-4,23 0,18 Q4,23 8,18" fill="none" stroke="#2b2f45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
