<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：凸レンズのはたらき"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：凸レンズのはたらき</text><g data-id="b2"><rect x="30.0" y="68.0" width="441.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="441.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="441.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="250.5" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">作図の3本の光</text><text x="40.0" y="222.7" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="222.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">光軸に平行な光 → レンズで屈折して</text><text x="61.0" y="251.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">反対側の（？）を通る。</text><text x="40.0" y="286.7" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="286.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">レンズの中心を通る光 →</text><text x="61.0" y="315.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">そのまま直進。</text><text x="40.0" y="350.8" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="350.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">焦点を通ってレンズに入った光 →</text><text x="61.0" y="379.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">光軸に平行に進む。</text></g><g data-id="b17"><rect x="489.0" y="68.0" width="441.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="489.0" y="68.0" width="441.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="489.0" y="107.7" width="441.0" height="8.0" rx="0" fill="#e07a1f"/><text x="709.5" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b17">物体の位置と像</text><text x="499.0" y="222.8" font-size="20" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b17">・</text><text x="519.0" y="222.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">焦点距離の2倍より遠い：</text><text x="519.0" y="249.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">実物より小さい（？）。</text><text x="499.0" y="283.8" font-size="20" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b17">・</text><text x="519.0" y="283.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">焦点距離の2倍の位置：実物と同じ大き</text><text x="519.0" y="310.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">さの実像（像も反対側の2倍の位置）。</text><text x="499.0" y="344.8" font-size="20" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b17">・</text><text x="519.0" y="344.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">2倍と焦点の間：実物より大きい実像。</text><text x="499.0" y="378.8" font-size="20" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b17">・</text><text x="519.0" y="378.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">焦点の位置：像はできない。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
