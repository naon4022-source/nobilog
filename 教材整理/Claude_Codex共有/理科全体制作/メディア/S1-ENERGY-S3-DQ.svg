<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：音の性質"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：音の性質</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">大きさと高さ</text><text x="40.0" y="185.8" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="185.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">振幅（振れ幅）が大き</text><text x="60.0" y="212.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">い → 大きい音。</text><text x="40.0" y="246.8" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="246.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">振動数（1秒間に振動す</text><text x="60.0" y="273.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">る回数）が（？） →</text><text x="60.0" y="300.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">高い音。単位は（？）</text><text x="60.0" y="327.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（（？））。</text><text x="40.0" y="361.8" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="361.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">弦の場合：短い・</text><text x="60.0" y="388.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">細い・強くはる →</text><text x="60.0" y="415.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">高い音。</text></g><g data-id="b20"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b20">音の速さ</text><text x="346.0" y="254.7" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="367.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">速さ＝距離 ÷ 時間。</text><text x="346.0" y="290.4" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="367.0" y="290.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">例：音が 3秒後に聞こ</text><text x="367.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">えた → 340 × 3 ＝</text><text x="367.0" y="347.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">1020m はなれている。</text></g><g data-id="b32"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b32">オシロスコープの波形</text><text x="652.0" y="254.7" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b32">・</text><text x="673.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b32">たての高さ＝振幅（大</text><text x="673.0" y="283.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b32">きさ）。</text><text x="652.0" y="318.7" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b32">・</text><text x="673.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b32">山の数の多さ＝振動数</text><text x="673.0" y="347.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b32">（高さ）。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><defs><radialGradient id="nb1b" cx="35%" cy="25%" r="75%"><stop offset="0" stop-color="#d9f7df"/><stop offset=".55" stop-color="#a9e4b6"/><stop offset="1" stop-color="#7fcf93"/></radialGradient><linearGradient id="nb1l" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4fb562"/><stop offset="1" stop-color="#8be09a"/></linearGradient><radialGradient id="nb1c"><stop offset="0" stop-color="#ff8096" stop-opacity=".75"/><stop offset="1" stop-color="#ff8096" stop-opacity="0"/></radialGradient></defs><g transform="translate(40,520) scale(0.25)"><ellipse cx="0" cy="54" rx="50" ry="9" fill="#285a3c" fill-opacity=".13"/><ellipse cx="-20" cy="46" rx="15" ry="9" fill="#6cbf80" stroke="#3e8f55" stroke-width="3"/><ellipse cx="20" cy="46" rx="15" ry="9" fill="#6cbf80" stroke="#3e8f55" stroke-width="3"/><g transform="rotate(0 0 -44)"><path d="M0,-38 Q2,-54 0,-66" fill="none" stroke="#3e8f55" stroke-width="5" stroke-linecap="round"/><g transform="translate(0,-64) rotate(-54)"><path d="M0,0 C-22,-6 -24,-34 0,-42 C16,-32 12,-8 0,0Z" fill="url(#nb1l)" stroke="#3e8f55" stroke-width="3"/><path d="M0,-3 Q-4,-20 0,-36" fill="none" stroke="#2e