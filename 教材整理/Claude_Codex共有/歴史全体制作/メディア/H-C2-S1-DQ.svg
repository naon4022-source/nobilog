<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：武士の成長と鎌倉幕府"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：武士の成長と鎌倉幕府</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">鎌倉幕府のしくみ</text><text x="40.0" y="180.1" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="180.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">御恩：将軍が御家人の</text><text x="61.0" y="208.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">領地を保護し、新しい</text><text x="61.0" y="236.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">領地を与える。</text><text x="40.0" y="272.5" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="272.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">奉公：御家人が戦いの</text><text x="61.0" y="300.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">ときに命がけで戦い、</text><text x="61.0" y="329.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">警備をする。</text><text x="40.0" y="364.9" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="364.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">守護（国ごと）・</text><text x="61.0" y="393.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">地頭（荘園・公領ごと）</text><text x="61.0" y="421.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">を置く。</text></g><g data-id="b20"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b20">元寇と幕府のおとろえ</text><text x="346.0" y="178.5" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="365.0" y="178.5" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">フビライ・ハンが率いる</text><text x="365.0" y="204.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">元が二度せめてくる（文</text><text x="365.0" y="229.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">永の役・弘安の役）。</text><text x="365.0" y="255.5" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">執権は（？）。</text><text x="346.0" y="287.8" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="365.0" y="287.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">恩賞（新しい領地）</text><text x="365.0" y="313.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">が十分でなく、御家人の</text><text x="365.0" y="339.1" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">不満が高まる。</text><text x="346.0" y="371.4" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="365.0" y="371.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">徳政令（1297年）</text><text x="365.0" y="397.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">で借金を帳消しにしたが、</text><text x="365.0" y="422.7" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">混乱。</text></g><g data-id="b39"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b39">鎌倉文化と新しい仏教</text><text x="652.0" y="183.8" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b39">・</text><text x="673.0" y="183.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">力強い文化：東大寺南</text><text x="673.0" y="212.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">大門の金剛力士像（運</text><text x="673.0" y="240.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">慶ら）、『平家物語』</text><text x="673.0" y="268.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">（琵琶法師）。</text><text x="652.0" y="304.6" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b39">・</text><text x="673.0" y="304.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">新しい仏教：浄土宗</text><text x="673.0" y="332.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">（法然）・浄土真宗</text><text x="673.0" y="361.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">（親鸞）・時宗（一遍）</text><text x="673.0" y="389.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">・日蓮宗（日蓮）・</text><text x="673.0" y="418.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">禅宗（栄西・道元）。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
