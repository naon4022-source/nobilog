<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="第一次世界大戦の対立関係"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">第一次世界大戦の対立（三国同盟と三国協商）</text><g data-id="b2"><rect x="40.0" y="92.0" width="360.0" height="220.0" rx="14" fill="#fdecee" stroke="#c8414f" stroke-width="3"/><rect x="40.0" y="92.0" width="360.0" height="47.7" rx="14" fill="#c8414f"/><rect x="40.0" y="131.7" width="360.0" height="8.0" rx="0" fill="#c8414f"/><text x="220.0" y="115.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">三国同盟</text><text x="220.0" y="194.1" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">ドイツ</text><text x="220.0" y="226.5" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">オーストリア</text><text x="220.0" y="258.9" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">イタリア</text></g><g data-id="b11"><rect x="560.0" y="92.0" width="360.0" height="220.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="560.0" y="92.0" width="360.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="560.0" y="131.7" width="360.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="740.0" y="115.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b11">三国協商</text><text x="740.0" y="194.1" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b11">イギリス</text><text x="740.0" y="226.5" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b11">フランス</text><text x="740.0" y="258.9" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b11">ロシア</text></g><line x1="422.8" y1="202.0" x2="537.2" y2="202.0" stroke="#c8414f" stroke-width="6" stroke-linecap="round"/><polygon points="550.0,202.0 535.6,209.0 535.6,195.0" fill="#c8414f"/><polygon points="410.0,202.0 424.4,195.0 424.4,209.0" fill="#c8414f"/><rect x="456.4" y="185.2" width="47.3" height="25.6" rx="8" fill="#fff" stroke="#c8414f" stroke-width="1.5"/><text x="480.0" y="207.6" font-size="16" font-weight="700" fill="#c8414f" text-anchor="middle">対立</text><g data-id="b25"><rect x="560.0" y="332.0" width="360.0" height="90.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="740.0" y="368.0" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b25">日本は日英同盟を理由に、</text><text x="740.0" y="390.9" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b25">協商（連合国）側で参戦</text></g><g data-id="b30"><rect x="40.0" y="332.0" width="360.0" height="90.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="220.0" y="379.5" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b30">イタリアはのちに連合国側で参戦</text></g><g data-id="b34"><rect x="40.0" y="450.0" width="880.0" height="75.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="480.0" y="490.0" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b34">戦後 → 国際連盟。国内：大正デモクラシー（民本主義・米騒動・原敬の政党内閣・1925年 普通選挙法）。</text></g></svg>
