<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="開国から幕府滅亡までの流れ"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">開国から江戸幕府の滅亡まで</text><line x1="30.0" y1="246.0" x2="922.2" y2="246.0" stroke="#8a96a3" stroke-width="5" stroke-linecap="round"/><polygon points="935.0,246.0 920.6,253.0 920.6,239.0" fill="#8a96a3"/><circle cx="50.0" cy="246.0" r="9.0" fill="#e07a1f" stroke="#fff" stroke-width="3"/><line x1="50.0" y1="234.0" x2="50.0" y2="216.0" stroke="#c9d6e8" stroke-width="2" stroke-dasharray="4 4"/><g data-id="b6"><rect x="10.0" y="72.0" width="230.0" height="144.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="10.0" y="72.0" width="230.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="10.0" y="111.7" width="230.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="125.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b6">1853年</text><text x="125.0" y="169.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b6">ペリー来航</text></g><circle cx="222.0" cy="246.0" r="9.0" fill="#e07a1f" stroke="#fff" stroke-width="3"/><line x1="222.0" y1="258.0" x2="222.0" y2="276.0" stroke="#c9d6e8" stroke-width="2" stroke-dasharray="4 4"/><g data-id="b15"><rect x="107.0" y="276.0" width="230.0" height="144.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="107.0" y="276.0" width="230.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="107.0" y="315.7" width="230.0" height="8.0" rx="0" fill="#e07a1f"/><text x="222.0" y="299.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b15">1854年</text><text x="222.0" y="360.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b15">日米和親条約</text><text x="222.0" y="385.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b15">下田・函館を開く</text></g><circle cx="394.0" cy="246.0" r="9.0" fill="#e07a1f" stroke="#fff" stroke-width="3"/><line x1="394.0" y1="234.0" x2="394.0" y2="216.0" stroke="#c9d6e8" stroke-width="2" stroke-dasharray="4 4"/><g data-id="b25"><rect x="279.0" y="72.0" width="230.0" height="144.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="279.0" y="72.0" width="230.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="279.0" y="111.7" width="230.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="394.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b25">1858年</text><text x="394.0" y="156.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b25">日米修好通商条約</text><text x="394.0" y="181.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b25">不平等条約（井伊直弼）</text></g><circle cx="566.0" cy="246.0" r="9.0" fill="#e07a1f" stroke="#fff" stroke-width="3"/><line x1="566.0" y1="258.0" x2="566.0" y2="276.0" stroke="#c9d6e8" stroke-width="2" stroke-dasharray="4 4"/><g data-id="b35"><rect x="451.0" y="276.0" width="230.0" height="144.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><rect x="451.0" y="276.0" width="230.0" height="47.7" rx="14" fill="#6a4aa0"/><rect x="451.0" y="315.7" width="230.0" height="8.0" rx="0" fill="#6a4aa0"/><text x="566.0" y="299.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b35">尊王攘夷</text><text x="566.0" y="360.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b35">→ 薩長同盟</text><text x="566.0" y="385.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b35">（坂本龍馬の仲立ち）</text></g><circle cx="738.0" cy="246.0" r="9.0" fill="#e07a1f" stroke="#fff" stroke-width="3"/><line x1="738.0" y1="234.0" x2="738.0" y2="216.0" stroke="#c9d6e8" stroke-width="2" stroke-dasharray="4 4"/><g data-id="b45"><rect x="623.0" y="72.0" width="230.0" height="144.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="623.0" y="72.0" width="230.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="623.0" y="111.7" width="230.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="738.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b45">1867年</text><text x="738.0" y="156.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b45">大政奉還</text><text x="738.0" y="181.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b45">（徳川慶喜）</text></g><circle cx="910.0" cy="246.0" r="9.0" fill="#e07a1f" stroke="#fff" stroke-width="3"/><line x1="910.0" y1="258.0" x2="910.0" y2="276.0" stroke="#c9d6e8" stroke-width="2" stroke-dasharray="4 4"/><g data-id="b55"><rect x="720.0" y="276.0" width="230.0" height="144.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="720.0" y="276.0" width="230.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="720.0" y="315.7" width="230.0" height="8.0" rx="0" fill="#e07a1f"/><text x="835.0" y="299.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b55">戊辰戦争</text><text x="835.0" y="373.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b55">旧幕府軍が敗れる</text></g><g data-id="b62"><rect x="30.0" y="440.0" width="900.0" height="85.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="480.0" y="473.5" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b62">不平等条約：領事裁判権を認め、関税自主権がない。→ のちに陸奥宗光（1894年）・</text><text x="480.0" y="496.4" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b62">小村寿太郎（1911年）が改正。</text></g></svg>
