<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="応仁の乱から戦国時代への流れ"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">応仁の乱から戦国時代へ（下剋上）</text><g data-id="b2"><rect x="30.0" y="72.0" width="190.5" height="268.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="72.0" width="190.5" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="111.7" width="190.5" height="8.0" rx="0" fill="#1f5fa8"/><text x="125.2" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">応仁の乱</text><text x="125.2" y="160.6" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">将軍のあと</text><text x="125.2" y="195.7" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">つぎ争いな</text><text x="125.2" y="230.8" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">どから京都</text><text x="125.2" y="265.9" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">で戦乱</text><text x="125.2" y="301.0" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">（1467年）</text></g><line x1="224.5" y1="206.0" x2="251.3" y2="206.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="262.5,206.0 249.9,212.1 249.9,199.9" fill="#e07a1f"/><g data-id="b15"><rect x="266.5" y="72.0" width="190.5" height="268.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="266.5" y="72.0" width="190.5" height="77.4" rx="14" fill="#e07a1f"/><rect x="266.5" y="141.4" width="190.5" height="8.0" rx="0" fill="#e07a1f"/><text x="361.8" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b15">幕府の力がお</text><text x="361.8" y="124.7" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b15">とろえる</text><text x="361.8" y="228.1" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b15">戦乱が全国</text><text x="361.8" y="263.2" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b15">に広がる</text></g><line x1="461.0" y1="206.0" x2="487.8" y2="206.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="499.0,206.0 486.4,212.1 486.4,199.9" fill="#e07a1f"/><g data-id="b26"><rect x="503.0" y="72.0" width="190.5" height="268.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="503.0" y="72.0" width="190.5" height="47.7" rx="14" fill="#2a8a5b"/><rect x="503.0" y="111.7" width="190.5" height="8.0" rx="0" fill="#2a8a5b"/><text x="598.2" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b26">下剋上</text><text x="598.2" y="195.7" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b26">下の身分の</text><text x="598.2" y="230.8" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b26">者が上の者</text><text x="598.2" y="265.9" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b26">をたおす</text></g><line x1="697.5" y1="206.0" x2="724.3" y2="206.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="735.5,206.0 722.9,212.1 722.9,199.9" fill="#e07a1f"/><g data-id="b37"><rect x="739.5" y="72.0" width="190.5" height="268.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><rect x="739.5" y="72.0" width="190.5" height="47.7" rx="14" fill="#6a4aa0"/><rect x="739.5" y="111.7" width="190.5" height="8.0" rx="0" fill="#6a4aa0"/><text x="834.8" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b37">戦国大名</text><text x="834.8" y="200.5" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b37">分国法で領国</text><text x="834.8" y="230.2" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b37">を治め、城下</text><text x="834.8" y="259.9" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b37">町をつくる</text></g><g data-id="b46"><rect x="30.0" y="360.0" width="900.0" height="165.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><rect x="30.0" y="360.0" width="900.0" height="47.7" rx="14" fill="#6a4aa0"/><rect x="30.0" y="399.7" width="900.0" height="8.0" rx="0" fill="#6a4aa0"/><text x="480.0" y="383.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b46">室町時代のようす</text><text x="44.0" y="454.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b46">民衆の成長：二毛作・定期市・座、村の自治（惣）、土一揆・一向一揆・山城の国一揆。</text><text x="44.0" y="478.3" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b46">文化：北山文化（金閣・足利義満、能）、東山文化（銀閣・足利義政、書院造、雪舟の水墨画）。</text></g></svg>
