<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：江戸時代の産業・文化と幕府の改革"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：江戸時代の産業・文化と幕府の改革</text><g data-id="b2"><rect x="30.0" y="68.0" width="441.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="441.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="441.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="250.5" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">三大改革</text><text x="40.0" y="176.5" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="176.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">享保の改革（徳川吉宗）：</text><text x="61.0" y="204.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">公事方御定書、目安箱、上げ米の制。</text><text x="40.0" y="240.5" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="240.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">寛政の改革（松平定信）：</text><text x="61.0" y="268.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">朱子学以外の学問を禁止、</text><text x="61.0" y="297.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">ききんにそなえて米をたくわえる。</text><text x="40.0" y="332.9" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="332.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（？）（水野忠邦）：株仲間の解散、</text><text x="61.0" y="361.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">倹約令。</text><text x="40.0" y="397.0" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="397.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">田沼意次（老中）：株仲間を奨励し、</text><text x="61.0" y="425.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">商業の力で財政を立て直そうとした。</text></g><g data-id="b21"><rect x="489.0" y="68.0" width="441.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="489.0" y="68.0" width="441.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="489.0" y="107.7" width="441.0" height="8.0" rx="0" fill="#e07a1f"/><text x="709.5" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b21">文化と学問</text><text x="499.0" y="217.0" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="518.0" y="217.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">元禄文化：井原西鶴（浮世草子）、</text><text x="518.0" y="242.7" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">近松門左衛門（人形浄瑠璃）、</text><text x="518.0" y="268.3" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">松尾芭蕉（俳諧）、菱川師宣（浮世絵）。</text><text x="499.0" y="300.6" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="518.0" y="300.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">化政文化：葛飾北斎・歌川広重（風景画）、</text><text x="518.0" y="326.3" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">十返舎一九、小林一茶。</text><text x="499.0" y="358.6" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="518.0" y="358.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">国学（本居宣長）、蘭学（（？）</text><text x="518.0" y="384.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">『解体新書』）、伊能忠敬の日本地図。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
