<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：人類の出現と古代文明"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：人類の出現と古代文明</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">四大文明</text><text x="40.0" y="142.2" font-size="17" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="57.0" y="142.2" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">エジプト文明：ナイル川、</text><text x="57.0" y="165.2" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">ピラミッド、象形文字、</text><text x="57.0" y="188.1" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">太陽暦。</text><text x="40.0" y="217.0" font-size="17" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="57.0" y="217.0" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">メソポタミア文明：</text><text x="57.0" y="240.0" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">チグリス川・ユーフラテス</text><text x="57.0" y="262.9" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">川、（？）、太陰暦、</text><text x="57.0" y="285.9" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">ハンムラビ法典。</text><text x="40.0" y="314.8" font-size="17" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="57.0" y="314.8" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">インダス文明：インダス川、</text><text x="57.0" y="337.7" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">モヘンジョ・ダロ、</text><text x="57.0" y="360.7" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">インダス文字。</text><text x="40.0" y="389.6" font-size="17" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="57.0" y="389.6" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">中国文明：黄河・長江、</text><text x="57.0" y="412.5" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">殷の甲骨文字。のちに（？）</text><text x="57.0" y="435.5" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">が統一、漢はシルクロード</text><text x="57.0" y="458.4" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">で西方と交流。</text></g><g data-id="b26"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b26">ギリシャ・ローマ</text><text x="346.0" y="240.5" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b26">・</text><text x="367.0" y="240.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b26">ギリシャ：アテネなど</text><text x="367.0" y="268.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b26">の都市国家（ポリス）、</text><text x="367.0" y="297.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b26">民主政。</text><text x="346.0" y="332.9" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b26">・</text><text x="367.0" y="332.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b26">ローマ：共和政から帝</text><text x="367.0" y="361.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b26">政へ、地中海を支配。</text></g><g data-id="b39"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b39">三大宗教</text><text x="652.0" y="242.7" font-size="19" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b39">・</text><text x="671.0" y="242.7" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">仏教：シャカ（インド）。</text><text x="652.0" y="275.0" font-size="19" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b39">・</text><text x="671.0" y="275.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">キリスト教：イエス（パ</text><text x="671.0" y="300.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">レスチナ）。</text><text x="652.0" y="332.9" font-size="19" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b39">・</text><text x="671.0" y="332.9" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">イスラム教：（？）</text><text x="671.0" y="358.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">（アラビア半島）。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,