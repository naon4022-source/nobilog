<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="兵農分離の図"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">太閤検地と刀狩 → 兵農分離（豊臣秀吉）</text><g data-id="b2"><rect x="30.0" y="82.0" width="400.0" height="170.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="82.0" width="400.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="121.7" width="400.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="230.0" y="105.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">太閤検地</text><text x="230.0" y="178.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">田畑の広さ・収穫量（石高）を調べ、</text><text x="230.0" y="203.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">耕作者を検地帳に登録</text></g><g data-id="b10"><rect x="30.0" y="272.0" width="400.0" height="170.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="30.0" y="272.0" width="400.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="30.0" y="311.7" width="400.0" height="8.0" rx="0" fill="#e07a1f"/><text x="230.0" y="295.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b10">刀狩</text><text x="230.0" y="368.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b10">百姓から刀などの武器を取り上げ、</text><text x="230.0" y="393.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b10">一揆を防ぐ</text></g><line x1="440.0" y1="167.0" x2="549.6" y2="244.6" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/><polygon points="560.0,252.0 544.2,249.4 552.3,238.0" fill="#e07a1f"/><line x1="440.0" y1="357.0" x2="549.6" y2="279.4" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/><polygon points="560.0,272.0 552.3,286.0 544.2,274.6" fill="#e07a1f"/><g data-id="b22"><rect x="570.0" y="182.0" width="360.0" height="170.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="570.0" y="182.0" width="360.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="570.0" y="221.7" width="360.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="750.0" y="205.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b22">兵農分離</text><text x="750.0" y="276.4" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b22">武士と百姓の身分がはっきり</text><text x="750.0" y="306.1" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b22">分かれた</text></g><g data-id="b30"><rect x="30.0" y="465.0" width="900.0" height="60.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="480.0" y="497.5" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b30">信長は楽市・楽座で自由な商売を認めた。桃山文化：天守閣のある城・狩野永徳・千利休の茶の湯。</text></g></svg>
