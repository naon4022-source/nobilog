<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="案内文の配置"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">案内文の配置：大事な情報ほど目立つ所に</text><rect x="60.0" y="72.0" width="440.0" height="450.0" rx="8" fill="#fff" stroke="#1d2b3a" stroke-width="3"/><rect x="80.0" y="92.0" width="400.0" height="70.0" rx="14" fill="#e07a1f"/><text x="280.0" y="136.0" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">見出し：行事名（何を）</text><rect x="80.0" y="177.0" width="400.0" height="90.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="280.0" y="230.0" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle">日時（いつ）・場所（どこで）</text><rect x="80.0" y="282.0" width="400.0" height="120.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="2"/><text x="280.0" y="322.0" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="middle">内容（何をするか）</text><text x="280.0" y="362.0" font-size="18" font-weight="600" fill="#1d2b3a" text-anchor="middle">・箇条書きや表で</text><rect x="80.0" y="417.0" width="400.0" height="85.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="2"/><text x="280.0" y="452.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle">持ち物・申しこみ方法</text><text x="280.0" y="482.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle">問い合わせ先</text><g data-id="b13"><rect x="540.0" y="72.0" width="380.0" height="140.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="540.0" y="72.0" width="380.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="540.0" y="111.7" width="380.0" height="8.0" rx="0" fill="#e07a1f"/><text x="730.0" y="95.0" font-size="22" font-weight="800" fill=