<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="随筆を書く"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">随筆を書く：題材 → 描写 → 推敲</text><g data-id="b2"><rect x="30.0" y="72.0" width="269.3" height="448.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="72.0" width="269.3" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="111.7" width="269.3" height="8.0" rx="0" fill="#1f5fa8"/><text x="164.7" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">題材を選ぶ</text><text x="164.7" y="233.1" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">心が動いた出来事</text><text x="164.7" y="268.2" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">（うれしい・</text><text x="164.7" y="303.3" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">くやしい・おどろ</text><text x="164.7" y="338.4" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">いた）。なぜ心が</text><text x="164.7" y="373.5" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">動いたかを考えら</text><text x="164.7" y="408.6" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">れるもの</text></g><line x1="303.3" y1="296.0" x2="330.1" y2="296.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="341.3,296.0 328.7,302.1 328.7,289.9" fill="#e07a1f"/><g data-id="b16"><rect x="345.3" y="72.0" width="269.3" height="448.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="345.3" y="72.0" width="269.3" height="47.7" rx="14" fill="#e07a1f"/><rect x="345.3" y="111.7" width="269.3" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b16">描写の工夫</text><text x="480.0" y="250.6" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b16">五感（見る・</text><text x="480.0" y="285.7" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b16">聞く・におい・</text><text x="480.0" y="320.8" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b16">味・さわる）、</text><text x="480.0" y="355.9" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b16">会話や行動、</text><text x="480.0" y="391.0" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b16">比喩やオノマトペ</text></g><line x1="618.7" y1="296.0" x2="645.5" y2="296.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="656.7,296.0 644.1,302.1 644.1,289.9" fill="#e07a1f"/><g data-id="b29"><rect x="660.7" y="72.0" width="269.3" height="448.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="660.7" y="72.0" width="269.3" height="47.7" rx="14" fill="#2a8a5b"/><rect x="660.7" y="111.7" width="269.3" height="8.0" rx="0" fill="#2a8a5b"/><text x="795.3" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b29">推敲</text><text x="795.3" y="250.6" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b29">誤字・脱字、</text><text x="795.3" y="285.7" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b29">主語と述語のねじ</text><text x="795.3" y="320.8" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b29">れ、くり返し、</text><text x="795.3" y="355.9" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b29">題名と内容が合っ</text><text x="795.3" y="391.0" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b29">ているか</text></g></svg>
