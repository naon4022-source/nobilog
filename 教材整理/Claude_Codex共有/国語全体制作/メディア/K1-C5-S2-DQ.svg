<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：昔話と古典"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：昔話と古典</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="46.4" rx="14" fill="#1f5fa8"/><rect x="30.0" y="106.3" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="90.2" font-size="21" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">歴史的仮名遣いの読み方</text><text x="40.0" y="141.1" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="141.1" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">語の頭以外の「は・</text><text x="60.0" y="168.1" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">ひ・ふ・へ・ほ」</text><text x="60.0" y="195.1" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">→「わ・い・う・え・</text><text x="60.0" y="222.1" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">お」（いふ→いう、</text><text x="60.0" y="249.1" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">かは→かわ）</text><text x="40.0" y="283.1" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="283.1" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">「ゐ・ゑ・を」→「い</text><text x="60.0" y="310.1" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">・え・お」（ゐる→い</text><text x="60.0" y="337.1" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">る）</text><text x="40.0" y="371.1" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="371.1" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">「ぢ・づ」→「じ・ず」</text><text x="60.0" y="398.1" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（はぢ→はじ）</text><text x="40.0" y="432.1" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="432.1" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">「くわ・ぐわ」→「か</text><text x="60.0" y="459.1" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">・が」（くわし→かし）</text></g><g data-id="b24"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b24">いろいろな古典</text><text x="346.0" y="151.8" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b24">・</text><text x="367.0" y="151.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">日本書紀・古事記：</text><text x="367.0" y="180.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">奈良時代の歴史の本。</text><text x="367.0" y="208.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">神話や伝説がのってい</text><text x="367.0" y="236.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">る。</text><text x="346.0" y="272.5" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b24">・</text><text x="367.0" y="272.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">竹取物語：平安時代初</text><text x="367.0" y="300.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">めの物語。</text><text x="346.0" y="336.6" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b24">・</text><text x="367.0" y="336.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">川柳：江戸時代に広まっ</text><text x="367.0" y="364.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">た、五七五の形で、</text><text x="367.0" y="393.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">季語にとらわれずに人</text><text x="367.0" y="421.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">の世をおもしろく表し</text><text x="367.0" y="450.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b24">たもの。</text></g><g data-id="b44"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b44">昔話と古典のつながり</text><text x="652.0" y="226.3" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b44">・</text><text x="673.0" y="226.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">昔話は、時代ごとに少</text><text x="673.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">しずつ形を変えて語り</text><text x="673.0" y="283.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">つがれてきた。</text><text x="652.0" y="318.7" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b44">・</text><text x="673.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">古い作品を読むと、</text><text x="673.0" y="347.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">昔の人の考え方や暮ら</text><text x="673.0" y="375.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">しがわかる。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
