<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="四季のたより 秋"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">四季のたより 秋：和歌を区切って意味をとらえる</text><text x="30.0" y="88.0" font-size="18" font-weight="700" fill="#8a96a3" text-anchor="start">秋来ぬと目にはさやかに見えねども風の音にぞおどろかれぬる（藤原敏行）</text><rect x="24.2" y="102.0" width="145.6" height="56.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="97.0" y="139.0" font-size="23" font-weight="700" fill="#1d2b3a" text-anchor="middle">あききぬと</text><circle cx="97.0" cy="178.0" r="15.0" fill="#1f5fa8"/><text x="97.0" y="184.0" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">5</text><rect x="177.8" y="102.0" width="193.4" height="56.0" rx="10" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="274.6" y="139.0" font-size="23" font-weight="700" fill="#1d2b3a" text-anchor="middle">めにはさやかに</text><circle cx="274.6" cy="178.0" r="15.0" fill="#e07a1f"/><text x="274.6" y="184.0" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">7</text><rect x="379.3" y="102.0" width="145.6" height="56.0" rx="10" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="452.1" y="139.0" font-size="23" font-weight="700" fill="#1d2b3a" text-anchor="middle">みえねども</text><circle cx="452.1" cy="178.0" r="15.0" fill="#2a8a5b"/><text x="452.1" y="184.0" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">5</text><rect x="532.9" y="102.0" width="193.4" height="56.0" rx="10" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="629.6" y="139.0" font-size="23" font-weight="700" fill="#1d2b3a" text-anchor="middle">かぜのおとにぞ</text><circle cx="629.6" cy="178.0" r="15.0" fill="#6a4aa0"/><text x="629.6" y="184.0" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">7</text><rect x="734.3" y="102.0" width="193.4" height="56.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="831.0" y="139.0" font-size="23" font-weight="700" fill="#1d2b3a" text-anchor="middle">おどろかれぬる</text><circle cx="831.0" cy="178.0" r="15.0" fill="#1f5fa8"/><text x="831.0" y="184.0" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">7</text><g data-id="b23"><rect x="30.0" y="232.0" width="216.0" height="120.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="232.0" width="216.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="271.7" width="216.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="138.0" y="255.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b23">秋来ぬ</text><text x="138.0" y="303.5" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b23">秋が来た（「ぬ」</text><text x="138.0" y="327.8" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b23">＝〜た）</text></g><g data-id="b31"><rect x="258.0" y="232.0" width="216.0" height="120.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="258.0" y="232.0" width="216.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="258.0" y="271.7" width="216.0" height="8.0" rx="0" fill="#e07a1f"/><text x="366.0" y="255.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b31">さやかに</text><text x="366.0" y="315.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b31">はっきりと</text></g><g data-id="b38"><rect x="486.0" y="232.0" width="216.0" height="120.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="486.0" y="232.0" width="216.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="486.0" y="271.7" width="216.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="594.0" y="255.0" font-size="22" font-weight="800"