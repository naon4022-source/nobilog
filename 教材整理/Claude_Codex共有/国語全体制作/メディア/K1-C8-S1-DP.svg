<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="練習問題の手がかり：言葉がつなぐ世界遺産"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">練習問題の手がかり：言葉がつなぐ世界遺産</text><rect x="20.0" y="66.0" width="400.0" height="416.0" rx="14" fill="#fff" stroke="#c9d6e8" stroke-width="2"/><text x="40.0" y="98.0" font-size="22" font-weight="800" fill="#1f5fa8" text-anchor="start">考える順番</text><circle cx="52.0" cy="168.7" r="17.0" fill="#e07a1f"/><text x="52.0" y="175.8" font-size="19.549999999999997" font-weight="800" fill="#fff" text-anchor="middle">1</text><g data-id="b6"><rect x="78.0" y="112.0" width="330.0" height="113.3" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="2"/><text x="92.0" y="171.6" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b6">事例を二つぬき出す。</text></g><circle cx="52.0" cy="292.0" r="17.0" fill="#e07a1f"/><text x="52.0" y="299.1" font-size="19.549999999999997" font-weight="800" fill="#fff" text-anchor="middle">2</text><g data-id="b12"><rect x="78.0" y="235.3" width="330.0" height="113.3" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="2"/><text x="92.0" y="294.9" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b12">共通点をさがす。</text></g><circle cx="52.0" cy="415.3" r="17.0" fill="#e07a1f"/><text x="52.0" y="422.5" font-size="19.549999999999997" font-weight="800" fill="#fff" text-anchor="middle">3</text><g data-id="b18"><rect x="78.0" y="358.7" width="330.0" height="113.3" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="2"/><text x="92.0" y="418.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">共通点から主張を一文にする。</text></g><g data-id="b22"><rect x="432.0" y="66.0" width="508.0" height="416.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="432.0" y="66.0" width="508.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="432.0" y="105.7" width="508.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="686.0" y="89.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b22">かんたんにやる方法</text><text x="442.0" y="267.9" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b22">・</text><text x="463.0" y="267.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">事例に①②と番号をふり、共通点を横に書く。</text><text x="442.0" y="303.6" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b22">・</text><text x="463.0" y="303.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">「このように」のあとの文を、</text><text x="463.0" y="331.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">主張の候補として線を引く。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">順番どおりに考えてから、練習問題に答えよう。（？）は自分でうめてみよう。</text><defs><radialGradient id="nb1b" cx="35%" cy="25%" r="75%"><stop offset="0" stop-color="#d9f7df"/><stop offset=".55" stop-color="#a9e4b6"/><stop offset="1" stop-color="#7fcf93"/></radialGradient><linearGradient id="nb1l" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4fb562"/><stop offset="1" stop-color="#8be09a"/></linearGradient><radialGradient id="nb1c"><stop offset="0" stop-color="#ff8096" stop-opacity=".75"/><stop offset="1" stop-color="#ff8096" stop-opacity="0"/></radialGradient></defs><g transform="translate(40,520) scale(0.25)"><ellipse cx="0" cy="54" rx="50" ry="9" fill="#285a3c" fill-opacity=".13"/><ellipse cx="-20" cy="46" rx="15" ry="9" fill="#6cbf80" stroke="#3e8f55" stroke-width="3"/><ellipse cx="20" cy