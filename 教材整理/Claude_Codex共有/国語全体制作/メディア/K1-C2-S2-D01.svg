<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="段落の役割と文章の組み立て"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">段落の役割と文章の組み立て（序論・本論・結論）</text><g data-id="b2"><rect x="30.0" y="72.0" width="269.3" height="308.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="72.0" width="269.3" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="111.7" width="269.3" height="8.0" rx="0" fill="#1f5fa8"/><text x="164.7" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">序論</text><text x="164.7" y="233.3" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">話題や問いを出す</text><text x="164.7" y="268.4" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">「〜でしょうか。」</text></g><line x1="303.3" y1="226.0" x2="330.1" y2="226.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="341.3,226.0 328.7,232.1 328.7,219.9" fill="#e07a1f"/><g data-id="b12"><rect x="345.3" y="72.0" width="269.3" height="308.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="345.3" y="72.0" width="269.3" height="47.7" rx="14" fill="#e07a1f"/><rect x="345.3" y="111.7" width="269.3" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b12">本論</text><text x="480.0" y="198.2" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b12">具体例・実験で説</text><text x="480.0" y="233.3" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b12">明する</text><text x="480.0" y="268.4" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b12">例や実験から何が</text><text x="480.0" y="303.5" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b12">言えるか</text></g><line x1="618.7" y1="226.0" x2="645.5" y2="226.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="656.7,226.0 644.1,232.1 644.1,219.9" fill="#e07a1f"/><g data-id="b24"><rect x="660.7" y="72.0" width="269.3" height="308.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="660.7" y="72.0" width="269.3" height="47.7" rx="14" fill="#2a8a5b"/><rect x="660.7" y="111.7" width="269.3" height="8.0" rx="0" fill="#2a8a5b"/><text x="795.3" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b24">結論</text><text x="795.3" y="198.2" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b24">まとめと筆者の考</text><text x="795.3" y="233.3" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b24">え</text><text x="795.3" y="268.4" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b24">筆者がいちばん言</text><text x="795.3" y="303.5" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b24">いたいこと</text></g><g data-id="b34"><rect x="40.0" y="395.0" width="880.0" height="130.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><rect x="40.0" y="395.0" width="880.0" height="47.7" rx="14" fill="#6a4aa0"/><rect x="40.0" y="434.7" width="880.0" height="8.0" rx="0" fill="#6a4aa0"/><text x="480.0" y="418.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b34">段落の要点をつかむ</text><text x="480.0" y="471.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b34">各段落の中心の文（キーセンテンス）は、段落の最初か最後に多い。</text><text x="480.0" y="496.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b34">要点を一行ずつ書いてつなげると要約になる。</text></g></svg>
