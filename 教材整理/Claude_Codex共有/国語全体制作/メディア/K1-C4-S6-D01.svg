<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="広告を形づくる要素"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">広告の情報を考える：広告を形づくる要素</text><rect x="60.0" y="72.0" width="400.0" height="450.0" rx="8" fill="#fff" stroke="#1d2b3a" stroke-width="3"/><rect x="80.0" y="92.0" width="360.0" height="80.0" rx="14" fill="#e07a1f"/><text x="260.0" y="142.0" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">キャッチコピー</text><rect x="80.0" y="187.0" width="360.0" height="230.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="2"/><text x="260.0" y="307.0" font-size="24" font-weight="700" fill="#1f5fa8" text-anchor="middle">メインビジュアル</text><rect x="80.0" y="432.0" width="360.0" height="70.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="2"/><text x="260.0" y="475.0" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle">タイトル（商品名など）</text><g data-id="b9"><rect x="500.0" y="72.0" width="420.0" height="140.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="500.0" y="72.0" width="420.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="500.0" y="111.7" width="420.0" height="8.0" rx="0" fill="#e07a1f"/><text x="710.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b9">キャッチコピー</text><text x="710.0" y="142.6" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b9">商品などの特徴を伝える宣伝の言葉。商品名・</text><text x="710.0" y="165.5" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b9">機能・見る人の立場・実現する生活・</text><text x="710.0" y="188.5" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b9">共感や疑問や言葉遊び</text></g><g data-id="b18"><rect x="500.0" y="227.0" width="420.0" height="140.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="500.0" y="227.0" width="420.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="500.0" y="266.7" width="420.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="710.0" y="250.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b18">メインビジュアル</text><text x="710.0" y="308.5" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b18">内容を想像させる画像。配置や構図、</text><text x="710.0" y="332.8" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b18">写真の撮り方・絵の描き方を工夫する</text></g><g data-id="b26"><rect x="500.0" y="382.0" width="420.0" height="140.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="500.0" y="382.0" width="420.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="500.0" y="421.7" width="420.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="710.0" y="405.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b26">広告の手法</text><text x="710.0" y="452.6" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b26">商品を見せる・感覚にうったえる・</text><text x="710.0" y="475.5" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b26">使い方を示す・データを見せる・</text><text x="710.0" y="498.5" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b26">有名人を起用・言葉で説明</text></g></svg>
