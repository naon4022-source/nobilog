<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：持続可能な未来を創るために"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：持続可能な未来を創るために</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">複数の情報を読む</text><text x="40.0" y="166.0" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="166.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">それぞれの文章が、</text><text x="61.0" y="194.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">どの目標と関係してい</text><text x="61.0" y="222.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">るかを確かめる。</text><text x="40.0" y="258.4" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="258.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">文章と図表を見比べ、</text><text x="61.0" y="286.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">同じことを言っている</text><text x="61.0" y="315.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">所をさがす。</text><text x="40.0" y="350.8" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="350.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">数字や図表は、何を表</text><text x="61.0" y="379.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">しているか（（？）・</text><text x="61.0" y="407.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">年・（？））を確かめ</text><text x="61.0" y="435.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">る。</text></g><g data-id="b21"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b21">課題を発見する</text><text x="346.0" y="212.2" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="367.0" y="212.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">「何が問題か」→「な</text><text x="367.0" y="240.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">ぜ問題か」→「だれが</text><text x="367.0" y="268.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">・どうすればよいか」</text><text x="367.0" y="297.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">の順に考える。</text><text x="346.0" y="332.9" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="367.0" y="332.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">身近な生活（食べ物・</text><text x="367.0" y="361.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">ごみ・買い物）と結び</text><text x="367.0" y="389.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">つける。</text></g><g data-id="b36"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b36">自分の考えをもつ</text><text x="652.0" y="240.5" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b36">・</text><text x="673.0" y="240.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b36">読んだ情報を根拠にし</text><text x="673.0" y="268.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b36">て、自分にできること</text><text x="673.0" y="297.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b36">を考える。</text><text x="652.0" y="332.9" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b36">・</text><text x="673.0" y="332.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b36">友達と話し合い、</text><text x="673.0" y="361.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b36">ちがう見方を知る。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
