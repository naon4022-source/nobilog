<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="場面の構成"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">「蜘蛛の糸」の場面の構成</text><g data-id="b2"><rect x="30.0" y="72.0" width="269.3" height="258.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="72.0" width="269.3" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="111.7" width="269.3" height="8.0" rx="0" fill="#1f5fa8"/><text x="164.7" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">極楽</text><text x="164.7" y="225.8" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">最初の極楽の場面</text></g><line x1="303.3" y1="201.0" x2="330.1" y2="201.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="341.3,201.0 328.7,207.1 328.7,194.9" fill="#e07a1f"/><g data-id="b11"><rect x="345.3" y="72.0" width="269.3" height="258.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="345.3" y="72.0" width="269.3" height="47.7" rx="14" fill="#e07a1f"/><rect x="345.3" y="111.7" width="269.3" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b11">地獄</text><text x="480.0" y="173.2" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b11">カンダタが救いの</text><text x="480.0" y="208.3" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b11">糸をのぼる。</text><text x="480.0" y="243.4" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b11">途中の言葉と行動</text><text x="480.0" y="278.5" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b11">が結末を決める</text></g><line x1="618.7" y1="201.0" x2="645.5" y2="201.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="656.7,201.0 644.1,207.1 644.1,194.9" fill="#e07a1f"/><g data-id="b23"><rect x="660.7" y="72.0" width="269.3" height="258.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="660.7" y="72.0" width="269.3" height="47.7" rx="14" fill="#2a8a5b"/><rect x="660.7" y="111.7" width="269.3" height="8.0" rx="0" fill="#2a8a5b"/><text x="795.3" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b23">極楽</text><text x="795.3" y="210.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b23">ふたたび極楽。お釈迦</text><text x="795.3" y="239.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b23">様の様子に注目</text></g><g data-id="b31"><rect x="60.0" y="350.0" width="410.0" height="160.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="60.0" y="350.0" width="410.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="60.0" y="389.7" width="410.0" height="8.0" rx="0" fill="#e07a1f"/><text x="265.0" y="373.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b31">カンダタの行動と結果</text><text x="265.0" y="429.4" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b31">生きていたころに一度だけ、</text><text x="265.0" y="453.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b31">小さな命を助けた。その善い行いがきっか</text><text x="265.0" y="478.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b31">けで糸がおろされる。</text></g><g data-id="b40"><rect x="490.0" y="350.0" width="410.0" height="160.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><rect x="490.0" y="350.0" width="410.0" height="47.7" rx="14" fill="#6a4aa0"/><rect x="490.0" y="389.7" width="410.0" height="8.0" rx="0" fill="#6a4aa0"/><text x="695.0" y="373.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b40">テーマを考える</text><text x="695.0" y="429.4" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b40">最初と最後の極楽を比べる。</text><text x="695.0" y="453.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b40">「自分だけ助かろうとする心」について、</text><text x="695.0" y="478.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b40">作者は何を伝えたかったか。</text></g></svg>
