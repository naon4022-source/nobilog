<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：画数と活字の字体"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：画数と活字の字体</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">画数の数え方</text><text x="40.0" y="221.3" font-size="18" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="58.0" y="221.3" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">折れても、ひと筆で書く線</text><text x="58.0" y="245.6" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">は一画（例：「乙」は1画、</text><text x="58.0" y="269.9" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">「弓」は（？））。</text><text x="40.0" y="300.5" font-size="18" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="58.0" y="300.5" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">「⻌（しんにょう）」</text><text x="58.0" y="324.8" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">は3画。</text><text x="40.0" y="355.4" font-size="18" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="58.0" y="355.4" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">部首の画数をまちがえやす</text><text x="58.0" y="379.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">いので注意する。</text></g><g data-id="b18"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b18">筆順の基本</text><text x="346.0" y="219.0" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b18">・</text><text x="367.0" y="219.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">上から下へ（三・工）。</text><text x="346.0" y="254.7" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b18">・</text><text x="367.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">左から右へ（川・州）。</text><text x="346.0" y="290.4" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b18">・</text><text x="367.0" y="290.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">横から縦へ（十・土）</text><text x="367.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">が多い。</text><text x="346.0" y="354.4" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b18">・</text><text x="367.0" y="354.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">中心から左右へ（小・</text><text x="367.0" y="382.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">水）。</text></g><g data-id="b34"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b34">活字の字体</text><text x="652.0" y="208.5" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b34">・</text><text x="673.0" y="208.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b34">（？）：横線が細く縦</text><text x="673.0" y="236.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b34">線が太い。新聞や本の</text><text x="673.0" y="265.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b34">本文。</text><text x="652.0" y="300.9" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b34">・</text><text x="673.0" y="300.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b34">ゴシック体：線の太さ</text><text x="673.0" y="329.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b34">が同じ。見出しや標識。</text><text x="652.0" y="364.9" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b34">・</text><text x="673.0" y="364.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b34">教科書体：手書きに近</text><text x="673.0" y="393.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b34">い。書き方の手本。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
