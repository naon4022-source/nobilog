<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="紹介スピーチの組み立て"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">紹介スピーチの組み立て（はじめ・中・終わり）</text><g data-id="b2"><rect x="30.0" y="72.0" width="269.3" height="328.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="72.0" width="269.3" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="111.7" width="269.3" height="8.0" rx="0" fill="#1f5fa8"/><text x="164.7" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">はじめ</text><text x="164.7" y="243.3" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">何を紹介するか、</text><text x="164.7" y="278.4" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">一言で言う</text></g><line x1="303.3" y1="236.0" x2="330.1" y2="236.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="341.3,236.0 328.7,242.1 328.7,229.9" fill="#e07a1f"/><g data-id="b12"><rect x="345.3" y="72.0" width="269.3" height="328.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="345.3" y="72.0" width="269.3" height="47.7" rx="14" fill="#e07a1f"/><rect x="345.3" y="111.7" width="269.3" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b12">中</text><text x="480.0" y="208.2" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b12">好きな理由を二つ</text><text x="480.0" y="243.3" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b12">程度。それぞれに</text><text x="480.0" y="278.4" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b12">エピソードや具体</text><text x="480.0" y="313.5" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b12">例をつける</text></g><line x1="618.7" y1="236.0" x2="645.5" y2="236.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="656.7,236.0 644.1,242.1 644.1,229.9" fill="#e07a1f"/><g data-id="b24"><rect x="660.7" y="72.0" width="269.3" height="328.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="660.7" y="72.0" width="269.3" height="47.7" rx="14" fill="#2a8a5b"/><rect x="660.7" y="111.7" width="269.3" height="8.0" rx="0" fill="#2a8a5b"/><text x="795.3" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b24">終わり</text><text x="795.3" y="225.7" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b24">聞き手へのよびか</text><text x="795.3" y="260.8" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b24">け（ぜひ〜してみ</text><text x="795.3" y="295.9" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b24">て）でしめる</text></g><g data-id="b33"><rect x="40.0" y="410.0" width="880.0" height="115.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><rect x="40.0" y="410.0" width="880.0" height="47.7" rx="14" fill="#6a4aa0"/><rect x="40.0" y="449.7" width="880.0" height="8.0" rx="0" fill="#6a4aa0"/><text x="480.0" y="433.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b33">伝わる話し方</text><text x="480.0" y="490.9" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b33">「理由は二つあります」と先に数を言うと、聞き手が整理しやすい。実物や写真を見せるとイメージが伝わる。</text></g></svg>
