<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="視点のちがい"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">視点のちがい：同じ出来事を二つの視点から読む（桜蝶）</text><line x1="313.0" y1="190.0" x2="341.6" y2="190.0" stroke="#e07a1f" stroke-width="4" stroke-linecap="round"/><polygon points="352.0,190.0 340.3,195.7 340.3,184.3" fill="#e07a1f"/><rect x="300.5" y="173.2" width="63.9" height="25.6" rx="8" fill="#fff" stroke="#e07a1f" stroke-width="1.5"/><text x="332.5" y="195.6" font-size="16" font-weight="700" fill="#e07a1f" text-anchor="middle">外から</text><line x1="647.0" y1="190.0" x2="618.4" y2="190.0" stroke="#e07a1f" stroke-width="4" stroke-linecap="round"/><polygon points="608.0,190.0 619.7,184.3 619.7,195.7" fill="#e07a1f"/><rect x="595.5" y="173.2" width="63.9" height="25.6" rx="8" fill="#fff" stroke="#e07a1f" stroke-width="1.5"/><text x="627.5" y="195.6" font-size="16" font-weight="700" fill="#e07a1f" text-anchor="middle">僕の目</text><g data-id="b10"><rect x="35.0" y="130.0" width="270.0" height="120.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="170.0" y="167.1" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b10">A：登場人物の外から語る</text><text x="170.0" y="192.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b10">白石さんと倉橋君を外か</text><text x="170.0" y="218.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b10">ら見る</text></g><g data-id="b16"><rect x="655.0" y="130.0" width="270.0" height="120.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="790.0" y="164.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b16">B：倉橋君（「僕」）</text><text x="790.0" y="193.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b16">の視点</text><text x="790.0" y="221.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b16">僕の心の中がわかる</text></g><g data-id="b22"><rect x="360.0" y="140.0" width="240.0" height="100.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="480.0" y="178.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b22">同じ場面</text><text x="480.0" y="207.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b22">桜蝶が飛び立つ公園</text></g><g data-id="b27"><rect x="40.0" y="300.0" width="880.0" height="100.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="480.0" y="339.9" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b27">A だけでは、倉橋君がなぜ毎日蝶を見ていたのか、なぜほほえんだのかはわからない。</text><text x="480.0" y="365.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b27">B を読むと、転校のさびしさと、親友の「別れは終わりではなく始まり」という言葉がわかる。</text></g><g data-id="b32"><rect x="40.0" y="418.0" width="880.0" height="110.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="40.0" y="418.0" width="880.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="40.0" y="457.7" width="880.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="441.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b32">視点とは</text><text x="480.0" y="485.6" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b32">登場人物の視点から語ると、その人の見方や気持ちがよく伝わる。でも、</text><text x="480.0" y="507.2" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b32">ほかの人の気持ちや別の場所のことはわからない。</text></g></svg>
