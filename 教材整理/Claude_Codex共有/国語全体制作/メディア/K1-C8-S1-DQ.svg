<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：言葉がつなぐ世界遺産"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：言葉がつなぐ世界遺産</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">事例と主張</text><text x="40.0" y="180.1" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="180.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（？）：主張をわかり</text><text x="61.0" y="208.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">やすくするための具体</text><text x="61.0" y="236.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">的な例。</text><text x="40.0" y="272.5" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="272.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">事例のあとに「（？）」</text><text x="61.0" y="300.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">「つまり」でまとめが</text><text x="61.0" y="329.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">続く。</text><text x="40.0" y="364.9" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="364.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">事例が複数あるときは、</text><text x="61.0" y="393.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">共通点が主張につなが</text><text x="61.0" y="421.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">る。</text></g><g data-id="b20"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b20">文章の構成</text><text x="346.0" y="172.7" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="364.0" y="172.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">序論（問い）：（？）</text><text x="364.0" y="197.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">の修復の方法に、イコモス</text><text x="364.0" y="221.3" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">の専門家が驚いた。</text><text x="364.0" y="245.6" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">それはどんな方法か。</text><text x="346.0" y="276.2" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="364.0" y="276.2" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">本論（事例）：①修復記録</text><text x="364.0" y="300.5" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">の蓄積（見取り図と余白の</text><text x="364.0" y="324.8" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">筆文字の指示）②世代を超</text><text x="364.0" y="349.1" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">えた技術の伝承（師匠から</text><text x="364.0" y="373.4" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">弟子へ言葉で）。</text><text x="346.0" y="404.0" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="364.0" y="404.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">結論（答え）：この二つこ</text><text x="364.0" y="428.3" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">そが専門家を驚かせた方法。</text></g><g data-id="b40"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b40">言葉が果たす役割</text><text x="652.0" y="212.2" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b40">・</text><text x="673.0" y="212.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b40">絵だけでは伝えにくい</text><text x="673.0" y="240.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b40">技法や微妙な色合いを、</text><text x="673.0" y="268.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b40">文字で書き留めて後の</text><text x="673.0" y="297.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b40">職人に伝える。</text><text x="652.0" y="332.9" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b40">・</text><text x="673.0" y="332.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b40">師匠が弟子に言葉で丁</text><text x="673.0" y="361.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b40">寧に説明し、技術を受</text><text x="673.0" y="389.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b40">けつぐ。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
