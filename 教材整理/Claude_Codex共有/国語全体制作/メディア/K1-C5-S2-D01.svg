<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="歴史的仮名遣いの直し方"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">歴史的仮名遣いの直し方</text><rect x="30.0" y="72.0" width="549.2" height="64.7" rx="0" fill="#1f5fa8" stroke="#c9d6e8" stroke-width="1.5"/><text x="304.6" y="107.5" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" data-box="t00">きまり</text><rect x="579.2" y="72.0" width="350.8" height="64.7" rx="0" fill="#1f5fa8" stroke="#c9d6e8" stroke-width="1.5"/><text x="754.6" y="107.5" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" data-box="t01">例</text><rect x="30.0" y="136.7" width="549.2" height="64.7" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="304.6" y="157.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t10">語の頭以外の「は・ひ・ふ・へ・ほ」→「わ・い・</text><text x="304.6" y="186.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t10">う・え・お」</text><rect x="579.2" y="136.7" width="350.8" height="64.7" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="754.6" y="172.3" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t11">いふ→いう、かは→かわ</text><rect x="30.0" y="201.4" width="549.2" height="64.7" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="304.6" y="237.0" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t20">「ゐ・ゑ・を」→「い・え・お」</text><rect x="579.2" y="201.4" width="350.8" height="64.7" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="754.6" y="237.0" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t21">ゐる→いる</text><rect x="30.0" y="266.1" width="549.2" height="64.7" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="304.6" y="301.7" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t30">「ぢ・づ」→「じ・ず」</text><rect x="579.2" y="266.1" width="350.8" height="64.7" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="754.6" y="301.7" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t31">はぢ→はじ</text><rect x="30.0" y="330.9" width="549.2" height="64.7" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="304.6" y="366.4" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t40">「くわ・ぐわ」→「か・が」</text><rect x="579.2" y="330.9" width="350.8" height="64.7" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="754.6" y="366.4" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t41">くわし→かし</text><rect x="30.0" y="395.6" width="549.2" height="64.7" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="304.6" y="431.1" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t50">「au」→「ô」など、母音が続く所</text><rect x="579.2" y="395.6" width="350.8" height="64.7" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="754.6" y="416.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t51">やうやう→ようよう、</text><text x="754.6" y="445.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t51">てうど→ちょうど</text><rect x="30.0" y="460.3" width="549.2" height="64.7" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="304.6" y="495.8" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t60">「む」→「ん」</text><rect x="579.2" y="460.3" width="350.8" height="64.7" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="754.6" y="495.8" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t61">なむ→なん</text></svg>
