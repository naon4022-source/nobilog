<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：資料をもとに紹介文を書く"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：資料をもとに紹介文を書く</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">書く手順</text><text x="40.0" y="209.3" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="209.3" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">① 題材を決める（相手</text><text x="60.0" y="236.3" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">は？ 何を伝えたい？）</text><text x="40.0" y="270.2" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="270.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">② 資料を集め、</text><text x="60.0" y="297.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">使う情報を選ぶ。</text><text x="40.0" y="331.2" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="331.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">③ 段落の構成を考える。</text><text x="40.0" y="365.2" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="365.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">④ 書く → 読み返して</text><text x="60.0" y="392.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">直す。</text></g><g data-id="b19"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b19">段落の構成</text><text x="346.0" y="208.5" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b19">・</text><text x="367.0" y="208.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">第一段落：何を紹介す</text><text x="367.0" y="236.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">るか（話題）。</text><text x="346.0" y="272.5" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b19">・</text><text x="367.0" y="272.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">第二・三段落：紹介し</text><text x="367.0" y="300.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">たい点と、それを支え</text><text x="367.0" y="329.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">る資料（事実・数字）。</text><text x="346.0" y="364.9" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b19">・</text><text x="367.0" y="364.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">最後の段落：読み手へ</text><text x="367.0" y="393.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">のよびかけ・まとめ。</text></g><g data-id="b35"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b35">資料の使い方</text><text x="652.0" y="226.3" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b35">・</text><text x="673.0" y="226.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b35">資料の文をそのまま写</text><text x="673.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b35">さず、自分の言葉でま</text><text x="673.0" y="283.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b35">とめる。</text><text x="652.0" y="318.7" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b35">・</text><text x="673.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b35">数字や事実は正確に書</text><text x="673.0" y="347.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b35">き、出典（どこから得</text><text x="673.0" y="375.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b35">た情報か）を示す。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
