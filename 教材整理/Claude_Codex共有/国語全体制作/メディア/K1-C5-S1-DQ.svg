<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：四季のたより 秋"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：四季のたより 秋</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">和歌の意味をとらえる</text><text x="40.0" y="145.3" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="145.3" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">秋来ぬと目にはさやか</text><text x="60.0" y="172.3" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">に見えねども風の音に</text><text x="60.0" y="199.3" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">ぞおどろかれぬる（藤</text><text x="60.0" y="226.3" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">原敏行）</text><text x="40.0" y="260.2" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="260.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">「秋来ぬ」＝秋が来た。</text><text x="60.0" y="287.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">「さやかに」＝（？）。</text><text x="60.0" y="314.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">「見えねども」＝見え</text><text x="60.0" y="341.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">ないけれど。</text><text x="40.0" y="375.2" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="375.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">目でははっきりわから</text><text x="60.0" y="402.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">ないが、風の音で秋の</text><text x="60.0" y="429.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">訪れに気づいて、</text><text x="60.0" y="456.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">はっとした。</text></g><g data-id="b23"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b23">俳句の情景</text><text x="346.0" y="180.1" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b23">・</text><text x="367.0" y="180.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">行く水におのが影追ふ</text><text x="367.0" y="208.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">（？）かな（千代女）</text><text x="346.0" y="244.2" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b23">・</text><text x="367.0" y="244.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">流れていく水面に映る</text><text x="367.0" y="272.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">自分の影を、とんぼが</text><text x="367.0" y="300.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">追いかけるように飛ん</text><text x="367.0" y="329.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">でいる。</text><text x="346.0" y="364.9" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b23">・</text><text x="367.0" y="364.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">「蜻蛉（とんぼ）」</text><text x="367.0" y="393.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">は秋の（？）、「かな」</text><text x="367.0" y="421.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">は（？）。</text></g><g data-id="b41"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b41">古語の意味</text><text x="652.0" y="212.2" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b41">・</text><text x="673.0" y="212.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">「ぬ」には「〜た（完</text><text x="673.0" y="240.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">了）」と「〜ない（打</text><text x="673.0" y="268.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">ち消し）」の二つがあ</text><text x="673.0" y="297.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">る。「秋来ぬ」の「ぬ」</text><text x="673.0" y="325.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">は「〜た」。</text><text x="652.0" y="361.3" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b41">・</text><text x="673.0" y="361.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">「おどろく」は「はっ</text><text x="673.0" y="389.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">と気づく」という意味。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
