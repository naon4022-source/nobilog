<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：文の成分"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：文の成分</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">五つの文の成分</text><text x="40.0" y="162.4" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="162.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（？）：「何が（は）・</text><text x="59.0" y="188.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">だれが（は）」にあたる。</text><text x="40.0" y="220.3" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="220.3" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（？）：「どうする・</text><text x="59.0" y="246.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">どんなだ・何だ・</text><text x="59.0" y="271.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">ある（いる・ない）」</text><text x="59.0" y="297.3" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">にあたる。</text><text x="40.0" y="329.6" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="329.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">修飾語：ほかの文節をく</text><text x="59.0" y="355.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">わしくする。</text><text x="40.0" y="387.5" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="387.5" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">接続語：前後の文や文節</text><text x="59.0" y="413.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">をつなぐ（だから・</text><text x="59.0" y="438.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">しかし・〜ので）。</text></g><g data-id="b23"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b23">文節どうしの関係</text><text x="346.0" y="190.6" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b23">・</text><text x="367.0" y="190.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">主・述の関係：（？）</text><text x="367.0" y="219.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">／咲く。</text><text x="346.0" y="254.7" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b23">・</text><text x="367.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">修飾・被修飾の関係：</text><text x="367.0" y="283.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">赤い／花。</text><text x="346.0" y="318.7" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b23">・</text><text x="367.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">接続の関係：雨なので</text><text x="367.0" y="347.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">／休む。</text><text x="346.0" y="382.8" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b23">・</text><text x="367.0" y="382.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">並立の関係：兄と／</text><text x="367.0" y="411.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">姉が（対等に並ぶ）。</text></g><g data-id="b41"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b41">連文節</text><text x="652.0" y="212.2" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b41">・</text><text x="673.0" y="212.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">二つ以上の文節がまと</text><text x="673.0" y="240.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">まって一つの成分になっ</text><text x="673.0" y="268.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">たもの。</text><text x="652.0" y="304.6" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b41">・</text><text x="673.0" y="304.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">主部・述部・修飾部・</text><text x="673.0" y="332.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">接続部・独立部とよぶ。</text><text x="673.0" y="361.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">例：「兄と姉が」→</text><text x="673.0" y="389.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">主部。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
