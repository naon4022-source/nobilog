<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：故事成語 —中国の名言"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：故事成語 —中国の名言</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">返り点</text><text x="40.0" y="180.1" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="180.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（？）：すぐ下の一字</text><text x="61.0" y="208.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">から、上の一字に返っ</text><text x="61.0" y="236.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">て読む。</text><text x="40.0" y="272.5" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="272.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">一・二点：二字以上は</text><text x="61.0" y="300.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">なれた字に返って読む。</text><text x="61.0" y="329.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">一の字まで読んでから</text><text x="61.0" y="357.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">二の字に返る。</text><text x="40.0" y="393.3" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="393.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（？）は、漢字の左下</text><text x="61.0" y="421.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">に小さく書く。</text></g><g data-id="b20"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b20">「矛盾」の話</text><text x="346.0" y="188.6" font-size="14" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="360.0" y="188.6" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">原文：楚人有鬻盾与矛者。誉之曰、</text><text x="360.0" y="207.5" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">「吾盾之堅、莫能陥也。」</text><text x="346.0" y="231.3" font-size="14" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="360.0" y="231.3" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">書き下し文：楚人に、盾と矛とをひ</text><text x="360.0" y="250.2" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">さぐ者あり。これをほめていはく、</text><text x="360.0" y="269.1" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">「わが盾の堅きこと、よくとほすも</text><text x="360.0" y="288.0" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">のなきなり。」と。</text><text x="346.0" y="311.8" font-size="14" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="360.0" y="311.8" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">盾と矛を売る人が、「どんな物も通</text><text x="360.0" y="330.7" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">さない盾」と「どんな物でも通す矛」</text><text x="360.0" y="349.6" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">の両方を自慢した。「その矛でその</text><text x="360.0" y="368.5" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">盾をついたらどうなるか」と聞かれ、</text><text x="360.0" y="387.4" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">答えられなかった。</text><text x="346.0" y="411.2" font-size="14" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="360.0" y="411.2" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">意味：（？）。</text></g><g data-id="b42"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b42">ほかの故事成語</text><text x="652.0" y="165.7" font-size="19" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b42">・</text><text x="671.0" y="165.7" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">助長：作物を早く育てよ</text><text x="671.0" y="191.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">うと苗を引っぱって、</text><text x="671.0" y="217.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">かえって枯らしてしまっ</text><text x="671.0" y="242.7" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">た話から。よけいな手助</text><text x="671.0" y="268.3" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">けで、かえって悪くする</text><text x="671.0" y="294.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">こと。（今は「ある傾向</text><text x="671.0" y="319.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">を強める」意味でも使う）</text><text x="652.0" y="351.9" font-size="19" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b42">・</text><text x="671.0" y="351.9" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">五十歩百歩：少しのちが</text><text x="671.0" y="377.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">いはあっても、本質は同</text><text x="671.0" y="403.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">じこと。</text><text x="652.0" y="435.5" font-size="19" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b42">・</text><text x="671.0" y="435.5" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">蛇足：よけいなつけ足し。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
