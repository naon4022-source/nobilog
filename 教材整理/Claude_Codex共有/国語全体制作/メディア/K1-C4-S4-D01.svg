<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="主張・理由・根拠"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">意見文の組み立て：主張・理由・根拠</text><path d="M269.7,75.0 L330.3,75.0 L417.0,218.3 L183.0,218.3 Z" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="300.0" y="149.6" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="middle" data-box="p0">主張</text><line x1="379.7" y1="146.7" x2="640.0" y2="146.7" stroke="#c9d6e8" stroke-width="2" stroke-dasharray="5 5"/><g data-id="b5"><rect x="645.0" y="78.0" width="285.0" height="137.3" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="2"/><text x="659.0" y="123.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b5">いちばん言いたいこと（〜</text><text x="659.0" y="149.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b5">すべきだ）。はじめと終わ</text><text x="659.0" y="175.1" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b5">りで示す</text></g><path d="M183.0,224.3 L417.0,224.3 L503.7,367.7 L96.3,367.7 Z" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="300.0" y="299.2" font-size="22" font-weight="700" fill="#e07a1f" text-anchor="middle" data-box="p1">理由</text><line x1="466.3" y1="296.0" x2="640.0" y2="296.0" stroke="#c9d6e8" stroke-width="2" stroke-dasharray="5 5"/><g data-id="b14"><rect x="645.0" y="227.3" width="285.0" height="137.3" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="2"/><text x="659.0" y="298.5" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b14">なぜそう考えるか（二つ程度）</text></g><path d="M96.3,373.7 L503.7,373.7 L590.3,517.0 L9.7,517.0 Z" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="300.0" y="448.5" font-size="22" font-weight="700" fill="#2a8a5b" text-anchor="middle" data-box="p2">根拠</text><line x1="553.0" y1="445.3" x2="640.0" y2="445.3" stroke="#c9d6e8" stroke-width="2" stroke-dasharray="5 5"/><g data-id="b21"><rect x="645.0" y="376.7" width="285.0" height="137.3" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="2"/><text x="659.0" y="409.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">理由を支える事実・数字・</text><text x="659.0" y="435.3" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">体験。だれでも確かめられ</text><text x="659.0" y="460.9" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">る事実を選び、数字は出典</text><text x="659.0" y="486.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">を示す</text></g></svg>
