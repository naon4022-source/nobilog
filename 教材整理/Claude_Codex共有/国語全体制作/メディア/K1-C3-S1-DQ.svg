<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：ベンチ"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：ベンチ</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">時代背景を調べる</text><text x="40.0" y="152.9" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="152.9" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">物語の出来事は、</text><text x="59.0" y="178.5" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">その時代の社会のきまり</text><text x="59.0" y="204.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">と深く関係している。</text><text x="40.0" y="236.5" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="236.5" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">図書館の本や資料で、</text><text x="59.0" y="262.1" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">当時のユダヤ人がどんな</text><text x="59.0" y="287.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">制限を受けていたかを調</text><text x="59.0" y="313.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">べると、登場人物の（？）</text><text x="59.0" y="339.1" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">の重さがわかる。</text><text x="40.0" y="371.4" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="371.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">調べたことは、本の題名</text><text x="59.0" y="397.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">・著者・出版社などの情</text><text x="59.0" y="422.7" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">報（奥付）といっしょに</text><text x="59.0" y="448.3" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">メモする。</text></g><g data-id="b23"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b23">心情を読む</text><text x="346.0" y="165.7" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b23">・</text><text x="365.0" y="165.7" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">心情は「言葉・（？）・</text><text x="365.0" y="191.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">（？）・（？）」</text><text x="365.0" y="217.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">に表れる。</text><text x="346.0" y="249.3" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b23">・</text><text x="365.0" y="249.3" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">打ち明け話の中で、</text><text x="365.0" y="275.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">緑のベンチに座ったヘル</text><text x="365.0" y="300.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">ガの前で立ったままもじ</text><text x="365.0" y="326.3" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">もじする所に注目する。</text><text x="346.0" y="358.6" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b23">・</text><text x="365.0" y="358.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">最後に「行かなかった」</text><text x="365.0" y="384.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">理由（見つかればヘルガ</text><text x="365.0" y="409.9" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">が収容所に送られる）に、</text><text x="365.0" y="435.5" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">気持ちが表れている。</text></g><g data-id="b43"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b43">本の情報を引き出す</text><text x="652.0" y="212.2" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b43">・</text><text x="673.0" y="212.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">奥付：本の最後にある、</text><text x="673.0" y="240.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">書名・著者・発行日・</text><text x="673.0" y="268.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">出版社などの情報。</text><text x="652.0" y="304.6" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b43">・</text><text x="673.0" y="304.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">同じ作者のほかの作品</text><text x="673.0" y="332.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">や、同じ時代を描いた</text><text x="673.0" y="361.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">本を読むと、理解が深</text><text x="673.0" y="389.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">まる。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
