<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：I am 〜. / I like 〜."><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：I am 〜. / I like 〜.</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">be動詞 am</text><text x="40.0" y="194.3" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="194.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">I （？） 〜.</text><text x="61.0" y="222.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">＝「わたしは〜です」。</text><text x="61.0" y="251.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">I と 〜 がイコールの</text><text x="61.0" y="279.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">関係。</text><text x="40.0" y="315.1" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="315.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">短くすると （？）</text><text x="61.0" y="343.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">〜.（アイム）。</text><text x="40.0" y="379.1" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="379.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">例：I am （？）ta. /</text><text x="61.0" y="407.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">I&#x27;m from Osaka.</text></g><g data-id="b19"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b19">一般動詞 like</text><text x="346.0" y="166.0" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b19">・</text><text x="367.0" y="166.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">I （？） 〜.</text><text x="367.0" y="194.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">＝「わたしは〜が好き</text><text x="367.0" y="222.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">です」。</text><text x="346.0" y="258.4" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b19">・</text><text x="367.0" y="258.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">like、play（する・</text><text x="367.0" y="286.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">ひく）、have（持っ</text><text x="367.0" y="315.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">ている）、eat（食べ</text><text x="367.0" y="343.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">る）などを一般動詞と</text><text x="367.0" y="371.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">いう。</text><text x="346.0" y="407.5" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b19">・</text><text x="367.0" y="407.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">例：I like soccer.</text><text x="367.0" y="435.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">/ I play the piano.</text></g><g data-id="b38"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b38">否定文（〜ではない）</text><text x="652.0" y="204.2" font-size="19" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b38">・</text><text x="671.0" y="204.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b38">一般動詞の否定：I （？）</text><text x="671.0" y="229.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b38">like 〜.（don&#x27;t = do</text><text x="671.0" y="255.5" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b38">not）</text><text x="652.0" y="287.8" font-size="19" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b38">・</text><text x="671.0" y="287.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b38">例：I don&#x27;t like</text><text x="671.0" y="313.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b38">tomatoes.（トマトは好</text><text x="671.0" y="339.1" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b38">きではありません）</text><text x="652.0" y="371.4" font-size="19" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b38">・</text><text x="671.0" y="371.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b38">be動詞の否定は I&#x27;m not</text><text x="671.0" y="397.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b38">〜.</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><defs><radialGradient id="nb1b" cx="35%" cy="25%" r="75%"><stop offset="0" stop-color="#d9f7df"/><stop offset=".55" stop-color="#a9e4b6"/><stop offset="1" stop-color="#7fcf93"/></radialGradient><linearGradient id="nb1l" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4fb562"/><stop offset="1" stop-color="#8be09a"/></linearGradient><radialGradient id="nb1c"><stop offset="0" stop-color="#ff8096" stop-opacity=".75"/><stop offset="1" stop-color="#ff8096" stop-opacity="0"/></radialGradient></defs><g transform="translate(40,520) scale(0.25)"><ellipse cx="0" cy="54" rx="50" ry="9" fill="#285a3c" fill-opacity=".13"/><ellipse cx="-20" cy="46" rx="15" ry="9" fill="#6cbf80" stroke="#3e8f55" stroke-width="3"/><ellipse cx="20" cy="46" rx="15" ry="9" fill="#6cbf80" stroke="#3e8f55" stroke-width="3"/><g transform="rotate(0 0 -44)"><path d="M0,-38 Q2,-54 0,-66" fill="none" stroke="#3e8f55" stroke-width="5" stroke-linecap="round"/><g transform="translate(0,-64) rotate(-54)"><path d="M0,0 C-22,-6 -24,-34 0,-42 C16,-32 12,-8 0,0Z" fill="url(#nb1l)" stroke="#3e8f55" stroke-width="3"/><path d="M0,-3 Q-4,-20 0,-36" fill="none" stroke="#2e7846" stroke-opacity=".55" stroke-width="2"/><ellipse cx="-6" cy="-28" rx="3.5" ry="6" fill="#fff" fill-opacity=".55" transform="rotate(-23 -6 -28)"/></g><g transform="translate(0,-64) rotate(54)"><path d="M0,0 C22,-6 24,-34 0,-42 C-16,-32 -12,-8 0,0Z" fill="url(#nb1l)" stroke="#3e8f55" stroke-width="3"/><path d="M0,-3 Q4,-20 0,-36" fill="none" stroke="#2e7846" stroke-opacity=".55" stroke-width="2"/><ellipse cx="6" cy="-28" rx="3.5" ry="6" fill="#fff" fill-opacity=".55" transform="rotate(23 6 -28)"/></g></g><ellipse cx="0" cy="14" rx="10" ry="16" fill="#9edbae" stroke="#3e8f55" stroke-width="3" transform="translate(-50,10) rotate(26)"/><ellipse cx="0" cy="14" rx="10" ry="16" fill="#9edbae" stroke="#3e8f55" stroke-width="3" transform="translate(50,10) rotate(-26)"/><path d="M0,-46 C40,-46 60,-18 60,12 C60,40 34,50 0,50 C-34,50 -60,40 -60,12 C-60,-18 -40,-46 0,-46Z" fill="url(#nb1b)" stroke="#3e8f55" stroke-width="3.5"/><ellipse cx="-30" cy="-22" rx="9" ry="5" fill="#fff" fill-opacity=".7" transform="rotate(-34 -30 -22)"/><circle cx="-17" cy="-31" r="2.6" fill="#fff" fill-opacity=".7"/><circle cx="-33" cy="16" r="13" fill="url(#nb1c)"/><circle cx="33" cy="16" r="13" fill="url(#nb1c)"/><ellipse cx="-19" cy="4" rx="9" ry="11.5" fill="#2b2f45"/><ellipse cx="-19.0" cy="7.0" rx="6.5" ry="7.0" fill="#6e96eb" fill-opacity=".55"/><circle cx="-22" cy="-0.5" r="3.6" fill="#fff"/><circle cx="-15.6" cy="8.0" r="1.7" fill="#fff"/><ellipse cx="19" cy="4" rx="9" ry="11.5" fill="#2b2f45"/><ellipse cx="19.0" cy="7.0" rx="6.5" ry="7.0" fill="#6e96eb" fill-opacity=".55"/><circle cx="16" cy="-0.5" r="3.6" fill="#fff"/><circle cx="22.4" cy="8.0" r="1.7" fill="#fff"/><path d="M-8,18 Q-4,23 0,18 Q4,23 8,18" fill="none" stroke="#2b2f45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
