<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：Is this 〜? / Who 〜?"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：Is this 〜? / Who 〜?</text><g data-id="b2"><rect x="30.0" y="68.0" width="441.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="441.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="441.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="250.5" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">this と that</text><text x="40.0" y="229.8" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="229.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">th（？）：自分の近くの物・人。（？）：</text><text x="59.0" y="255.5" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">はなれた物・人。</text><text x="40.0" y="287.8" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="287.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">This is 〜. / That is 〜.（That is は</text><text x="59.0" y="313.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">That&#x27;s と短くできる）</text><text x="40.0" y="345.7" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="345.7" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">答えるときは （？） を使う：（？）, it</text><text x="59.0" y="371.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">is. / No, it isn&#x27;t.</text></g><g data-id="b17"><rect x="489.0" y="68.0" width="441.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="489.0" y="68.0" width="441.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="489.0" y="107.7" width="441.0" height="8.0" rx="0" fill="#e07a1f"/><text x="709.5" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b17">Who の文</text><text x="499.0" y="236.8" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b17">・</text><text x="520.0" y="236.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">Who is 〜? ＝「〜はだれですか」。</text><text x="499.0" y="272.5" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b17">・</text><text x="520.0" y="272.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">答え：（？） is 〜. / She is</text><text x="520.0" y="300.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">〜.（男の人なら he、女の人なら she）</text><text x="499.0" y="336.6" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b17">・</text><text x="520.0" y="336.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">例：Who is that girl? — She is</text><text x="520.0" y="364.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">（？） sister.</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
