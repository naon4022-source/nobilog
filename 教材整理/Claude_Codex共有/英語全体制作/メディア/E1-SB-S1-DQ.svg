<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：アルファベットと教室の英語"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：アルファベットと教室の英語</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="46.4" rx="14" fill="#1f5fa8"/><rect x="30.0" y="106.3" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="90.2" font-size="21" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">アルファベットの書き方</text><text x="40.0" y="179.5" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="179.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">大文字は、上の3本の</text><text x="61.0" y="207.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">線の間に書く。</text><text x="40.0" y="243.5" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="243.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">小文字は、高さがちが</text><text x="61.0" y="271.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">う：b・d・h・k・l</text><text x="61.0" y="300.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">は上に出る、g・j・</text><text x="61.0" y="328.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">p・q・y は下に出る。</text><text x="40.0" y="364.3" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="364.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">まちがえやすいペア：</text><text x="61.0" y="392.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">b と d、p と q、m と</text><text x="61.0" y="421.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">n。</text></g><g data-id="b20"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b20">教室でよく使う英語</text><text x="346.0" y="145.2" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="364.0" y="145.2" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">（？） （？）, （？）</text><text x="364.0" y="169.5" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">.（立ってください）</text><text x="364.0" y="193.8" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">Sit down, please.（す</text><text x="364.0" y="218.1" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">わってください）</text><text x="346.0" y="248.7" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="364.0" y="248.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">Open your textbooks to</text><text x="364.0" y="273.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">page five.（教科書の5ペー</text><text x="364.0" y="297.3" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">ジを開いて）</text><text x="346.0" y="327.9" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="364.0" y="327.9" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">Repeat after</text><text x="364.0" y="352.2" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">me.（わたしのあとについ</text><text x="364.0" y="376.5" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">て言って）</text><text x="346.0" y="407.1" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="364.0" y="407.1" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">Excuse me.（すみません）</text><text x="364.0" y="431.4" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">I have a question.（質</text><text x="364.0" y="455.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">問があります）</text></g><g data-id="b43"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b43">曜日と月</text><text x="652.0" y="148.8" font-size="20" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b43">・</text><text x="672.0" y="148.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">曜日：Sunday Monday</text><text x="672.0" y="175.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">Tuesday Wednesday</text><text x="672.0" y="202.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">Thursday Friday</text><text x="672.0" y="229.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">Saturday（最初は大文</text><text x="672.0" y="256.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">字）</text><text x="652.0" y="290.8" font-size="20" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b43">・</text><text x="672.0" y="290.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">月：January</text><text x="672.0" y="317.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">February March</text><text x="672.0" y="344.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">April May June July</text><text x="672.0" y="371.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">August September</text><text x="672.0" y="398.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">October November</text><text x="672.0" y="425.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">December（最初は大文</text><text x="672.0" y="452.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">字）</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><defs><radialGradient id="nb1b" cx="35%" cy="25%" r="75%"><stop offset="0" stop-color="#d9f7df"/><stop offset=".55" stop-color="#a9e4b6"/><stop offset="1" stop-color="#7fcf93"/></radialGradient><linearGradient id="nb1l" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4fb562"/><stop offset="1" stop-color="#8be09a"/></linearGradient><radialGradient id="nb1c"><stop offset="0" stop-color="#ff8096" stop-opacity=".75"/><stop offset="1" stop-color="#ff8096" stop-opacity="0"/></radialGradient></defs><g transform="translate(40,520) scale(0.25)"><ellipse cx="0" cy="54" rx="50" ry="9" fill="#285a3c" fill-opacity=".13"/><ellipse cx="-20" cy="46" rx="15" r