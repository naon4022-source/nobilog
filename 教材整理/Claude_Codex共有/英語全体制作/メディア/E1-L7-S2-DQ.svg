<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：Can I 〜? / Can you 〜?"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：Can I 〜? / Can you 〜?</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">許可と依頼</text><text x="40.0" y="226.3" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="226.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（？） I ＋ 動詞?</text><text x="61.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">＝「（わたしが）</text><text x="61.0" y="283.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">〜してもいいですか」。</text><text x="40.0" y="318.7" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">Can （？） ＋ 動詞?</text><text x="61.0" y="347.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">＝「（あなたが）</text><text x="61.0" y="375.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">〜してくれますか」。</text></g><g data-id="b16"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b16">答え方</text><text x="346.0" y="229.8" font-size="20" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="366.0" y="229.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">引き受ける：（？）. /</text><text x="366.0" y="256.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">（？） （？）. / （？）</text><text x="366.0" y="283.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">. / No problem.</text><text x="346.0" y="317.8" font-size="20" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="366.0" y="317.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">断る：Sorry, I</text><text x="366.0" y="344.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">can&#x27;t. / I&#x27;m sorry,</text><text x="366.0" y="371.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">but I&#x27;m busy now.</text></g><g data-id="b30"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b30">看板の英語</text><text x="652.0" y="226.3" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b30">・</text><text x="673.0" y="226.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b30">Don&#x27;t ＋ 動詞.（〜</text><text x="673.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b30">してはいけない）：</text><text x="673.0" y="283.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b30">Don&#x27;t run.</text><text x="652.0" y="318.7" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b30">・</text><text x="673.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b30">No 〜.（〜禁止）：</text><text x="673.0" y="347.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b30">No smoking. / No</text><text x="673.0" y="375.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b30">photos.</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
