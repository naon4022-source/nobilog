weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">の言い方を使う。</text></g><g data-id="b17"><rect x="489.0" y="68.0" width="441.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="489.0" y="68.0" width="441.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="489.0" y="107.7" width="441.0" height="8.0" rx="0" fill="#e07a1f"/><text x="709.5" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b17">be動詞と一般動詞の整理</text><text x="499.0" y="222.7" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b17">・</text><text x="520.0" y="222.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">be動詞の文：疑問文は be動詞を前へ、</text><text x="520.0" y="251.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">否定文は be動詞の後ろに not。</text><text x="499.0" y="286.7" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b17">・</text><text x="520.0" y="286.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">一般動詞の文：疑問文は Do を前に、</text><text x="520.0" y="315.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">否定文は動詞の前に don&#x27;t。</text><text x="499.0" y="350.8" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b17">・</text><text x="520.0" y="350.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">一つの文に be動詞と一般動詞をいっ</text><text x="520.0" y="379.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">しょに使わない。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path 