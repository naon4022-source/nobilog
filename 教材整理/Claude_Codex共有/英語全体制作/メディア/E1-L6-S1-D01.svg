<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="Which と Why"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">Which（えらぶ）と Why（理由）の使い分け</text><g data-id="b2"><rect x="40.0" y="82.0" width="420.0" height="140.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="40.0" y="82.0" width="420.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="40.0" y="121.7" width="420.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="250.0" y="105.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">Which ＝ えらぶ</text><text x="250.0" y="161.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">Which do you like, A or B?</text><text x="250.0" y="190.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">「AとBのどちらが好きですか」</text></g><g data-id="b10"><rect x="70.0" y="252.0" width="160.0" height="80.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="150.0" y="296.9" font-size="34" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b10">A</text></g><g data-id="b14"><rect x="270.0" y="252.0" width="160.0" height="80.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="350.0" y="296.9" font-size="34" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b14">B</text></g><text x="250.0" y="302.0" font-size="22" font-weight="700" fill="#8a96a3" text-anchor="middle">or</text><g data-id="b19"><rect x="500.0" y="82.0" width="420.0" height="140.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="500.0" y="82.0" width="420.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="500.0" y="121.7" width="420.0" height="8.0" rx="0" fill="#e07a1f"/><text x="710.0" y="105.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b19">Why ＝ 理由をたずねる</text><text x="710.0" y="161.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b19">Why do you like summer?</text><text x="710.0" y="190.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b19">「なぜ〜ですか」</text></g><line x1="710.0" y1="227.0" x2="710.0" y2="250.8" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="710.0,262.0 703.9,249.4 716.1,249.4" fill="#e07a1f"/><g data-id="b29"><rect x="500.0" y="267.0" width="420.0" height="110.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="500.0" y="267.0" width="420.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="500.0" y="306.7" width="420.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="710.0" y="290.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b29">Because ＋ 理由の文</text><text x="710.0" y="346.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b29">Because I can swim in the sea.</text></g><g data-id="b36"><rect x="40.0" y="410.0" width="880.0" height="100.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="480.0" y="463.2" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b36">Which ＋ 名詞 ＋ 疑問文? ＝「どの〜を…しますか」</text></g></svg>
