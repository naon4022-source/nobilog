">いちばん好きな〜は…</text><text x="673.0" y="394.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b32">です</text><text x="652.0" y="429.7" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b32">・</text><text x="673.0" y="429.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b32">My favorite color</text><text x="673.0" y="458.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b32">is blue.</text></g></svg>
