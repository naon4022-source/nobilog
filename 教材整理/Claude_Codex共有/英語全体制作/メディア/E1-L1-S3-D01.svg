<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="can の位置"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">can は動詞の前に入る（I ＋ can ＋ swim）</text><rect x="292.1" y="122.0" width="57.5" height="70.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="320.8" y="171.4" font-size="40" font-weight="700" fill="#1d2b3a" text-anchor="middle">I</text><rect x="363.5" y="122.0" width="99.9" height="70.0" rx="10" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="413.5" y="171.4" font-size="40" font-weight="700" fill="#1d2b3a" text-anchor="middle">can</text><rect x="477.4" y="122.0" width="123.2" height="70.0" rx="10" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="539.0" y="171.4" font-size="40" font-weight="700" fill="#1d2b3a" text-anchor="middle">swim</text><rect x="614.6" y="122.0" width="53.3" height="70.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="641.3" y="171.4" font-size="40" font-weight="700" fill="#1d2b3a" text-anchor="middle">.</text><text x="413.5" y="212.0" font-size="22" font-weight="700" fill="#e07a1f" text-anchor="middle">〜できる</text><text x="539.0" y="212.0" font-size="20" font-weight="700" fill="#2a8a5b" text-anchor="middle">動詞のもとの形</text><g data-id="b12"><rect x="30.0" y="252.0" width="288.0" height="268.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="252.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="291.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="275.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b12">否定</text><text x="40.0" y="397.7" font-size="21" font-