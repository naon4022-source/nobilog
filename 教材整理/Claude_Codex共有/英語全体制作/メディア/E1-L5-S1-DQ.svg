<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：現在進行形（〜している）"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：現在進行形（〜している）</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">現在進行形の形</text><text x="40.0" y="226.3" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="226.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">am / is / （？） ＋</text><text x="61.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">動詞の ing 形。</text><text x="40.0" y="290.4" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="290.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">主語に合わせて</text><text x="61.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">be動詞を選ぶ：I am、</text><text x="61.0" y="347.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">He / She is、We /</text><text x="61.0" y="375.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">You / （？） are。</text></g><g data-id="b16"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b16">ing のつけ方</text><text x="346.0" y="145.3" font-size="20" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="366.0" y="145.3" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">ふつうは ing：play →</text><text x="366.0" y="172.3" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">playing。</text><text x="346.0" y="206.3" font-size="20" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="366.0" y="206.3" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">e で終わる語は e</text><text x="366.0" y="233.3" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">をとって ing：make →</text><text x="366.0" y="260.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">（？）、write →</text><text x="366.0" y="287.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">writing。</text><text x="346.0" y="321.2" font-size="20" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="366.0" y="321.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">短い母音＋子音字で終</text><text x="366.0" y="348.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">わる語は、最後の字を</text><text x="366.0" y="375.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">重ねる：run →</text><text x="366.0" y="402.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">running、swim →</text><text x="366.0" y="429.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">swimming、sit →</text><text x="366.0" y="456.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">sitting。</text></g><g data-id="b37"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b37">否定文</text><text x="652.0" y="287.2" font-size="20" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b37">・</text><text x="672.0" y="287.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">be動詞の後ろに （？）：</text><text x="672.0" y="314.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">She isn&#x27;t sleeping.</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
