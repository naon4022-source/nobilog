<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：Are you 〜? / Do you 〜?"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：Are you 〜? / Do you 〜?</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">be動詞の疑問文</text><text x="40.0" y="217.0" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="217.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">Are （？） 〜?</text><text x="59.0" y="242.7" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">＝「あなたは〜ですか」。</text><text x="40.0" y="275.0" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="275.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">答え：（？）, I （？）</text><text x="59.0" y="300.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">. / （？）, I&#x27;m not.</text><text x="40.0" y="332.9" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="332.9" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">例：Are you a</text><text x="59.0" y="358.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">student? — Yes, I</text><text x="59.0" y="384.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">am.</text></g><g data-id="b18"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b18">一般動詞の疑問文</text><text x="346.0" y="194.3" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b18">・</text><text x="367.0" y="194.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">（？） you 〜?</text><text x="367.0" y="222.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">＝「あなたは〜します</text><text x="367.0" y="251.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">か」。</text><text x="346.0" y="286.7" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b18">・</text><text x="367.0" y="286.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">答え：Yes, I do. /</text><text x="367.0" y="315.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">No, I （？）.</text><text x="346.0" y="350.8" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b18">・</text><text x="367.0" y="350.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">例：Do you （？）</text><text x="367.0" y="379.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">basketball? — No,</text><text x="367.0" y="407.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">I don&#x27;t.</text></g><g data-id="b35"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b35">文の終わり</text><text x="652.0" y="268.9" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b35">・</text><text x="673.0" y="268.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b35">疑問文の最後は「?」。</text><text x="652.0" y="304.6" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b35">・</text><text x="673.0" y="304.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b35">話すときは、文の終わ</text><text x="673.0" y="332.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b35">りを上げて言う。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><defs><radialGradient id="nb1b" cx="35%" cy="25%" r="75%"><stop offset="0" stop-color="#d9f7df"/><stop offset=".55" stop-color="#a9e4b6"/><stop offset="1" stop-color="#7fcf93"/></radialGradient><linearGradient id="nb1l" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4fb562"/><stop offset="1" stop-color="#8be09a"/></linearGradient><radialGradient id="nb1c"><stop offset="0" stop-color="#ff8096" stop-opacity=".75"/><stop offset="1" stop-color="#ff8096" stop-opacity="0"/></radialGradient></defs><g transform="translate(40,520) scale(0.25)"><ellipse cx="0" cy="54" rx="50" ry="9" fill="#285a3c" fill-opacity=".13"/><ellipse cx="-20" cy="46" rx="15" ry="9" fill="#6cbf80" stroke="#3e8f55" stroke-width="3"/><ellipse cx="20" cy="46" rx="15" ry="9" fill="#6cbf80" stroke="#3e8f55" stroke-width="3"/><g transfor