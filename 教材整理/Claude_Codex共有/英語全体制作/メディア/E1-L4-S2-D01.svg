<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="How many の組み立て"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">How many ＋ 複数形 ＋ 疑問文</text><rect x="199.0" y="112.0" width="165.4" height="60.0" rx="10" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="281.7" y="152.8" font-size="30" font-weight="700" fill="#1d2b3a" text-anchor="middle">How many</text><rect x="378.4" y="112.0" width="99.9" height="60.0" rx="10" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="428.4" y="152.8" font-size="30" font-weight="700" fill="#1d2b3a" text-anchor="middle">cats</text><rect x="492.3" y="112.0" width="207.2" height="60.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="595.9" y="152.8" font-size="30" font-weight="700" fill="#1d2b3a" text-anchor="middle">do you have</text><rect x="713.5" y="112.0" width="47.5" height="60.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="737.3" y="152.8" font-size="30" font-weight="700" fill="#1d2b3a" text-anchor="middle">?</text><text x="281.7" y="202.0" font-size="20" font-weight="700" fill="#e07a1f" text-anchor="middle">数をたずねる</text><text x="428.4" y="202.0" font-size="20" font-weight="700" fill="#2a8a5b" text-anchor="middle">複数形</text><text x="595.9" y="202.0" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="middle">ふつうの疑問文</text><text x="480.0" y="247.0" font-size="22" font-weight="700" fill="#2a8a5b" text-anchor="middle">— I have two cats.（答えは数を入れて言う）</text><g data-id="b14"><rect x="30.0" y="272.0" width="441.0" height="253.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="272.0" width="441.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="311.7" width="441.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="250.5" y="295.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b14">複数形の作り方</text><text x="40.0" y="356.7" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b14">・</text><text x="61.0" y="356.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b14">ふつうは s：books・pens</text><text x="40.0" y="392.4" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b14">・</text><text x="61.0" y="392.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b14">es：boxes・dishes</text><text x="40.0" y="428.1" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b14">・</text><text x="61.0" y="428.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b14">y→ies：city → cities</text><text x="40.0" y="463.8" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b14">・</text><text x="61.0" y="463.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b14">形が変わる：child → children、</text><text x="61.0" y="492.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b14">man → men</text></g><g data-id="b29"><rect x="489.0" y="272.0" width="441.0" height="253.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="489.0" y="272.0" width="441.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="489.0" y="311.7" width="441.0" height="8.0" rx="0" fill="#e07a1f"/><text x="709.5" y="295.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b29">Does の疑問文</text><text x="499.0" y="392.4" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b29">・</text><text x="520.0" y="392.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b29">Does ＋ 主語 ＋ 動詞のもとの形 〜?</tex