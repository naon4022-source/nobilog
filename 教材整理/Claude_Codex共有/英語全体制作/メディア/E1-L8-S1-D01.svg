<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="過去・現在・未来の比べ図"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">時間の線の上で：過去・現在・未来の文</text><line x1="40.0" y1="152.0" x2="907.2" y2="152.0" stroke="#8a96a3" stroke-width="5" stroke-linecap="round"/><polygon points="920.0,152.0 905.6,159.0 905.6,145.0" fill="#8a96a3"/><circle cx="160.0" cy="152.0" r="12.0" fill="#1f5fa8" stroke="#fff" stroke-width="3"/><text x="160.0" y="122.0" font-size="24" font-weight="800" fill="#1f5fa8" text-anchor="middle">過去</text><circle cx="480.0" cy="152.0" r="12.0" fill="#e07a1f" stroke="#fff" stroke-width="3"/><text x="480.0" y="122.0" font-size="24" font-weight="800" fill="#e07a1f" text-anchor="middle">現在</text><circle cx="800.0" cy="152.0" r="12.0" fill="#2a8a5b" stroke="#fff" stroke-width="3"/><text x="800.0" y="122.0" font-size="24" font-weight="800" fill="#2a8a5b" text-anchor="middle">未来</text><g data-id="b10"><rect x="40.0" y="182.0" width="260.0" height="120.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="170.0" y="230.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b10">I played tennis</text><text x="170.0" y="259.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b10">yesterday.</text></g><g data-id="b15"><rect x="350.0" y="182.0" width="260.0" height="120.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="480.0" y="230.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b15">I play tennis</text><text x="480.0" y="259.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b15">every day.</tex