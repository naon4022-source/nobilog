 y="345.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b38">will</text><text x="499.0" y="417.4" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b38">・</text><text x="520.0" y="417.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b38">will ＋ 動詞のもとの形（主語が何で</text><text x="520.0" y="445.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b38">も will）</text><text x="499.0" y="481.4" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b38">・</text><text x="520.0" y="481.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b38">否定 won&#x27;t（will not）</text></g></svg>
