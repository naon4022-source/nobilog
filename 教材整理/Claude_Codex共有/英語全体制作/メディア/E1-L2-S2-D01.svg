<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="this と that"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">this（近く）と that（遠く）</text><g transform="translate(140,292) scale(1.3)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g><circle cx="270.0" cy="282.0" r="34.0" fill="#fff6e8" stroke="#e07a1f" stroke-width="4"/><text x="270.0" y="222.0" font-size="30" font-weight="800" fill="#e07a1f" text-anchor="middle">this</text><circle cx="800.0" cy="282.0" r="34.0" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="4"/><text x="800.0" y="222.0" font-size="30" font-weight="800" fill="#1f5fa8" text-anchor="middle">that</text><line x1="180.0" y1="322.0" x2="250.4" y2="322.0" stroke="#e07a1f" stroke-width="4" stroke-linecap="round"/><polygon points="260.0,322.0 249.2,327.2 249.2,316.8" fill="#e07a1f"/><line x1="180.0" y1="342.0" x2="780.4" y2="342.0" stroke="#1f5fa8" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/><polygon points="790.0,342.0 779.2,347.2 779.2,336.8" fill="#1f5fa8"/><text x="230.0" y="362.0" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="middle">近く</text><text x="520.0" y="372.0" font-size="18" font-weight="700" fill="#1f5fa8" text-anchor="middle">はなれた所</text><g data-id="b13"><rect x="30.0" y="392.0" width="441.0" height="133.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="392.0" width="441.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="431.7" width="441.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="250.5" y="415.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b13">This is 〜. / That is 〜.</text><text x="40.0" y="468.7" font-size="18" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b13">・</text><text x="58.0" y="468.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b13">That is は That&#x27;s と短くできる</text><text x="40.0" y="499.3" font-size="18" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b13">・</text><text x="58.0" y="499.3" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b13">答えは it：Yes, it is. / No, it isn&#x27;t.</text></g><g data-id="b23"><rect x="489.0" y="392.0" width="441.0" height="133.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="489.0" y="392.0" width="441.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="489.0" y="431.7" width="441.0" height="8.0" rx="0" fill="#e07a1f"/><text x="709.5" y="415.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b23">Who is 〜?</text><text x="499.0" y="468.7" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b23">・</text><text x="517.0" y="468.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">「〜はだれですか」</text><text x="499.0" y="499.3" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b23">・</text><text x="517.0" y="499.3" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">He is 〜.（男の人）/ She is 〜.（女の人）</text></g></svg>
