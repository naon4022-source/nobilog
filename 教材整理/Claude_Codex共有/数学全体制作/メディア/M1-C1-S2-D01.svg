<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>符号を先に決める2つの道</title><desc>符号がちがう加法。大きい絶対値の符号を選び、絶対値の差を計算する。最終解答は示さない。</desc><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348"><rect x="45" y="35" width="1510" height="120" rx="24" fill="#e8f0fa"/><text x="90" y="113" font-size="48" font-weight="700">符号を先に決める</text><text x="800" y="238" font-size="50" text-anchor="middle">(+13)+(−21)</text><rect x="240" y="285" width="1120" height="110" rx="20" fill="white" stroke="#1f5fa8" stroke-width="4"/><text x="800" y="355" text-anchor="middle" font-size="44">符号はちがう</text><path d="M800 405V450l-15 -17M800 450l15 -17" fill="none" stroke="#1f5fa8" stroke-width="6"/><rect x="240" y="460" width="1120" height="110" rx="20" fill="white" stroke="#1f5fa8" stroke-width="4"/><text x="800" y="530" text-anchor="middle" font-size="44">絶対値は21のほうが大きい → 符号は−</text><path d="M800 580V625l-15 -17M800 625l15 -17" fill="none" stroke="#1f5fa8" stroke-width="6"/><rect x="240" y="635" width="1120" height="110" rx="20" fill="white" stroke="#1f5fa8" stroke-width="4"/><text x="800" y="705" text-anchor="middle" font-size="44">絶対値の差は 21−13</text><text x="800" y="841" font-size="40" text-anchor="middle">符号と絶対値を、分けて考えよう。</text></g></svg>