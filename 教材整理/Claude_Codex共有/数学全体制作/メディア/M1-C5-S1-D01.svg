<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>点と直線の距離</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="544.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">いちばん短いのは 垂線</text><line x1="150.0" y1="620.0" x2="1450.0" y2="620.0" stroke="#203348" stroke-width="5" stroke-linecap="round"/><text x="1470.0" y="634.0" font-size="48" fill="#203348" text-anchor="start" font-weight="700" font-style="italic">ℓ</text><line x1="760.0" y1="200.0" x2="380.0" y2="620.0" stroke="#9aa9bb" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8"/><circle cx="380.0" cy="620.0" r="8.0" fill="#9aa9bb" stroke="#9aa9bb" stroke-width="4"/><line x1="760.0" y1="200.0" x2="560.0" y2="620.0" stroke="#9aa9bb" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8"/><circle cx="560.0" cy="620.0" r="8.0" fill="#9aa9bb" stroke="#9aa9bb" stroke-width="4"/><line x1="760.0" y1="200.0" x2="1060.0" y2="620.0" stroke="#9aa9bb" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8"/><circle cx="1060.0" cy="620.0" r="8.0" fill="#9aa9bb" stroke="#9aa9bb" stroke-width="4"/><line x1="760.0" y1="200.0" x2="1250.0" y2="620.0" stroke="#9aa9bb" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8"/><circle cx="1250.0" cy="620.0" r="8.0" fill="#9aa9bb" stroke="#9aa9bb" stroke-width="4"/><line x1="760.0" y1="200.0" x2="760.0" y2="620.0" stroke="#e07a1f" stroke-width="8" stroke-linecap="round"/><polyline points="790.0,620.0 790.0,590.0 760.0,590.0" fill="none" stroke="#e07a1f" stroke-width="3" stroke-linejoin="round"/><circle cx="760.0" cy="200.0" r="9.0" fill="#203348" stroke="#203348" stroke-width="2"/><text x="760.0" y="174.0" font-size="46" fill="#203348" text-anchor="middle" font-weight="700">P</text><text x="790.0" y="680.0" font-size="46" fill="#e07a1f" text-anchor="start" font-weight="700">H</text><path d="M490.0 521.7 A420 420 0 0 0 1030.0 521.7" fill="none" stroke="#1f5fa8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="14 10"/><text x="1050.0" y="250.0" font-size="36" fill="#1f5fa8" text-anchor="start" font-weight="700">コンパスで PH の長さを</text><text x="1050.0" y="300.0" font-size="36" fill="#1f5fa8" text-anchor="start" font-weight="700">うつすと、ほかの線分は</text><text x="1050.0" y="350.0" font-size="36" fill="#1f5fa8" text-anchor="start" font-weight="700">みな長い</text><text x="800.0" y="800.0" font-size="44" fill="#e07a1f" text-anchor="middle" font-weight="700">点 P と直線 ℓ の距離 ＝ 垂線 PH の長さ</text></g></svg>