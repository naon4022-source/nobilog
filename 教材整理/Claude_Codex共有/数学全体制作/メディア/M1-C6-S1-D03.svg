<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>三脚はぐらつかない</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="632.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">3点で 平面が1つに決まる</text><path d="M60 640 Q300 600 500 650 T950 630 T1540 650" fill="none" stroke="#8a6a3a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><line x1="330.0" y1="300.0" x2="200.0" y2="628.0" stroke="#203348" stroke-width="6" stroke-linecap="round"/><line x1="330.0" y1="300.0" x2="330.0" y2="650.0" stroke="#203348" stroke-width="6" stroke-linecap="round"/><line x1="330.0" y1="300.0" x2="470.0" y2="642.0" stroke="#203348" stroke-width="6" stroke-linecap="round"/><polygon points="260.0,300.0 400.0,300.0 380.0,260.0 280.0,260.0" fill="#8ec1ec" stroke="#203348" stroke-width="4" stroke-linejoin="round"/><rect x="900.0" y="380.0" width="420.0" height="40.0" rx="4" fill="#f6dcb8" stroke="#203348" stroke-width="4"/><line x1="920.0" y1="420.0" x2="920.0" y2="640.0" stroke="#203348" stroke-width="6" stroke-linecap="round"/><line x1="1300.0" y1="420.0" x2="1300.0" y2="640.0" stroke="#203348" stroke-width="6" stroke-linecap="round"/><line x1="1000.0" y1="420.0" x2="1000.0" y2="560.0" stroke="#203348" stroke-width="6" stroke-linecap="round"/><line x1="1220.0" y1="420.0" x2="1220.0" y2="600.0" stroke="#203348" stroke-width="6" stroke-linecap="round"/><text x="330.0" y="750.0" font-size="40" fill="#2a8a5b" text-anchor="middle" font-weight="800">三脚：ぐらつかない</text><text x="1110.0" y="750.0" font-size="40" fill="#c0392b" text-anchor="middle" font-weight="800">4本足：ぐらつくことがある</text><text x="1000.0" y="600.0" font-size="30" fill="#c0392b" text-anchor="middle" font-weight="700">すきま</text><text x="800.0" y="840.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">1つの直線上にない3点をふくむ平面は 1つだけ</text></g></svg>