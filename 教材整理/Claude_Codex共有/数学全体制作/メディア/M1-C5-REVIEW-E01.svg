<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>条件から作図を選ぶ早見表</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="544.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">条件から 作図をえらぶ</text><rect x="120.0" y="140.0" width="620.0" height="95.0" rx="18" fill="white" stroke="#1f5fa8" stroke-width="4"/><text x="430.0" y="202.0" font-size="36" fill="#203348" text-anchor="middle" font-weight="700">2点から等しい</text><line x1="750.0" y1="187.0" x2="850.0" y2="187.0" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/><polygon points="850.0,187.0 833.8,194.8 833.8,179.2" fill="#e07a1f" stroke="none" stroke-width="4" stroke-linejoin="round"/><rect x="860.0" y="140.0" width="620.0" height="95.0" rx="18" fill="#fff7ec" stroke="#e07a1f" stroke-width="4"/><text x="1170.0" y="202.0" font-size="38" fill="#e07a1f" text-anchor="middle" font-weight="800">垂直二等分線</text><rect x="120.0" y="255.0" width="620.0" height="95.0" rx="18" fill="white" stroke="#1f5fa8" stroke-width="4"/><text x="430.0" y="317.0" font-size="36" fill="#203348" text-anchor="middle" font-weight="700">2本の線から等しい</text><line x1="750.0" y1="302.0" x2="850.0" y2="302.0" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/><polygon points="850.0,302.0 833.8,309.8 833.8,294.2" fill="#e07a1f" stroke="none" stroke-width="4" stroke-linejoin="round"/><rect x="860.0" y="255.0" width="620.0" height="95.0" rx="18" fill="#fff7ec" stroke="#e07a1f" stroke-width="4"/><text x="1170.0" y="317.0" font-size="38" fill="#e07a1f" text-anchor="middle" font-weight="800">角の二等分線</text><rect x="120.0" y="370.0" width="620.0" height="95.0" rx="18" fill="white" stroke="#1f5fa8" stroke-width="4"/><text x="430.0" y="432.0" font-size="36" fill="#203348" text-anchor="middle" font-weight="700">直角・いちばん近い</text><line x1="750.0" y1="417.0" x2="850.0" y2="417.0" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/><polygon points="850.0,417.0 833.8,424.8 833.8,409.2" fill="#e07a1f" stroke="none" stroke-width="4" stroke-linejoin="round"/><rect x="860.0" y="370.0" width="620.0" height="95.0" rx="18" fill="#fff7ec" stroke="#e07a1f" stroke-width="4"/><text x="1170.0" y="432.0" font-size="38" fill="#e07a1f" text-anchor="middle" font-weight="800">垂線</text><rect x="120.0" y="485.0" width="620.0" height="95.0" rx="18" fill="white" stroke="#1f5fa8" stroke-width="4"/><text x="430.0" y="547.0" font-size="36" fill="#203348" text-anchor="middle" font-weight="700">直線に寄るいちばん短い道</text><line x1="750.0" y1="532.0" x2="850.0" y2="532.0" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/><polygon points="850.0,532.0 833.8,539.8 833.8,524.2" fill="#e07a1f" stroke="none" stroke-width="4" stroke-linejoin="round"/><rect x="860.0" y="485.0" width="620.0" height="95.0" rx="18" fill="#fff7ec" stroke="#e07a1f" stroke-width="4"/><text x="1170.0" y="547.0" font-size="38" fill="#e07a1f" text-anchor="middle" font-weight="800">対称移動して線分</text><rect x="120.0" y="600.0" width="620.0" height="95.0" rx="18" fill="white" stroke="#1f5fa8" stroke-width="4"/><text x="430.0" y="662.0" font-size="36" fill="#203348" text-anchor="middle" font-weight="700">円の中心</text><line x1="750.0" y1="647.0" x2="850.0" y2="647.0" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/><polygon points="850.0,647.0 833.8,654.8 833.8,639.2" fill="#e07a1f" stroke="none" stroke-width="4" stroke-linejoin="round"/><rect x="860.0" y="600.0" width="620.0" height="95.0" rx="18" fill="#fff7ec" stroke="#e07a1f" stroke-width="4"/><text x="1170.0" y="662.0" font-size="38" fill="#e07a1f" text-anchor="middle" font-weight="800">弦の垂直二等分線を2本</text><rect x="120.0" y="715.0" width="620.0" height="95.0" rx="18" fill="white" stroke="#1f5fa8" stroke-width="4"/><text x="430.0" y="777.0