<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>この節の地図</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="456.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">円とおうぎ形の地図</text><rect x="60.0" y="150.0" width="700.0" height="600.0" rx="24" fill="white" stroke="#1f5fa8" stroke-width="5"/><rect x="60.0" y="150.0" width="700.0" height="70.0" rx="24" fill="#1f5fa8" stroke="none" stroke-width="4"/><rect x="60.0" y="190.0" width="700.0" height="30.0" rx="0" fill="#1f5fa8" stroke="none" stroke-width="4"/><text x="410.0" y="200.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">ことば</text><text x="410.0" y="290.0" font-size="34" fill="#203348" text-anchor="middle" font-weight="700">弧：円周の一部</text><text x="410.0" y="368.0" font-size="34" fill="#203348" text-anchor="middle" font-weight="700">弦：弧の両はしを結ぶ線分</text><text x="410.0" y="446.0" font-size="34" fill="#203348" text-anchor="middle" font-weight="700">中心角：2つの半径の角</text><text x="410.0" y="524.0" font-size="34" fill="#203348" text-anchor="middle" font-weight="700">接線：1点で接する直線</text><text x="410.0" y="602.0" font-size="34" fill="#203348" text-anchor="middle" font-weight="700">（接点を通る半径に垂直）</text><rect x="840.0" y="150.0" width="700.0" height="600.0" rx="24" fill="white" stroke="#e07a1f" stroke-width="5"/><rect x="840.0" y="150.0" width="700.0" height="70.0" rx="24" fill="#e07a1f" stroke="none" stroke-width="4"/><rect x="840.0" y="190.0" width="700.0" height="30.0" rx="0" fill="#e07a1f" stroke="none" stroke-width="4"/><text x="1190.0" y="200.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">公式</text><text x="1190.0" y="290.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700