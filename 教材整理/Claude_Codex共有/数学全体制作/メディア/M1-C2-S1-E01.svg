<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><title>かっこごと代入する</title><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348" font-size="40"><text x="90" y="100" font-size="48">代入｜負の数は、かっこごと</text><text x="590" y="365" font-size="80" text-anchor="middle">5−2×</text><path d="M800 245H1090V495H800V420C730 420 730 320 800 320Z" fill="white" stroke="#386a9a" stroke-width="5" stroke-dasharray="12 8"/><text x="965" y="380" font-size="60" text-anchor="middle">x</text><path d="M800 530H1090V780H800V705C730 705 730 605 800 605Z" fill="#e8f2eb" stroke="#397052" stroke-width="5"/><text x="965" y="672" font-size="60" text-anchor="middle">(−3)</text><path d="M945 525V505l-15 16m15 -16l15 16" fill="none" stroke="#397052" stroke-width="6"/><rect x="120" y="550" width="450" height="130" rx="20" fill="white" stroke="#ac4e41" stroke-width="4"/><text x="345" y="630" text-anchor="middle">✗ −3</text><text x="350" y="745" text-anchor="middle">かっこを忘れると合わない</text><text x="800" y="855" text-anchor="middle">形を合わせるように、数と符号をひとまとめに入れる。</text></g></svg>