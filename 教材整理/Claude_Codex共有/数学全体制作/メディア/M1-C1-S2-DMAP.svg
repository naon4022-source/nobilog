<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>この節の地図：正負の数の計算</title><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348"><rect x="45" y="35" width="1510" height="120" rx="24" fill="#e8f0fa"/><text x="90" y="113" font-size="48" font-weight="700">この節の地図：正負の数の計算</text><path d="M600 470L480 250" stroke="#1f5fa8" stroke-width="5" fill="none"/><rect x="125" y="195" width="360" height="110" rx="20" fill="white" stroke="#203348" stroke-width="4"/><text x="305" y="267" font-size="42" text-anchor="middle">加法</text><path d="M600 470L480 470" stroke="#1f5fa8" stroke-width="5" fill="none"/><rect x="125" y="415" width="360" height="110" rx="20" fill="white" stroke="#203348" stroke-width="4"/><text x="305" y="487" font-size="42" text-anchor="middle">減法</text><path d="M600 470L480 690" stroke="#1f5fa8" stroke-width="5" fill="none"/><rect x="125" y="635" width="360" height="110" rx="20" fill="white" stroke="#203348" stroke-width="4"/><text x="305" y="707" font-size="42" text-anchor="middle">乗法</text><path d="M1000 470L1100 220" stroke="#1f5fa8" stroke-width="5" fill="none"/><rect x="1110" y="165" width="360" height="110" rx="20" fill="white" stroke="#203348" stroke-width="4"/><text x="1290" y="237" font-size="42" text-anchor="middle">除法</text><path d="M1000 470L1100 400" stroke="#1f5fa8" stroke-width="5" fill="none"/><rect x="1110" y="345" width="360" height="110" rx="20" fill="white" stroke="#203348" stroke-width="4"/><text x="1290" y="417" font-size="42" text-anchor="middle">累乗</text><path d="M1000 470L1100 580" stroke="#1f5fa8" stroke-width="5" fill="none"/><rect x="1110" y="525" width="360" height="110" rx="20" fill="white" stroke="#203348" stroke-width="4"/><text x="1290" y="597" font-size="42" text-anchor="middle">分配法則</text><path d="M1000 470L1100 760" stroke="#1f5fa8" stroke-width="5" fill="none"/><rect x="1110" y="705" width="360" height="110" rx="20" fill="white" stroke="#203348" stroke-width="4"/><text x="1290" y="777" font-size="42" text-anchor="middle">素因数分解</text><rect x="600" y="380" width="400" height="180" rx="23" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="6"/><text x="800" y="456" font-size="46" text-anchor="middle">符号を</text><text x="800" y="521" font-size="46" text-anchor="middle">先に決める</text><text x="800" y="868" font-size="40" text-anchor="middle">道具どうしのつながりを、思い出そう。</text></g></svg>