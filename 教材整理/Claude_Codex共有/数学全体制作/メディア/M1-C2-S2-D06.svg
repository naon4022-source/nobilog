<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>等式と不等式</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="632.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">等号・不等号で 関係を表す</text><rect x="160.0" y="200.0" width="1280.0" height="170.0" rx="18" fill="white" stroke="#1f5fa8" stroke-width="5"/><text x="500.0" y="310.0" font-size="64" fill="#203348" text-anchor="middle" font-weight="800">4x ＋ 3</text><text x="800.0" y="310.0" font-size="64" fill="#1f5fa8" text-anchor="middle" font-weight="900">＝</text><text x="1100.0" y="310.0" font-size="64" fill="#203348" text-anchor="middle" font-weight="800" font-style="italic">y</text><text x="500.0" y="430.0" font-size="38" fill="#1f5fa8" text-anchor="middle" font-weight="700">左辺</text><text x="1100.0" y="430.0" font-size="38" fill="#1f5fa8" text-anchor="middle" font-weight="700">右辺</text><line x1="400.0" y1="460.0" x2="1200.0" y2="460.0" stroke="#1f5fa8" stroke-width="3" stroke-linecap="round"/><line x1="400.0" y1="450.0" x2="400.0" y2="470.0" stroke="#1f5fa8" stroke-width="3" stroke-linecap="round"/><line x1="1200.0" y1="450.0" x2="1200.0" y2="470.0" stroke="#1f5fa8" stroke-width="3" stroke-linecap="round"/><text x="800.0" y="510.0" font-size="38" fill="#1f5fa8" text-anchor="middle" font-weight="700">両辺</text><rect x="100.0" y="580.0" width="330.0" height="200.0" rx="18" fill="#fff7ec" stroke="#e07a1f" stroke-width="4"/><text x="265.0" y="660.0" font-size="48" fill="#e07a1f" text-anchor="middle" font-weight="800">a ＞ b</text><text x="265.0" y="730.0" font-size="26" fill="#203348" text-anchor="middle" font-weight="700">a は b より大きい</text><rect x="460.0" y="580.0" width="330.0" height="200.0" rx="18" fill="#fff7ec" stroke="#e07a1f" stroke-width="4"/><text x="625.0" y="660.0" font-size="48" fill="#e07a1f" text-anchor="middle" font-weight="800">a ＜ b</text><text x="625.0" y="730.0" font-size="26" fill="#203348" text-anchor="middle" font-weight="700">a は b より小さい（未満）</text><rect x="820.0" y="580.0" width="330.0" height="200.0" rx="18" fill="#fff7ec" stroke="#e07a1f" stroke-width="4"/><text x="985.0" y="660.0" font-size="48" fill="#e07a1f" text-anchor="middle" font-weight="800">a ≧ b</text><text x="985.0" y="730.0" font-size="26" fill="#203348" text-anchor="middle" font-weight="700">a は b 以上</text><rect x="1180.0" y="580.0" width="330.0" height="200.0" rx="18" fill="#fff7ec" stroke="#e07a1f" stroke-width="4"/><text x="1345.0" y="660.0" font-size="48" fill="#e07a1f" text-anchor="middle" font-weight="800">a ≦ b</text><text x="1345.0" y="730.0" font-size="26" fill="#203348" text-anchor="middle" font-weight="700">a は b 以下</text><text x="800.0" y="850.0" font-size="34" fill="#e07a1f" text-anchor="middle" font-weight="700">以上・以下は「＝」をふくむ</text></g></svg>