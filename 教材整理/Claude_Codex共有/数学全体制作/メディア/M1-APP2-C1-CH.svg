<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>まちがえた計算をたどる</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="896.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">逆向きに たどって「ある数」を見つける</text><rect x="150.0" y="275.0" width="220.0" height="110.0" rx="18" fill="#cfe3f6" stroke="#1f5fa8" stroke-width="5"/><text x="260.0" y="346.0" font-size="44" fill="#1f5fa8" text-anchor="middle" font-weight="800">ある数</text><rect x="690.0" y="275.0" width="220.0" height="110.0" rx="18" fill="white" stroke="#203348" stroke-width="5"/><text x="800.0" y="346.0" font-size="44" fill="#203348" text-anchor="middle" font-weight="800">5</text><line x1="380.0" y1="310.0" x2="680.0" y2="310.0" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/><polygon points="680.0,310.0 663.8,317.8 663.8,302.2" fill="#e07a1f" stroke="none" stroke-width="4" stroke-linejoin="round"/><text x="530.0" y="280.0" font-size="30" fill="#e07a1f" text-anchor="middle" font-weight="700">＋(−3)（まちがい）</text><line x1="680.0" y1="370.0" x2="380.0" y2="370.0" stroke="#2a8a5b" stroke-width="6" stroke-linecap="round"/><polygon points="380.0,370.0 396.2,362.2 396.2,377.8" fill="#2a8a5b" stroke="none" stroke-width="4" stroke-linejoin="round"/><text x="530.0" y="420.0" font-size="30" fill="#2a8a5b" text-anchor="middle" font-weight="700">−(−3) で もどる</text><rect x="150.0" y="585.0" width="220.0" height="110.0" rx="18" fill="#cfe3f6" stroke="#1f5fa8" stroke-width="5"/><text x="260.0" y="656.0" font-size="44" fill="#1f5fa8" text-anchor="middle" font-weight="800">ある数</text><rect x="690.0" y="585.0" width="220.0" height="110.0" rx="18" fill="white" stroke="#c0392b" stroke-width="5"/><text x="800.0" y="656.0" font-size="44" fill="#c0392b" text-anchor="middle" font-weight="800">？</text><line x1="380.0" y1="640.0" x2="680.0" y2="640.0" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/><polygon points="680.0,640.0 663.8,647.8 663.8,632.2" fill="#c0392b" stroke="none" stroke-width="4" stroke-linejoin="round"/><text x="530.0" y="610.0" font-size="30" fill="#c0392b" text-anchor="middle" font-weight="700">×(−3)（正しい計算）</text><text x="1220.0" y="330.0" font-size="36" fill="#2a8a5b" text-anchor="start" font-weight="700">① 逆にたどる</text><text x="1220.0" y="640.0" font-size="36" fill="#c0392b" text-anchor="start" font-weight="700">② やり直す</text></g></svg>