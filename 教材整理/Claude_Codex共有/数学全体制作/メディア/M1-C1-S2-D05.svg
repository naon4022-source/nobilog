<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>小数のかけ算の手順図</title><desc>負の数2個で正の符号。小数点をいったん外して15かける4の筆算。小数点を戻した最終答えは表示しない。</desc><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348"><rect x="45" y="35" width="1510" height="120" rx="24" fill="#e8f0fa"/><text x="90" y="113" font-size="48" font-weight="700">小数のかけ算は、2段で考える</text><text x="800" y="233" font-size="50" text-anchor="middle">(−0.4)×(−1.5)</text><rect x="120" y="280" width="1360" height="120" rx="20" fill="white" stroke="#1f5fa8" stroke-width="4"/><text x="175" y="352" font-size="44">① 符号：負が2個 → +</text><rect x="120" y="435" width="1360" height="350" rx="20" fill="white" stroke="#203348" stroke-width="4"/><text x="175" y="508" font-size="44">② 0.4×1.5 の筆算</text><text x="1120" y="524" font-size="52" text-anchor="end">15</text><text x="1120" y="596" font-size="52" text-anchor="end">×　4</text><path d="M890 620H1150" stroke="#203348" stroke-width="5"/><text x="1120" y="693" font-size="52" text-anchor="end">60</text><text x="180" y="608" font-size="40">小数点をいったん外して計算。</text><text x="180" y="692" font-size="40">最後に、小数点の位置を戻す。</text><text x="800" y="850" font-size="40" text-anchor="middle">符号を決めてから、絶対値をかけよう。</text></g></svg>