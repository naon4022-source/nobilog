<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><pattern id="h" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 16L16 0" stroke="#487654" stroke-width="3"/></pattern></defs><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348" font-size="40"><text x="90" y="100" font-size="48">分配法則｜面積を2つに分ける</text><rect x="270" y="270" width="800" height="310" fill="#edf3fa" stroke="#386a9a" stroke-width="5"/><rect x="1070" y="270" width="300" height="310" fill="url(#h)" stroke="#397052" stroke-width="5"/><text x="670" y="230" text-anchor="middle">2x</text><text x="1220" y="230" text-anchor="middle">3</text><text x="185" y="445" text-anchor="middle">5</text><text x="670" y="460" text-anchor="middle" font-size="60">10x</text><rect x="1130" y="380" width="180" height="115" fill="white"/><text x="1220" y="460" text-anchor="middle" font-size="60">15</text><text x="800" y="725" text-anchor="middle" font-size="60">5(2x+3)＝10x+15</text><text x="800" y="840" text-anchor="middle">模式図：分けても、全体の面積は変わらない。</text></g></svg>