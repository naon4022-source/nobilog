<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>リボンを等分する</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="720.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">60cm のリボンを 等分する</text><text x="160.0" y="255.0" font-size="40" fill="#1f5fa8" text-anchor="start" font-weight="700">2等分</text><rect x="300.0" y="200.0" width="600.0" height="80.0" rx="4" fill="#8ec1ec" stroke="#203348" stroke-width="4"/><rect x="900.0" y="200.0" width="600.0" height="80.0" rx="4" fill="white" stroke="#203348" stroke-width="4"/><path d="M300 300 L300 320 L900.0 320 L900.0 300" fill="none" stroke="#e07a1f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="600.0" y="360.0" font-size="34" fill="#e07a1f" text-anchor="middle" font-weight="700">1本分</text><text x="160.0" y="425.0" font-size="40" fill="#1f5fa8" text-anchor="start" font-weight="700">3等分</text><rect x="300.0" y="370.0" width="400.0" height="80.0" rx="4" fill="#f6dcb8" stroke="#203348" stroke-width="4"/><rect x="700.0" y="370.0" width="400.0" height="80.0" rx="4" fill="white" stroke="#203348" stroke-width="4"/><rect x="1100.0" y="370.0" width="400.0" height="80.0" rx="4" fill="white" stroke="#203348" stroke-width="4"/><path d="M300 470 L300 490 L700.0 490 L700.0 470" fill="none" stroke="#e07a1f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="500.0" y="530.0" font-size="34" fill="#e07a1f" text-anchor="middle" font-weight="700">1本分</text><text x="160.0" y="595.0" font-size="40" fill="#1f5fa8" text-anchor="start" font-weight="700">4等分</text><rect x="300.0" y="540.0" width="300.0" height="80.0" rx="4" fill="#cdebd7" stroke="#203348" stroke-width="4"/><rect x="600.0" y="540.0" width="300.0" height="80.0" rx="4" fill="white" stroke="#203348" stroke-width="4"/><rect x="900.0" y="540.0" width="300.0" height="80.0" rx="4" fill="white" stroke="#203348" stroke-width="4"/><rect x="1200.0" y="540.0" width="300.0" height="80.0" rx="4" fill="white" stroke="#203348" stroke-width="4"/><path d="M300 640 L300 660 L600.0 660 L600.0 640" fill="none" stroke="#e07a1f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="450.0" y="700.0" font-size="34" fill="#e07a1f" text-anchor="middle" font-weight="700">1本分</text><text x="800.0" y="770.0" font-size="42" fill="#203348" text-anchor="middle" font-weight="700">等分する数がふえると、1本分は短くなる</text></g></svg>