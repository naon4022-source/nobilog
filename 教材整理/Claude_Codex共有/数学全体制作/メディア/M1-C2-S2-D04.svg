<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348" font-size="40"><text x="90" y="100" font-size="48">2つのかっこ｜数と符号を、ひと組に見る</text><text x="800" y="210" text-anchor="middle" font-size="60">2(3a+4)−5(a−1)</text><rect x="190" y="275" width="1220" height="135" rx="20" fill="white" stroke="#386a9a" stroke-width="4"/><text x="245" y="335">① 1つめ：2を両方へ</text><text x="1190" y="365" text-anchor="middle">6a+8</text><path d="M800 420v15l-12 -10m12 10l12 -10" fill="none" stroke="#386a9a" stroke-width="5"/><rect x="190" y="445" width="1220" height="135" rx="20" fill="white" stroke="#386a9a" stroke-width="4"/><text x="245" y="505">② 2つめ：−5ごと両方へ</text><text x="1190" y="535" text-anchor="middle">−5a+5</text><path d="M800 590v15l-12 -10m12 10l12 -10" fill="none" stroke="#386a9a" stroke-width="5"/><rect x="190" y="615" width="1220" height="135" rx="20" fill="white" stroke="#386a9a" stroke-width="4"/><text x="245" y="675">③ 同じ種類をまとめる</text><text x="1190" y="705" text-anchor="middle">(6a−5a)+(8+5)</text></g></svg>