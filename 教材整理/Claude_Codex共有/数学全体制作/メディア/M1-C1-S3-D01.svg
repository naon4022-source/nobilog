<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><title>20分を基準にしたちがい</title><defs><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#386a9a" stroke-width="3"/></pattern></defs><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348" font-size="40"><text x="90" y="100" font-size="48">基準とのちがいだけを、棒で見る</text><path d="M180 535H1440" stroke="#203348" stroke-width="5"/><text x="800" y="180" text-anchor="middle">横線は 0（仮平均20分）</text><rect x="345" y="535" width="90" height="84" fill="url(#h)" stroke="#203348" stroke-width="3"/><text x="390" y="667" text-anchor="middle">−2</text><text x="390" y="760" text-anchor="middle">18分</text><rect x="570" y="409" width="90" height="126" fill="#41877a" stroke="#203348" stroke-width="3"/><text x="615" y="385" text-anchor="middle">+3</text><text x="615" y="760" text-anchor="middle">23分</text><rect x="795" y="535" width="90" height="6" fill="#41877a" stroke="#203348" stroke-width="3"/><text x="840" y="511" text-anchor="middle">0</text><text x="840" y="760" text-anchor="middle">20分</text><rect x="1020" y="535" width="90" height="126" fill="url(#h)" stroke="#203348" stroke-width="3"/><text x="1065" y="709" text-anchor="middle">−3</text><text x="1065" y="760" text-anchor="middle">17分</text><rect x="1245" y="241" width="90" height="294" fill="#41877a" stroke="#203348" stroke-width="3"/><text x="1290" y="217" text-anchor="middle">+7</text><text x="1290" y="760" text-anchor="middle">27分</text><text x="800" y="850" text-anchor="middle">基準より大きい → ＋ ／ 小さい → −</text></g></svg>