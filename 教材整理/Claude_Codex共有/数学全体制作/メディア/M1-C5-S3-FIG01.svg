<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>いちばん短い道</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="676.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">B を折り返して、A と結ぶ</text><line x1="120.0" y1="560.0" x2="1480.0" y2="560.0" stroke="#203348" stroke-width="5" stroke-linecap="round"/><text x="1500.0" y="574.0" font-size="46" fill="#203348" text-anchor="start" font-weight="700" font-style="italic">ℓ</text><circle cx="330.0" cy="250.0" r="9.0" fill="#203348" stroke="#203348" stroke-width="2"/><text x="330.0" y="224.0" font-size="44" fill="#203348" text-anchor="middle" font-weight="700">A</text><circle cx="1150.0" cy="350.0" r="9.0" fill="#203348" stroke="#203348" stroke-width="2"/><text x="1150.0" y="324.0" font-size="44" fill="#203348" text-anchor="middle" font-weight="700">B</text><circle cx="1150.0" cy="770.0" r="9.0" fill="#e07a1f" stroke="#e07a1f" stroke-width="2"/><text x="1190.0" y="780.0" font-size="44" fill="#e07a1f" text-anchor="middle" font-weight="700">B′</text><line x1="1150.0" y1="350.0" x2="1150.0" y2="770.0" stroke="#9aa9bb" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/><line x1="330.0" y1="250.0" x2="818.8" y2="560.0" stroke="#1f5fa8" stroke-width="7" stroke-linecap="round"/><line x1="818.8" y1="560.0" x2="1150.0" y2="350.0" stroke="#1f5fa8" stroke-width="7" stroke-linecap="round" stroke-dasharray="4 0"/><line x1="818.8" y1="560.0" x2="1150.0" y2="770.0" stroke="#1f5fa8" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 8"/><circle cx="818.8" cy="560.0" r="9.0" fill="#1f5fa8" stroke="#1f5fa8" stroke-width="2"/><text x="808.8" y="620.0" font-size="44" fill="#1f5fa8" text-anchor="middle" font-weight="700">P</text><text x="800.0" y="860.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">PB ＝ PB′ だから、A→P→B ＝ A→P→B′（線分）</text></g></svg>