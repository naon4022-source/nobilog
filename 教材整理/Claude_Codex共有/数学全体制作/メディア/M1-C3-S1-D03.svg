<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>移項と等式の性質の対応</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="764.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">5x−7＝18 を 2つの方法で</text><rect x="90.0" y="140.0" width="680.0" height="560.0" rx="24" fill="white" stroke="#1f5fa8" stroke-width="5"/><rect x="90.0" y="140.0" width="680.0" height="70.0" rx="24" fill="#1f5fa8" stroke="none" stroke-width="4"/><rect x="90.0" y="180.0" width="680.0" height="30.0" rx="0" fill="#1f5fa8" stroke="none" stroke-width="4"/><text x="430.0" y="190.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">等式の性質</text><rect x="830.0" y="140.0" width="680.0" height="560.0" rx="24" fill="white" stroke="#e07a1f" stroke-width="5"/><rect x="830.0" y="140.0" width="680.0" height="70.0" rx="24" fill="#e07a1f" stroke="none" stroke-width="4"/><rect x="830.0" y="180.0" width="680.0" height="30.0" rx="0" fill="#e07a1f" stroke="none" stroke-width="4"/><text x="1170.0" y="190.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">移項</text><text x="430.0" y="290.0" font-size="46" fill="#203348" text-anchor="middle" font-weight="700">5x−7＝18</text><text x="1170.0" y="290.0" font-size="46" fill="#203348" text-anchor="middle" font-weight="700">5x−7＝18</text><line x1="250.0" y1="320.0" x2="250.0" y2="390.0" stroke="#1f5fa8" stroke-width="5" stroke-linecap="round"/><polygon points="250.0,390.0 242.2,373.8 257.8,373.8" fill="#1f5fa8" stroke="none" stroke-width="4" stroke-linejoin="round"/><line x1="990.0" y1="320.0" x2="990.0" y2="390.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="990.0,390.0 982.2,373.8 997.8,373.8" fill="#e07a1f" stroke="none" stroke-width="4" stroke-linejoin="round"/><text x="430.0" y="455.0" font-size="46" fill="#203348" text-anchor="middle" font-weight="700">5x−7＋7＝18＋7</text><text x="1170.0" y="455.0" font-size="46" fill="#203348" text-anchor="middle" font-weight="700">5x＝18＋7</text><line x1="250.0" y1="485.0" x2="250.0" y2="555.0" stroke="#1f5fa8" stroke-width="5" stroke-linecap="round"/><polygon points="250.0,555.0 242.2,538.8 257.8,538.8" fill="#1f5fa8" stroke="none" stroke-width="4" stroke-linejoin="round"/><line x1="990.0" y1="485.0" x2="990.0" y2="555.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="990.0,555.0 982.2,538.8 997.8,538.8" fill="#e07a1f" stroke="none" stroke-width="4" stroke-linejoin="round"/><text x="430.0" y="620.0" font-size="46" fill="#203348" text-anchor="middle" font-weight="700">5x＝25</text><text x="1170.0" y="620.0" font-size="46" fill="#203348" text-anchor="middle" font-weight="700">5x＝25</text><text x="270.0" y="385.0" font-size="36" fill="#1f5fa8" text-anchor="start" font-weight="700">両辺に ＋7</text><text x="1010.0" y="385.0" font-size="36" fill="#e07a1f" text-anchor="start" font-weight="700">−7 を移すと ＋7</text><rect x="250.0" y="740.0" width="1100.0" height="90.0" rx="18" fill="#fff7ec" stroke="#e07a1f" stroke-width="4"/><text x="800.0" y="800.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">同じ行は同じ式になる → 移項は等式の性質の近道</text></g></svg>