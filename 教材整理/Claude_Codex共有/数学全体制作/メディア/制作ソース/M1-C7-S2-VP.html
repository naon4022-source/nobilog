<!doctype html><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style><canvas width="1280" height="720"></canvas>
<script src="動画エンジン/engine.js"></script><script src="動画エンジン/engine3d.js"></script><script src="動画エンジン/c67.js"></script><script src="動画エンジン/c67vp.js"></script><script>
// M1-C7-S2-VP 1分でわかる 7章2節（Claude）
const PTS=[[1,0],[5,.2],[10,.5],[20,.35],[40,.25],[70,.27],[100,.22],[200,.205],[500,.216],[1000,.214],[2000,.213]];
function graph(nMax,a){const GX=150,GW=560,GY=470,GH=280,X=n=>GX+Math.log10(n)/Math.log10(2000)*GW,Y=v=>GY-v/.6*GH;g.globalAlpha=a;g.strokeStyle=C.ink;g.lineWidth=3;g.beginPath();g.moveTo(GX,GY);g.lineTo(GX+GW,GY);g.moveTo(GX,GY);g.lineTo(GX,GY-GH);g.stroke();
 [1,10,100,1000].forEach(n=>text(String(n),X(n),GY+30,22,C.ink,'center',700));text('回',GX+GW+24,GY+30,22,C.ink,'center',700);g.strokeStyle=C.orange;g.lineWidth=2;g.setLineDash([8,6]);g.beginPath();g.moveTo(GX,Y(.21));g.lineTo(GX+GW,Y(.21));g.stroke();g.setLineDash([]);
 g.strokeStyle=C.blue;g.lineWidth=4;g.beginPath();PTS.filter(([n])=>n<=nMax).forEach(([n,v],k)=>k?g.lineTo(X(n),Y(v)):g.moveTo(X(n),Y(v)));g.stroke();g.globalAlpha=1}
function info(lines,a,x=780,y=180){g.globalAlpha=a;rbox(x,y,430,60+lines.length*58,22,'#fffdf8',C.orange,4);lines.forEach((l,k)=>text(l[0],x+215,y+58+k*58,l[1]||34,l[2]||C.ink,'center',800));g.globalAlpha=1}
window.SCENE={draw({i,p,t}){
 header('1分でわかる　7章2節 データにもとづく確率');
 if(i===0){[0,1,2].forEach(k=>{g.globalAlpha=seg(p,.1+k*.15,.25+k*.15);cupIcon(380+k*260,330,1.5,k);text(['上向き','下向き','横向き'][k],380+k*260,450,32,C.ink,'center',800);g.globalAlpha=1});return}
 if(i===1){graph(Math.pow(2000,seg(p,.05,.85)),1);g.globalAlpha=seg(p,.8,.95);text('0.21 に 落ちつく',920,300,38,C.orange,'center',800);g.globalAlpha=1;return}
 if(i===2){graph(2000,1);info([['確率'],['多数回の相対度数',34,C.blue],['上向き ≒ 0.21',40,C.orange]],seg(p,.1,.3));return}
 if(i===3){graph(2000,.3);info([['予想される回数'],['確率 × 回数',38,C.blue],['0.21 × 500 ≒ 105回',34,C.orange]],seg(p,.1,.3),420,180);return}
 if(i===4){const N=100,k=Math.round(30*seg(p,.15,.7));for(let j=0;j<N;j++){const x=390+(j%10)*50,y=105+Math.floor(j/10)*38;rbox(x,y,42,32,6,j<k?C.sky:'#fff',C.dim,2);if(j<k){g.fillStyle=C.blue;g.beginPath();g.arc(x+21,y+17,6,0,7);g.fill()}}
  g.globalAlpha=seg(p,.7,.9);text('100回中 およそ30回 雨',640,530,36,C.blue,'center',800);g.globalAlpha=1;return}
 g.globalAlpha=seg(p,0,.2);rbox(160,180,960,260,28,'#fffdf8',C.orange,5);text('たくさんのデータから 起こりやすさを予想',640,280,40,C.ink,'center',800);text('確率 ≒ 多数回の相対度数',640,370,44,C.orange,'center',800);g.globalAlpha=1}};
</script>
