<!doctype html><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style><canvas width="1280" height="720"></canvas>
<script src="動画エンジン/engine.js"></script><script src="動画エンジン/engine3d.js"></script><script src="動画エンジン/c67.js"></script><script>
// M1-C7-S1-V02 3つの代表値（Claude）。紙飛行機 A の記録（小さい順）。平均 8.38・中央値 8.35・最頻値 9
const D=[4.2,5.8,6.1,6.5,7.0,7.3,7.4,7.8,8.1,8.2,8.5,8.6,8.9,9.0,9.4,9.7,10.2,10.8,11.5,12.6],MEAN=8.38,MED=8.35;
const X0=180,BW=46,GAP=0,Y0=560,SC=30;   // 1m＝30px
const bx=k=>X0+k*(BW+GAP)+BW/2;
function bars(level=0,hi=null,alpha=1){D.forEach((v,k)=>{const hgt=(v+(MEAN-v)*level)*SC;g.globalAlpha=alpha;g.fillStyle=hi&&hi.includes(k)?C.orange:'#8ec1ec';g.strokeStyle='#fff';g.lineWidth=2;g.fillRect(bx(k)-BW/2,Y0-hgt,BW,hgt);g.strokeRect(bx(k)-BW/2,Y0-hgt,BW,hgt);
 if(level<0.05&&(k===0||k===19)){text(v.toFixed(1),bx(k),Y0-hgt-10,30,C.ink,'center',800)}g.globalAlpha=1});g.strokeStyle=C.ink;g.lineWidth=3;g.beginPath();g.moveTo(X0-10,Y0);g.lineTo(X0+20*BW+10,Y0);g.stroke()}
function hline(v,col,label,alpha=1){g.globalAlpha=alpha;g.strokeStyle=col;g.lineWidth=4;g.setLineDash([12,8]);g.beginPath();g.moveTo(X0-10,Y0-v*SC);g.lineTo(X0+20*BW+20,Y0-v*SC);g.stroke();g.setLineDash([]);text(label,X0+20*BW+30,Y0-v*SC+12,32,col,'left',800);g.globalAlpha=1}
const HIST=[2,6,8,3,1];
function hist(alpha,hot){const L=200,W=150,yb=560;g.globalAlpha=alpha;HIST.forEach((c,b)=>{g.fillStyle=hot&&b===2?C.orange:'#8ec1ec';g.strokeStyle=C.ink;g.lineWidth=2.5;g.fillRect(L+W*b,yb-c*40,W,c*40);g.strokeRect(L+W*b,yb-c*40,W,c*40)});
 g.strokeStyle=C.ink;g.lineWidth=3;g.beginPath();g.moveTo(L-10,yb);g.lineTo(L+5*W+10,yb);g.stroke();for(let k=0;k<=5;k++)text(String(4+2*k),L+W*k,yb+36,28,C.ink,'center',800);g.globalAlpha=1}
function numberLine(a){const L=170,R=1110,v2x=v=>L+(v-4)*(R-L)/10;g.globalAlpha=a;g.strokeStyle=C.ink;g.lineWidth=3;g.beginPath();g.moveTo(L,400);g.lineTo(R,400);g.stroke();for(let v=4;v<=14;v++){g.beginPath();g.moveTo(v2x(v),390);g.lineTo(v2x(v),410);g.stroke();text(String(v),v2x(v),445,26,C.ink,'center',700)}
 [[MEAN,'平均値 8.38',C.blue,-1],[MED,'中央値 8.35',C.green,1],[9,'最頻値 9',C.orange,-1]].forEach(([v,s,c,side],k)=>{const x=v2x(v),y=side<0?330-k*0:480;g.fillStyle=c;g.beginPath();g.arc(x,400,10,0,7);g.fill();text(s,x+(k===2?60:k===0?-60:0),side<0?(k===2?290:340):505,30,c,'center',800);g.strokeStyle=c;g.lineWidth=2;g.beginPath();g.moveTo(x,400);g.lineTo(x+(k===2?50:k===0?-50:0),side<0?(k===2?300:350):480);g.stroke()});g.globalAlpha=1}
window.SCENE={draw({i,p,t}){
 header('3つの代表値');
 if(i===0){g.globalAlpha=seg(p,0,.3);bars(0);g.globalAlpha=1;g.globalAlpha=seg(p,.5,.7);text('20個の記録を 1つの数で代表させると？',640,140,36,C.ink,'center',800);g.globalAlpha=1;return}
 if(i===1){const lv=seg(p,.35,.85);bars(lv);if(p>.85)hline(MEAN,C.blue,'8.38',seg(p,.85,.95));g.globalAlpha=seg(p,.05,.3);rbox(330,110,620,64,18,'#fffdf8',C.blue,3);text('合計 167.6 ÷ 20個 ＝ 8.38m',640,154,34,C.blue,'center',800);g.globalAlpha=1;return}
 if(i===2){bars(0,[9,10]);const a=seg(p,.3,.5),x=(bx(9)+bx(10))/2;g.globalAlpha=a;g.strokeStyle=C.green;g.lineWidth=4;g.beginPath();g.moveTo(x,Y0+10);g.lineTo(x,150);g.stroke();g.fillStyle=C.green;g.beginPath();g.moveTo(x,150);g.lineTo(x+60,170);g.lineTo(x,190);g.closePath();g.fill();
  text('10番目 8.2',bx(9)-80,600,30,C.orange,'center',800);text('11番目 8.5',bx(10)+80,600,30,C.orange,'center',800);g.globalAlpha=seg(p,.6,.8);rbox(170,150,480,64,18,'#fffdf8',C.green,3);text('(8.2＋8.5)÷2 ＝ 8.35m',410,194,34,C.green,'center',800);g.globalAlpha=1;return}
 if(i===3){hist(seg(p,0,.3),p>.5);g.globalAlpha=seg(p,.5,.7);text('度数がいちばん多い階級',920,180,34,C.orange,'center',800);g.globalAlpha=1;return}
 if(i===4){hist(1,true);g.globalAlpha=seg(p,.1,.3);const x=200+150*2.5;g.strokeStyle=C.red;g.lineWidth=5;g.beginPath();g.moveTo(x,560);g.lineTo(x,220);g.stroke();text('まん中 9',x,205,36,C.red,'center',800);
  g.globalAlpha=seg(p,.4,.6);rbox(820,260,380,110,18,'#fffdf8',C.orange,3);text('階級値 (8＋10)÷2',1010,305,30,C.ink,'center',800);text('＝ 9m ＝ 最頻値',1010,350,32,C.orange,'center',800);g.globalAlpha=1;return}
 numberLine(seg(p,0,.25));g.globalAlpha=seg(p,.5,.7);text('目的に合わせて 使い分ける',640,200,40,C.ink,'center',800);g.globalAlpha=1}};
</script>
