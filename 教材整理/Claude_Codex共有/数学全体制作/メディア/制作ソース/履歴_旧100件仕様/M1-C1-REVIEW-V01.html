<!doctype html><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style><canvas width="1280" height="720"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),blue='#1f5fa8',ink='#203348';
function text(s,x,y,size=32,col=ink,align='left'){g.fillStyle=col;g.font=`600 ${size}px "Hiragino Sans",sans-serif`;g.textAlign=align;g.fillText(s,x,y)}
function line(x,y,a,b,col=ink,w=3,dash=[]){g.strokeStyle=col;g.lineWidth=w;g.setLineDash(dash);g.beginPath();g.moveTo(x,y);g.lineTo(a,b);g.stroke();g.setLineDash([])}
function dot(x,y,col=blue,r=10){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function box(x,y,w,h,col='#eef4fb'){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,22);g.fill()}
function arrow(x,y,a,b,col=blue,dash=[]){line(x,y,a,b,col,7,dash);const t=Math.atan2(b-y,a-x);line(a,b,a-16*Math.cos(t-.5),b-16*Math.sin(t-.5),col,7);line(a,b,a-16*Math.cos(t+.5),b-16*Math.sin(t+.5),col,7)}
function axis(lo,hi,y,start=120,span=1040){const x=n=>start+(n-lo)*span/(hi-lo);line(start-20,y,start+span+20,y);for(let n=lo;n<=hi;n++){line(x(n),y-8,x(n),y+8,n===0?blue:ink,n===0?5:2);if(hi-lo<=16||n%2===0)text(String(n).replace('-','−'),x(n),y+47,26,ink,'center')}return x}
const titles=['温度計から、数直線へ','大小｜右にある数ほど大きい','移動｜大きい → 右へ','計算｜ひく数の符号を変えてたす','平均｜基準とのちがいをならす'];
window.renderAt=function(raw){let t=Math.max(1,Math.min(59,raw)),stage=t<7?0:t<19?1:t<31?2:t<43?3:4;g.fillStyle='#f6f8fc';g.fillRect(0,0,1280,720);box(35,25,1210,98,'#e8f0fa');text('1章のふりかえり',65,64,24,blue);text(titles[stage],65,105,36);box(45,147,1190,425,'white');
if(stage===0){const u=Math.min(1,(t-1)/5),cy=340;line(280,200,280,495,'#90a9c5',22);line(280,490,280,431,'#1f5fa8',12);dot(280,490,blue,22);for(let n=-5;n<=5;n++){let y=340-n*26;line(252,y,308,y,ink,n===0?4:2);if(n%2===0)text(`${String(n).replace('-','−')}℃`,220,y+8,25,ink,'right')}text('0℃が基準',360,275,32);arrow(375,350,690,350,blue);let x=axis(-5,5,460,650,500);dot(x(-3.5),460,blue);text('−3.5',x(-3.5),420,30,blue,'center');text('温度も数も、0を基準に見る',640,635,32,ink,'center');}
if(stage===1){const u=Math.min(1,(t-7)/7),x=axis(-5,5,385);dot(x(-3.5),385,blue);dot(x(-2),385,'#98602f');text('−3.5',x(-3.5),330,34,blue,'center');text('−2',x(-2),330,34,'#98602f','center');arrow(300,240,300+650*u,240);text('大きくなる',650,214,30,blue,'center');if(u===1)text('−3.5 ＜ −2',640,530,42,ink,'center');text('負の数は、0に近いほうが大きい',640,635,32,ink,'center');}
if(stage===2){const u=Math.min(1,(t-19)/8),x=axis(-5,5,390),pos=-3+5*u;dot(x(-3),390,ink,7);arrow(x(-3),280,x(pos),280);dot(x(pos),390,blue,14);text('−3から、右へ5',640,218,40,blue,'center');if(u===1)text('−3より5大きい数は 2',640,530,40,ink,'center');text('向きと、移動する量を分けて考える',640,635,32,ink,'center');}
if(stage===3){const u=Math.min(1,(t-43+12)/8),x=axis(-10,6,400);text(t<35?'(−9) − (−14)':'(−9) ＋ (+14)',640,228,46,blue,'center');const p=Math.max(0,Math.min(1,(t-35)/5));dot(x(-9),400,ink,7);if(t>=35){arrow(x(-9),300,x(-9+14*p),300);dot(x(-9+14*p),400,blue,14)}if(p===1)text('＝ 5',1080,235,44,ink,'center');text('ひき算 → 反対の数をたす',640,635,32,ink,'center');}
if(stage===4){const v=[18,23,20,17,27],p=Math.max(0,Math.min(1,(t-46)/8));line(190,370,1100,370,ink,4,[10,8]);text('基準20分',90,358,27);v.forEach((n,i)=>{let x=280+i*170,h=20+(n-20)*(1-p)+p,top=510-h*7;box(x,top,95,h*7,i%2?'#b7cadf':'#618aba');text('元'+n,x+47,205,32,ink,'center');text(String(i+1)+'人目',x+47,549,25,ink,'center');});if(t>=54){text('ちがいの合計 5 → 5÷5＝1',640,603,31,ink,'center');text('平均＝20＋1＝21分',640,657,36,blue,'center')}else text('多いところから、少ないところへ',640,635,32,ink,'center');}
for(let i=0;i<5;i++){box(52+i*244,688,225,8,i<=stage?blue:'#d8e1ec')}return {stage,time:t};};renderAt(0);
</script>
