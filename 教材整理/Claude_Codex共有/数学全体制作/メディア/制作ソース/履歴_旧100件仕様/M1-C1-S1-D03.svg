<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">読書の目標20ページを基準にする</title><desc id="desc">月から金の読書量は23、18、20、25、15ページ。目標20ページの線より上をプラス、下をマイナスと示す。各日の差の数は表示しない。</desc><defs><pattern id="stripe" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#6587ac" stroke-width="2"/></pattern></defs><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348"><rect x="45" y="35" width="1510" height="120" rx="25" fill="#e8f0fa"/><text x="90" y="114" font-size="48" font-weight="700">目標を0の基準にすると？</text><rect x="65" y="190" width="1470" height="580" rx="25" fill="white"/><rect x="340" y="302" width="100" height="368" fill="#d5e1ee" stroke="#203348" stroke-width="3"/><text x="390" y="278" font-size="39" text-anchor="middle">23</text><text x="390" y="725" font-size="36" text-anchor="middle">月</text><rect x="340" y="302" width="100" height="48" fill="url(#stripe)" stroke="#1f5fa8" stroke-width="3"/><text x="485" y="338.0" font-size="45">＋</text><rect x="560" y="382" width="100" height="288" fill="#d5e1ee" stroke="#203348" stroke-width="3"/><text x="610" y="358" font-size="39" text-anchor="middle">18</text><text x="610" y="725" font-size="36" text-anchor="middle">火</text><rect x="560" y="350" width="100" height="32" fill="url(#stripe)" stroke="#1f5fa8" stroke-width="3"/><text x="705" y="378.0" font-size="45">−</text><rect x="780" y="350" width="100" height="320" fill="#d5e1ee" stroke="#203348" stroke-width="3"/><text x="830" y="326" font-size="39" text-anchor="middle">20</text><text x="830" y="725" font-size="36" text-anchor="middle">水</text><rect x="1000" y="270" width="100" height="400" fill="#d5e1ee" stroke="#203348" stroke-width="3"/><text x="1050" y="246" font-size="39" text-anchor="middle">25</text><text x="1050" y="725" font-size="36" text-anchor="middle">木</text><rect x="1000" y="270" width="100" height="80" fill="url(#stripe)" stroke="#1f5fa8" stroke-width="3"/><text x="1145" y="322.0" font-size="45">＋</text><rect x="1220" y="430" width="100" height="240" fill="#d5e1ee" stroke="#203348" stroke-width="3"/><text x="1270" y="406" font-size="39" text-anchor="middle">15</text><text x="1270" y="725" font-size="36" text-anchor="middle">金</text><rect x="1220" y="350" width="100" height="80" fill="url(#stripe)" stroke="#1f5fa8" stroke-width="3"/><text x="1365" y="402.0" font-size="45">−</text><path d="M270 350H1450" stroke="#203348" stroke-width="5" stroke-dasharray="14 8"/><text x="110" y="325" font-size="32">目標20</text><text x="110" y="370" font-size="29">0の基準</text><path d="M270 670H1450" stroke="#203348" stroke-width="3"/><text x="800" y="838" text-anchor="middle" font-size="34">上なら＋。下なら−。同じなら、ちがいはない。</text></g></svg>