<script src="動画エンジン/engine.js"></script><script src="動画エンジン/engine3d.js"></script><script src="動画エンジン/c67.js"></script><script src="動画エンジン/c67vp.js"></script><script>
// M1-C6-S2-VP 1分でわかる 6章2節（Claude）
function eqCard(lines,a,y=150){g.globalAlpha=a;rbox(700,y,520,70+lines.length*62,24,'#fffdf8',C.orange,4);lines.forEach((l,k)=>text(l[0],960,y+62+k*62,l[1]||40,l[2]||C.ink,'center',800));g.globalAlpha=1}
window.SCENE={draw({i,p,t}){
 header('1分でわかる　6章2節 体積と表面積');
 if(i===0){[['体積',C.blue],['表面積',C.orange]].forEach(([s,c],k)=>card4(170+k*500,190,440,240,s,c,seg(p,.1+k*.25,.3+k*.25)));g.globalAlpha=seg(p,.1,.3);miniCyl(390,340,55);g.globalAlpha=seg(p,.35,.55);netCyl(890,330,30,1);g.globalAlpha=1;return}
 if(i===1){const f=seg(p,.1,.8),o={cx:330,cy:330,s:110,M:view(.3,-.35)};const n=Math.floor(f*10),y=k=>-1+0.2*k;
  // 底面を1枚ずつ積み重ねる
  for(let k=0;k<n;k++){surf(lathe([[1,y(k)],[1,y(k+1)]],40),{...o,color:k%2?'#8ec1ec':'#a9cff0'})}
  if(n>0)surf(lathe([[0,y(n)],[1,y(n)]],40),{...o,color:'#5f9fd8'});else surf(lathe([[0,-1],[1,-1]],40),{...o,color:'#5f9fd8'});
  g.globalAlpha=seg(p,.05,.2);text('底面積 S',560,y(0)*-110+330+20,32,C.blue,'left',800);g.globalAlpha=1;
  eqCard([['柱の体積'],['V ＝ S h',52,C.blue],['底面積 × 高さ',32]],seg(p,.5,.7));return}
 if(i===2){[0,1,2].forEach(k=>{g.globalAlpha=seg(p,.05+k*.15,.2+k*.15);miniCone(150+k*130,330,58);g.globalAlpha=1});g.globalAlpha=seg(p,.5,.6);text('＝',540,345,56,C.ink,'center',800);g.globalAlpha=1;if(p>.5)miniCyl(640,330,58);
  eqCard([['錐の体積'],['V ＝ ⅓ S h',52,C.blue]],seg(p,.6,.8),400);return}
 if(i===3){miniBall(330,320,120);eqCard([['球の体積'],['V ＝ ⁴⁄₃ π r³',48,C.blue],['ちょうど入る円柱の ⅔',30]],seg(p,.2,.4));return}
 if(i===4){netCyl(330,330,46,1);eqCard([['柱の表面積'],['側面積 ＋ 底面積×2',38,C.orange],['錐は 底面1つ',30]],seg(p,.2,.4));return}
 if(i===5){netCone(330,130,200,67,1);eqCard([['円錐の側面積'],['π × 母線 × 半径',40,C.orange],['πℓr',48,C.orange]],seg(p,.2,.4));return}
 miniBall(330,320,120,1,'#f4b6c2');eqCard([['球の表面積'],['S ＝ 4 π r²',52,C.orange],['半径 r の円 4つ分',30]],seg(p,.2,.4))}};
</script>
