<!doctype html><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style><canvas width="1280" height="720"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),blue='#1f5fa8',ink='#203348';
function text(s,x,y,size=32,col=ink,align='left'){g.fillStyle=col;g.font=`600 ${size}px "Hiragino Sans",sans-serif`;g.textAlign=align;g.fillText(s,x,y)}
function line(x,y,a,b,col=ink,w=3,dash=[]){g.strokeStyle=col;g.lineWidth=w;g.setLineDash(dash);g.beginPath();g.moveTo(x,y);g.lineTo(a,b);g.stroke();g.setLineDash([])}
function dot(x,y,col=blue,r=10){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function box(x,y,w,h,col='#eef4fb'){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,22);g.fill()}
function arrow(x,y,a,b,col=blue,dash=[]){line(x,y,a,b,col,7,dash);const t=Math.atan2(b-y,a-x);line(a,b,a-16*Math.cos(t-.5),b-16*Math.sin(t-.5),col,7);line(a,b,a-16*Math.cos(t+.5),b-16*Math.sin(t+.5),col,7)}
function axis(lo,hi,y,start=120,span=1040){const x=n=>start+(n-lo)*span/(hi-lo);line(start-20,y,start+span+20,y);for(let n=lo;n<=hi;n++){line(x(n),y-8,x(n),y+8,n===0?blue:ink,n===0?5:2);if(hi-lo<=16||n%2===0)text(String(n).replace('-','−'),x(n),y+47,26,ink,'center')}return x}
function bread(x,y){g.fillStyle='#cda878';g.beginPath();g.roundRect(x,y,125,75,30);g.fill();for(let j=0;j<3;j++)line(x+25+j*30,y+15,x+14+j*30,y+43,'#957344',4)}
window.renderAt=function(raw){const t=Math.max(1,Math.min(59,raw));g.fillStyle='#f6f8fc';g.fillRect(0,0,1280,720);box(35,25,1210,98,'#e8f0fa');text('2章をふりかえる｜式をつくる・計算する・説明する',65,85,35,blue);box(45,147,1190,465,'white');if(t<20){const n=Math.min(5,Math.floor((t-1)/2)+1);for(let j=0;j<n;j++){bread(115+j*200,245);text('x 円',177+j*200,370,32,ink,'center')}if(t>=12){text('＋ 牛乳120円',640,445,38,ink,'center');text('x×5+120 → 5x+120',640,545,44,blue,'center')}text('変わる値を文字にして、数量を式にする',640,665,34,ink,'center')}else if(t<40){text('x＝150 を入れて確かめる',640,225,38,blue,'center');const rows=['5x+120','5×150+120','750+120＝870（円）'],n=Math.min(3,1+Math.floor((t-20)/6));for(let j=0;j<n;j++){box(220,260+j*108,840,90);text(rows[j],640,320+j*108,40,ink,'center')}text('文字の意味と、計算の順番を意識する',640,665,34,ink,'center')}else{text('なぜ 5x+120 なの？',640,230,40,blue,'center');const lines=['5x：同じパンを5個買う代金','120：牛乳1本の代金','たす：全部の代金を合わせる'],n=Math.min(3,1+Math.floor((t-40)/6));for(let j=0;j<n;j++){box(150,280+j*102,980,80);text(lines[j],640,333+j*102,34,ink,'center')}text('式の一つひとつを、ことばで説明する',640,665,34,ink,'center')}return {time:t};};renderAt(0);</script>
