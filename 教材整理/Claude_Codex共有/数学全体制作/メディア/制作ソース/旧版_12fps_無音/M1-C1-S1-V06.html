<!doctype html><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style><canvas width="1280" height="720"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),blue='#1f5fa8',ink='#203348';
function text(s,x,y,size=32,col=ink,align='left'){g.fillStyle=col;g.font=`600 ${size}px "Hiragino Sans",sans-serif`;g.textAlign=align;g.fillText(s,x,y)}
function line(x,y,a,b,col=ink,w=3,dash=[]){g.strokeStyle=col;g.lineWidth=w;g.setLineDash(dash);g.beginPath();g.moveTo(x,y);g.lineTo(a,b);g.stroke();g.setLineDash([])}
function dot(x,y,col=blue,r=10){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function box(x,y,w,h,col='#eef4fb'){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,22);g.fill()}
function arrow(x,y,a,b,col=blue,dash=[]){line(x,y,a,b,col,7,dash);const t=Math.atan2(b-y,a-x);line(a,b,a-16*Math.cos(t-.5),b-16*Math.sin(t-.5),col,7);line(a,b,a-16*Math.cos(t+.5),b-16*Math.sin(t+.5),col,7)}
function axis(lo,hi,y,start=120,span=1040){const x=n=>start+(n-lo)*span/(hi-lo);line(start-20,y,start+span+20,y);for(let n=lo;n<=hi;n++){line(x(n),y-8,x(n),y+8,n===0?blue:ink,n===0?5:2);if(hi-lo<=16||n%2===0)text(String(n).replace('-','−'),x(n),y+47,26,ink,'center')}return x}
const titles=['温度計から、数直線へ','大小｜右にある数ほど大きい','移動｜大きい → 右へ','計算｜ひく数の符号を変えてたす','平均｜基準とのちがいをならす'];
function frog(x,y){g.fillStyle='#4d8860';g.beginPath();g.ellipse(x,y-23,29,20,0,0,7);g.fill();dot(x-15,y-41,'#4d8860',10);dot(x+15,y-41,'#4d8860',10);dot(x-15,y-44,'white',5);dot(x+15,y-44,'white',5);dot(x-15,y-44,ink,2);dot(x+15,y-44,ink,2);line(x-20,y-7,x-38,y,ink,4);line(x+20,y-7,x+38,y,ink,4)}
window.renderAt=function(raw){const t=Math.max(1,Math.min(29,raw));g.fillStyle='#f6f8fc';g.fillRect(0,0,1280,720);box(35,25,1210,98,'#e8f0fa');text('数直線をジャンプするカエル',65,88,42,blue);box(45,147,1190,425,'white');const x=n=>650+n*120,y=455;line(150,y,1140,y);for(let n=-4;n<=4;n++)line(x(n),y-10,x(n),y+10,ink,n===0?5:3);text('−3',x(-3),520,38,ink,'center');text('0',x(0),520,38,ink,'center');if(t>=13&&t<17)text('2',x(2),520,42,blue,'center');
const right=t<15,u=right?Math.min(5,Math.max(0,(t-3)/2)):Math.min(4,Math.max(0,(t-17)/2.5)),n=Math.floor(u),f=u-n,pos=right?-3+u:2-u;
for(let j=0;j<n;j++){let a=right?-3+j:2-j;g.strokeStyle=blue;g.lineWidth=5;g.setLineDash(right?[]:[9,7]);g.beginPath();g.arc(x(a)+(right?60:-60),y,60,Math.PI,2*Math.PI);g.stroke();g.setLineDash([])}frog(x(pos),y-65*Math.sin(Math.PI*f));
const flip=t>=15&&t<17,w=flip?Math.max(.05,Math.abs(Math.cos((t-15)*Math.PI/2))):1;g.save();g.translate(640,270);g.scale(w,1);box(-210,-55,420,95,'#e8f0fa');text(right?'5大きい':t<16?'−4大きい':'4小さい',0,8,44,blue,'center');g.restore();text(right?'大きい → 右へ、5回ジャンプ':'負の数だけ大きい → 反対に、左へ進む',640,640,34,ink,'center');return {time:t,position:pos,jumps:n};};renderAt(0);</script>
