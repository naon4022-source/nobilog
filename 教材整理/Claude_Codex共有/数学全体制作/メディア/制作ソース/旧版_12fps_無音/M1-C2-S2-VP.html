<!doctype html><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style><canvas width="1280" height="720"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),blue='#1f5fa8',ink='#203348';
function text(s,x,y,size=32,col=ink,align='left'){g.fillStyle=col;g.font=`600 ${size}px "Hiragino Sans",sans-serif`;g.textAlign=align;g.fillText(s,x,y)}
function line(x,y,a,b,col=ink,w=3,dash=[]){g.strokeStyle=col;g.lineWidth=w;g.setLineDash(dash);g.beginPath();g.moveTo(x,y);g.lineTo(a,b);g.stroke();g.setLineDash([])}
function dot(x,y,col=blue,r=10){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function box(x,y,w,h,col='#eef4fb'){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,22);g.fill()}
function arrow(x,y,a,b,col=blue,dash=[]){line(x,y,a,b,col,7,dash);const t=Math.atan2(b-y,a-x);line(a,b,a-16*Math.cos(t-.5),b-16*Math.sin(t-.5),col,7);line(a,b,a-16*Math.cos(t+.5),b-16*Math.sin(t+.5),col,7)}
function axis(lo,hi,y,start=120,span=1040){const x=n=>start+(n-lo)*span/(hi-lo);line(start-20,y,start+span+20,y);for(let n=lo;n<=hi;n++){line(x(n),y-8,x(n),y+8,n===0?blue:ink,n===0?5:2);if(hi-lo<=16||n%2===0)text(String(n).replace('-','−'),x(n),y+47,26,ink,'center')}return x}
const scene0=function(raw){const t=Math.max(1,Math.min(24,raw)),p=Math.max(0,Math.min(1,(t-3)/9));g.fillStyle='#f6f8fc';g.fillRect(0,0,1280,720);box(35,25,1210,98,'#e8f0fa');text('袋とばらのあめ｜同じ種類をまとめる',65,88,40,blue);box(45,147,1190,465,'white');text(t<13?'(4x+2)+(3x+5)':'7x+7',640,215,45,blue,'center');const starts=[170,320,470,620,900,1030,1160];for(let j=0;j<7;j++){const x=starts[j]*(1-p)+(170+j*145)*p;box(x-42,255,84,100,j<4?'#e8f0fa':'#e5efe7');line(x-25,255,x-13,236);line(x+25,255,x+13,236);line(x-13,236,x+13,236);text('x',x,322,35,ink,'center');text('袋',x,400,27,ink,'center')}const candy=[200,340,620,760,900,1040,1180];for(let j=0;j<7;j++){const x=candy[j]*(1-p)+(170+j*145)*p;dot(x,495,j<2?blue:'#397052',23);line(x-35,480,x-23,495,ink,3);line(x+23,495,x+35,480,ink,3);text('1個',x,555,27,ink,'center')}text(t<13?'袋は袋へ、ばらはばらへ集める':'7袋と7個。袋とばらは、混ぜて数えない。',640,665,34,ink,'center');return {time:t,bags:7,loose:7};};
const scene1=function(raw){const t=Math.max(1,Math.min(24,raw));g.fillStyle='#f6f8fc';g.fillRect(0,0,1280,720);box(35,25,1210,98,'#e8f0fa');text('−( ) で符号がひっくり返る',65,88,42,blue);box(45,147,1190,465,'white');text('6a−(4a−7)',640,240,50,blue,'center');const p=Math.max(0,Math.min(1,(t-5)/5));text(t<20?'−( )':'符号反転',245+130*p,410,t<20?50:32,blue,'center');for(let j=0;j<2;j++){const a=9+j*5,b=a+4,q=Math.max(0,Math.min(1,(t-a)/(b-a))),scale=Math.abs(Math.cos(Math.PI*q)),x=665+j*270;g.save();g.translate(x,360);g.scale(Math.max(.025,scale),1);box(-100,0,200,110,q<.5?'#edf3fa':'#e6f1e9');text(q<.5?['4a','−7'][j]:['−4a','+7'][j],0,75,48,ink,'center');g.restore()}if(t>=20)text('6a−4a+7',640,545,46,blue,'center');text(t<20?'中のすべての項の符号を変える':'ひく式を、かっこごと −1 倍する',640,665,34,ink,'center');return {time:t};};
const scene2=function(raw){const t=Math.max(1,Math.min(24,raw));g.fillStyle='#f6f8fc';g.fillRect(0,0,1280,720);box(35,25,1210,98,'#e8f0fa');text('分配法則のかけ橋',65,88,42,blue);box(45,147,1190,465,'white');text('−3',310,350,60,blue,'center');text('(',465,350,60,ink,'center');text('5x',620,350,60,ink,'center');text('−2',935,350,60,ink,'center');text(')',1085,350,60,ink,'center');const p=Math.max(0,Math.min(1,(t-3)/6)),q=Math.max(0,Math.min(1,(t-12)/6));function bridge(end,p,y,col){g.strokeStyle=col;g.lineWidth=6;g.setLineDash(end===935?[12,9]:[]);g.beginPath();g.moveTo(310,280);g.quadraticCurveTo((310+end)/2,y,310+(end-310)*p,280);g.stroke();g.setLineDash([]);if(p===1)arrow(end,260,end,280,col)}if(p>0)bridge(620,p,180,blue);if(q>0)bridge(935,q,100,'#397052');if(t>=10){box(480,420,280,100);text('−15x',620,485,48,blue,'center')}if(t>=19){box(800,420,270,100,'#e6f1e9');text('+6',935,485,48,'#397052','center')}text(t<12?'まず −3×5x':'−3 を、両方の項へかける',640,665,36,ink,'center');return {time:t};};
const scene3=function(raw){const t=Math.max(1,Math.min(24,raw)),tilt=Math.max(0,Math.min(1,(t-17)/6)),yl=445-70*tilt,yr=445+70*tilt;g.fillStyle='#f6f8fc';g.fillRect(0,0,1280,720);box(35,25,1210,98,'#e8f0fa');text('てんびんが式になる',65,88,42,blue);box(45,147,1190,465,'white');g.fillStyle='#9baec1';g.beginPath();g.moveTo(640,250);g.lineTo(550,560);g.lineTo(730,560);g.closePath();g.fill();line(350,280-70*tilt,930,280+70*tilt,ink,8);dot(640,280,blue,12);for(const [x,y] of [[350,yl],[930,yr]]){line(x-100,y-165,x-100,y,ink,3);line(x+100,y-165,x+100,y,ink,3);line(x-125,y,x+125,y,ink,6)}for(let j=0;j<6;j++){const x=267+j*33;g.fillStyle='#c99c62';g.fillRect(x,yl-105,18,100);g.fillStyle=ink;g.beginPath();g.moveTo(x,yl-105);g.lineTo(x+9,yl-122);g.lineTo(x+18,yl-105);g.fill()}box(855,yr-105,150,98,'#e5efe7');text('y 円',930,yr-45,32,ink,'center');text('x円 × 6本',350,yl+65,30,ink,'center');if(t>=13)text(t<20?'6x＝y':'6x＜y',640,210,48,blue,'center');text(t<13?'鉛筆6本の代金と、y円を比べる':t<20?'同じ大きさなら、等号で表す':'右が大きい。口が大きいほうへ開く。',640,665,34,ink,'center');return {time:t,rightHeavier:tilt};};
window.renderAt=function(raw){const t=Math.max(1,Math.min(59,raw)),bounds=[1,15,30,45,59],index=t<15?0:t<30?1:t<45?2:3,local=1+(t-bounds[index])*23/(bounds[index+1]-bounds[index]);[scene0,scene1,scene2,scene3][index](local);g.fillStyle='#e8f0fa';g.fillRect(65,38,1150,63);text('1分でわかる 文字式の計算',65,88,42,blue);return {time:t,scene:index,local};};renderAt(0);</script>
