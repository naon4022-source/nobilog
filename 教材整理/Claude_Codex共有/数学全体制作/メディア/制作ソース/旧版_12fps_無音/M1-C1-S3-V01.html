<!doctype html><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style><canvas width="1280" height="720"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),blue='#1f5fa8',ink='#203348';
function text(s,x,y,size=32,col=ink,align='left'){g.fillStyle=col;g.font=`600 ${size}px "Hiragino Sans",sans-serif`;g.textAlign=align;g.fillText(s,x,y)}
function line(x,y,a,b,col=ink,w=3,dash=[]){g.strokeStyle=col;g.lineWidth=w;g.setLineDash(dash);g.beginPath();g.moveTo(x,y);g.lineTo(a,b);g.stroke();g.setLineDash([])}
function dot(x,y,col=blue,r=10){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function box(x,y,w,h,col='#eef4fb'){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,22);g.fill()}
function arrow(x,y,a,b,col=blue,dash=[]){line(x,y,a,b,col,7,dash);const t=Math.atan2(b-y,a-x);line(a,b,a-16*Math.cos(t-.5),b-16*Math.sin(t-.5),col,7);line(a,b,a-16*Math.cos(t+.5),b-16*Math.sin(t+.5),col,7)}
function axis(lo,hi,y,start=120,span=1040){const x=n=>start+(n-lo)*span/(hi-lo);line(start-20,y,start+span+20,y);for(let n=lo;n<=hi;n++){line(x(n),y-8,x(n),y+8,n===0?blue:ink,n===0?5:2);if(hi-lo<=16||n%2===0)text(String(n).replace('-','−'),x(n),y+47,26,ink,'center')}return x}
const initial=[18,23,20,17,27],moves=[[4,0,3],[4,2,1],[4,3,2],[1,3,2]],colors=['#28679e','#b66b32','#417550','#815898','#48868b'];
function bars(heights,labels=true){const scale=12,bottom=550;line(120,bottom-240,1160,bottom-240,blue,3,[10,8]);text('基準 20',1150,bottom-252,28,blue,'right');for(let j=0;j<5;j++){g.fillStyle=colors[j];g.fillRect(190+j*205,bottom-heights[j]*scale,95,heights[j]*scale);for(let k=1;k<heights[j];k++)line(190+j*205,bottom-k*scale,285+j*205,bottom-k*scale,'#ffffff',1);text(String.fromCharCode(65+j),237+j*205,595,30,ink,'center');if(labels)text(String(initial[j]),237+j*205,bottom-heights[j]*scale-20,36,ink,'center')}}
window.renderAt=function(raw){const t=Math.max(1,Math.min(29,raw));g.fillStyle='#f6f8fc';g.fillRect(0,0,1280,720);box(35,25,1210,98,'#e8f0fa');text('でこぼこをならす',65,88,42,blue);box(45,147,1190,465,'white');let h=initial.slice();if(t<15){bars(h);text('量を変えずに、高いところから低いところへ',640,665,34,ink,'center')}else{const step=Math.min(3,Math.floor((t-15)/3.5)),p=Math.min(1,(t-15-step*3.5)/3.5);for(let i=0;i<step;i++){const[a,b,q]=moves[i];h[a]-=q;h[b]+=q}const[a,b,q]=moves[step],source=h[a];h[a]-=q;if(p>=1)h[b]+=q;bars(h,false);if(p<1){const x=(190+a*205)*(1-p)+(190+b*205)*p,y=(550-source*12)*(1-p)+(550-(h[b]+q)*12)*p-100*Math.sin(Math.PI*p);g.fillStyle=colors[a];g.fillRect(x,y,95,q*12);g.strokeStyle=ink;g.lineWidth=3;g.strokeRect(x,y,95,q*12)}text(t>=29?'全部が同じ高さ。量は、はじめと同じ。':'切り取った部分を、低いところへ移す',640,665,34,ink,'center')}return {time:t,total:105,answerVisible:false}};renderAt(0);</script>
