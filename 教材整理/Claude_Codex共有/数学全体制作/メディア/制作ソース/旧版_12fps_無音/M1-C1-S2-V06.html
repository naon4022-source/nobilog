<!doctype html><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style><canvas width="1280" height="720"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),blue='#1f5fa8',ink='#203348';
function text(s,x,y,size=32,col=ink,align='left'){g.fillStyle=col;g.font=`600 ${size}px "Hiragino Sans",sans-serif`;g.textAlign=align;g.fillText(s,x,y)}
function line(x,y,a,b,col=ink,w=3,dash=[]){g.strokeStyle=col;g.lineWidth=w;g.setLineDash(dash);g.beginPath();g.moveTo(x,y);g.lineTo(a,b);g.stroke();g.setLineDash([])}
function dot(x,y,col=blue,r=10){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function box(x,y,w,h,col='#eef4fb'){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,22);g.fill()}
function arrow(x,y,a,b,col=blue,dash=[]){line(x,y,a,b,col,7,dash);const t=Math.atan2(b-y,a-x);line(a,b,a-16*Math.cos(t-.5),b-16*Math.sin(t-.5),col,7);line(a,b,a-16*Math.cos(t+.5),b-16*Math.sin(t+.5),col,7)}
function axis(lo,hi,y,start=120,span=1040){const x=n=>start+(n-lo)*span/(hi-lo);line(start-20,y,start+span+20,y);for(let n=lo;n<=hi;n++){line(x(n),y-8,x(n),y+8,n===0?blue:ink,n===0?5:2);if(hi-lo<=16||n%2===0)text(String(n).replace('-','−'),x(n),y+47,26,ink,'center')}return x}
const titles=['温度計から、数直線へ','大小｜右にある数ほど大きい','移動｜大きい → 右へ','計算｜ひく数の符号を変えてたす','平均｜基準とのちがいをならす'];
window.renderAt=function(raw){const t=Math.max(1,Math.min(29,raw));g.fillStyle='#f6f8fc';g.fillRect(0,0,1280,720);box(35,25,1210,98,'#e8f0fa');text('÷が×に変わる魔法',65,88,42,blue);box(45,147,1190,425,'white');if(t<15){text('18',210,325,50,ink,'center');text('×(−2/3)',1010,325,46,ink,'center');const k=Math.min(1,Math.max(0,(t-3)/6));g.save();g.translate(610,310);g.scale(Math.max(.03,Math.abs(Math.cos(k*Math.PI))),1);box(-205,-65,410,110,'#e8f0fa');text(k<.5?'÷(−4)':'×(−1/4)',0,18,46,blue,'center');g.restore();if(t>=10){text('負の数は2個 → 符号は+',640,483,36,blue,'center')}}else{text('符号は+。絶対値を約分する',640,240,36,blue,'center');const xs=[350,640,930];['18','1','2'].forEach((n,j)=>text(n,xs[j],390,44,ink,'center'));['4','3'].forEach((n,j)=>text(n,j?930:350,518,44,ink,'center'));line(240,437,1040,437,ink,4);text('×',500,390,40,ink,'center');text('×',785,390,40,ink,'center');text('×',640,518,40,ink,'center');const a=Math.min(1,(t-15)/5),b=Math.max(0,Math.min(1,(t-20)/5));if(a>0){line(312,405,312+80*a,350,blue,5);line(903,531,903+58*a,477,blue,5)}if(a===1){text('6',350,327,36,blue,'center');text('1',930,566,36,blue,'center')}if(b>0){line(905,405,905+55*b,351,ink,5,[8,5]);line(323,531,323+58*b,477,ink,5,[8,5])}if(b===1){text('1',930,327,36,ink,'center');text('2',350,566,36,ink,'center')}}text(t<15?'わる数を逆数にして、かけ算にする':'約分してから、残った数をかける',640,643,36,ink,'center');return {time:t};};renderAt(0);</script>
