<!doctype html><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style><canvas width="1280" height="720"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),blue='#1f5fa8',ink='#203348';
function text(s,x,y,size=32,col=ink,align='left'){g.fillStyle=col;g.font=`600 ${size}px "Hiragino Sans",sans-serif`;g.textAlign=align;g.fillText(s,x,y)}
function line(x,y,a,b,col=ink,w=3,dash=[]){g.strokeStyle=col;g.lineWidth=w;g.setLineDash(dash);g.beginPath();g.moveTo(x,y);g.lineTo(a,b);g.stroke();g.setLineDash([])}
function dot(x,y,col=blue,r=10){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function box(x,y,w,h,col='#eef4fb'){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,22);g.fill()}
function arrow(x,y,a,b,col=blue,dash=[]){line(x,y,a,b,col,7,dash);const t=Math.atan2(b-y,a-x);line(a,b,a-16*Math.cos(t-.5),b-16*Math.sin(t-.5),col,7);line(a,b,a-16*Math.cos(t+.5),b-16*Math.sin(t+.5),col,7)}
function axis(lo,hi,y,start=120,span=1040){const x=n=>start+(n-lo)*span/(hi-lo);line(start-20,y,start+span+20,y);for(let n=lo;n<=hi;n++){line(x(n),y-8,x(n),y+8,n===0?blue:ink,n===0?5:2);if(hi-lo<=16||n%2===0)text(String(n).replace('-','−'),x(n),y+47,26,ink,'center')}return x}
const scene0=function(raw){const t=Math.max(1,Math.min(29,raw)),n=t<6?1:t<10?2:t<15?3:t<20?4:5;g.fillStyle='#f6f8fc';g.fillRect(0,0,1280,720);box(35,25,1210,98,'#e8f0fa');text('nが消える数あて',65,88,42,blue);box(45,147,1190,465,'white');const headings=['手順','文字 n','n＝5','n＝−4'],xs=[210,570,850,1090];for(let i=0;i<(t>=24?4:2);i++)text(headings[i],xs[i],203,32,blue,'center');const labels=['最初の数','3倍する','6をたす','3でわる','元の数をひく'],eq=['n','3n','3n+6','n+2','2'],a=[5,15,21,7,2],b=[-4,-12,-6,-2,2],witness=Math.max(0,Math.min(5,Math.floor(t-24)+1));for(let j=0;j<n;j++){const y=265+j*67;box(80,y-38,1120,57,j===4?'#e5f0e8':'#edf3fa');text(labels[j],xs[0],y,29,ink,'center');text(eq[j],xs[1],y,38,ink,'center');if(j<witness&&t>=24){text(String(a[j]),xs[2],y,34,ink,'center');text(String(b[j]).replace('-','−'),xs[3],y,34,ink,'center')}}if(t>=20&&t<24){text('(n+2)−n＝2',900,560,36,blue,'center')}text(t<24?'手順を、1段ずつ文字の式で表す':'5でも−4でも2。文字の式なら、理由まで分かる。',640,665,32,ink,'center');return {time:t,rows:n};};
window.renderAt=function(raw){const t=Math.max(1,Math.min(59,raw));if(t<30){scene0(1+(t-1)*28/29);g.fillStyle='#e8f0fa';g.fillRect(65,38,1150,63);text('1分でわかる 文字式の利用',65,88,42,blue)}else{g.fillStyle='#f6f8fc';g.fillRect(0,0,1280,720);box(35,25,1210,98,'#e8f0fa');text('1分でわかる 文字式の利用',65,88,42,blue);box(45,147,1190,465,'white');text('正六角形を、辺1本ずつ共有する',640,213,36,blue,'center');const n=Math.min(3,1+Math.floor((t-30)/4)),seen=new Set;for(let j=0;j<n;j++){const cx=260+j*Math.sqrt(3)*60,cy=360,pts=Array.from({length:6},(_,k)=>[cx+60*Math.cos(Math.PI/6+k*Math.PI/3),cy+60*Math.sin(Math.PI/6+k*Math.PI/3)]);for(let k=0;k<6;k++){const a=pts[k],b=pts[(k+1)%6],key=[a,b].map(p=>p.map(z=>z.toFixed(3)).join(',')).sort().join('|');if(seen.has(key))continue;seen.add(key);line(...a,...b,j?blue:ink,j?5:3,j?[10,6]:[])}}for(let j=0;j<n;j++){box(700+j*145,280,130,155);text(String(j+1)+'個',765+j*145,330,32,ink,'center');text(String(6+5*j)+'本',765+j*145,398,34,ink,'center')}if(t>=43)text('1個増えるごとに +5本',890,485,32,blue,'center');if(t>=50)text('6+5(n−1)＝5n+1（本）',640,560,44,blue,'center');text('表で規則を見つけ、文字で理由を表す',640,665,34,ink,'center')}return {time:t};};renderAt(0);</script>
