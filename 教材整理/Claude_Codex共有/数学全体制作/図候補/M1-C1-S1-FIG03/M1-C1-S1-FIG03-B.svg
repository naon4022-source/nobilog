<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 435" role="img" aria-label="基準を0とみたちがいを棒で示す（例題2-標準）"><rect width="1000" height="435.0" fill="white" /><svg viewBox="0 0 640 250" width="960" height="375.0" role="img" aria-labelledby="t d" x="20" y="30" data-source-sha256="1c3c654cd14e02018c95916cd683a4e2e0fafd23a6d0f89bbc55e77d48d1bf8b">
<title id="t">目標20ページとのちがい</title>
<desc id="d">読んだページ数を目標20ページとのちがいで表した図。月は26ページで＋6、火は17ページで−3、水は20ページで0。上向きの棒は目標より多い、下向きの斜線の棒は目標より少ない。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222" /></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff" /><line x1="0" y1="0" x2="0" y2="6" stroke="#222" stroke-width="2" /></pattern></defs>
<rect width="640" height="250" fill="#fff" />

<line x1="70" y1="125" x2="600" y2="125" stroke="#222" stroke-width="2.5" />
<text x="66" y="130" font-size="14" text-anchor="end" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222">0</text>
<text x="74" y="147" font-size="14" text-anchor="start" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222">目標20ページ＝0</text>
<rect x="140" y="53" width="60" height="72" fill="#9a9a9a" stroke="#222" stroke-width="1.5" data-diff="6" />
<text x="170" y="45" font-size="18" font-weight="bold" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222">＋6</text>
<text x="170" y="220" font-size="15" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222">月（26ページ）</text>
<rect x="290" y="125" width="60" height="36" fill="url(#hatch)" stroke="#222" stroke-width="1.5" data-diff="-3" />
<text x="320" y="183" font-size="18" font-weight="bold" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222">−3</text>
<text x="320" y="220" font-size="15" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222">火（17ページ）</text>
<line x1="440" y1="125" x2="500" y2="125" stroke="#222" stroke-width="5" data-diff="0" />
<text x="470" y="115" font-size="18" font-weight="bold" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222">0</text>
<text x="470" y="220" font-size="15" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222">水（20ページ）</text>
</svg></svg>