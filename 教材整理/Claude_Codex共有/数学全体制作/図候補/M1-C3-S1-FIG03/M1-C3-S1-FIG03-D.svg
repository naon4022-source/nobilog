<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">移項は「両辺に同じ数をたす」を短く書いたものであることを、2列の式で対応させる</title><desc id="desc">左は両辺に7をたす書き方、右は移項の書き方。どちらも5x＝25になる。移項では、左辺の−7が符号を変えて右辺の+7になる。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#222"/></marker></defs><rect width="1000" height="700" fill="white"/><g fill="#222" font-family="system-ui,sans-serif">
<rect x="36" y="41" width="930" height="620" rx="18" fill="#ddd"/>
<rect x="30" y="30" width="930" height="620" rx="18" fill="white" stroke="#222"/>
<line x1="500" y1="70" x2="500" y2="620" stroke="#222" stroke-width="2" stroke-dasharray="6 6"/>
<text x="265" y="100" font-size="32" text-anchor="middle" >両辺に7をたす</text>
<text x="745" y="100" font-size="32" text-anchor="middle" >移項</text>
<text x="265" y="210" font-size="34" text-anchor="middle" data-col="0" data-stage="0">5x−7＝18</text>
<line x1="265" y1="230" x2="265" y2="340" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="265" y="385" font-size="34" text-anchor="middle" data-col="0" data-stage="1">5x−7+7＝18+7</text>
<line x1="265" y1="405" x2="265" y2="460" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="265" y="505" font-size="34" text-anchor="middle" data-col="0" data-stage="2">5x＝25</text>
<line x1="265" y1="525" x2="265" y2="560" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="265" y="605" font-size="34" text-anchor="middle" data-col="0" data-stage="3">x＝5</text>
<text x="745" y="210" font-size="34" text-anchor="middle" data-col="1" data-stage="0">5x−7＝18</text>
<text x="745" y="385" font-size="34" text-anchor="middle" data-col="1" data-stage="1">5x＝18+7</text>
<line x1="745" y1="405" x2="745" y2="460" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="745" y="505" font-size="34" text-anchor="middle" data-col="1" data-stage="2">5x＝25</text>
<line x1="745" y1="525" x2="745" y2="560" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="745" y="605" font-size="34" text-anchor="middle" data-col="1" data-stage="3">x＝5</text>
<path d="M720 220 C920 235 930 310 797 345" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arrow)" data-transfer="true"/>
<text x="785" y="280" font-size="28" text-anchor="middle" >符号が変わる</text>
</g></svg>
