<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">x に順に数を入れて、左辺と右辺が等しくなる値（解）を見つける表</title><desc id="desc">xに1から6を入れた表。左辺と右辺が等しくなるのはxが4のときだけで、どちらも7になる。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#222"/></marker></defs><rect width="1000" height="700" fill="white"/><g fill="#222" font-family="system-ui,sans-serif">
<rect x="30" y="30" width="930" height="620" rx="18" fill="white" stroke="#222"/>
<text x="150" y="95" font-size="32" text-anchor="middle" >x</text>
<text x="405" y="95" font-size="32" text-anchor="middle" >左辺 3x−5</text>
<text x="655" y="95" font-size="32" text-anchor="middle" >右辺 x+3</text>
<text x="865" y="95" font-size="32" text-anchor="middle" >等しい？</text>
<g data-row="1">
<text x="150" y="155" font-size="36" text-anchor="middle" data-col="0">1</text>
<text x="405" y="155" font-size="36" text-anchor="middle" data-col="1">−2</text>
<text x="655" y="155" font-size="36" text-anchor="middle" data-col="2">4</text>
</g>
<line x1="70" y1="183" x2="930" y2="183" stroke="#222" stroke-width="2" stroke-dasharray="2 4"/>
<g data-row="2">
<text x="150" y="240" font-size="36" text-anchor="middle" data-col="0">2</text>
<text x="405" y="240" font-size="36" text-anchor="middle" data-col="1">1</text>
<text x="655" y="240" font-size="36" text-anchor="middle" data-col="2">5</text>
</g>
<line x1="70" y1="268" x2="930" y2="268" stroke="#222" stroke-width="2" stroke-dasharray="2 4"/>
<g data-row="3">
<text x="150" y="325" font-size="36" text-anchor="middle" data-col="0">3</text>
<text x="405" y="325" font-size="36" text-anchor="middle" data-col="1">4</text>
<text x="655" y="325" font-size="36" text-anchor="middle" data-col="2">6</text>
</g>
<line x1="70" y1="353" x2="930" y2="353" stroke="#222" stroke-width="2" stroke-dasharray="2 4"/>
<rect x="65" y="365" width="870" height="70" rx="8" fill="#eee" stroke="#222" stroke-width="4" data-equal-row="4"/>
<g data-row="4">
<text x="150" y="410" font-size="36" text-anchor="middle" data-col="0">4</text>
<text x="405" y="410" font-size="36" text-anchor="middle" data-col="1">7</text>
<text x="655" y="410" font-size="36" text-anchor="middle" data-col="2">7</text>
<text x="865" y="410" font-size="36" text-anchor="middle" data-col="3">○</text>
</g>
<g data-row="5">
<text x="150" y="495" font-size="36" text-anchor="middle" data-col="0">5</text>
<text x="405" y="495" font-size="36" text-anchor="middle" data-col="1">10</text>
<text x="655" y="495" font-size="36" text-anchor="middle" data-col="2">8</text>
</g>
<line x1="70" y1="523" x2="930" y2="523" stroke="#222" stroke-width="2" stroke-dasharray="2 4"/>
<g data-row="6">
<text x="150" y="580" font-size="36" text-anchor="middle" data-col="0">6</text>
<text x="405" y="580" font-size="36" text-anchor="middle" data-col="1">13</text>
<text x="655" y="580" font-size="36" text-anchor="middle" data-col="2">9</text>
</g>
<line x1="70" y1="608" x2="930" y2="608" stroke="#222" stroke-width="2" stroke-dasharray="2 4"/>
</g></svg>
