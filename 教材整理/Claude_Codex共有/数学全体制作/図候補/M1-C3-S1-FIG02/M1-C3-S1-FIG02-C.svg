<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">等式の性質を、てんびんの両方から同じ重さを取る動きで示す</title><desc id="desc">上のてんびんは、箱xと30gが80gとつりあう。両方から30gを取ると、下のてんびんで箱xと50gがつりあう。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#222"/></marker></defs><rect width="1000" height="700" fill="white"/><g fill="#222" font-family="system-ui,sans-serif">
<rect x="30" y="30" width="930" height="620" rx="18" fill="white" stroke="#222"/>
<text x="500" y="75" font-size="34" text-anchor="middle" >両方から30gを取る</text>
<g data-row="0">
<line x1="180" y1="220" x2="820" y2="220" stroke="#222" stroke-width="2" data-beam="true"/>
<path d="M500 220 L475 310 H525 Z" fill="white" stroke="#222"/>
<line x1="290" y1="220" x2="290" y2="240" stroke="#222" stroke-width="2" />
<line x1="190" y1="240" x2="390" y2="240" stroke="#222" stroke-width="2" />
<line x1="710" y1="220" x2="710" y2="240" stroke="#222" stroke-width="2" />
<line x1="610" y1="240" x2="810" y2="240" stroke="#222" stroke-width="2" />
<rect x="200" y="120" width="100" height="100" fill="white" stroke="#222"/>
<text x="250" y="182" font-size="40" text-anchor="middle" >x</text>
<rect x="320" y="140" width="100" height="80" fill="white" stroke="#222"/>
<text x="370" y="192" font-size="32" text-anchor="middle" data-weight="30">30g</text>
<rect x="660" y="120" width="120" height="100" fill="white" stroke="#222"/>
<text x="720" y="182" font-size="36" text-anchor="middle" data-weight="80">80g</text>
</g>
<g data-row="1">
<line x1="180" y1="520" x2="820" y2="520" stroke="#222" stroke-width="2" data-beam="true"/>
<path d="M500 520 L475 610 H525 Z" fill="white" stroke="#222"/>
<line x1="290" y1="520" x2="290" y2="540" stroke="#222" stroke-width="2" />
<line x1="190" y1="540" x2="390" y2="540" stroke="#222" stroke-width="2" />
<line x1="710" y1="520" x2="710" y2="540" stroke="#222" stroke-width="2" />
<line x1="610" y1="540" x2="810" y2="540" stroke="#222" stroke-width="2" />
<rect x="240" y="420" width="100" height="100" fill="white" stroke="#222"/>
<text x="290" y="482" font-size="40" text-anchor="middle" >x</text>
<rect x="660" y="420" width="120" height="100" fill="white" stroke="#222"/>
<text x="720" y="482" font-size="36" text-anchor="middle" data-weight="50">50g</text>
</g>
<line x1="290" y1="280" x2="290" y2="395" stroke="#222" stroke-width="2" marker-end="url(#arrow)" data-remove="30"/>
<text x="190" y="350" font-size="32" text-anchor="middle" >−30g</text>
<line x1="710" y1="280" x2="710" y2="395" stroke="#222" stroke-width="2" marker-end="url(#arrow)" data-remove="30"/>
<text x="810" y="350" font-size="32" text-anchor="middle" >−30g</text>
<text x="500" y="642" font-size="32" text-anchor="middle" >x+30＝80 → x＝50</text>
<rect x="120" y="315" width="140" height="45" rx="7" fill="none" stroke="#222" stroke-dasharray="7 6"/><rect x="740" y="315" width="140" height="45" rx="7" fill="none" stroke="#222" stroke-dasharray="7 6"/>
</g></svg>
