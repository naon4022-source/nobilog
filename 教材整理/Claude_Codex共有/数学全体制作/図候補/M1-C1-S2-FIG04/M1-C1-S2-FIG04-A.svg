<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<title id="title">負×負が正になる理由を、かける数を1ずつ減らす表で示す</title><desc id="desc">(−3)×3＝−9から、かける数を1ずつ減らすと答えは3ずつ増え、(−3)×(−1)＝3、(−3)×(−2)＝6になる。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#222"/></marker></defs><rect width="1000" height="700" fill="white"/><g font-family="system-ui,sans-serif" fill="#222">
<rect x="35" y="35" width="790" height="75" rx="12" fill="white" stroke="#222" stroke-width="2" />
<text x="70" y="82" font-size="36" text-anchor="start" data-multiplier="3">(−3)×3</text>
<text x="555" y="82" font-size="36" text-anchor="start" data-product="-9">＝−9</text>
<line x1="855" y1="90" x2="855" y2="142" stroke="#222" stroke-width="2" marker-end="url(#arrow)" data-increment="3"/>
<text x="880" y="130" font-size="30" text-anchor="start" >+3</text>
<rect x="35" y="130" width="790" height="75" rx="12" fill="white" stroke="#222" stroke-width="2" />
<text x="70" y="177" font-size="36" text-anchor="start" data-multiplier="2">(−3)×2</text>
<text x="555" y="177" font-size="36" text-anchor="start" data-product="-6">＝−6</text>
<line x1="855" y1="185" x2="855" y2="237" stroke="#222" stroke-width="2" marker-end="url(#arrow)" data-increment="3"/>
<text x="880" y="225" font-size="30" text-anchor="start" >+3</text>
<rect x="35" y="225" width="790" height="75" rx="12" fill="white" stroke="#222" stroke-width="2" />
<text x="70" y="272" font-size="36" text-anchor="start" data-multiplier="1">(−3)×1</text>
<text x="555" y="272" font-size="36" text-anchor="start" data-product="-3">＝−3</text>
<line x1="855" y1="280" x2="855" y2="332" stroke="#222" stroke-width="2" marker-end="url(#arrow)" data-increment="3"/>
<text x="880" y="320" font-size="30" text-anchor="start" >+3</text>
<rect x="35" y="320" width="790" height="75" rx="12" fill="white" stroke="#222" stroke-width="2" />
<text x="70" y="367" font-size="36" text-anchor="start" data-multiplier="0">(−3)×0</text>
<text x="555" y="367" font-size="36" text-anchor="start" data-product="0">＝0</text>
<line x1="855" y1="375" x2="855" y2="427" stroke="#222" stroke-width="2" marker-end="url(#arrow)" data-increment="3"/>
<text x="880" y="415" font-size="30" text-anchor="start" >+3</text>
<rect x="35" y="415" width="790" height="75" rx="12" fill="white" stroke="#222" stroke-width="2" />
<text x="70" y="462" font-size="36" text-anchor="start" data-multiplier="-1">(−3)×(−1)</text>
<text x="555" y="462" font-size="36" text-anchor="start" data-product="3">＝3</text>
<line x1="855" y1="470" x2="855" y2="522" stroke="#222" stroke-width="2" marker-end="url(#arrow)" data-increment="3"/>
<text x="880" y="510" font-size="30" text-anchor="start" >+3</text>
<rect x="35" y="510" width="790" height="75" rx="12" fill="white" stroke="#222" stroke-width="2" />
<text x="70" y="557" font-size="36" text-anchor="start" data-multiplier="-2">(−3)×(−2)</text>
<text x="555" y="557" font-size="36" text-anchor="start" data-product="6">＝6</text>
<text x="500" y="675" font-size="32" text-anchor="middle" >3ずつ増える</text>
</g></svg>