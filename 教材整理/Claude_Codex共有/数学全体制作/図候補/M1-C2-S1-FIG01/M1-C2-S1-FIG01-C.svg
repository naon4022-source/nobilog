<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">代金 5x+120 を、同じ長さの帯5つと別の帯1つで示すテープ図</title><desc id="desc">パン1個の値段 x 円の帯が5つならび、その右に牛乳120円の帯がある。5つ分で5x円、全体で5x+120円。</desc><rect width="1000" height="700" fill="white"/><g font-family="system-ui,sans-serif" fill="#222">
<rect x="100" y="260" width="120" height="130" fill="white" stroke="#222" stroke-width="2" data-band="0"/>
<text x="160.0" y="338" font-size="40" text-anchor="middle" data-cost="0">x</text>
<rect x="220" y="260" width="120" height="130" fill="white" stroke="#222" stroke-width="2" data-band="1"/>
<text x="280.0" y="338" font-size="40" text-anchor="middle" data-cost="1">x</text>
<rect x="340" y="260" width="120" height="130" fill="white" stroke="#222" stroke-width="2" data-band="2"/>
<text x="400.0" y="338" font-size="40" text-anchor="middle" data-cost="2">x</text>
<rect x="460" y="260" width="120" height="130" fill="white" stroke="#222" stroke-width="2" data-band="3"/>
<text x="520.0" y="338" font-size="40" text-anchor="middle" data-cost="3">x</text>
<rect x="580" y="260" width="120" height="130" fill="white" stroke="#222" stroke-width="2" data-band="4"/>
<text x="640.0" y="338" font-size="40" text-anchor="middle" data-cost="4">x</text>
<rect x="700" y="260" width="180" height="130" fill="white" stroke="#222" stroke-width="2" data-band="5"/>
<text x="790.0" y="338" font-size="40" text-anchor="middle" data-cost="5">120</text>
<path d="M100 245 v-18 H700 v18" stroke="#222" fill="none" stroke-width="2" data-bracket="5x"/><text x="400.0" y="200" font-size="34" text-anchor="middle" >5x</text>
<path d="M100 405 v18 H880 v-18" stroke="#222" fill="none" stroke-width="2" data-bracket="5x+120"/><text x="490.0" y="470" font-size="34" text-anchor="middle" >5x+120</text>
<text x="400" y="160" font-size="36" text-anchor="middle" >パン</text>
<text x="790" y="215" font-size="36" text-anchor="middle" >牛乳</text>
<text x="500" y="550" font-size="32" text-anchor="middle" >円</text>
<text x="500" y="605" font-size="28" text-anchor="middle" >帯の長さから120とxの大小は読めません</text>
<rect x="45" y="60" width="910" height="590" rx="18" fill="none" stroke="#222" stroke-dasharray="7 5"/>
</g></svg>