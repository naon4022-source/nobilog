<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">分配法則 5(2x+3)＝10x+15 を、長方形の面積で示す</title><desc id="desc">たて5、横2x+3の長方形。左の部分の面積は10x、右の部分は15。全体は10x+15。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#222"/></marker></defs><rect width="1000" height="700" fill="white"/><g font-family="system-ui,sans-serif" fill="#222">
<rect x="31" y="31" width="940" height="650" rx="16" fill="#ddd"/>
<rect x="25" y="25" width="940" height="650" rx="16" fill="white" stroke="#222"/>
<rect x="160" y="220" width="700" height="240" fill="white" stroke="#222" stroke-width="3" data-area="all"/><line x1="610" y1="220" x2="610" y2="460" stroke="#222" stroke-width="3" data-split="true"/>
<text x="385" y="170" font-size="40" text-anchor="middle" >2x</text>
<text x="735" y="170" font-size="40" text-anchor="middle" >3</text>
<text x="110" y="350" font-size="40" text-anchor="middle" >5</text>
<text x="385" y="350" font-size="36" text-anchor="middle" data-area-label="left">5×2x＝10x</text>
<text x="735" y="350" font-size="36" text-anchor="middle" data-area-label="right">5×3＝15</text>
<text x="500" y="560" font-size="40" text-anchor="middle" data-total="true">5(2x+3)＝10x+15</text>
<text x="500" y="630" font-size="28" text-anchor="middle" >長さの比からxの値は読めません</text>
</g></svg>