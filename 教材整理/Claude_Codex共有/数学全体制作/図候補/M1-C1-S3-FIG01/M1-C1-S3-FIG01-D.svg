<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">仮平均からのちがいを、基準線の上下の棒で示す</title>
<desc id="desc">20分を基準にした5人のちがい。−2、+3、0、−3、+7。上と下をならすと基準より1分上になり、平均は21分。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#111"/></marker><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="white"/><path d="M-2 2 L2 -2 M0 9 L9 0 M7 11 L11 7" stroke="#111" stroke-width="1.5"/></pattern></defs><rect width="1000" height="760" fill="white"/><g font-family="system-ui,sans-serif" fill="#111">
<rect x="30" y="26" width="940" height="715" rx="12" fill="#ddd"/>
<rect x="25" y="20" width="940" height="715" rx="12" fill="white" stroke="#bbb"/>
<text x="45" y="65" font-size="34" text-anchor="start">基準20分からのちがい</text>
<text x="45" y="105" font-size="28" text-anchor="start">上向き：灰色　下向き：斜線</text>
<line data-tick="-3" x1="120" x2="910" y1="610" y2="610" stroke="#ddd" stroke-width="1"/>
<text x="90" y="619" font-size="28" text-anchor="end">−3</text>
<line data-tick="-2" x1="120" x2="910" y1="570" y2="570" stroke="#ddd" stroke-width="1"/>
<text x="90" y="579" font-size="28" text-anchor="end">−2</text>
<line data-tick="-1" x1="120" x2="910" y1="530" y2="530" stroke="#ddd" stroke-width="1"/>
<text x="90" y="539" font-size="28" text-anchor="end">−1</text>
<line data-tick="0" x1="120" x2="910" y1="490" y2="490" stroke="#111" stroke-width="3"/>
<text x="90" y="499" font-size="28" text-anchor="end">0</text>
<line data-tick="1" x1="120" x2="910" y1="450" y2="450" stroke="#ddd" stroke-width="1"/>
<text x="90" y="459" font-size="28" text-anchor="end">1</text>
<line data-tick="2" x1="120" x2="910" y1="410" y2="410" stroke="#ddd" stroke-width="1"/>
<text x="90" y="419" font-size="28" text-anchor="end">2</text>
<line data-tick="3" x1="120" x2="910" y1="370" y2="370" stroke="#ddd" stroke-width="1"/>
<text x="90" y="379" font-size="28" text-anchor="end">3</text>
<line data-tick="4" x1="120" x2="910" y1="330" y2="330" stroke="#ddd" stroke-width="1"/>
<text x="90" y="339" font-size="28" text-anchor="end">4</text>
<line data-tick="5" x1="120" x2="910" y1="290" y2="290" stroke="#ddd" stroke-width="1"/>
<text x="90" y="299" font-size="28" text-anchor="end">5</text>
<line data-tick="6" x1="120" x2="910" y1="250" y2="250" stroke="#ddd" stroke-width="1"/>
<text x="90" y="259" font-size="28" text-anchor="end">6</text>
<line data-tick="7" x1="120" x2="910" y1="210" y2="210" stroke="#ddd" stroke-width="1"/>
<text x="90" y="219" font-size="28" text-anchor="end">7</text>
<text x="90" y="185" font-size="28" text-anchor="end">分</text>
<rect data-bar="0" data-difference="-2" x="177" y="490" width="66" height="80" fill="url(#hatch)" stroke="#111" stroke-width="2"/>
<text x="210" y="650" font-size="30" text-anchor="middle">A</text>
<text x="210" y="688" font-size="30" text-anchor="middle">−2</text>
<rect data-bar="1" data-difference="3" x="327" y="370" width="66" height="120" fill="#aaa" stroke="#111" stroke-width="2"/>
<text x="360" y="650" font-size="30" text-anchor="middle">B</text>
<text x="360" y="688" font-size="30" text-anchor="middle">+3</text>
<rect data-bar="2" data-difference="0" x="477" y="490" width="66" height="0" fill="url(#hatch)" stroke="#111" stroke-width="2"/>
<circle cx="510" cy="490" r="5" fill="#111"/>
<text x="510" y="650" font-size="30" text-anchor="middle">C</text>
<text x="510" y="688" font-size="30" text-anchor="middle">0</text>
<rect data-bar="3" data-difference="-3" x="627" y="490" width="66" height="120" fill="url(#hatch)" stroke="#111" stroke-width="2"/>
<text x="660" y="650" font-size="30" text-anchor="middle">D</text>
<text x="660" y="688" font-size="30" text-anchor="middle">−3</text>
<rect data-bar="4" data-difference="7" x="777" y="210" width="66" height="280" fill="#aaa" stroke="#111" stroke-width="2"/>
<text x="810" y="650" font-size="30" text-anchor="middle">E</text>
<text x="810" y="688" font-size="30" text-anchor="middle">+7</text>
<line data-average="1" x1="120" x2="910" y1="450" y2="450" stroke="#111" stroke-width="3" stroke-dasharray="9 7"/>
<text x="45" y="145" font-size="28" text-anchor="start">ちがいの平均 +1（点線）</text>
<text x="560" y="145" font-size="28" text-anchor="start">基準20分＝0</text>
</g></svg>