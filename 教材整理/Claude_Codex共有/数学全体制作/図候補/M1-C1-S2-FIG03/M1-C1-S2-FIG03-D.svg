<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<title id="title">式の項を正の項と負の項に仕分ける（交換・結合法則）</title><desc id="desc">7−12+5−3 の項を正の項と負の項に分ける。正の項は7と5で和は12。負の項は−12と−3で和は−15。12と−15をたして−3。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#222"/></marker></defs><rect width="1000" height="700" fill="white"/><g font-family="system-ui,sans-serif" fill="#222">
<text x="500" y="60" font-size="40" text-anchor="middle" >7−12+5−3</text>
<text x="200" y="150" font-size="36" text-anchor="middle" data-term="7">+7</text>
<path d="M200 170 C200 200 200 220 200 270" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)" data-sort="7" data-sign="1" />
<text x="400" y="150" font-size="36" text-anchor="middle" data-term="-12">−12</text>
<path d="M400 170 C400 200 620 220 620 270" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)" data-sort="-12" data-sign="-1" stroke-dasharray="8 6"/>
<text x="600" y="150" font-size="36" text-anchor="middle" data-term="5">+5</text>
<path d="M600 170 C600 200 380 220 380 270" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)" data-sort="5" data-sign="1" />
<text x="800" y="150" font-size="36" text-anchor="middle" data-term="-3">−3</text>
<path d="M800 170 C800 200 800 220 800 270" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)" data-sort="-3" data-sign="-1" stroke-dasharray="8 6"/>
<rect x="85" y="280" width="380" height="230" rx="12" fill="#ddd"/><rect x="80" y="275" width="380" height="230" rx="12" fill="white" stroke="#222" stroke-width="2" data-box-sign="1"/>
<text x="270" y="320" font-size="32" text-anchor="middle" >正の項の箱</text>
<text x="270" y="390" font-size="40" text-anchor="middle" >+7　+5</text>
<text x="270" y="465" font-size="34" text-anchor="middle" data-sum="12">和 +12</text>
<rect x="545" y="280" width="380" height="230" rx="12" fill="#ddd"/><rect x="540" y="275" width="380" height="230" rx="12" fill="white" stroke="#222" stroke-width="2" data-box-sign="-1"/>
<text x="730" y="320" font-size="32" text-anchor="middle" >負の項の箱</text>
<text x="730" y="390" font-size="40" text-anchor="middle" >−12　−3</text>
<text x="730" y="465" font-size="34" text-anchor="middle" data-sum="-15">和 −15</text>
<text x="500" y="590" font-size="40" text-anchor="middle" data-result="-3">12＋(−15)＝−3</text>
</g></svg>