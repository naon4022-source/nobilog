<script src="../../数学全体制作/メディア/制作ソース/動画エンジン/engine.js"></script><script>window.META={"kind": "V", "chip": "国語・例題", "title": "体験と考えを見分ける", "steps": [{"role": "intro", "text": "きょうは「聞くということ」の例題だよ。いっしょに考えよう！"}, {"role": "problem", "text": "昨日、祖母に昔の遊びを聞いた。最初は話が短かったが、「それでどうなったの？」とたずねると、祖母は目を輝かせて話を続けた。聞き手の一言で、話し手の心は開くのだと思う。"}, {"role": "step", "text": "「〜た」で終わる文をさがす（あったこと）。"}, {"role": "step", "text": "「〜と思う」で終わる文をさがす（考え）。"}, {"role": "step", "text": "体験が、考えのどんな根拠になっているかを言う。"}, {"role": "answer", "text": "体験：「昨日、祖母に…聞いた。」「最初は…話を続けた。」　考え：「聞き手の一言で、話し手の心は開くのだと思う。」　質問したら祖母が話し続けた体験が、考えの根拠になっている。"}, {"role": "point", "text": "文の終わりを見る：「〜た」は体験、「〜と思う・〜だ・〜べきだ」は考え。"}]};</script><script src="../template.js"></script>
