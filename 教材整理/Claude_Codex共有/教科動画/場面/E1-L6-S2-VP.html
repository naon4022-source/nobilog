<script src="../../数学全体制作/メディア/制作ソース/動画エンジン/engine.js"></script><script>window.META={"kind": "VP", "chip": "英語", "title": "Whose / Who 〜? と代名詞", "steps": [{"role": "title", "text": "Whose / Who 〜? と代名詞"}, {"role": "pt", "text": "Whose 〜? は持ち主、Who 〜? は「だれが」。"}, {"role": "pt", "text": "代名詞は「〜は・〜の・〜を・〜のもの」で形が変わる。"}, {"role": "pt", "text": "動詞や with・for の後ろは「〜を」の形（him・her・them）。"}, {"role": "tip", "text": "代名詞の表を、たて（I・my・me・mine）にリズムで唱える。"}, {"role": "caution", "text": "I like he. のように、動詞の後ろに「〜は」の形を使う。"}, {"role": "end", "text": "これでばっちり。練習問題にチャレンジしよう！"}]};</script><script src="../template.js"></script>
