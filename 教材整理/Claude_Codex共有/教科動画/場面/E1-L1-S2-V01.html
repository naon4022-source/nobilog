<script src="../../数学全体制作/メディア/制作ソース/動画エンジン/engine.js"></script><script>window.META={"kind": "V", "chip": "英語・例題", "title": "Are you と Do you の見分け方", "steps": [{"role": "intro", "text": "きょうは「Are you 〜? / Do you 〜?」の例題だよ。いっしょに考えよう！"}, {"role": "problem", "text": "①You are from Kyoto. ②You eat rice."}, {"role": "step", "text": "be動詞（are）か、一般動詞（eat）かを見分ける。"}, {"role": "step", "text": "be動詞なら Are を前へ、一般動詞なら Do を前に置く。"}, {"role": "step", "text": "最後を「?」にする。"}, {"role": "answer", "text": "①Are you from Kyoto?　②Do you eat rice?"}, {"role": "point", "text": "答えには、質問で使った言葉（are / do）をそのまま使う。"}]};</script><script src="../template.js"></script>
