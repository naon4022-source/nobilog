<script src="../../数学全体制作/メディア/制作ソース/動画エンジン/engine.js"></script><script>window.META={"kind": "V", "chip": "国語・例題", "title": "写真の切り取り方で変わる印象", "steps": [{"role": "intro", "text": "きょうは「写真で「事実」を表現する」の例題だよ。いっしょに考えよう！"}, {"role": "problem", "text": "写真A：ごみが一つ落ちている道を、大きく写した写真。写真B：同じ道を、広く写した写真（ほとんどきれいな道）。"}, {"role": "step", "text": "それぞれの写真から受ける印象を書く。"}, {"role": "step", "text": "何が写っていて、何が写っていないかを比べる。"}, {"role": "step", "text": "目的に合う写真はどちらかを考える。"}, {"role": "answer", "text": "A は「ごみの多い道」、B は「きれいな道」という印象を受ける。　A は一部分だけを切り取っているので、道全体の様子は伝わらない。"}, {"role": "point", "text": "写真のまわりを指でかくして、見え方の変化を試す。"}]};</script><script src="../template.js"></script>
