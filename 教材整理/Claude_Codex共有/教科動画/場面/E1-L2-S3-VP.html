<script src="../../数学全体制作/メディア/制作ソース/動画エンジン/engine.js"></script><script>window.META={"kind": "VP", "chip": "英語", "title": "When 〜? と be動詞・一般動詞の整理", "steps": [{"role": "title", "text": "When 〜? と be動詞・一般動詞の整理"}, {"role": "pt", "text": "When is 〜? で「いつ」をたずねる。答えは It's 〜."}, {"role": "pt", "text": "日にちは 1st・2nd・3rd・4th… の形。"}, {"role": "pt", "text": "be動詞と一般動詞は、疑問文・否定文の作り方がちがう。いっしょに使わない。"}, {"role": "tip", "text": "日本語が「〜です」で終わる→be動詞、「〜する」で終わる→一般動詞。"}, {"role": "caution", "text": "I am like 〜. / Are you play 〜? のように二つの動詞をまぜる。"}, {"role": "end", "text": "これでばっちり。練習問題にチャレンジしよう！"}]};</script><script src="../template.js"></script>
