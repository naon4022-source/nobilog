<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="昼間人口と夜間人口の図"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">東京都心の昼間人口と夜間人口</text><rect x="120.0" y="92.0" width="110.0" height="300.0" rx="4" fill="#e07a1f"/><rect x="250.0" y="282.0" width="110.0" height="110.0" rx="4" fill="#1f5fa8"/><text x="175.0" y="417.0" font-size="18" font-weight="800" fill="#e07a1f" text-anchor="middle">昼</text><text x="305.0" y="417.0" font-size="18" font-weight="800" fill="#1f5fa8" text-anchor="middle">夜</text><text x="240.0" y="452.0" font-size="24" font-weight="800" fill="#1d2b3a" text-anchor="middle">都心</text><rect x="520.0" y="242.0" width="110.0" height="150.0" rx="4" fill="#e07a1f"/><rect x="650.0" y="162.0" width="110.0" height="230.0" rx="4" fill="#1f5fa8"/><text x="575.0" y="417.0" font-size="18" font-weight="800" fill="#e07a1f" text-anchor="middle">昼</text><text x="705.0" y="417.0" font-size="18" font-weight="800" fill="#1f5fa8" text-anchor="middle">夜</text><text x="640.0" y="452.0" font-size="24" font-weight="800" fill="#1d2b3a" text-anchor="middle">郊外</text><line x1="80.0" y1="392.0" x2="880.0" y2="392.0" stroke="#1d2b3a" stroke-width="2"/><line x1="660.0" y1="162.0" x2="309.6" y2="162.0" stroke="#8a96a3" stroke-width="4" stroke-linecap="round"/><polygon points="300.0,162.0 310.8,156.8 310.8,167.2" fill="#8a96a3"/><rect x="398.1" y="145.2" width="163.8" height="25.6" rx="8" fill="#fff" stroke="#8a96a3" stroke-width="1.5"/><text x="480.0" y="167.6" font-size="16" font-weight="700" fill="#8a96a3" text-anchor="middle">通勤・通学で都心へ</text><g data-id="b17"><rect x="30.0" y="460.0" width="900.0" height="65.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="480.0" y="495.0" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b17">都心は昼間人口が多く、郊外は夜間人口が多い。政治・経済・文化の機能が東京に集中（一極集中）。</text></g><text x="945.0" y="538.0" font-size="12" font-weight="600" fill="#8a96a3" text-anchor="end">（棒の長さは大小関係だけを表した模式図）</text></svg>
