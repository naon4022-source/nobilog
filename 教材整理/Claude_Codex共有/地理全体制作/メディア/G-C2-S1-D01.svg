<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="世界の気候帯の分布の図"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">世界の気候帯：赤道から両極へ</text><rect x="80.0" y="92.0" width="420.0" height="80.0" rx="0" fill="#e8f4fb" stroke="#c9d6e8" stroke-width="1"/><text x="290.0" y="139.0" font-size="20" font-weight="800" fill="#1d2b3a" text-anchor="middle">寒帯</text><rect x="80.0" y="172.0" width="420.0" height="80.0" rx="0" fill="#c9dcef" stroke="#c9d6e8" stroke-width="1"/><text x="290.0" y="219.0" font-size="20" font-weight="800" fill="#1d2b3a" text-anchor="middle">冷帯</text><rect x="80.0" y="252.0" width="420.0" height="80.0" rx="0" fill="#cfeccf" stroke="#c9d6e8" stroke-width="1"/><text x="290.0" y="299.0" font-size="20" font-weight="800" fill="#1d2b3a" text-anchor="middle">温帯</text><rect x="80.0" y="332.0" width="420.0" height="60.0" rx="0" fill="#f3e2b3" stroke="#c9d6e8" stroke-width="1"/><text x="290.0" y="369.0" font-size="20" font-weight="800" fill="#1d2b3a" text-anchor="middle">乾燥帯</text><rect x="80.0" y="392.0" width="420.0" height="60.0" rx="0" fill="#f7c9b9" stroke="#c9d6e8" stroke-width="1"/><text x="290.0" y="429.0" font-size="20" font-weight="800" fill="#1d2b3a" text-anchor="middle">熱帯</text><line x1="60.0" y1="452.0" x2="520.0" y2="452.0" stroke="#c8414f" stroke-width="3"/><text x="60.0" y="474.0" font-size="16" font-weight="800" fill="#c8414f" text-anchor="start">赤道</text><text x="290.0" y="88.0" font-size="15" font-weight="800" fill="#8a96a3" text-anchor="middle">北極</text><text x="290.0" y="498.5" font-size="16" font-weight="700" fill="#8a96a3" text-anchor="middle">（北半球の模式図。南半球もほぼ同じ順にならぶが、</text><text x="290.0" y="520.1" font-size="16" fon