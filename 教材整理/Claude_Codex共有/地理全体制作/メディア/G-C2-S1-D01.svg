6e8" stroke-width="1.5"/><text x="574.2" y="412.6" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t50">寒帯</text><rect x="608.4" y="380.3" width="160.8" height="59.7" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="688.8" y="413.4" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t51">一年中寒い</text><rect x="769.2" y="380.3" width="160.8" height="59.7" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="849.6" y="413.4" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t52">イヌイット</text><g data-id="b56"><rect x="540.0" y="452.0" width="390.0" height="74.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="735.0" y="480.5" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b56">高床の家：熱帯は湿気をにがす、</text><text x="735.0" y="502.1" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b56">冷帯は凍土をとかさない</text></g><text x="945.0" y="538.0" font-size="12" font-weight="600" fill="#8a96a3" text-anchor="end">（気候帯の並び方の模式図）</text></svg>
