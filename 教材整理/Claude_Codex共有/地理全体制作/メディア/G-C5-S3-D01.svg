fill="#1d2b3a" text-anchor="middle" data-box="b16">太平洋側（三陸など）で、稲が育たない冷害が起こりやすい。対策：</text><text x="480.0" y="472.3" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b16">品種改良で寒さに強い米をつくる。東北は東日本大震災（2011年）からの復興も進める。</text></g><text x="945.0" y="538.0" font-size="12" font-weight="600" fill="#8a96a3" text-anchor="end">（模式図）</text></svg>
