<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="アメリカの農業地域の図"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">アメリカの農業：適地適作（土地に合った作物をつくる）</text><g data-id="b2"><rect x="40.0" y="82.0" width="230.0" height="330.0" rx="14" fill="#fdecee" stroke="#c8414f" stroke-width="3"/><text x="155.0" y="236.9" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">放牧・かんがい農業</text><text x="155.0" y="262.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">（西部・雨が少ない）</text></g><g data-id="b7"><rect x="280.0" y="82.0" width="200.0" height="150.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="380.0" y="159.9" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b7">小麦</text></g><g data-id="b11"><rect x="280.0" y="242.0" width="200.0" height="170.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="380.0" y="329.9" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b11">放牧・小麦</text></g><g data-id="b15"><rect x="490.0" y="82.0" width="200.0" height="160.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="590.0" y="164.3" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b15">とうもろこし・大豆</text></g><g data-id="b19"><rect x="490.0" y="252.0" width="200.0" height="160.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="590.0" y="334.9" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b19">綿花</text></g><g data-id="b23"><rect x="700.0" y="82.0" width="230.0" height="160.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="815.0" y="164.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b23">酪農（五大湖の周辺）</text></g><g data-id="b27"><rect x="700.0" y="252.0" width="230.0" height="160.0" rx="14" fill="#ffffff" stroke="#8a96a3" stroke-width="3"/><text x="815.0" y="334.9" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b27">果樹・野菜など</text></g><line x1="275.0" y1="72.0" x2="275.0" y2="422.0" stroke="#c8414f" stroke-width="4" stroke-dasharray="10 7"/><text x="275.0" y="442.0" font-size="17" font-weight="800" fill="#c8414f" text-anchor="middle">西経100度</text><text x="140.0" y="442.0" font-size="16" font-weight="800" fill="#8a96a3" text-anchor="middle">← 西（雨が少ない）</text><text x="800.0" y="442.0" font-size="16" font-weight="800" fill="#8a96a3" text-anchor="middle">東（雨が多い）→</text><g data-id="b35"><rect x="30.0" y="462.0" width="900.0" height="65.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="480.0" y="497.1" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b35">気候や土地に合わせて地域ごとに作物を決め、大型機械で大規模に生産する（企業的な農業）。</text></g><text x="945.0" y="538.0" font-size="12" font-weight="600" fill="#8a96a3" text-anchor="end">（地域の並びを表した模式図。実際の地図の形ではない）</text></svg>
