<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="時差の図"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">時差：経度15度ごとに1時間ずれる</text><line x1="60.0" y1="182.0" x2="900.0" y2="182.0" stroke="#1d2b3a" stroke-width="3"/><line x1="60.0" y1="172.0" x2="60.0" y2="192.0" stroke="#1d2b3a" stroke-width="2"/><text x="60.0" y="214.0" font-size="15" font-weight="800" fill="#8a96a3" text-anchor="middle">0°</text><line x1="153.3" y1="172.0" x2="153.3" y2="192.0" stroke="#1d2b3a" stroke-width="2"/><text x="153.3" y="214.0" font-size="15" font-weight="800" fill="#8a96a3" text-anchor="middle">15°</text><line x1="246.7" y1="172.0" x2="246.7" y2="192.0" stroke="#1d2b3a" stroke-width="2"/><text x="246.7" y="214.0" font-size="15" font-weight="800" fill="#8a96a3" text-anchor="middle">30°</text><line x1="340.0" y1="172.0" x2="340.0" y2="192.0" stroke="#1d2b3a" stroke-width="2"/><text x="340.0" y="214.0" font-size="15" font-weight="800" fill="#8a96a3" text-anchor="middle">45°</text><line x1="433.3" y1="172.0" x2="433.3" y2="192.0" stroke="#1d2b3a" stroke-width="2"/><text x="433.3" y="214.0" font-size="15" font-weight="800" fill="#8a96a3" text-anchor="middle">60°</text><line x1="526.7" y1="172.0" x2="526.7" y2="192.0" stroke="#1d2b3a" stroke-width="2"/><text x="526.7" y="214.0" font-size="15" font-weight="800" fill="#8a96a3" text-anchor="middle">75°</text><line x1="620.0" y1="172.0" x2="620.0" y2="192.0" stroke="#1d2b3a" stroke-width="2"/><text x="620.0" y="214.0" font-size="15" font-weight="800" fill="#8a96a3" text-anchor="middle">90°</text><line x1="713.3" y1="172.0" x2="713.3" y2="192.0" stroke="#1d2b3a" stroke-width="2"/><text x="713.3" y="214.0" font-size="15" font-weight="800" fill="#8a96a3" text-anchor="middle">105°</text><line x1="806.7" y1="172.0" x2="806.7" y2="192.0" stroke="#1d2b3a" stroke-width="2"/><text x="806.7" y="214.0" font-size="15" font-weight="800" fill="#8a96a3" text-anchor="middle">120°</text><line x1="900.0" y1="172.0" x2="900.0" y2="192.0" stroke="#1d2b3a" stroke-width="2"/><text x="900.0" y="214.0" font-size="15" font-weight="800" fill="#8a96a3" text-anchor="middle">135°</text><circle cx="60.0" cy="182.0" r="10.0" fill="#1f5fa8"/><text x="60.0" y="122.0" font-size="19" font-weight="800" fill="#1f5fa8" text-anchor="start">ロンドン（0度）</text><text x="60.0" y="152.0" font-size="22" font-weight="800" fill="#1f5fa8" text-anchor="start">午前3時</text><circle cx="900.0" cy="182.0" r="10.0" fill="#c8414f"/><text x="900.0" y="122.0" font-size="19" font-weight="800" fill="#c8414f" text-anchor="end">東京（東経135度）</text><text x="900.0" y="152.0" font-size="22" font-weight="800" fill="#c8414f" text-anchor="end">正午</text><line x1="69.6" y1="242.0" x2="890.4" y2="242.0" stroke="#e07a1f" stroke-width="4" stroke-linecap="round"/><polygon points="900.0,242.0 889.2,247.2 889.2,236.8" fill="#e07a1f"/><polygon points="60.0,242.0 70.8,236.8 70.8,247.2" fill="#e07a1f"/><rect x="351.9" y="225.2" width="256.3" height="25.6" rx="8" fill="#fff" stroke="#e07a1f" stroke-width="1.5"/><text x="480.0" y="247.6" font-size="16" font-weight="700" fill="#e07a1f" text-anchor="middle">経度の差 135度 ÷ 15 ＝ 9時間</text><g data-id="b34"><rect x="30.0" y="282.0" width="269.3" height="168.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="282.0" width="269.3" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="321.7" width="269.3" height="8.0" rx="0" fill="#1f5fa8"/><text x="164.7" y="305.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b34">①</text><text x="164.7" y="361.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b34">経度の差を求める（東</text><text x="164.7" y="390.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b34">経どうしは引き算、</text><text x="164.7" y="418.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b34">東経と西経は足し算）</text></g><line x1="303.3" y1="366.0" x2="330.1" y2="366.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="341.3,366.0 328.7,372.1 328.7,359.9" fill="#e07a1f"/><g data-id="b45"><rect x="345.3" y="282.0" width="269.3" height="168.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="345.3" y="282.0" width="269.3" height="47.7" rx="14" fill="#e07a1f"/><rect x="345.3" y="321.7" width="269.3" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="305.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b45">②</text><text x="480.0" y="373.3" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b45">経度の差 ÷ 15</text><text x="480.0" y="408.4" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b45">＝ 時差</text></g><line x1="618.7" y1="366.0" x2="645.5" y2="366.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="656.7,366.0 644.1,372.1 644.1,359.9" fill="#e07a1f"/><g data-id="b55"><rect x="660.7" y="282.0" width="269.3" height="168.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="660.7" y="282.0" width="269.3" height="47.7" rx="14" fill="#2a8a5b"/><rect x="660.7" y="321.7" width="269.3" height="8.0" rx="0" fill="#2a8a5b"/><text x="795.3" y="305.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b55">③</text><text x="795.3" y="373.3" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b55">東にあるほど時刻</text><text x="795.3" y="408.4" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b55">が進んでいる</text></g><g data-id="b63"><rect x="30.0" y="462.0" width="900.0" height="64.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="480.0" y="485.5" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b63">地球は24時間で360度回る → 1時間で15度。日付変更線（ほぼ180度）</text><text x="480.0" y="507.1" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b63">を西から東へこえるときは日付を1日おくらせる。</text></g></svg>
