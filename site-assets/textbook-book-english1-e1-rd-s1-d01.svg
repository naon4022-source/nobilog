<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="物語の流れ"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">英語の物語の流れ（はじめ → 出来事 → 結末）</text><g data-id="b2"><rect x="30.0" y="72.0" width="190.5" height="328.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="72.0" width="190.5" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="111.7" width="190.5" height="8.0" rx="0" fill="#1f5fa8"/><text x="125.2" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">はじめ</text><text x="125.2" y="190.6" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">登場人物と</text><text x="125.2" y="225.7" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">場所をメモ</text><text x="125.2" y="260.8" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">する</text><text x="125.2" y="295.9" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">（Who?</text><text x="125.2" y="331.0" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">Where?）</text></g><line x1="224.5" y1="236.0" x2="251.3" y2="236.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="262.5,236.0 249.9,242.1 249.9,229.9" fill="#e07a1f"/><g data-id="b15"><rect x="266.5" y="72.0" width="190.5" height="328.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="266.5" y="72.0" width="190.5" height="47.7" rx="14" fill="#e07a1f"/><rect x="266.5" y="111.7" width="190.5" height="8.0" rx="0" fill="#e07a1f"/><text x="361.8" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b15">出来事</text><text x="361.8" y="155.5" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b15">過去形</text><text x="361.8" y="190.6" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b15">（walked</text><text x="361.8" y="225.7" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b15">・said）</text><text x="361.8" y="260.8" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b15">で話が進む。</text><text x="361.8" y="295.9" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b15">知らない単</text><text x="361.8" y="331.0" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b15">語は前後か</text><text x="361.8" y="366.1" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b15">ら予想</text></g><line x1="461.0" y1="236.0" x2="487.8" y2="236.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="499.0,236.0 486.4,242.1 486.4,229.9" fill="#e07a1f"/><g data-id="b30"><rect x="503.0" y="72.0" width="190.5" height="328.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="503.0" y="72.0" width="190.5" height="47.7" rx="14" fill="#2a8a5b"/><rect x="503.0" y="111.7" width="190.5" height="8.0" rx="0" fill="#2a8a5b"/><text x="598.2" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b30">結末</text><text x="598.2" y="260.2" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b30">どうなったか</text></g><line x1="697.5" y1="236.0" x2="724.3" y2="236.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="735.5,236.0 722.9,242.1 722.9,229.9" fill="#e07a1f"/><g data-id="b39"><rect x="739.5" y="72.0" width="190.5" height="328.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><rect x="739.5" y="72.0" width="190.5" height="47.7" rx="14" fill="#6a4aa0"/><rect x="739.5" y="111.7" width="190.5" height="8.0" rx="0" fill="#6a4aa0"/><text x="834.8" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b39">ことわざ</text><text x="834.8" y="208.2" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b39">「虎の威を</text><text x="834.8" y="243.3" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b39">借る狐」と</text><text x="834.8" y="278.4" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b39">結末を結び</text><text x="834.8" y="313.5" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b39">つける</text></g><g data-id="b49"><rect x="40.0" y="415.0" width="880.0" height="100.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="480.0" y="468.2" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b49">「虎の威を借る狐」＝強い者の力をかりて、いばる人のたとえ。</text></g></svg>
