<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="ルーペの使い方"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">ルーペの使い方：目に近づけて持ち、動かせる方を動かす</text><rect x="30.0" y="72.0" width="435.0" height="330.0" rx="14" fill="#fff" stroke="#c9d6e8" stroke-width="2"/><text x="247.0" y="107.0" font-size="22" font-weight="800" fill="#1f5fa8" text-anchor="middle">動かせるものを見るとき</text><ellipse cx="110.0" cy="252.0" rx="26.0" ry="16.0" fill="#fff" stroke="#1d2b3a" stroke-width="3"/><circle cx="116.0" cy="252.0" r="8.0" fill="#1d2b3a"/><ellipse cx="165.0" cy="252.0" rx="9.0" ry="48.0" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="160.0" y="298.0" width="10.0" height="50.0" rx="3" fill="#8a5a2b"/><text x="165.0" y="190.0" font-size="16" font-weight="800" fill="#1f5fa8" text-anchor="middle">ルーペ</text><line x1="330.0" y1="262.0" x2="330.0" y2="322.0" stroke="#2a8a5b" stroke-width="5"/><circle cx="330.0" cy="252.0" r="22.0" fill="#f6a5b5" stroke="#c8414f" stroke-width="3"/><circle cx="330.0" cy="252.0" r="7.0" fill="#f6c945"/><line x1="279.6" y1="334.0" x2="380.4" y2="334.0" stroke="#e07a1f" stroke-width="4" stroke-linecap="round"/><polygon points="390.0,334.0 379.2,339.2 379.2,328.8" fill="#e07a1f"/><polygon points="270.0,334.0 280.8,328.8 280.8,339.2" fill="#e07a1f"/><text x="330.0" y="360.0" font-size="18" font-weight="800" fill="#e07a1f" text-anchor="middle">花を動かす</text><text x="247.0" y="392.0" font-size="19" font-weight="800" fill="#1d2b3a" text-anchor="middle">見るものを前後に動かす</text><rect x="495.0" y="72.0" width="435.0" height="330.0" rx="14" fill="#fff" stroke="#c9d6e8" stroke-width="2"/><text x="712.0" y="107.0" font-size="22" font-weight="800" fil