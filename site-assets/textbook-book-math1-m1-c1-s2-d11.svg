<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>かっこのある累乗</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="808.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">(−3)⁴ と −3⁴ は ちがう</text><rect x="60.0" y="170.0" width="700.0" height="600.0" rx="24" fill="white" stroke="#1f5fa8" stroke-width="5"/><rect x="60.0" y="170.0" width="700.0" height="70.0" rx="24" fill="#1f5fa8" stroke="none" stroke-width="4"/><rect x="60.0" y="210.0" width="700.0" height="30.0" rx="0" fill="#1f5fa8" stroke="none" stroke-width="4"/><text x="410.0" y="220.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">(−3)⁴</text><text x="410.0" y="330.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">(−3)×(−3)×(−3)×(−3)</text><text x="410.0" y="440.0" font-size="34" fill="#1f5fa8" text-anchor="middle" font-weight="700">−3 を 4回かける</text><text x="410.0" y="600.0" font-size="70" fill="#1f5fa8" text-anchor="middle" font-weight="900">＝ 81</text><rect x="840.0" y="170.0" width="700.0" height="600.0" rx="24" fill="white" stroke="#e07a1f" stroke-width="5"/><rect x="840.0" y="170.0" width="700.0" height="70.0" rx="24" fill="#e07a1f" stroke="none" stroke-width="4"/><rect x="840.0" y="210.0" width="700.0" height="30.0" rx="0" fill="#e07a1f" stroke="none" stroke-width="4"/><text x="1190.0" y="220.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">−3⁴</text><text x="1190.0" y="330.0" font-size="44" fill="#203348" text-anchor="middle" font-weight="700">−( 3×3×3×3 )</text><text x="1190.0" y="440.0" font-size="34" fill="#e07a1f" text-anchor="middle" font-weight="700">3 だけを 4回かける</text><text x="1190.0" y="600.0" font-size="70" fill="#e07a1f" text-anchor="middle" font-weight="900">＝ −81</text><text x="800.0" y="840.0" font-size="34" fill="#203348" text-anchor="middle" font-weight="700">指数は すぐ左の数（かっこがあれば かっこ全体）にかかる</text></g></svg>