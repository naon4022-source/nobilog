<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="事例と主張の関係"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">言葉がつなぐ世界遺産：問い → 事例 → 答え</text><g data-id="b2"><rect x="150.0" y="72.0" width="660.0" height="100.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="150.0" y="72.0" width="660.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="150.0" y="111.7" width="660.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="480.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">序論（問い）</text><text x="480.0" y="134.6" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">日光の社寺の修復と保存の方法に、イコモスの専門家が驚いた。</text><text x="480.0" y="156.2" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">それはどんな方法か？</text></g><g data-id="b10"><rect x="40.0" y="202.0" width="430.0" height="200.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="40.0" y="202.0" width="430.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="40.0" y="241.7" width="430.0" height="8.0" rx="0" fill="#e07a1f"/><text x="255.0" y="225.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b10">事例1：修復記録の蓄積</text><text x="255.0" y="301.4" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b10">見取り図（実物と同じ大きさ・色）の余白に、</text><text x="255.0" y="325.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b10">筆文字で細かい指示。絵だけでは伝わらない</text><text x="255.0" y="350.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b10">技法や色合いを文字で残す。</text></g><g data-id="b19"><rect x="490.0" y="202.0" width="430.0" height="200.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="490.0" y="202.0" width="430.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="490.0" y="241.7" width="430.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="705.0" y="225.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b19">事例2：世代を超えた技術の伝承</text><text x="705.0" y="301.4" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b19">師匠の澤田さんが弟子の手塚さんに、</text><text x="705.0" y="325.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b19">言葉で丁寧に彩色技術を伝える。</text><text x="705.0" y="350.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b19">江戸時代から続く職人の鎖の一つ。</text></g><line x1="255.0" y1="407.0" x2="410.5" y2="432.4" stroke="#e07a1f" stroke-width="4" stroke-linecap="round"/><polygon points="420.0,434.0 408.5,437.4 410.2,427.1" fill="#e07a1f"/><line x1="705.0" y1="407.0" x2="549.5" y2="432.4" stroke="#e07a1f" stroke-width="4" stroke-linecap="round"/><polygon points="540.0,434.0 549.8,427.1 551.5,437.4" fill="#e07a1f"/><g data-id="b32"><rect x="150.0" y="437.0" width="660.0" height="90.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><rect x="150.0" y="437.0" width="660.0" height="47.7" rx="14" fill="#6a4aa0"/><rect x="150.0" y="476.7" width="660.0" height="8.0" rx="0" fill="#6a4aa0"/><text x="480.0" y="460.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b32">結論（答え）</text><text x="480.0" y="505.4" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b32">絵や文字の記録と、直接の言葉で、技術を伝えてきた。言葉が世界遺産をつなぐ。</text></g></svg>
