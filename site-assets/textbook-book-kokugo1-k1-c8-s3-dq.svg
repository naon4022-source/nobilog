"21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="397.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">考察：（？）。</text></g><g data-id="b19"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b19">推敲の観点</text><text x="346.0" y="233.2" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b19">・</text><text x="367.0" y="233.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">（？）。</text><text x="346.0" y="268.9" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b19">・</text><text x="367.0" y="268.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">数字や名前に誤りがな</text><text x="367.0" y="297.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">いか。</text><text x="346.0" y="332.9" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b19">・</text><text x="367.0" y="332.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">一文が長すぎないか。</text><text x="346.0" y="368.6" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b19">・</text><text x="367.0" y="368.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">出典を示しているか。</text></g><g data-id="b34"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b34">読み合いの仕方</text><text x="652.0" y="230.0" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b34">・</text><text x="673.0" y="230.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b34">よいところ（Plus）</text><text x="673.0" y="258.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b34">・直すとよいところ</text><text x="673.0" y="286.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b34">（Minus）・おもしろ</text><text x="673.0" y="315.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b34">いところ</text><text x="673.0" y="343.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b34">（Interesting）</text><text x="673.0" y="371.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b34">で伝え合う。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
