="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="40.0" y="410.0" width="430.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="40.0" y="449.7" width="430.0" height="8.0" rx="0" fill="#e07a1f"/><text x="255.0" y="433.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b39">音の数は「拍」で数える</text><text x="255.0" y="488.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b39">「きゃ」は1拍。「っ」「ん」「ー」も1拍。</text></g><g data-id="b46"><rect x="490.0" y="410.0" width="430.0" height="110.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="490.0" y="410.0" width="430.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="490.0" y="449.7" width="430.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="705.0" y="433.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b46">季語</text><text x="705.0" y="477.6" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b46">季節を表す言葉。俳句には原則一つ。</text><text x="705.0" y="499.2" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b46">赤い線＝季節を表す言葉</text></g></svg>
