<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="四季のたより 春"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">四季のたより 春：音の数で区切って読む</text><text x="30.0" y="88.0" font-size="18" font-weight="700" fill="#8a96a3" text-anchor="start">和歌（五・七・五・七・七）志貴皇子</text><rect x="28.9" y="102.0" width="140.4" height="56.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="99.1" y="139.0" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle">いわばしる</text><circle cx="99.1" cy="178.0" r="15.0" fill="#1f5fa8"/><text x="99.1" y="184.0" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">5</text><rect x="177.3" y="102.0" width="186.2" height="56.0" rx="10" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="270.4" y="139.0" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle">たるみのうえの</text><circle cx="270.4" cy="178.0" r="15.0" fill="#e07a1f"/><text x="270.4" y="184.0" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">7</text><rect x="371.5" y="102.0" width="140.4" height="56.0" rx="10" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="441.7" y="139.0" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle">さわらびの</text><circle cx="441.7" cy="178.0" r="15.0" fill="#2a8a5b"/><text x="441.7" y="184.0" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">5</text><rect x="375.5" y="152.0" width="132.4" height="5.0" rx="2" fill="#c8414f"/><rect x="519.9" y="102.0" width="209.0" height="56.0" rx="10" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="624.4" y="139.0" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle">もえいずるはるに