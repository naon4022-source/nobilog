<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>1あたりでくらべる</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="852.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">速さも 割合も「わり算で 1あたり」</text><rect x="60.0" y="170.0" width="700.0" height="600.0" rx="24" fill="white" stroke="#1f5fa8" stroke-width="5"/><rect x="60.0" y="170.0" width="700.0" height="70.0" rx="24" fill="#1f5fa8" stroke="none" stroke-width="4"/><rect x="60.0" y="210.0" width="700.0" height="30.0" rx="0" fill="#1f5fa8" stroke="none" stroke-width="4"/><text x="410.0" y="220.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">速さ</text><text x="410.0" y="320.0" font-size="48" fill="#203348" text-anchor="middle" font-weight="800">道のり ÷ 時間</text><text x="410.0" y="400.0" font-size="30" fill="#1f5fa8" text-anchor="middle" font-weight="700">＝ 1分（1時間）あたりの道のり</text><rect x="130.0" y="500.0" width="100.0" height="90.0" rx="6" fill="#8ec1ec" stroke="#203348" stroke-width="2"/><text x="180.0" y="555.0" font-size="26" fill="#203348" text-anchor="middle" font-weight="700">1分</text><rect x="242.0" y="500.0" width="100.0" height="90.0" rx="6" fill="#e6eef8" stroke="#203348" stroke-width="2"/><text x="292.0" y="555.0" font-size="26" fill="#203348" text-anchor="middle" font-weight="700">1分</text><rect x="354.0" y="500.0" width="100.0" height="90.0" rx="6" fill="#e6eef8" stroke="#203348" stroke-width="2"/><text x="404.0" y="555.0" font-size="26" fill="#203348" text-anchor="middle" font-weight="700">1分</text><rect x="466.0" y="500.0" width="100.0" height="90.0" rx="6" fill="#e6eef8" stroke="#203348" stroke-width="2"/><text x="516.0" y="555.0" font-size="26" fill="#203348" text-anchor="middle" font-weight="700">1分</text><rect x="578.0" y="500.0" width="100.0" height="90.0" rx="6" fill="#e6eef8" stroke="#203348" stroke-width="2"/><text x="628.0" y="555.0" font-size="26" fill="#203348" text-anchor="middle" font-weight="700">1分</text><text x="410.0" y="660.0" font-size="32" fill="#203348" text-anchor="middle" font-weight="700">1つ分の道のりでくらべる</text><rect x="840.0" y="170.0" width="700.0" height="600.0" rx="24" fill="white" stroke="#e07a1f" stroke-width="5"/><rect x="840.0" y="170.0" width="700.0" height="70.0" rx="24" fill="#e07a1f" stroke="none" stroke-width="4"/><rect x="840.0" y="210.0" width="700.0" height="30.0" rx="0" fill="#e07a1f" stroke="none" stroke-width="4"/><text x="1190.0" y="220.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">割合</text><text x="1190.0" y="320.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="800">くらべる量 ÷ もとにする量</text><text x="1190.0" y="400.0" font-size="30" fill="#e07a1f" text-anchor="middle" font-weight="700">＝ もとにする量を 1 とみた大きさ</text><rect x="920.0" y="500.0" width="400.0" height="70.0" rx="0" fill="#f6dcb8" stroke="#203348" stroke-width="2"/><text x="1120.0" y="546.0" font-size="34" fill="#203348" text-anchor="middle" font-weight="700">1</text><rect x="920.0" y="590.0" width="520.0" height="70.0" rx="0" fill="#f2c48d" stroke="#203348" stroke-width="2"/><text x="1180.0" y="636.0" font-size="34" fill="#203348" text-anchor="middle" font-weight="700">1.3</text><text x="1190.0" y="720.0" font-size="32" fill="#203348" text-anchor="middle" font-weight="700">1 にあたる量でくらべる</text></g></svg>