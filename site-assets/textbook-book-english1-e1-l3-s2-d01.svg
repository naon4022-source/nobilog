<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="did ともとの形"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">did が出てくると、動詞はもとの形にもどる</text><rect x="60.0" y="102.0" width="49.2" height="58.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="84.6" y="141.1" font-size="28" font-weight="700" fill="#1d2b3a" text-anchor="middle">I</text><rect x="123.2" y="102.0" width="95.2" height="58.0" rx="10" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="170.8" y="141.1" font-size="28" font-weight="700" fill="#1d2b3a" text-anchor="middle">went</text><rect x="232.4" y="102.0" width="211.7" height="58.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="338.3" y="141.1" font-size="28" font-weight="700" fill="#1d2b3a" text-anchor="middle">to the park.</text><rect x="60.0" y="212.0" width="49.2" height="58.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="84.6" y="251.1" font-size="28" font-weight="700" fill="#1d2b3a" text-anchor="middle">I</text><rect x="123.2" y="212.0" width="127.8" height="58.0" rx="10" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="187.1" y="251.1" font-size="28" font-weight="700" fill="#1d2b3a" text-anchor="middle">didn&#x27;t</text><rect x="265.1" y="212.0" width="62.6" height="58.0" rx="10" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="296.4" y="251.1" font-size="28" font-weight="700" fill="#1d2b3a" text-anchor="middle">go</text><rect x="341.7" y="212.0" width="211.7" height="58.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="447.5" y="251.1" font-size="28" font-weight="700" fill="#1d2b3a" text-anchor="middle">to the park.</text><rect x="60.0" y="322.0" width="81.8" height="58.0" rx="10" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="100.9" y="361.1" font-size="28" font-weight="700" fill="#1d2b3a" text-anchor="middle">Did</text><rect x="155.8" y="322.0" width="78.9" height="58.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="195.3" y="361.1" font-size="28" font-weight="700" fill="#1d2b3a" text-anchor="middle">you</text><rect x="248.8" y="322.0" width="62.6" height="58.0" rx="10" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="280.1" y="361.1" font-size="28" font-weight="700" fill="#1d2b3a" text-anchor="middle">go</text><rect x="325.4" y="322.0" width="211.7" height="58.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="431.2" y="361.1" font-size="28" font-weight="700" fill="#1d2b3a" text-anchor="middle">to the park?</text><text x="700.0" y="267.0" font-size="22" font-weight="800" fill="#2a8a5b" text-anchor="middle">went → go（もとの形）</text><g data-id="b25"><rect x="620.0" y="102.0" width="300.0" height="90.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="770.0" y="135.3" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b25">Yes, I did.</text><text x="770.0" y="165.0" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b25">No, I didn&#x27;t.</text></g><g data-id="b30"><rect x="40.0" y="410.0" width="880.0" height="110.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><rect x="40.0" y="410.0" width="880.0" height="47.7" rx="14" fill="#6a4aa0"/><rect x="40.0" y="449.7" width="880.0" height="8.0" rx="0" fill="#6a4aa0"/><text x="480.0" y="433.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b30">be動詞の過去</text><text x="480.0" y="488.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b30">was not（wasn&#x27;t）・were not（weren&#x27;t）、疑問は Was / Were を前に（Were you home?）</text></g></svg>
