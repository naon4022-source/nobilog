<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>対称移動の性質</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="588.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">対称の軸 ℓ で折り返す</text><line x1="800.0" y1="140.0" x2="800.0" y2="800.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round" stroke-dasharray="16 10"/><text x="820.0" y="180.0" font-size="48" fill="#e07a1f" text-anchor="start" font-weight="700" font-style="italic">ℓ</text><polygon points="470.0,250.0 330.0,560.0 620.0,620.0" fill="#8ec1ec" stroke="#203348" stroke-width="5" stroke-linejoin="round"/><polygon points="1130.0,250.0 1270.0,560.0 980.0,620.0" fill="#f6dcb8" stroke="#203348" stroke-width="5" stroke-linejoin="round"/><line x1="470.0" y1="250.0" x2="1130.0" y2="250.0" stroke="#9aa9bb" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/><line x1="635.0" y1="234.0" x2="635.0" y2="266.0" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><line x1="965.0" y1="234.0" x2="965.0" y2="266.0" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><polyline points="822.0,250.0 822.0,228.0 800.0,228.0" fill="none" stroke="#203348" stroke-width="3" stroke-linejoin="round"/><text x="442.0" y="262.0" font-size="42" fill="#203348" text-anchor="end" font-weight="700">A</text><text x="1158.0" y="262.0" font-size="42" fill="#203348" text-anchor="start" font-weight="700">A′</text><line x1="330.0" y1="560.0" x2="1270.0" y2="560.0" stroke="#9aa9bb" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/><line x1="565.0" y1="544.0" x2="565.0" y2="576.0" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><line x1="1035.0" y1="544.0" x2="1035.0" y2="576.0" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><polyline points="822.0,560.0 822.0,538.0 800.0,538.0" fill="none" stroke="#203348" stroke-width="3" stroke-linejoin="round"/><text x="302.0" y="572.0" font-size="42" fill="#203348" text-anchor="end" font-weight="700">B</text><text x="1298.0" y="572.0" font-size="42" fill="#203348" text-anchor="start" font-weight="700">B′</text><line x1="620.0" y1="620.0" x2="980.0" y2="620.0" stroke="#9aa9bb" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/><line x1="710.0" y1="604.0" x2="710.0" y2="636.0" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><line x1="890.0" y1="604.0" x2="890.0" y2="636.0" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><polyline points="822.0,620.0 822.0,598.0 800.0,598.0" fill="none" stroke="#203348" stroke-width="3" stroke-linejoin="round"/><text x="592.0" y="632.0" font-size="42" fill="#203348" text-anchor="end" font-weight="700">C</text><text x="1008.0" y="632.0" font-size="42" fill="#203348" text-anchor="start" font-weight="700">C′</text><text x="800.0" y="860.0" font-size="36" fill="#203348" text-anchor="middle" font-weight="700">対応する点を結ぶ線分は、ℓ と垂直に交わり、ℓ で2等分される</text></g></svg>