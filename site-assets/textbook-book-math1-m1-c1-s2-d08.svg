<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>分配法則の面積図</title><defs><pattern id="part" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M0 20L20 0" stroke="#9ab3cf" stroke-width="3"/></pattern></defs><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348"><rect x="45" y="35" width="1510" height="120" rx="24" fill="#e8f0fa"/><text x="90" y="113" font-size="48" font-weight="700">分配法則を、面積で見る</text><text x="800" y="249" font-size="42" text-anchor="middle">長さは正の数で表す（模式図）</text><rect x="250" y="380" width="517" height="240" fill="url(#part)" stroke="#203348" stroke-width="5"/><rect x="767" y="380" width="583" height="240" fill="white" stroke="#203348" stroke-width="5"/><text x="508" y="340" font-size="50" text-anchor="middle">47</text><text x="1058" y="340" font-size="50" text-anchor="middle">53</text><text x="170" y="518" font-size="50" text-anchor="middle">8</text><rect x="340" y="450" width="338" height="85" rx="15" fill="white"/><text x="508" y="511" font-size="48" text-anchor="middle">8×47</text><text x="1058" y="511" font-size="48" text-anchor="middle">8×53</text><path d="M250 663v27h1100v-27" fill="none" stroke="#1f5fa8" stroke-width="5"/><text x="800" y="753" font-size="48" text-anchor="middle">47+53＝100</text><text x="800" y="849" font-size="40" text-anchor="middle">全体は 8×100。符号は最後につける。</text></g></svg>