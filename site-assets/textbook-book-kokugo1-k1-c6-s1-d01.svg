<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="表現技法の見分け方"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">表現技法の見分け方</text><g data-id="b2"><rect x="30.0" y="72.0" width="218.0" height="300.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="72.0" width="218.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="111.7" width="218.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="139.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">反復</text><text x="44.0" y="220.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">同じ言葉をくり返</text><text x="44.0" y="245.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">す。リズムが生ま</text><text x="44.0" y="271.5" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">れ、印象が強まる</text></g><g data-id="b11"><rect x="260.0" y="72.0" width="218.0" height="300.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="260.0" y="72.0" width="218.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="260.0" y="111.7" width="218.0" height="8.0" rx="0" fill="#e07a1f"/><text x="369.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b11">比喩</text><text x="274.0" y="181.7" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b11">直喩：「〜のよう</text><text x="274.0" y="207.3" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b11">な」を使う</text><text x="274.0" y="233.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b11">隠喩：「〜のよう</text><text x="274.0" y="258.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b11">な」を使わない</text><text x="274.0" y="284.3" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b11">擬人法：人でない</text><text x="274.0" y="309.9" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b11">ものを人のように</text></g><g data-id="b23"><rect x="490.0" y="72.0" width="218.0" height="300.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="490.0" y="72.0" width="218.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="490.0" y="111.7" width="218.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="599.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b23">体言止め</text><text x="504.0" y="233.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">名詞で終わる。</text><text x="504.0" y="258.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">余韻が残る</text></g><g data-id="b31"><rect x="720.0" y="72.0" width="218.0" height="300.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><rect x="720.0" y="72.0" width="218.0" height="47.7" rx="14" fill="#6a4aa0"/><rect x="720.0" y="111.7" width="218.0" height="8.0" rx="0" fill="#6a4aa0"/><text x="829.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b31">倒置</text><text x="734.0" y="233.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b31">語順を入れかえて</text><text x="734.0" y="258.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b31">強調する</text></g><g data-id="b39"><rect x="30.0" y="390.0" width="900.0" height="130.0" rx="14" fill="#fdecee" stroke="#c8414f" stroke-width="3"/><rect x="30.0" y="390.0" width="900.0" height="47.7" rx="14" fill="#c8414f"/><rect x="30.0" y="429.7" width="900.0" height="8.0" rx="0" fill="#c8414f"/><text x="480.0" y="413.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b39">オノマトペ</text><text x="44.0" y="466.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">擬声語（擬音語）：音や声をまねた言葉（ワンワン・ザーザー）</text><text x="44.0" y="491.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">擬態語：様子や状態を表す言葉（きらきら・のろのろ）</text></g></svg>
