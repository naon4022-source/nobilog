<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="地域から世界へ"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">地域から世界へ：取材にもとづく文章の読み方</text><g data-id="b2"><rect x="30.0" y="72.0" width="288.0" height="448.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="72.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="111.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">事実と考えを分ける</text><text x="40.0" y="275.7" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="275.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">人物の言葉（「」）</text><text x="61.0" y="304.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">＝取材で得た事実</text><text x="40.0" y="339.7" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="339.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">「〜だろう」「〜と感</text><text x="61.0" y="368.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">じた」＝筆者の考え</text></g><g data-id="b14"><rect x="336.0" y="72.0" width="288.0" height="448.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="72.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="111.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b14">伝統と新しさ</text>