<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><title>a²と−a²のかっこの範囲</title><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" font-size="40" fill="#203348"><text x="90" y="100" font-size="48">a＝−4｜かっこの範囲を確かめる</text><rect x="65" y="180" width="710" height="570" rx="24" fill="white" stroke="#397052" stroke-width="5"/><rect x="825" y="180" width="710" height="570" rx="24" fill="white" stroke="#386a9a" stroke-width="5"/><text x="420" y="295" text-anchor="middle" font-size="60">a²</text><text x="1180" y="295" text-anchor="middle" font-size="60">−a²</text><rect x="150" y="375" width="540" height="150" rx="20" fill="#e8f2eb" stroke="#397052" stroke-width="4"/><text x="420" y="470" text-anchor="middle">(−4)×(−4)</text><text x="960" y="470" text-anchor="middle" font-size="60">−</text><rect x="1020" y="375" width="425" height="150" rx="20" fill="#edf3fa" stroke="#386a9a" stroke-width="4" stroke-dasharray="12 9"/><text x="1233" y="470" text-anchor="middle">{(−4)×(−4)}</text><text x="420" y="640" text-anchor="middle">負の数を、かっこごと2回かける</text><text x="1180" y="640" text-anchor="middle">外の − は、累乗のあと</text><text x="800" y="850" text-anchor="middle">指数が、どこにかかっているかを見る。</text></g></svg>