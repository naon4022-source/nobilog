<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：森には魔法つかいがいる"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：森には魔法つかいがいる</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">問いと答え</text><text x="40.0" y="166.0" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="166.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">筆者は、自分の疑問</text><text x="61.0" y="194.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（問い）を示し、</text><text x="61.0" y="222.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">調べたり人に教わった</text><text x="61.0" y="251.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">りして答えを見つけて</text><text x="61.0" y="279.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">いく。</text><text x="40.0" y="315.1" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="315.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">問いの文：「（？）」</text><text x="61.0" y="343.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">「（？）」。</text><text x="40.0" y="379.1" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="379.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">答えの文：「〜からで</text><text x="61.0" y="407.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">ある」「〜ということ</text><text x="61.0" y="435.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">がわかった」。</text></g><g data-id="b21"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b21">森・川・海のつながり</text><text x="346.0" y="160.5" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="364.0" y="160.5" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">水に溶けた鉄は、酸素と出</text><text x="364.0" y="184.8" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">会うと粒になって沈むので、</text><text x="364.0" y="209.1" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">海には鉄が少ない。</text><text x="346.0" y="239.7" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="364.0" y="239.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">森の腐葉土で生まれる「フ</text><text x="364.0" y="264.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">ルボ酸」が鉄と結びつくと</text><text x="364.0" y="288.3" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">「フルボ酸鉄」になり、</text><text x="364.0" y="312.6" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">沈まずに川で海へ運ばれる。</text><text x="346.0" y="343.2" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="364.0" y="343.2" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">（？）は鉄を使って育ち、</text><text x="364.0" y="367.5" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">カキのえさになる。だから、</text><text x="364.0" y="391.8" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">豊かな森が豊かな海を支え</text><text x="364.0" y="416.1" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">ている（魔法つかいの正体</text><text x="364.0" y="440.4" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">＝フルボ酸鉄）。</text></g><g data-id="b42"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b42">論理の展開をとらえる</text><text x="652.0" y="226.3" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b42">・</text><text x="673.0" y="226.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">問いが出た順に番号を</text><text x="673.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">つける。</text><text x="652.0" y="290.4" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b42">・</text><text x="673.0" y="290.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">それぞれの答えと、</text><text x="673.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">答えを見つけた方法</text><text x="673.0" y="347.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">（体験・研究者の話・</text><text x="673.0" y="375.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">調査）を表にする。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
