<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="Are と Do の疑問文"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">Are と Do が前に出て疑問文になる</text><text x="40.0" y="102.0" font-size="22" font-weight="800" fill="#1f5fa8" text-anchor="start">be動詞の文</text><rect x="60.0" y="122.0" width="81.8" height="58.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="100.9" y="161.1" font-size="28" font-weight="700" fill="#1d2b3a" text-anchor="middle">You</text><rect x="155.8" y="122.0" width="78.9" height="58.0" rx="10" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="195.3" y="161.1" font-size="28" font-weight="700" fill="#1d2b3a" text-anchor="middle">are</text><rect x="248.8" y="122.0" width="186.1" height="58.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="341.8" y="161.1" font-size="28" font-weight="700" fill="#1d2b3a" text-anchor="middle">a student.</text><rect x="60.0" y="222.0" width="81.8" height="58.0" rx="10" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="100.9" y="261.1" font-size="28" font-weight="700" fill="#1d2b3a" text-anchor="middle">Are</text><rect x="155.8" y="222.0" width="78.9" height="58.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="195.3" y="261.1" font-size="28" font-weight="700" fill="#1d2b3a" text-anchor="middle">you</text><rect x="248.8" y="222.0" width="186.1" height="58.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="341.8" y="261.1" font-size="28" font-weight="700" fill="#1d2b3a" text-anchor="middle">a student?</text><path d="M195,180 C195,202 101,197 101,220" fill="none" stroke="#e07a1f" stroke-width="4"/><text x="60.0" y="322.0" font-size="22" font-weight="700" fill="#2a8a5b" text-anchor="start">Yes, I am. / No, I&#x27;m not.</text><text x="520.0" y="102.0" font-size="22" font-weight="800" fill="#e07a1f" text-anchor="start">一般動詞の文</text><rect x="520.0" y="122.0" width="74.4" height="54.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="557.2" y="157.6" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle">You</text><rect x="608.4" y="122.0" width="85.9" height="54.0" rx="10" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="651.4" y="157.6" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle">play</text><rect x="708.3" y="122.0" width="183.8" height="54.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="800.2" y="157.6" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle">basketball.</text><rect x="520.0" y="222.0" width="60.5" height="54.0" rx="10" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="550.2" y="257.6" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle">Do</text><rect x="594.5" y="222.0" width="71.9" height="54.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="630.4" y="257.6" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle">you</text><rect x="680.4" y="222.0" width="85.9" height="54.0" rx="10" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="723.3" y="257.6" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle">play</text><rect x="780.3" y="222.0" width="183.8" height="54.0" rx="10" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="872.2" y="257.6" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle">basketball?</text><text x="600.0" y="207.0" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start">Do を前に足す</text><text x="520.0" y="322.0" font-size="22" font-weight="700" fill="#2a8a5b" text-anchor="start">Yes, I do. / No, I don&#x27;t.</text><g data-id="b34"><rect x="40.0" y="400.0" width="880.0" height="110.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="480.0" y="458.2" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b34">疑問文の最後は「?」。話すときは、文の終わりを上げて言う。</text></g></svg>
