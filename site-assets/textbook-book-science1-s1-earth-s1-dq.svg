<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：地震のゆれと伝わり方"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：地震のゆれと伝わり方</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">P波とS波</text><text x="40.0" y="151.8" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="151.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">P波：速い（約6〜</text><text x="61.0" y="180.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">8km/s）。初期微動を</text><text x="61.0" y="208.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">起こす。</text><text x="40.0" y="244.2" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="244.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（？）：おそい（約3</text><text x="61.0" y="272.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">〜4km/s）。主要動を</text><text x="61.0" y="300.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">起こす。</text><text x="40.0" y="336.6" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="336.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">初期微動継続時間＝S</text><text x="61.0" y="364.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">波が着いた時刻 −</text><text x="61.0" y="393.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">P波が着いた時刻。</text><text x="61.0" y="421.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">震源からの距離に比例</text><text x="61.0" y="450.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">する。</text></g><g data-id="b22"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b22">震度とマグニチュード</text><text x="346.0" y="212.2" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b22">・</text><text x="367.0" y="212.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">震度：その場所でのゆ</text><text x="367.0" y="240.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">れの大きさ（0〜7、</text><text x="367.0" y="268.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">5と6は強・弱があり</text><text x="367.0" y="297.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">10段階）。</text><text x="346.0" y="332.9" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b22">・</text><text x="367.0" y="332.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">（？）：地震そのもの</text><text x="367.0" y="361.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">の規模（エネルギーの</text><text x="367.0" y="389.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">大きさ）。</text></g><g data-id="b37"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b37">地震が起こるしくみ</text><text x="652.0" y="166.0" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b37">・</text><text x="673.0" y="166.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">日本付近では、海のプ</text><text x="673.0" y="194.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">レートが陸のプレート</text><text x="673.0" y="222.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">の下にしずみこむ。</text><text x="652.0" y="258.4" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b37">・</text><text x="673.0" y="258.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">陸のプレートがひずみ</text><text x="673.0" y="286.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">にたえられず、はね上</text><text x="673.0" y="315.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">がると地震が起こる。</text><text x="652.0" y="350.8" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b37">・</text><text x="673.0" y="350.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">震源は、太平洋側では</text><text x="673.0" y="379.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">浅く、日本海側（大陸</text><text x="673.0" y="407.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">側）に向かって深くな</text><text x="673.0" y="435.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">る。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><defs><radialGradient id="nb1b" cx="35%" cy="25%" r="75%"><stop offset="0" stop-color="#d9f7df"/><stop offset=".55" stop-color="#a9e4b6"/><stop offset="1" stop-color="#7fcf93"/></radialGradient><linearGradient id="nb1l" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4fb562"/><stop offset="1" stop-color="#8be09a"/></linearGradient><radialGradient id="nb1c"><stop offset="0" stop-color="#ff8096" stop-opacity=".75"/><stop offset="1" stop-color="#ff8096" stop-opacity="0"/></radialGradient></defs><g transform="translate(40,520) scale(0.25)"><ellipse cx="0" cy="54" rx="50" ry="9" fill="#285a3c" fill-opacity=".13"/><ellipse cx="-20" cy="46" rx="15" ry="9" fill="#6cbf80" stroke="#3e8f55" stroke-width="3"/><ellipse cx="20" cy="46" rx="15" ry="9" fill="#6cbf80" stroke="#3e8f55" stroke-width="3"/><g transform="rotate(0 0 -44)"><path d="M0,-38 Q2,-54 0,-66" fill="none" stroke="#3e8f55" stroke-width="5" stroke-linecap="round"/><g transform="translate(0,-64) rotate(-54)"><path d="M0,0 C-22,-6 -24,-34 0,-42 C16,-32 12,-8 0,0Z" fill="url(#nb1l)" stroke="#3e8f55" stroke-width="3"/><path d="M0,-3 Q-4,-20 0,-36" fill="none" stroke="#2e7846" stroke-opacity=".55" stroke-width="2"/><ellipse cx="-6" cy="-28" rx="3.5" ry="6" fill="#fff" fill-opacity=".55" transform="rotate(-23 -6 -28)"/></g><g transform="translate(0,-64) rotate(54)"><path d="M0,0 C22,-6 24,-34 0,-42 C-16,-32 -12,-8 0,0Z" fill="url(#nb1l)" stroke="#3e8f55" stroke-width="3"/><path d="M0,-3 Q4,-20 0,-36" fill="none" stroke="#2e7846" stroke-opacity=".55" stroke-width="2"/><ellipse cx="6" cy="-28" rx="3.5" ry="6" fill="#fff" fill-opacity=".55" transform="rotate(23 6 -28)"/><