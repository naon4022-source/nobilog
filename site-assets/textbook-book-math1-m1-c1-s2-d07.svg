<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>かっこの範囲と2乗のちがい</title><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348"><rect x="45" y="35" width="1510" height="120" rx="24" fill="#e8f0fa"/><text x="90" y="113" font-size="48" font-weight="700">(−3)² と −3² のちがい</text><rect x="65" y="205" width="710" height="555" rx="25" fill="white"/><rect x="825" y="205" width="710" height="555" rx="25" fill="white"/><text x="420" y="330" font-size="64" text-anchor="middle"><tspan>(−3)</tspan><tspan dx="24">²</tspan></text><rect x="320.587" y="264.304" width="149.608" height="85.872" rx="14" fill="none" stroke="#1f5fa8" stroke-width="5"/><path d="M420 390V455l-17 -20M420 455l17 -20" stroke="#1f5fa8" stroke-width="6" fill="none"/><text x="420" y="552" font-size="51" text-anchor="middle">(−3)×(−3)</text><rect x="289.994" y="497.696" width="260.012" height="72.413" rx="15" fill="none" stroke="#1f5fa8" stroke-width="5"/><text x="1180" y="330" font-size="64" text-anchor="middle"><tspan>−</tspan><tspan dx="24">3²</tspan></text><rect x="1169.362" y="264.304" width="87.267" height="83.291" rx="14" fill="none" stroke="#397052" stroke-width="5" stroke-dasharray="12 8"/><path d="M1180 390V455l-17 -20M1180 455l17 -20" stroke="#397052" stroke-width="6" fill="none"/><text x="1180" y="552" font-size="51" text-anchor="middle"><tspan>−</tspan><tspan dx="24">(3×3)</tspan></text><rect x="1130.339" y="497.696" width="156.788" height="72.413" rx="15" fill="none" stroke="#397052" stroke-width="5" stroke-dasharray="12 8"/><text x="420" y="680" font-size="40" text-anchor="middle">負の数全体を、2回かける</text><text x="1180" y="680" font-size="40" text-anchor="middle">3の2乗に、−をつける</text><text x="800" y="850" font-size="42" text-anchor="middle">かっこが囲む範囲を、先に確かめよう。</text></g></svg>