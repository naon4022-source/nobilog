<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="練習問題の手がかり：画数と活字の字体"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">練習問題の手がかり：画数と活字の字体</text><rect x="20.0" y="66.0" width="400.0" height="416.0" rx="14" fill="#fff" stroke="#c9d6e8" stroke-width="2"/><text x="40.0" y="98.0" font-size="22" font-weight="800" fill="#1f5fa8" text-anchor="start">考える順番</text><circle cx="52.0" cy="168.7" r="17.0" fill="#e07a1f"/><text x="52.0" y="175.8" font-size="19.549999999999997" font-weight="800" fill="#fff" text-anchor="middle">1</text><g data-id="b6"><rect x="78.0" y="112.0" width="330.0" height="113.3" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="2"/><text x="92.0" y="158.1" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b6">ひと筆で書く線を一画として、</text><text x="92.0" y="185.1" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b6">空中に書きながら数える。</text></g><circle cx="52.0" cy="292.0" r="17.0" fill="#e07a1f"/><text x="52.0" y="299.1" font-size="19.549999999999997" font-weight="800" fill="#fff" text-anchor="middle">2</text><g data-id="b13"><rect x="78.0" y="235.3" width="330.0" height="113.3" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="2"/><text x="92.0" y="294.9" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b13">点も一画と数える。</text></g><circle cx="52.0" cy="415.3" r="17.0" fill="#e07a1f"/><text x="52.0" y="422.5" font-size="19.549999999999997" font-weight="800" fill="#fff" text-anchor="middle">3</text><g data-id="b19"><rect x="78.0" y="358.7" width="330.0" height="113.3" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="2"/><text x="92.0" y="418.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">辞書の総画数で確かめる。</text></g><g data-id="b23"><rect x="432.0" y="66.0" width="508.0" height="416.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="432.0" y="66.0" width="508.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="432.0" y="105.7" width="508.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="686.0" y="89.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b23">かんたんにやる方法</text><text x="442.0" y="250.0" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b23">・</text><text x="463.0" y="250.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">画数は、空中に指で書いて数える。</text><text x="442.0" y="285.7" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b23">・</text><text x="463.0" y="285.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">まよったら漢和辞典で、部首の画数と合わせ</text><text x="463.0" y="314.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">て確かめる。</text><text x="442.0" y="349.8" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b23">・</text><text x="463.0" y="349.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">書き方の手本にするなら教科書体を見る。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">順番どおりに考えてから、練習問題に答えよう。（？）は自分でうめてみよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
