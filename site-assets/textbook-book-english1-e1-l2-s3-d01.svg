<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="be動詞と一般動詞の比べ表"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">be動詞の文と一般動詞の文の作り方</text><rect x="30.0" y="86.0" width="123.1" height="70.0" rx="0" fill="#1f5fa8" stroke="#c9d6e8" stroke-width="1.5"/><rect x="153.1" y="86.0" width="373.7" height="70.0" rx="0" fill="#1f5fa8" stroke="#c9d6e8" stroke-width="1.5"/><text x="340.0" y="124.2" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" data-box="t01">be動詞の文</text><rect x="526.8" y="86.0" width="403.2" height="70.0" rx="0" fill="#1f5fa8" stroke="#c9d6e8" stroke-width="1.5"/><text x="728.4" y="124.2" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" data-box="t02">一般動詞の文</text><rect x="30.0" y="156.0" width="123.1" height="70.0" rx="0" fill="#e8f0fa" stroke="#c9d6e8" stroke-width="1.5"/><text x="91.5" y="193.5" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t10">ふつうの文</text><rect x="153.1" y="156.0" width="373.7" height="70.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="340.0" y="194.2" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t11">You are a student.</text><rect x="526.8" y="156.0" width="403.2" height="70.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="728.4" y="194.2" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t12">You play tennis.</text><rect x="30.0" y="226.0" width="123.1" height="70.0" rx="0" fill="#e8f0fa" stroke="#c9d6e8" stroke-width="1.5"/><text x="91.5" y="264.2" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t20">疑問文</text><rect x="153.1" y="226.0" width="373.7" height="70.0" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="340.0" y="264.2" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t21">Are you a student?</text><rect x="526.8" y="226.0" width="403.2" height="70.0" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="728.4" y="264.2" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t22">Do you play tennis?</text><rect x="30.0" y="296.0" width="123.1" height="70.0" rx="0" fill="#e8f0fa" stroke="#c9d6e8" stroke-width="1.5"/><text x="91.5" y="334.2" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t30">否定文</text><rect x="153.1" y="296.0" width="373.7" height="70.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="340.0" y="334.2" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t31">I am not a student.</text><rect x="526.8" y="296.0" width="403.2" height="70.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="728.4" y="334.2" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t32">I don&#x27;t play tennis.</text><rect x="30.0" y="366.0" width="123.1" height="70.0" rx="0" fill="#e8f0fa" stroke="#c9d6e8" stroke-width="1.5"/><text x="91.5" y="404.2" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t40">作り方</text><rect x="153.1" y="366.0" width="373.7" height="70.0" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="340.0" y="389.3" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t41">疑問：be動詞を前へ／否定：</text><text x="340.0" y="419.0" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t41">後ろに not</text><rect x="526.8" y="366.0" width="403.2" height="70.0" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="728.4" y="389.3" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t42">疑問：Do を前に／否定：</text><text x="728.4" y="419.0" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t42">動詞の前に don&#x27;t</text><g data-id="b33"><rect x="40.0" y="460.0" width="880.0" height="60.0" rx="14" fill="#fdecee" stroke="#c8414f" stroke-width="3"/><text x="480.0" y="493.2" font-size="22" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b33">この節の基本文では、like・playの前にam・are・isを足さない。</text></g></svg>
