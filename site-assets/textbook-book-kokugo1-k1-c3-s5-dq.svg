<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：材料を整理して案内文を書く"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：材料を整理して案内文を書く</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">必ず入れる情報</text><text x="40.0" y="247.3" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="247.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（？）（（？））</text><text x="40.0" y="283.0" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="283.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（？）（いつ）</text><text x="40.0" y="318.7" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（？）（どこで）</text><text x="40.0" y="354.4" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="354.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">内容（何をするか）</text></g><g data-id="b16"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b16">優先順位と配置</text><text x="346.0" y="236.8" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="367.0" y="236.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">必ず伝える情報 →</text><text x="367.0" y="265.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">いちばん目立つ所に。</text><text x="346.0" y="300.9" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="367.0" y="300.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">伝えたほうがよい情報</text><text x="367.0" y="329.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">→ 本文や箇条書きで。</text><text x="346.0" y="364.9" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="367.0" y="364.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">必要ない情報 → 外す。</text></g><g data-id="b30"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b30">読みやすくする工夫</text><text x="652.0" y="208.5" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b30">・</text><text x="673.0" y="208.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b30">見出し・箇条書き・</text><text x="673.0" y="236.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b30">表を使う。</text