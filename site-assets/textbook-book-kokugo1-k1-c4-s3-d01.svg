eight="800" fill="#fff" text-anchor="middle" data-box="b16">森</text><text x="115.0" y="473.2" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b16">落ち葉が積もっ</text><text x="115.0" y="496.2" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b16">て腐葉土に</text></g><line x1="202.0" y1="460.0" x2="206.0" y2="460.0" stroke="#e07a1f" stroke-width="4" stroke-linecap="round"/><polygon points="214.0,460.0 205.0,464.3 205.0,455.7" fill="#e07a1f"/><g data-id="b26"><rect x="216.0" y="400.0" width="170.0" height="120.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="216.0" y="400.0" width="170.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="216.0" y="439.7" width="170.0" height="8.0" rx="0" fill="#e07a1f"/><text x="301.0" y="423.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b26">腐葉土</text><text x="301.0" y="465.4" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b26">フルボ酸が生まれ、</text><text x="301.0" y="484.3" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b26">鉄と結びついてフル</text><text x="301.0" y="503.2" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b26">ボ酸鉄に</text></g><line x1="388.0" y1="460.0" x2="392.0" y2="460.0" stroke="#e07a1f" stroke-width="4" stroke-linecap="round"/><polygon points="400.0,460.0 391.0,464.3 391.0,455.7" fill="#e07a1f"/><g data-id="b37"><rect x="402.0" y="400.0" width="170.0" height="120.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="402.0" y="400.0" width="170.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="402.0" y="439.7" width="170.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="487.0" y="423.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b37">川</text><text x="487.0" y="473.2" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b37">沈まないフルボ</text><text x="487.0" y="496.2"