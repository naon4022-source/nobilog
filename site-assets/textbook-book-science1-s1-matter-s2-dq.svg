<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：気体の性質と集め方"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：気体の性質と集め方</text><g data-id="b2"><rect x="30.0" y="68.0" width="441.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="441.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="441.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="250.5" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">おもな気体</text><text x="40.0" y="162.4" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="162.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">酸素：（？）＋（？）。ものを燃やすはた</text><text x="59.0" y="188.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">らき。（？）。</text><text x="40.0" y="220.3" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="220.3" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（？）：石灰石＋うすい塩酸。</text><text x="59.0" y="246.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">石灰水を白くにごらせる。水上置換法か下</text><text x="59.0" y="271.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">方置換法。</text><text x="40.0" y="303.9" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="303.9" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">水素：亜鉛などの金属＋うすい塩酸。</text><text x="59.0" y="329.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">燃えると水ができる（音を立てて燃える）。</text><text x="59.0" y="355.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">水上置換法。</text><text x="40.0" y="387.5" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="387.5" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">アンモニア：塩化アンモニウム＋水酸化カ</text><text x="59.0" y="413.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">ルシウムを加熱。水にとけやすく、刺激臭、</text><text x="59.0" y="438.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">水溶液はアルカリ性。上方置換法。</text></g><g data-id="b23"><rect x="489.0" y="68.0" width="441.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="489.0" y="68.0" width="441.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="489.0" y="107.7" width="441.0" height="8.0" rx="0" fill="#e07a1f"/><text x="709.5" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b23">集め方の選び方</text><text x="499.0" y="222.7" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b23">・</text><text x="520.0" y="222.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">水にとけにくい → 水上置換法（純粋</text><text x="520.0" y="251.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">な気体が集まる）。</text><text x="499.0" y="286.7" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b23">・</text><text x="520.0" y="286.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">水にとけやすく空気より重い →</text><text x="520.0" y="315.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">下方置換法。</text><text x="499.0" y="350.8" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b23">・</text><text x="520.0" y="350.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">水にとけやすく空気より軽い →</text><text x="520.0" y="379.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">上方置換法。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
