<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：聞くということ"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：聞くということ</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">体験と考えを分ける</text><text x="40.0" y="151.8" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="151.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">体験：いつ・どこで・</text><text x="61.0" y="180.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">だれと・何があったか。</text><text x="61.0" y="208.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">過去の形（（？））</text><text x="61.0" y="236.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">が多い。</text><text x="40.0" y="272.5" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="272.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（？）：「（？）」</text><text x="61.0" y="300.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">「〜ではないか」</text><text x="61.0" y="329.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">「〜が（？）」など、</text><text x="61.0" y="357.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">筆者の判断が出る文。</text><text x="40.0" y="393.3" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="393.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（？）、考えを支える</text><text x="61.0" y="421.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">「根拠」として書かれ</text><text x="61.0" y="450.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">ている。</text></g><g data-id="b22"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="72.0" rx="14" fill="#e07a1f"/><rect x="336.0" y="132.0" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="89.4" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" data-box="b22">「聞く」は「問う」</text><text x="480.0" y="116.4" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" data-box="b22">とつながる</text><text x="346.0" y="187.9" font-size="16" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b22">・</text><text x="362.0" y="187.9" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">「（？）」は、耳を傾けるだ</text><text x="362.0" y="209.5" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">けでなく「問う」ことをとも</text><text x="362.0" y="231.1" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">なう。聞くと疑問がわき、</text><text x="362.0" y="252.7" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">問うと話が広がる。</text><text x="346.0" y="279.9" font-size="16" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b22">・</text><text x="362.0" y="279.9" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">筆者は聞くのが得意だったわ</text><text x="362.0" y="301.5" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">けではない。苦手だからこそ</text><text x="362.0" y="323.1" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">必死になり、相手の話が深く</text><text x="362.0" y="344.7" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">心に入って、自分も元気にな</text><text x="362.0" y="366.3" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">ると気づいた。</text><text x="346.0" y="393.5" font-size="16" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b22">・</text><text x="362.0" y="393.5" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">相手の話と自分の感情の記憶</text><text x="362.0" y="415.1" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">が重なって胸が熱くなる瞬間</text><text x="362.0" y="436.7" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">がある。それが「聞く妙味」。</text></g><g data-id="b44"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b44">筆者の考えのまとめ方</text><text x="652.0" y="226.3" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b44">・</text><text x="673.0" y="226.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">文章の終わりの近くに、</text><text x="673.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">筆者の考えがまとまっ</text><text x="673.0" y="283.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">て書かれることが多い。</text><text x="652.0" y="318.7" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b44">・</text><text x="673.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">「つまり」「だから」</text><text x="673.0" y="347.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">「このように」のあと</text><text x="673.0" y="375.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">に注目する。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
