<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">読書の目標20ページを基準にする</title><desc id="desc">月から水の読書量は26、17、20ページ。目標20ページの線より上をプラス、下をマイナスと示す。各日の差の数は表示しない。</desc><defs><pattern id="stripe" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#6587ac" stroke-width="2"/></pattern></defs><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348"><rect x="45" y="35" width="1510" height="120" rx="25" fill="#e8f0fa"/><text x="90" y="114" font-size="48" font-weight="700">目標を0の基準にすると？</text><rect x="65" y="190" width="1470" height="580" rx="25" fill="white"/><rect x="480" y="254" width="100" height="416" fill="#d5e1ee" stroke="#203348" stroke-width="3"/><text x="530" y="230" font-size="40" text-anchor="middle">26</text><text x="530" y="725" font-size="40" text-anchor="middle">月</text><rect x="480" y="254" width="100" height="96" fill="url(#stripe)" stroke="#1f5fa8" stroke-width="3"/><text x="625" y="314.0" font-size="45">＋</text><rect x="780" y="398" width="100" height="272" fill="#d5e1ee" stroke="#203348" stroke-width="3"/><text x="830" y="230" font-size="40" text-anchor="middle">17</text><text x="830" y="725" font-size="40" text-anchor="middle">火</text><rect x="780" y="350" width="100" height="48" fill="url(#stripe)" stroke="#1f5fa8" stroke-width="3"/><text x="925" y="386.0" font-size="45">−</text><rect x="1080" y="350" width="100" height="320" fill="#d5e1ee" stroke="#203348" stroke-width="3"/><text x="1130" y="230" font-size="40" text-anchor="middle">20</text><text x="1130" y="725" font-size="40" text-anchor="middle">水</text><path d="M270 350H1450" stroke="#203348" stroke-width="5" stroke-dasharray="14 8"/><text x="110" y="325" font-size="40">目標20</text><text x="110" y="370" font-size="40">0の基準</text><path d="M270 670H1450" stroke="#203348" stroke-width="3"/><text x="800" y="838" text-anchor="middle" font-size="40">上なら＋。下なら−。同じなら、ちがいはない。</text></g></svg>