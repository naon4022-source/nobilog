<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="編集の流れ"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">全ては編集されている：編集で受け取り方が変わる</text><g data-id="b2"><rect x="30.0" y="72.0" width="190.5" height="228.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="72.0" width="190.5" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="111.7" width="190.5" height="8.0" rx="0" fill="#1f5fa8"/><text x="125.2" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">選ぶ</text><text x="125.2" y="193.3" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">いらない場</text><text x="125.2" y="228.4" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">面を切る</text></g><line x1="224.5" y1="186.0" x2="251.3" y2="186.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="262.5,186.0 249.9,192.1 249.9,179.9" fill="#e07a1f"/><g data-id="b12"><rect x="266.5" y="72.0" width="190.5" height="228.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="266.5" y="72.0" width="190.5" height="47.7" rx="14" fill="#e07a1f"/><rect x="266.5" y="111.7" width="190.5" height="8.0" rx="0" fill="#e07a1f"/><text x="361.8" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b12">並べる</text><text x="361.8" y="175.7" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b12">順番を決め</text><text x="361.8" y="210.8" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b12">る（入れか</text><text x="361.8" y="245.9" font-size="26" font-weight="700" fill="#1d2