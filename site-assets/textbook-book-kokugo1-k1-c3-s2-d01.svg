47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="359.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="343.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b42">バラエティ</text><text x="40.0" y="420.0" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b42">・</text><text x="61.0" y="420.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">テロップを入れ、</text><text x="61.0" y="448.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">おもしろいやりとりだ</text><text x="61.0" y="476.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b42">けをつなぐ</text></g><g data-id="b52"><rect x="336.0" y="320.0" width="288.0" height="205.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="320.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="359.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="343.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b52">ニュース</text><text x="346.0" y="393.5" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b52">・</text><text x="365.0" y="393.5" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b52">消防学校の原稿：</text><text x="365.0" y="419.1" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b52">技術の披露を先にして興</text><text x="365.0" y="444.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b52">味を引く</text><text x="346.0" y="477.1" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b52">・</text><text x="365.0" y="477.1" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b52">順番を変えても、</text><text x="365.0" y="502.7" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b52">うそではない</text></g><g data-id="b65"><rect x="642.0" y="320.0" width="288.0" height="205.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="320.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="359.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="343.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b65">ドキュメンタリー</text><text x="652.0" y="416.4" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b65">・</text><text x="673.0" y="416.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b65">結婚式＋花＝幸せ</text><text x="652.0" y="452.1" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b65">・</text><text x="673.0" y="452.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b65">結婚式＋嵐の空＝波乱</text><text x="673.0" y="480.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b65">の予感</text></g></svg>
