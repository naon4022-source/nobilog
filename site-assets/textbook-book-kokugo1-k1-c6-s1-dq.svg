<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：河童と蛙"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：河童と蛙</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">オノマトペ</text><text x="40.0" y="166.0" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="166.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">擬声語（擬音語）：</text><text x="61.0" y="194.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">音や声をまねた言葉。</text><text x="61.0" y="222.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">ワンワン・ザーザー・</text><text x="61.0" y="251.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">ぽちゃん。</text><text x="40.0" y="286.7" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="286.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（？）：様子や状態を</text><text x="61.0" y="315.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">表す言葉。きらきら・</text><text x="61.0" y="343.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">のろのろ・しんみり。</text><text x="40.0" y="379.1" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="379.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">音のイメージで、</text><text x="61.0" y="407.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">場面を生き生きと伝え</text><text x="61.0" y="435.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">る。</text></g><g data-id="b21"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b21">表現の技法</text><text x="346.0" y="157.4" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="364.0" y="157.4" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">（？）：同じ言葉をくり返</text><text x="364.0" y="181.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">す。リズムが生まれ、</text><text x="364.0" y="206.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">印象が強まる。</text><text x="346.0" y="236.6" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="364.0" y="236.6" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">比喩：ほかのものにたとえ</text><text x="364.0" y="260.9" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">る。直喩（〜のような）・</text><text x="364.0" y="285.2" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">隠喩（〜のようなを使わな</text><text x="364.0" y="309.5" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">い）・（？）（人でないも</text><text x="364.0" y="333.8" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">のを人のように）。</text><text x="346.0" y="364.4" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="364.0" y="364.4" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">体言止め：名詞で終わる。</text><text x="364.0" y="388.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">余韻が残る。</text><text x="346.0" y="419.3" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="364.0" y="419.3" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">倒置：語順を入れかえて強</text><text x="364.0" y="443.6" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">調する。</text></g><g data-id="b43"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b43">詩の構成と朗読</text><text x="652.0" y="226.3" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b43">・</text><text x="673.0" y="226.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">連（行のまとまり）</text><text x="673.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">ごとに場面や時間の変</text><text x="673.0" y="283.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">化を読む。</text><text x="652.0" y="318.7" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b43">・</text><text x="673.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">朗読では、速さ・</text><text x="673.0" y="347.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">強弱・間を工夫して、</text><text x="673.0" y="375.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">情景を伝える。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
