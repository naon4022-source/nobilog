<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="返り点の読む順番"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">返り点：読む順番に番号をつけると</text><text x="240.0" y="100.0" font-size="22" font-weight="800" fill="#1f5fa8" text-anchor="middle">レ点：すぐ下の一字から上の一字へ返る</text><rect x="60.0" y="112.0" width="80.0" height="80.0" rx="6" fill="#fff" stroke="#c9d6e8" stroke-width="2"/><text x="100.0" y="172.0" font-size="50" font-weight="600" fill="#1d2b3a" text-anchor="middle">開</text><text x="66.0" y="220.0" font-size="22" font-weight="800" fill="#c8414f" text-anchor="start">レ</text><circle cx="100.0" cy="252.0" r="18.0" fill="#e07a1f"/><text x="100.0" y="259.0" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text><rect x="160.0" y="112.0" width="80.0" height="80.0" rx="6" fill="#fff" stroke="#c9d6e8" stroke-width="2"/><text x="200.0" y="172.0" font-size="50" font-weight="600" fill="#1d2b3a" text-anchor="middle">門</text><circle cx="200.0" cy="252.0" r="18.0" fill="#e07a1f"/><text x="200.0" y="259.0" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="300.0" y="172.0" font-size="26" font-weight="800" fill="#2a8a5b" text-anchor="start">→ 門を開く</text><text x="240.0" y="310.0" font-size="22" font-weight="800" fill="#1f5fa8" text-anchor="middle">一・二点：二字以上はなれた字へ返る</text><rect x="60.0" y="322.0" width="80.0" height="80.0" rx="6" fill="#fff" stroke="#c9d6e8" stroke-width="2"/><text x="100.0" y="382.0" font-size="50" font-weight="600" fill="#1d2b3a" text-anchor="middle">望</text><text x="66.0" y="430.0" font-size="22" font-weight="800" fill="#c8414f" text-anchor="start">二</text><circle cx="100.0" cy="462.0" r="18.0" fill="#e07a1f"/><text x="100.0" y="469.0" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text><rect x="160.0" y="322.0" width="80.0" height="80.0" rx="6" fill="#fff" stroke="#c9d6e8" stroke-width="2"/><text x="200.0" y="382.0" font-size="50" font-weight="600" fill="#1d2b3a" text-anchor="middle">遠</text><circle cx="200.0" cy="462.0" r="18.0" fill="#e07a1f"/><text x="200.0" y="469.0" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text><rect x="260.0" y="322.0" width="80.0" height="80.0" rx="6" fill="#fff" stroke="#c9d6e8" stroke-width="2"/><text x="300.0" y="382.0" font-size="50" font-weight="600" fill="#1d2b3a" text-anchor="middle">山</text><text x="266.0" y="430.0" font-size="22" font-weight="800" fill="#c8414f" text-anchor="start">一</text><circle cx="300.0" cy="462.0" r="18.0" fill="#e07a1f"/><text x="300.0" y="469.0" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="400.0" y="382.0" font-size="26" font-weight="800" fill="#2a8a5b" text-anchor="start">→ 遠山を望む</text><text x="480.0" y="520.0" font-size="18" font-weight="600" fill="#8a96a3" text-anchor="middle">赤い字が返り点（漢字の左下に小さく書く）。オレンジの数字が読む順番。</text></svg>
