<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" width="640" height="150" role="img" aria-labelledby="t d">
<title id="t">正の数と負の数の数直線</title>
<desc id="d">−5から5までの数直線。0より右が正の数、0より左が負の数。右へ行くほど大きい。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#222" stroke-width="2"/></pattern></defs>
<rect width="640" height="150" fill="#fff"/>

<line x1="25" y1="80" x2="615" y2="80" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
<line x1="40.00" y1="74" x2="40.00" y2="86" stroke="#222" stroke-width="1.4" data-v="-5"/>
<line x1="96.00" y1="74" x2="96.00" y2="86" stroke="#222" stroke-width="1.4" data-v="-4"/>
<line x1="152.00" y1="74" x2="152.00" y2="86" stroke="#222" stroke-width="1.4" data-v="-3"/>
<line x1="208.00" y1="74" x2="208.00" y2="86" stroke="#222" stroke-width="1.4" data-v="-2"/>
<line x1="264.00" y1="74" x2="264.00" y2="86" stroke="#222" stroke-width="1.4" data-v="-1"/>
<line x1="320.00" y1="74" x2="320.00" y2="86" stroke="#222" stroke-width="2.4" data-v="0"/>
<line x1="376.00" y1="74" x2="376.00" y2="86" stroke="#222" stroke-width="1.4" data-v="1"/>
<line x1="432.00" y1="74" x2="432.00" y2="86" stroke="#222" stroke-width="1.4" data-v="2"/>
<line x1="488.00" y1="74" x2="488.00" y2="86" stroke="#222" stroke-width="1.4" data-v="3"/>
<line x1="544.00" y1="74" x2="544.00" y2="86" stroke="#222" stroke-width="1.4" data-v="4"/>
<line x1="600.00" y1="74" x2="600.00" y2="86" stroke="#222" stroke-width="1.4" data-v="5"/>
<text x="40.00" y="110" font-size="17" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222" data-v="-5">−5</text>
<text x="96.00" y="110" font-size="17" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222" data-v="-4">−4</text>
<text x="152.00" y="110" font-size="17" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222" data-v="-3">−3</text>
<text x="208.00" y="110" font-size="17" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222" data-v="-2">−2</text>
<text x="264.00" y="110" font-size="17" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222" data-v="-1">−1</text>
<text x="320.00" y="110" font-size="17" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222" data-v="0">0</text>
<text x="376.00" y="110" font-size="17" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222" data-v="1">1</text>
<text x="432.00" y="110" font-size="17" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222" data-v="2">2</text>
<text x="488.00" y="110" font-size="17" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222" data-v="3">3</text>
<text x="544.00" y="110" font-size="17" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222" data-v="4">4</text>
<text x="600.00" y="110" font-size="17" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222" data-v="5">5</text>
<line x1="303.2" y1="30" x2="51.2" y2="30" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="180.0" y="22" font-size="16" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222">負の数（0より小さい）</text>
<line x1="336.8" y1="30" x2="588.8" y2="30" stroke="#222" stroke-width="3" marker-end="url(#ah)"/>
<text x="460.0" y="22" font-size="16" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222">正の数（0より大きい）</text>
<text x="320.0" y="140" font-size="14" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#222">0 は正の数でも負の数でもない</text>
</svg>
