<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>絶対値が3より小さい整数</title><desc>境界は白丸、範囲の中の整数は黒丸。個数は表示しない。</desc><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348"><rect x="45" y="35" width="1510" height="120" rx="24" fill="#e8f0fa"/><text x="90" y="113" font-size="48" font-weight="700">絶対値が3より小さい整数</text><rect x="65" y="205" width="1470" height="555" rx="25" fill="white"/><path d="M290 465H1310" stroke="#203348" stroke-width="5"/><path d="M410 378H1190" stroke="#1f5fa8" stroke-width="8" stroke-dasharray="14 8"/><text x="800" y="309" font-size="44" text-anchor="middle">0からのきょりが、3より小さい</text><path d="M410 450V480" stroke="#203348" stroke-width="4"/><circle cx="410" cy="465" r="18" fill="white" stroke="#203348" stroke-width="5"/><text x="410" y="545" text-anchor="middle" font-size="44">−3</text><path d="M540 450V480" stroke="#203348" stroke-width="4"/><circle cx="540" cy="465" r="18" fill="#203348" stroke="#203348" stroke-width="5"/><text x="540" y="545" text-anchor="middle" font-size="44">−2</text><path d="M670 450V480" stroke="#203348" stroke-width="4"/><circle cx="670" cy="465" r="18" fill="#203348" stroke="#203348" stroke-width="5"/><text x="670" y="545" text-anchor="middle" font-size="44">−1</text><path d="M800 450V480" stroke="#203348" stroke-width="4"/><circle cx="800" cy="465" r="18" fill="#203348" stroke="#203348" stroke-width="5"/><text x="800" y="545" text-anchor="middle" font-size="44">0</text><path d="M930 450V480" stroke="#203348" stroke-width="4"/><circle cx="930" cy="465" r="18" fill="#203348" stroke="#203348" stroke-width="5"/><text x="930" y="545" text-anchor="middle" font-size="44">1</text><path d="M1060 450V480" stroke="#203348" stroke-width="4"/><circle cx="1060" cy="465" r="18" fill="#203348" stroke="#203348" stroke-width="5"/><text x="1060" y="545" text-anchor="middle" font-size="44">2</text><path d="M1190 450V480" stroke="#203348" stroke-width="4"/><circle cx="1190" cy="465" r="18" fill="white" stroke="#203348" stroke-width="5"/><text x="1190" y="545" text-anchor="middle" font-size="44">3</text><circle cx="410" cy="650" r="18" fill="white" stroke="#203348" stroke-width="5"/><text x="450" y="665" font-size="40">白丸：ふくまない</text><circle cx="900" cy="650" r="18" fill="#203348"/><text x="940" y="665" font-size="40">黒丸：ふくむ</text><text x="800" y="835" text-anchor="middle" font-size="42">境界の点をふくむか、先に確かめよう。</text></g></svg>