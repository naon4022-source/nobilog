<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>速さ・時間を式から導く</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="676.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">1つの式から 2つの式を導く</text><rect x="450.0" y="160.0" width="700.0" height="120.0" rx="18" fill="#cfe3f6" stroke="#1f5fa8" stroke-width="5"/><text x="800.0" y="238.0" font-size="50" fill="#1f5fa8" text-anchor="middle" font-weight="800">道のり ＝ 速さ × 時間</text><line x1="800.0" y1="290.0" x2="420.0" y2="520.0" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/><polygon points="420.0,520.0 429.8,504.9 437.9,518.3" fill="#e07a1f" stroke="none" stroke-width="4" stroke-linejoin="round"/><rect x="100.0" y="540.0" width="640.0" height="110.0" rx="18" fill="white" stroke="#e07a1f" stroke-width="5"/><text x="420.0" y="612.0" font-size="44" fill="#203348" text-anchor="middle" font-weight="800">速さ ＝ 道のり ÷ 時間</text><text x="460.0" y="400.0" font-size="32" fill="#e07a1f" text-anchor="middle" font-weight="700">両辺を 時間 でわる</text><line x1="800.0" y1="290.0" x2="1180.0" y2="520.0" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/><polygon points="1180.0,520.0 1162.1,518.3 1170.2,504.9" fill="#e07a1f" stroke="none" stroke-width="4" stroke-linejoin="round"/><rect x="860.0" y="540.0" width="640.0" height="110.0" rx="18" fill="white" stroke="#e07a1f" stroke-width="5"/><text x="1180.0" y="612.0" font-size="44" fill="#203348" text-anchor="middle" font-weight="800">時間 ＝ 道のり ÷ 速さ</text><text x="1140.0" y="400.0" font-size="32" fill="#e07a1f" text-anchor="middle" font-weight="700">両辺を 速さ でわる</text><text x="800.0" y="780.0" font-size="36" fill="#203348" text-anchor="middle" font-weight="700">覚える式は 1つだけ。あとは 等式の性質で 変形する</text></g></svg>