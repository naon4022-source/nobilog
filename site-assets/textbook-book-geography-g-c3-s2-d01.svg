<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="北大西洋海流と偏西風の図"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">北大西洋海流と偏西風がヨーロッパをあたためる</text><rect x="30.0" y="72.0" width="900.0" height="330.0" rx="10" fill="#cfe9fb"/><path d="M560,92 L900,92 L900,382 L620,382 Q560,262 600,182 Z" fill="#e9dcc4" stroke="#1d2b3a" stroke-width="2"/><text x="760.0" y="252.0" font-size="26" font-weight="800" fill="#1d2b3a" text-anchor="middle">ヨーロッパ</text><text x="200.0" y="262.0" font-size="24" font-weight="800" fill="#1f5fa8" text-anchor="middle">大西洋</text><path d="M120,362 C260,322 420,232 580,152" fill="none" stroke="#c8414f" stroke-width="8"/><line x1="560.0" y1="162.0" x2="577.1" y2="153.4" stroke="#c8414f" stroke-width="8" stroke-linecap="round"/><polygon points="590.0,147.0 579.0,161.3 572.0,147.2" fill="#c8414f"/><text x="430.0" y="307.0" font-size="20" font-weight="800" fill="#c8414f" text-anchor="middle">北大西洋海流（暖流）</text><line x1="100.0" y1="122.0" x2="529.6" y2="122.0" stroke="#e07a1f" stroke-width="4" stroke-linecap="round"/><polygon points="540.0,122.0 528.3,127.7 528.3,116.3" fill="#e07a1f"/><line x1="130.0" y1="167.0" x2="549.6" y2="167.0" stroke="#e07a1f" stroke-width="4" stroke-linecap="round"/><polygon points="560.0,167.0 548.3,172.7 548.3,161.3" fill="#e07a1f"/><line x1="160.0" y1="212.0" x2="569.6" y2="212.0" stroke="#e07a1f" stroke-width="4" stroke-linecap="round"/><polygon points="580.0,212.0 568.3,217.7 568.3,206.3" fill="#e07a1f"/><text x="300.0" y="112.0" font-size="19" font-weight="800" fill="#e07a1f" text-anchor="middle">偏西風（西から東へ）</text><g data-id="b17"><rect x="30.0" y="360.0" width="900.0" height="80.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="480.0" y="402.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b17">暖流の上をわたってくる偏西風が、暖かさを運ぶ → 日本より北にあるのに、冬も比較的温暖</text></g><g data-id="b21"><rect x="30.0" y="452.0" width="900.0" height="73.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="480.0" y="491.0" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b21">農業：混合農業（作物＋家畜）・地中海式農業・酪農。EU：加盟国間の経済格差、移民・難民への対応。</text></g><text x="945.0" y="538.0" font-size="12" font-weight="600" fill="#8a96a3" text-anchor="end">（模式図）</text></svg>
