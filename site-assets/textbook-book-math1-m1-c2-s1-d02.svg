<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><title>道のり・速さ・時間の関係</title><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" font-size="40" fill="#203348"><text x="90" y="100" font-size="48">求めたい量をかくして、関係を見る</text><path d="M490 185L150 675H830Z" fill="white" stroke="#386a9a" stroke-width="6"/><path d="M316 435H664M490 435V675" stroke="#386a9a" stroke-width="5"/><text x="490" y="385" text-anchor="middle">道のり</text><text x="345" y="585" text-anchor="middle">速さ</text><text x="640" y="585" text-anchor="middle">時間</text><rect x="920" y="220" width="610" height="100" rx="18" fill="#edf3fa"/><text x="1225" y="285" text-anchor="middle">道のり＝速さ×時間</text><rect x="920" y="395" width="610" height="100" rx="18" fill="#edf3fa"/><text x="1225" y="460" text-anchor="middle">速さ＝道のり÷時間</text><rect x="920" y="570" width="610" height="100" rx="18" fill="#edf3fa"/><text x="1225" y="635" text-anchor="middle">時間＝道のり÷速さ</text><path d="M675 345H900l-18 -14m18 14l-18 14M840 535H880V460H900l-18 -14m18 14l-18 14M840 600H870V635H900l-18 -14m18 14l-18 14" fill="none" stroke="#386a9a" stroke-width="5"/><text x="800" y="825" text-anchor="middle">単位をそろえる：分速なら、時間も「分」。</text></g></svg>