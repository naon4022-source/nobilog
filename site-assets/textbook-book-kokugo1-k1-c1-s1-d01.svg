<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="体験と考えの関係"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">体験と考えの関係：体験が「根拠」になって考えを支える</text><g data-id="b2"><rect x="250.0" y="72.0" width="460.0" height="120.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="250.0" y="72.0" width="460.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="250.0" y="111.7" width="460.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="480.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">考え（筆者が言いたいこと）</text><text x="480.0" y="143.5" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">「〜と思う」「〜ではないか」「〜が大切だ」</text><text x="480.0" y="167.8" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">筆者の判断が出る文</text></g><g data-id="b10"><rect x="60.0" y="330.0" width="240.0" height="130.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="60.0" y="330.0" width="240.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="60.0" y="369.7" width="240.0" height="8.0" rx="0" fill="#e07a1f"/><text x="180.0" y="353.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b10">体験1</text><text x="180.0" y="396.8" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b10">いつ・どこで・だれと・</text><text x="180.0" y="418.4" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b10">何があったか</text><text x="180.0" y="440.0" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b10">（過去の形「〜た」が多い）</text></g><line x1="180.0" y1="326.0" x2="351.5" y2="204.0" stroke="#2a8a5b