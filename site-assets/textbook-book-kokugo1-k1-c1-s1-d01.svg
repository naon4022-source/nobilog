612.8,200.2 606.3,209.4" fill="#2a8a5b"/><text x="640.0" y="300.0" font-size="20" font-weight="700" fill="#2a8a5b" text-anchor="start">根拠として支える</text><rect x="60.0" y="478.0" width="840.0" height="46.0" rx="14" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="480.0" y="508.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle">考えは文章の終わり近くに多い。「つまり」「だから」「このように」のあとに注目！</text></svg>
