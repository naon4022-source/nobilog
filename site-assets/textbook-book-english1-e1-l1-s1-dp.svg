xt><text x="92.0" y="431.7" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">like 〜.</text></g><rect x="432.0" y="146.0" width="145.9" height="64.0" rx="0" fill="#1f5fa8" stroke="#c9d6e8" stroke-width="1.5"/><text x="504.9" y="180.9" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" data-box="t00">型</text><rect x="577.9" y="146.0" width="188.6" height="64.0" rx="0" fill="#1f5fa8" stroke="#c9d6e8" stroke-width="1.5"/><text x="672.2" y="180.9" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" data-box="t01">意味</text><rect x="766.5" y="146.0" width="173.5" height="64.0" rx="0" fill="#1f5fa8" stroke="#c9d6e8" stroke-width="1.5"/><text x="853.2" y="180.9" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" data-box="t02">例</text><rect x="432.0" y="210.0" width="145.9" height="64.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="504.9" y="244.9" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t10">I am 〜.</text><rect x="577.9" y="210.0" width="188.6" height="64.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="672.2" y="244.9" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t11">わたしは〜です</text><rect x="766.5" y="210.0" width="173.5" height="64.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="853.2" y="244.9" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t12">I am Aya.</text><rect x="432.0" y="274.0" width="145.9" height="64.0" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="504.9" y="308.9" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t20">I like 〜.</text><rect x="577.9" y="274.0" width="188.6" height="64.0" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="672.2" y="295.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t21">わたしは〜が好</text><text x="672.2" y="322.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t21">きです</text><rect x="766.5" y="274.0" width="173.5" height="64.0" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="853.2" y="308.9" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t22">I like cats.</text><rect x="432.0" y="338.0" width="145.9" height="64.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="504.9" y="359.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t30">I don&#x27;t</text><text x="504.9" y="386.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t30">like 〜.</text><rect x="577.9" y="338.0" width="188.6" height="64.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="672.2" y="359.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t31">〜は好きではあ</text><text x="672.2" y="386.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t31">りません</text><rect x="766.5" y="338.0" width="173.5" height="64.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="853.2" y="359.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t32">I don&#x27;t like</text><text x="853.2" y="386.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t32">natto.</text><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">順番どおりに考えてから、練習問題に答えよう。（？）は自分でうめてみよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circ