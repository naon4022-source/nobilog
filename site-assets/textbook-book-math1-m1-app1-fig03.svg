<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>小数と分数のわり算</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="456.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">わり算の2つのコツ</text><rect x="60.0" y="150.0" width="700.0" height="640.0" rx="24" fill="white" stroke="#1f5fa8" stroke-width="5"/><rect x="60.0" y="150.0" width="700.0" height="70.0" rx="24" fill="#1f5fa8" stroke="none" stroke-width="4"/><rect x="60.0" y="190.0" width="700.0" height="30.0" rx="0" fill="#1f5fa8" stroke="none" stroke-width="4"/><text x="410.0" y="200.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">小数のわり算</text><text x="410.0" y="320.0" font-size="54" fill="#203348" text-anchor="middle" font-weight="700">4.68 ÷ 1.2</text><line x1="410.0" y1="360.0" x2="410.0" y2="450.0" stroke="#1f5fa8" stroke-width="6" stroke-linecap="round"/><polygon points="410.0,450.0 402.2,433.8 417.8,433.8" fill="#1f5fa8" stroke="none" stroke-width="4" stroke-linejoin="round"/><text x="560.0" y="415.0" font-size="30" fill="#1f5fa8" text-anchor="middle" font-weight="700">どちらも 10倍</text><text x="410.0" y="530.0" font-size="54" fill="#203348" text-anchor="middle" font-weight="700">46.8 ÷ 12</text><text x="410.0" y="640.0" font-size="54" fill="#1f5fa8" text-anchor="middle" font-weight="800">＝ 3.9</text><text x="410.0" y="740.0" font-size="32" fill="#e07a1f" text-anchor="middle" font-weight="700">小数点を 同じけただけ 右へ</text><rect x="840.0" y="150.0" width="700.0" height="640.0" rx="24" fill="white" stroke="#2a8a5b" stroke-width="5"/><rect x="840.0" y="150.0" width="700.0" height="70.0" rx="24" fill="#2a8a5b" stroke="none" stroke-width="4"/><rect x="840.0" y="190.0" width="700.0" height="30.0" rx="0" fill="#2a8a5b" stroke="none" stroke-width="4"/><text x="1190.0" y="200.0" font-size="40" fill="white" text-anchor="middle" font-weight="800">分数のわり算</text><text x="1000.0" y="352.0" font-size="54" fill="#203348" text-anchor="middle" font-weight="700">b</text><line x1="978.3" y1="362.0" x2="1021.7" y2="362.0" stroke="#203348" stroke-width="3" stroke-linecap="round"/><text x="1000.0" y="418.0" font-size="54" fill="#203348" text-anchor="middle" font-weight="700">a</text><text x="1080.0" y="375.0" font-size="54" fill="#203348" text-anchor="middle" font-weight="700">÷</text><text x="1160.0" y="352.0" font-size="54" fill="#203348" text-anchor="middle" font-weight="700">d</text><line x1="1138.3" y1="362.0" x2="1181.7" y2="362.0" stroke="#203348" stroke-width="3" stroke-linecap="round"/><text x="1160.0" y="418.0" font-size="54" fill="#203348" text-anchor="middle" font-weight="700">c</text><line x1="1190.0" y1="420.0" x2="1190.0" y2="500.0" stroke="#2a8a5b" stroke-width="6" stroke-linecap="round"/><polygon points="1190.0,500.0 1182.2,483.8 1197.8,483.8" fill="#2a8a5b" stroke="none" stroke-width="4" stroke-linejoin="round"/><text x="1000.0" y="592.0" font-size="54" fill="#203348" text-anchor="middle" font-weight="700">b</text><line x1="978.3" y1="602.0" x2="1021.7" y2="602.0" stroke="#203348" stroke-width="3" stroke-linecap="round"/><text x="1000.0" y="658.0" font-size="54" fill="#203348" text-anchor="middle" font-weight="700">a</text><text x="1080.0" y="615.0" font-size="54" fill="#203348" text-anchor="middle" font-weight="700">×</text><text x="1160.0" y="592.0" font-size="54" fill="#203348" text-anchor="middle" font-weight="700">c</text><line x1="1138.3" y1="602.0" x2="1181.7" y2="602.0" stroke="#203348" stroke-width="3" stroke-linecap="round"/><text x="1160.0" y="658.0" font-size="54" fill="#203348" text-anchor="middle" font-weight="700">d</text><text x="1300.0" y="615.0" font-size="10" fill="#203348" text-anchor="middle" font-weight="700"></text><text x="1190.0" y="740.0" font-size="3