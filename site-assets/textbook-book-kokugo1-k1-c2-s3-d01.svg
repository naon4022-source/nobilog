<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="紹介文の段落構成"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">紹介文の段落構成（話題 → 紹介点と資料 → まとめ）</text><g data-id="b2"><rect x="30.0" y="72.0" width="269.3" height="308.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="72.0" width="269.3" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="111.7" width="269.3" height="8.0" rx="0" fill="#1f5fa8"/><text x="164.7" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">第一段落</text><text x="164.7" y="233.3" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">何を紹介するか</text><text x="164.7" y="268.4" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">（話題）</text></g><line x1="303.3" y1="226.0" x2="330.1" y2="226.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="341.3,226.0 328.7,232.1 328.7,219.9" fill="#e07a1f"/><g data-id="b12"><rect x="345.3" y="72.0" width="269.3" height="308.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="345.3" y="72.0" width="269.3" height="47.7" rx="14" fill="#e07a1f"/><rect x="345.3" y="111.7" width="269.3" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b12">第二・三段落</text><text x="480.0" y="215.7" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b12">紹介したい点と、</text><text x="480.0" y="250.8" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b12">それを支える資料</text><text x="480.0" y="285.9" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b12">（事実・数字）</text></g><line x1="618.7" y1="226.0" x2="645.5" y2="226.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="656.7,226.0 644.1,232.1 644.1,219.9" fill="#e07a1f"/><g data-id="b23"><rect x="660.7" y="72.0" width="269.3" height="308.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="660.7" y="72.0" width="269.3" height="47.7" rx="14" fill="#2a8a5b"/><rect x="660.7" y="111.7" width="269.3" height="8.0" rx="0" fill="#2a8a5b"/><text x="795.3" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b23">最後の段落</text><text x="795.3" y="233.3" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b23">読み手へのよびか</text><text x="795.3" y="268.4" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b23">け・まとめ</text></g><g data-id="b31"><rect x="40.0" y="395.0" width="880.0" height="130.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="40.0" y="395.0" width="880.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="40.0" y="434.7" width="880.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="480.0" y="418.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b31">資料の使い方</text><text x="480.0" y="471.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b31">資料の文はそのまま写さず、自分の言葉でまとめる。数字や事実は正確に書き、</text><text x="480.0" y="496.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b31">出典（どこから得た情報か）を示す。</text></g></svg>
