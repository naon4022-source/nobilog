<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="練習問題の手がかり：When 〜? と be動詞・一般動詞の整理"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">練習問題の手がかり：When 〜? と be動詞・一般動詞の整理</text><rect x="20.0" y="66.0" width="400.0" height="416.0" rx="14" fill="#fff" stroke="#c9d6e8" stroke-width="2"/><text x="40.0" y="98.0" font-size="22" font-weight="800" fill="#1f5fa8" text-anchor="start">考える順番</text><circle cx="52.0" cy="168.7" r="17.0" fill="#e07a1f"/><text x="52.0" y="175.8" font-size="19.549999999999997" font-weight="800" fill="#fff" text-anchor="middle">1</text><g data-id="b6"><rect x="78.0" y="112.0" width="330.0" height="113.3" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="2"/><text x="92.0" y="171.6" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b6">月を英語にする：March。</text></g><circle cx="52.0" cy="292.0" r="17.0" fill="#e07a1f"/><text x="52.0" y="299.1" font-size="19.549999999999997" font-weight="800" fill="#fff" text-anchor="middle">2</text><g data-id="b12"><rect x="78.0" y="235.3" width="330.0" height="113.3" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="2"/><text x="92.0" y="281.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b12">日にちを順番の言い方にする：</text><text x="92.0" y="308.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b12">23rd（twenty-third）。</text></g><circle cx="52.0" cy="415.3" r="17.0" fill="#e07a1f"/><text x="52.0" y="422.5" font-size="19.549999999999997" font-weight="800" fill="#fff" text-anchor="middle">3</text><g data-id="b19"><rect x="78.0" y="358.7" width="330.0" height="113.3" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="2"/><text x="92.0" y="418.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">It&#x27;s 〜. の文にする。</text></g><rect x="432.0" y="146.0" width="97.9" height="64.0" rx="0" fill="#1f5fa8" stroke="#c9d6e8" stroke-width="1.5"/><rect x="529.9" y="146.0" width="222.2" height="64.0" rx="0" fill="#1f5fa8" stroke="#c9d6e8" stroke-width="1.5"/><text x="641.0" y="180.9" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" data-box="t01">be動詞の文</text><rect x="752.1" y="146.0" width="187.9" height="64.0" rx="0" fill="#1f5fa8" stroke="#c9d6e8" stroke-width="1.5"/><text x="846.0" y="180.9" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" data-box="t02">一般動詞の文</text><rect x="432.0" y="210.0" width="97.9" height="64.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="480.9" y="244.0" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t10">ふつうの文</text><rect x="529.9" y="210.0" width="222.2" height="64.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="641.0" y="231.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t11">You are a</text><text x="641.0" y="258.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t11">student.</text><rect x="752.1" y="210.0" width="187.9" height="64.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="846.0" y="231.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t12">You play</text><text x="846.0" y="258.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t12">tenn（？）.</text><rect x="432.0" y="274.0" width="97.9" height="64.0" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="480.9" y="308.9" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t20">疑問文</text><rect x="529.9" y="274.0" width="222.2" height="64.0" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="641.0" y="295.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t21">Are you a</text><text x="641.0" y="322.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t21">student?</text><rect x="752.1" y="274.0" width="187.9" height="64.0" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="846.0" y="295.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t22">Do you play</text><text x="846.0" y="322.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t22">tennis?</text><rect x="432.0" y="338.0" width="97.9" height="64.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="480.9" y="372.9" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t30">否定文</text><rect x="529.9" y="338.0" width="222.2" height="64.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="641.0" y="359.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t31">I （？） （？） a</text><text x="641.0" y="386.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t31">student.</text><rect x="752.1" y="338.0" width="187.9" height="64.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="846.0" y="359.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t32">I （？） play</text><text x="846.0" y="386.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t32">tennis.</text><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">順番どおりに考えてから、練習問題に答えよう。（？）は自分でうめてみよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill