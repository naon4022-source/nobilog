<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="言葉の単位"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">言葉の単位：文章 ⊃ 段落 ⊃ 文 ⊃ 文節 ⊃ 単語</text><rect x="30.0" y="68.0" width="900.0" height="372.0" rx="18" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="44.0" y="98.0" font-size="22" font-weight="800" fill="#1f5fa8" text-anchor="start">文章（談話）</text><text x="193.3" y="93.5" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="n0">まとまった内容を表す全体</text><rect x="103.6" y="99.0" width="752.7" height="310.0" rx="18" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="117.6" y="129.0" font-size="22" font-weight="800" fill="#e07a1f" text-anchor="start">段落</text><text x="175.4" y="124.5" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="n1">内容のまとまり。書き出しを一字下げる</text><rect x="177.3" y="130.0" width="605.5" height="248.0" rx="18" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="191.3" y="160.0" font-size="22" font-weight="800" fill="#2a8a5b" text-anchor="start">文</text><text x="226.2" y="155.5" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="n2">「。」までのひと続き</text><rect x="250.9" y="161.0" width="458.2" height="186.0" rx="18" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="264.9" y="191.0" font-size="22" font-weight="800" fill="#6a4aa0" text-anchor="start">文節</text><text x="322.7" y="186.5" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="n3">「ネ」を入れて自然に区切れる所</text><rect x="324.5" y="192.0" width="310.9" height="124.0" rx="18" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="338.5" y="222.0" font-size="22" font-weight="800" fill="#1f5fa8" text-anchor="start">単語</text><text x="396.3" y="217.5" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="n4">言葉の最小の単位</text><g data-id="b17"><rect x="60.0" y="452.0" width="840.0" height="70.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="480.0" y="490.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b17">例：私は／本を／読む。（3文節）→ 私／は／本／を／読む。（5単語）</text></g></svg>
