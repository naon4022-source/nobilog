<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：お気に入りの一品を紹介する"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：お気に入りの一品を紹介する</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">話の組み立て</text><text x="40.0" y="180.1" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="180.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">はじめ：（？）、</text><text x="61.0" y="208.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">一言で言う。</text><text x="40.0" y="244.2" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="244.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">中：好きな理由を二つ</text><text x="61.0" y="272.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">程度。それぞれにエピ</text><text x="61.0" y="300.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">ソードや具体例をつけ</text><text x="61.0" y="329.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">る。</text><text x="40.0" y="364.9" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="364.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">終わり：聞き手へのよ</text><text x="61.0" y="393.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">びかけ（ぜひ〜してみ</text><text x="61.0" y="421.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">て）でしめる。</text></g><g data-id="b20"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b20">伝わる話し方</text><text x="346.0" y="217.0" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="365.0" y="217.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">聞き手の顔を見て、</text><text x="365.0" y="242.7" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">ゆっくり、はっきり話す。</text><text x="346.0" y="275.0" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="365.0" y="275.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">実物や写真を見せると、</text><text x="365.0" y="300.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">イメージが伝わりやすい。</text><text x="346.0" y="332.9" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b20">・</text><text x="365.0" y="332.9" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">「理由は二つあります」</text><text x="365.0" y="358.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">と先に数を言うと、（？）</text><text x="365.0" y="384.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">整理しやすい。</text></g><g data-id="b36"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b36">聞き手の役割</text><text x="652.0" y="254.7" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b36">・</text><text x="673.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b36">うなずきながら聞く。</text><text x="652.0" y="290.4" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b36">・</text><text x="673.0" y="290.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b36">「それはどうして？」</text><text x="673.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b36">「いつから？」など、</text><text x="673.0" y="347.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b36">話を広げる質問をする。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
