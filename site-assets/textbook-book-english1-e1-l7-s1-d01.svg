<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="should と have to"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">should と have to の強さ</text><path d="M60,312 L900,222 L900,312 Z" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="60.0" y="337.0" font-size="20" font-weight="700" fill="#8a96a3" text-anchor="start">弱い</text><text x="900.0" y="337.0" font-size="20" font-weight="700" fill="#8a96a3" text-anchor="end">強い</text><line x1="300.0" y1="197.0" x2="300.0" y2="277.4" stroke="#2a8a5b" stroke-width="4" stroke-linecap="round"/><polygon points="300.0,287.0 294.8,276.2 305.2,276.2" fill="#2a8a5b"/><line x1="730.0" y1="197.0" x2="730.0" y2="232.4" stroke="#e07a1f" stroke-width="4" stroke-linecap="round"/><polygon points="730.0,242.0 724.8,231.2 735.2,231.2" fill="#e07a1f"/><g data-id="b9"><rect x="150.0" y="82.0" width="300.0" height="110.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="300.0" y="114.1" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b9">should ＋ 動詞のもとの形</text><text x="300.0" y="139.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b9">〜したほうがよい（アドバ</text><text x="300.0" y="165.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b9">イス）</text></g><g data-id="b15"><rect x="560.0" y="82.0" width="340.0" height="110.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="730.0" y="126.9" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b15">have to ＋ 動詞のもとの形</text><text x="730.0" y="152.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b15">〜しなければならない</text></g><g data-id="b20"><rect x="40.0" y="357.0" width="430.0" height="160.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="40.0" y="357.0" width="430.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="40.0" y="396.7" width="430.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="255.0" y="380.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b20">形</text><text x="54.0" y="436.4" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">shouldn&#x27;t ＝〜しないほうがよい</text><text x="54.0" y="460.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">主語が三人称単数なら has to（She has to</text><text x="54.0" y="485.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">get up early.）</text></g><g data-id="b29"><rect x="490.0" y="357.0" width="430.0" height="160.0" rx="14" fill="#fdecee" stroke="#c8414f" stroke-width="3"/><rect x="490.0" y="357.0" width="430.0" height="47.7" rx="14" fill="#c8414f"/><rect x="490.0" y="396.7" width="430.0" height="8.0" rx="0" fill="#c8414f"/><text x="705.0" y="380.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b29">注意</text><text x="705.0" y="447.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b29">don&#x27;t have to ＝「〜する必要はない」</text><text x="705.0" y="474.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b29">「〜してはいけない」ではない！</text></g></svg>
