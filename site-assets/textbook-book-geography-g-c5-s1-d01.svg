<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="本州四国連絡橋の図"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">本州四国連絡橋の三つのルート</text><rect x="30.0" y="72.0" width="900.0" height="70.0" rx="14" fill="#e9dcc4" stroke="#1d2b3a" stroke-width="2"/><text x="480.0" y="117.0" font-size="26" font-weight="800" fill="#1d2b3a" text-anchor="middle">本州</text><rect x="30.0" y="142.0" width="900.0" height="170.0" rx="0" fill="#cfe9fb"/><text x="330.0" y="232.0" font-size="18" font-weight="800" fill="#1f5fa8" text-anchor="middle">瀬戸内海</text><rect x="30.0" y="312.0" width="900.0" height="70.0" rx="14" fill="#e9dcc4" stroke="#1d2b3a" stroke-width="2"/><text x="480.0" y="357.0" font-size="26" font-weight="800" fill="#1d2b3a" text-anchor="middle">四国</text><line x1="780.0" y1="142.0" x2="780.0" y2="312.0" stroke="#c8414f" stroke-width="8"/><rect x="697.1" y="162.0" width="165.8" height="30.0" rx="8" fill="#fff" stroke="#c8414f" stroke-width="1.5"/><text x="780.0" y="182.0" font-size="18" font-weight="800" fill="#c8414f" text-anchor="middle">神戸・鳴門ルート</text><rect x="686.2" y="260.0" width="187.6" height="27.0" rx="8" fill="#fff" stroke="#c8414f" stroke-width="1.5"/><text x="780.0" y="277.0" font-size="15" font-weight="800" fill="#c8414f" text-anchor="middle">明石海峡大橋・大鳴門橋</text><line x1="480.0" y1="142.0" x2="480.0" y2="312.0" stroke="#e07a1f" stroke-width="8"/><rect x="397.1" y="162.0" width="165.8" height="30.0" rx="8" fill="#fff" stroke="#e07a1f" stroke-width="1.5"/><text x="480.0" y="182.0" font-size="18" font-weight="800" fill="#e07a1f" text-anchor="middle">児島・坂出ルート</text><rect x="386.2" y="260.0" width="187.6" height="27.0" rx="8" fill="#fff" stroke="#e07a1f" stroke-width="1.5"/><text x="480.0" y="277.0" font-size="15" font-weight="800" fill="#e07a1f" text-anchor="middle">瀬戸大橋（鉄道も通る）</text><line x1="180.0" y1="142.0" x2="180.0" y2="312.0" stroke="#2a8a5b" stroke-width="8"/><rect x="97.1" y="162.0" width="165.8" height="30.0" rx="8" fill="#fff" stroke="#2a8a5b" stroke-width="1.5"/><text x="180.0" y="182.0" font-size="18" font-weight="800" fill="#2a8a5b" text-anchor="middle">尾道・今治ルート</text><rect x="125.2" y="260.0" width="109.6" height="27.0" rx="8" fill="#fff" stroke="#2a8a5b" stroke-width="1.5"/><text x="180.0" y="277.0" font-size="15" font-weight="800" fill="#2a8a5b" text-anchor="middle">しまなみ海道</text><g data-id="b23"><rect x="30.0" y="395.0" width="900.0" height="130.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><rect x="30.0" y="395.0" width="900.0" height="47.7" rx="14" fill="#6a4aa0"/><rect x="30.0" y="434.7" width="900.0" height="8.0" rx="0" fill="#6a4aa0"/><text x="480.0" y="418.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b23">橋ができて</text><text x="480.0" y="471.5" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b23">交通が便利になり、大都市に人や買い物客が吸い寄せられる＝ストロー現象。一方で、</text><text x="480.0" y="495.8" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b23">観光や物流は活発になった。</text></g><text x="945.0" y="538.0" font-size="12" font-weight="600" fill="#8a96a3" text-anchor="end">（東西の並び：左が西・右が東の模式図）</text></svg>
