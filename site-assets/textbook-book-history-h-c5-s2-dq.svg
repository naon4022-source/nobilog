<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：第二次世界大戦と戦後の改革"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：第二次世界大戦と戦後の改革</text><g data-id="b2"><rect x="30.0" y="68.0" width="441.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="441.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="441.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="250.5" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">戦後の民主化</text><text x="40.0" y="239.8" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="239.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">GHQ（連合国軍総司令部）のもとで改革。</text><text x="40.0" y="273.8" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="273.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">財閥解体、農地改革（自作農を増やす）、</text><text x="60.0" y="300.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">教育基本法。</text><text x="40.0" y="334.8" font-size="20" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="60.0" y="334.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">選挙権：満20歳以上の男女（女性の参</text><text x="60.0" y="361.8" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">政権）。</text></g><g data-id="b16"><rect x="489.0" y="68.0" width="441.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-widt