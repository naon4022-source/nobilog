<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="調べた内容を聞く"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">調べた内容を聞く：予想 → メモ → 質問</text><g data-id="b2"><rect x="30.0" y="72.0" width="269.3" height="448.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="72.0" width="269.3" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="111.7" width="269.3" height="8.0" rx="0" fill="#1f5fa8"/><text x="164.7" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">予想して聞く</text><text x="164.7" y="285.7" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">テーマから話を予</text><text x="164.7" y="320.8" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">想。予想とちがっ</text><text x="164.7" y="355.9" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">た所に新しい発見</text></g><line x1="303.3" y1="296.0" x2="330.1" y2="296.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="341.3,296.0 328.7,302.1 328.7,289.9" fill="#e07a1f"/><g data-id="b13"><rect x="345.3" y="72.0" width="269.3" height="448.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="345.3" y="72.0" width="269.3" height="47.7" rx="14" fill="#e07a1f"/><rect x="345.3" y="111.7" width="269.3" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b13">メモをとる</text><text x="480.0" y="268.2" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b13">キーワードと数字</text><text x="480.0" y="303.3" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b13">だけ。記号を使う</text><text x="480.0" y="338.4" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b13">（→ 原因・結果、</text><text x="480.0" y="373.5" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b13">！大事、？質問）</text></g><line x1="618.7" y1="296.0" x2="645.5" y2="296.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="656.7,296.0 644.1,302.1 644.1,289.9" fill="#e07a1f"/><g data-id="b25"><rect x="660.7" y="72.0" width="269.3" height="448.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="660.7" y="72.0" width="269.3" height="47.7" rx="14" fill="#2a8a5b"/><rect x="660.7" y="111.7" width="269.3" height="8.0" rx="0" fill="#2a8a5b"/><text x="795.3" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b25">質問する</text><text x="795.3" y="268.2" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b25">「どうして？」</text><text x="795.3" y="303.3" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b25">「どのように？」。</text><text x="795.3" y="338.4" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b25">答えを受けてさら</text><text x="795.3" y="373.5" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b25">にくわしく</text></g></svg>
