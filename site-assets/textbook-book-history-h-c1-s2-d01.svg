<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="縄文・弥生・古墳の暮らしの変化"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">縄文・弥生・古墳：暮らしの変化</text><g data-id="b2"><rect x="30.0" y="72.0" width="269.3" height="258.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="72.0" width="269.3" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="111.7" width="269.3" height="8.0" rx="0" fill="#1f5fa8"/><text x="164.7" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">縄文時代</text><text x="164.7" y="173.2" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">狩り・漁・採集</text><text x="164.7" y="208.3" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">縄文土器・たて穴</text><text x="164.7" y="243.4" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">住居</text><text x="164.7" y="278.5" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">貝塚・土偶</text></g><line x1="303.3" y1="201.0" x2="330.1" y2="201.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="341.3,201.0 328.7,207.1 328.7,194.9" fill="#e07a1f"/><g data-id="b14"><rect x="345.3" y="72.0" width="269.3" height="258.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="345.3" y="72.0" width="269.3" height="47.7" rx="14" fill="#e07a1f"/><rect x="345.3" y="111.7" width="269.3" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b14">弥生時代</text><text x="480.0" y="173.2" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b14">稲作が広まる</text><text x="480.0" y="208.3" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b14">弥生土器・高床倉</text><text x="480.0" y="243.4" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b14">庫</text><text x="480.0" y="278.5" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b14">争いとくにの誕生</text></g><line x1="618.7" y1="201.0" x2="645.5" y2="201.0" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="656.7,201.0 644.1,207.1 644.1,194.9" fill="#e07a1f"/><g data-id="b26"><rect x="660.7" y="72.0" width="269.3" height="258.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="660.7" y="72.0" width="269.3" height="47.7" rx="14" fill="#2a8a5b"/><rect x="660.7" y="111.7" width="269.3" height="8.0" rx="0" fill="#2a8a5b"/><text x="795.3" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b26">古墳時代</text><text x="795.3" y="196.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b26">大王（ヤマト王権）</text><text x="795.3" y="225.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b26">前方後円墳・埴輪</text><text x="795.3" y="253.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b26">渡来人が技術を伝える</text></g><g data-id="b35"><rect x="30.0" y="350.0" width="440.0" height="175.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="30.0" y="350.0" width="440.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="30.0" y="389.7" width="440.0" height="8.0" rx="0" fill="#e07a1f"/><text x="250.0" y="373.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b35">弥生時代のできごと</text><text x="250.0" y="438.1" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b35">吉野ヶ里遺跡（堀やさくで囲まれたむら）。</text><text x="250.0" y="461.0" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b35">奴国の王が漢から金印（57年）。</text><text x="250.0" y="484.0" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b35">邪馬台国の卑弥呼が魏に使い（3世紀）。</text></g><g data-id="b44"><rect x="490.0" y="350.0" width="440.0" height="175.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="490.0" y="350.0" width="440.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="490.0" y="389.7" width="440.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="710.0" y="373.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b44">古墳時代のできごと</text><text x="710.0" y="438.1" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b44">大仙（大山）古墳＝日本最大の前方後円墳。</text><text x="710.0" y="461.0" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b44">渡来人が漢字・儒教・仏教・須恵器・</text><text x="710.0" y="484.0" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b44">機織りを伝えた。</text></g></svg>
