<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="明治の三大改革"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">明治の三大改革</text><g data-id="b2"><rect x="30.0" y="72.0" width="288.0" height="258.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="72.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="111.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">学制</text><text x="40.0" y="212.7" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="212.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">6歳以上の男女に教育</text><text x="61.0" y="241.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">を受けさせる</text></g><g data-id="b11"><rect x="336.0" y="72.0" width="288.0" height="258.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="72.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="111.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b11">徴兵令</text><text x="346.0" y="212.7" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b11">・</text><text x="367.0" y="212.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b11">満20歳以上の男子に</text><text x="367.0" y="241.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b11">兵役</text></g><g data-id="b20"><rect x="642.0" y="72.0" width="288.0" height="258.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="72.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="111.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b20">地租改正</text><text x="652.0" y="194.9" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b20">・</text><text x="673.0" y="194.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">地価の3%を現金で納</text><text x="673.0" y="223.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">める（のち2.5%に）</text><text x="652.0" y="258.9" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b20">・</text><text x="673.0" y="258.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">国の収入が安定</text></g><g data-id="b31"><rect x="30.0" y="360.0" width="269.3" height="165.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="360.0" width="269.3" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="399.7" width="269.3" height="8.0" rx="0" fill="#1f5fa8"/><text x="164.7" y="383.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b31">自由民権運動</text><text x="164.7" y="449.8" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b31">板垣退助・民撰議</text><text x="164.7" y="484.9" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b31">院設立の建白書</text></g><line x1="303.3" y1="442.5" x2="330.1" y2="442.5" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="341.3,442.5 328.7,448.6 328.7,436.4" fill="#e07a1f"/><g data-id="b41"><rect x="345.3" y="360.0" width="269.3" height="165.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="345.3" y="360.0" width="269.3" height="47.7" rx="14" fill="#e07a1f"/><rect x="345.3" y="399.7" width="269.3" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="383.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b41">大日本帝国憲法</text><text x="480.0" y="449.8" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b41">1889年・天皇が</text><text x="480.0" y="484.9" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b41">元首（伊藤博文）</text></g><line x1="618.7" y1="442.5" x2="645.5" y2="442.5" stroke="#e07a1f" stroke-width="5" stroke-linecap="round"/><polygon points="656.7,442.5 644.1,448.6 644.1,436.4" fill="#e07a1f"/><g data-id="b51"><rect x="660.7" y="360.0" width="269.3" height="165.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="660.7" y="360.0" width="269.3" height="47.7" rx="14" fill="#2a8a5b"/><rect x="660.7" y="399.7" width="269.3" height="8.0" rx="0" fill="#2a8a5b"/><text x="795.3" y="383.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b51">帝国議会</text><text x="795.3" y="467.3" font-size="26" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b51">衆議院と貴族院</text></g></svg>
