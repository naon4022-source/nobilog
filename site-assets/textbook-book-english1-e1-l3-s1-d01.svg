<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="過去形への変身"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">動詞の過去形への変身</text><g data-id="b2"><rect x="30.0" y="72.0" width="288.0" height="348.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="72.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="111.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">ed をつける</text><text x="40.0" y="207.8" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="207.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">play → played</text><text x="40.0" y="243.5" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="243.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">watch → watched</text><text x="40.0" y="279.2" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="279.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">e で終わる語は d</text><text x="61.0" y="307.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">だけ：like → liked、</text><text x="61.0" y="335.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">use → used</text></g><g data-id="b16"><rect x="336.0" y="72.0" width="288.0" height="348.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="72.0" width="288.0" height="46.4" rx="14" fill="#e07a1f"/><rect x="336.0" y="110.3" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="94.2" font-size="21" font-weight="800" fill="#fff" text-anchor="middle" data-box="b16">形が変わる（不規則動詞）</text><text x="346.0" y="199.8" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="367.0" y="199.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">go → went</text><text x="346.0" y="235.5" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="367.0" y="235.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">eat → ate</text><text x="346.0" y="271.2" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="367.0" y="271.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">see → saw</text><text x="346.0" y="306.9" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="367.0" y="306.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">have → had</text><text x="346.0" y="342.6" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="367.0" y="342.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">make → made</text></g><g data-id="b32"><rect x="642.0" y="72.0" width="288.0" height="348.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="72.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="111.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b32">be動詞</text><text x="652.0" y="236.2" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b32">・</text><text x="673.0" y="236.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b32">am・is → was</text><text x="652.0" y="271.9" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b32">・</text><text x="673.0" y="271.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b32">are → were</text><text x="652.0" y="307.6" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b32">・</text><text x="673.0" y="307.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b32">It was fun.</text></g><g data-id="b44"><rect x="40.0" y="435.0" width="880.0" height="85.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="480.0" y="466.9" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b44">過去を表す言葉：yesterday（きのう）・last night（昨夜）・last</text><text x="480.0" y="493.9" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b44">Sunday（この前の日曜日）・〜 ago（〜前）</text></g></svg>
