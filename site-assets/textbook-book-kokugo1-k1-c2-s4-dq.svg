<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：漢字の部首"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：漢字の部首</text><g data-id="b2"><rect x="30.0" y="68.0" width="441.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="441.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="441.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="250.5" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">部首の七つの位置</text><text x="40.0" y="176.5" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="176.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">へん（左）：イ（にんべん）・</text><text x="61.0" y="204.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">氵（さんずい）・木（きへん）</text><text x="40.0" y="240.5" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="240.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">つくり（右）：刂（りっとう）・</text><text x="61.0" y="268.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">攵（のぶん・ぼくづくり）・</text><text x="61.0" y="297.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">頁（おおがい）</text><text x="40.0" y="332.9" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="332.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">かんむり（上）：宀（うかんむり）・</text><text x="61.0" y="361.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">艹（（？））・⺮（たけかんむり）</text><text x="40.0" y="397.0" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="397.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">あし（下）：心（こころ）・</text><text x="61.0" y="425.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">灬（れんが・れっか）・儿（ひとあし）</text></g><g data-id="b21"><rect x="489.0" y="68.0" width="441.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="489.0" y="68.0" width="441.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="489.0" y="107.7" width="441.0" height="8.0" rx="0" fill="#e07a1f"/><text x="709.5" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b21">部首と意味</text><text x="499.0" y="233.2" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="520.0" y="233.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">氵：水に関係（海・池・流）</text><text x="499.0" y="268.9" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="520.0" y="268.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">扌（てへん）：手の動作（投・持・打）</text><text x="499.0" y="304.6" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="520.0" y="304.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">忄（りっしんべん）：心のはたらき</text><text x="520.0" y="332.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">（情・快・慣）</text><text x="499.0" y="368.6" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="520.0" y="368.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">貝：お金・財産（財・貯・賃）</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
