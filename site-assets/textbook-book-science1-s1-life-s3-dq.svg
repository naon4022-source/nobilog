<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：葉・根のつくりと植物の分類"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：葉・根のつくりと植物の分類</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">単子葉類と双子葉類</text><text x="40.0" y="236.6" font-size="18" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="58.0" y="236.6" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">単子葉類（イネ・トウモロ</text><text x="58.0" y="260.9" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">コシ・ユリ）：子葉1枚・</text><text x="58.0" y="285.2" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">平行脈・ひげ根。</text><text x="40.0" y="315.8" font-size="18" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="58.0" y="315.8" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">双子葉類（アブラナ・</text><text x="58.0" y="340.1" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">ヒマワリ・サクラ）：</text><text x="58.0" y="364.4" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">子葉2枚・網状脈・（？）。</text></g><g data-id="b16"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b16">種子をつくらない植物</text><text x="346.0" y="220.3" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="365.0" y="220.3" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">シダ植物（イヌワラビ）：</text><text x="365.0" y="246.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">根・茎・葉の区別がある。</text><text x="365.0" y="271.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">（？）でふえる。</text><text x="346.0" y="303.9" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="365.0" y="303.9" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">コケ植物（ゼニゴケ）：</text><text x="365.0" y="329.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">根・茎・葉の区別がない。</text><text x="365.0" y="355.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">仮根で体を固定。</text><text x="365.0" y="380.9" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">胞子でふえる。</text></g><g data-id="b31"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b31">植物の分類</text><text x="652.0" y="198.0" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b31">・</text><text x="673.0" y="198.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b31">種子をつくる？ →</text><text x="673.0" y="226.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b31">つくる：種子植物（被</text><text x="673.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b31">子植物・裸子植物）／</text><text x="673.0" y="283.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b31">つくらない：シダ植物</text><text x="673.0" y="311.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b31">・コケ植物。</text><text x="652.0" y="347.1" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b31">・</text><text x="673.0" y="347.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b31">被子植物はさらに単子</text><text x="673.0" y="375.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b31">葉類・双子葉類に分か</text><text x="673.0" y="403.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b31">れる。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
