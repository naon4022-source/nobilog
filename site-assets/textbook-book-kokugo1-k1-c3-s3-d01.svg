<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="写真を見る観点"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">写真で「事実」を表現する：写真を見る観点</text><g data-id="b2"><rect x="30.0" y="72.0" width="172.0" height="150.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="72.0" width="172.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="111.7" width="172.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="116.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">人物</text><text x="116.0" y="158.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">表情・動作・</text><text x="116.0" y="183.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">服装・姿勢</text></g><g data-id="b10"><rect x="212.0" y="72.0" width="172.0" height="150.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="212.0" y="72.0" width="172.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="212.0" y="111.7" width="172.0" height="8.0" rx="0" fill="#e07a1f"/><text x="298.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b10">事物や背景</text><text x="298.0" y="158.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b10">何が写っている</text><text x="298.0" y="183.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b10">か</text></g><g data-id="b18"><rect x="394.0" y="72.0" width="172.0" height="150.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="394.0" y="72.0" width="172.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="394.0" y="111.7" width="172.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="480.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b18">場所</text><text x="480.0" y="170.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b18">どこか</text></g><g data-id="b25"><rect x="576.0" y="72.0" width="172.0" height="150.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><rect x="576.0" y="72.0" width="172.0" height="47.7" rx="14" fill="#6a4aa0"/><rect x="576.0" y="111.7" width="172.0" height="8.0" rx="0" fill="#6a4aa0"/><text x="662.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b25">時間・空間</text><text x="662.0" y="158.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b25">いつ・どれく</text><text x="662.0" y="183.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b25">らいの広さ</text></g><g data-id="b33"><rect x="758.0" y="72.0" width="172.0" height="150.0" rx="14" fill="#fdecee" stroke="#c8414f" stroke-width="3"/><rect x="758.0" y="72.0" width="172.0" height="47.7" rx="14" fill="#c8414f"/><rect x="758.0" y="111.7" width="172.0" height="8.0" rx="0" fill="#c8414f"/><text x="844.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b33">構図</text><text x="844.0" y="158.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b33">角度・距離・</text><text x="844.0" y="183.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b33">組み合わせ</text></g><g data-id="b41"><rect x="30.0" y="240.0" width="440.0" height="140.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="30.0" y="240.0" width="440.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="30.0" y="279.7" width="440.0" height="8.0" rx="0" fill="#e07a1f"/><text x="250.0" y="263.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b41">何を切り取るか</text><text x="250.0" y="310.6" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b41">撮影者は、場面の一部・ある一瞬を切り取る。</text><text x="250.0" y="333.5" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b41">近づくか離れるかで伝わることが変わる。</text><text x="250.0" y="356.5" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b41">撮る人には意図や目的がある。</text></g><g data-id="b50"><rect x="490.0" y="240.0" width="440.0" height="140.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="490.0" y="240.0" width="440.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="490.0" y="279.7" width="440.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="710.0" y="263.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b50">題名</text><text x="710.0" y="333.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b50">同じ写真でも、題名によって見え方が変わる。</text></g><g data-id="b57"><rect x="30.0" y="395.0" width="900.0" height="125.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><rect x="30.0" y="395.0" width="900.0" height="47.7" rx="14" fill="#6a4aa0"/><rect x="30.0" y="434.7" width="900.0" height="8.0" rx="0" fill="#6a4aa0"/><text x="480.0" y="418.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b57">組み合わせる順序</text><text x="480.0" y="468.5" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b57">写真を並べる順番を変えると、全く別の物語ができる。写真に写った「事実」も、</text><text x="480.0" y="494.1" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b57">ちがう見方をされる。</text></g></svg>
