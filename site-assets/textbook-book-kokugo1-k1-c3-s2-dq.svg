<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：全ては編集されている"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：全ては編集されている</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">編集とは</text><text x="40.0" y="204.2" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="204.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">いらない場面を切り、</text><text x="59.0" y="229.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">伝えるものを選ぶ。</text><text x="40.0" y="262.1" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="262.1" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（？）（ニュースの原稿</text><text x="59.0" y="287.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">の順番を入れかえる）。</text><text x="40.0" y="320.1" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="320.1" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">テロップをつけたり、</text><text x="59.0" y="345.7" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">映像をつないだりする。</text><text x="59.0" y="371.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">どれも、受け手の受け取</text><text x="59.0" y="397.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">り方を変える。</text></g><g data-id="b19"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b19">筆者の主張と具体例</text><text x="346.0" y="151.8" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b19">・</text><text x="367.0" y="151.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">主張：メディアの情報</text><text x="367.0" y="180.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">は全て編集されている。</text><text x="367.0" y="208.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">だから受け手は、</text><text x="367.0" y="236.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">それを意識して受け取</text><text x="367.0" y="265.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">る必要がある。</text><text x="346.0" y="300.9" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b19">・</text><text x="367.0" y="300.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">具体例は、主張を読者</text><text x="367.0" y="329.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">に納得させるための材</text><text x="367.0" y="357.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">料。</text><text x="346.0" y="393.3" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b19">・</text><text x="367.0" y="393.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">主張 → 例 →</text><text x="367.0" y="421.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">もう一度主張、の形に</text><text x="367.0" y="450.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">注目する。</text></g><g data-id="b39"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="43.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="103.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="88.6" font-size="19" font-weight="800" fill="#fff" text-anchor="middle" data-box="b39">情報を受け取るときの見方</text><text x="652.0" y="206.5" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b39">・</text><text x="673.0" y="206.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">だれが、何のために作っ</text><text x="673.0" y="234.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">た情報か。</text><text x="652.0" y="270.5" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b39">・</text><text x="673.0" y="270.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">ほかのメディアではど</text><text x="673.0" y="298.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">う伝えているか、</text><text x="673.0" y="327.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">比べてみる。</text><text x="652.0" y="362.9" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b39">・</text><text x="673.0" y="362.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">事実と意見（感想）</text><text x="673.0" y="391.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b39">を分ける。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
