<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：構成を考えて話す・日本語の音声"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：構成を考えて話す・日本語の音声</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">話の構成</text><text x="40.0" y="194.3" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="194.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">頭括型：はじめに結論</text><text x="61.0" y="222.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">を言う。</text><text x="40.0" y="258.4" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="258.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">尾括型：最後に結論を</text><text x="61.0" y="286.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">言う。</text><text x="40.0" y="322.4" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="322.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（？）：はじめと終わ</text><text x="61.0" y="350.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">りの両方で結論を言う。</text><text x="61.0" y="379.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">聞き手の記憶に残りや</text><text x="61.0" y="407.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">すい。</text></g><g data-id="b19"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b19">日本語の音声</text><text x="346.0" y="180.1" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b19">・</text><text x="367.0" y="180.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">母音：あ・い・う・</text><text x="367.0" y="208.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">え・お の5つ。</text><text x="346.0" y="244.2" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b19">・</text><text x="367.0" y="244.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">子音：k・s・t・n</text><text x="367.0" y="272.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">などの音。多くは母音</text><text x="367.0" y="300.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">と組み合わさる。</text><text x="346.0" y="336.6" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b19">・</text><text x="367.0" y="336.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">拍：かなで書いたとき</text><text x="367.0" y="364.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">の一音分。「がっこう」</text><text x="367.0" y="393.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">は が・っ・こ・う</text><text x="367.0" y="421.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b19">の4拍。</text></g><g data-id="b37"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="72.0" rx="14" fill="#2a8a5b"/><rect x="642.0" y="132.0" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="89.4" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" data-box="b37">アクセントとイントネー</text><text x="786.0" y="116.4" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" data-box="b37">ション</text><text x="652.0" y="194.0" font-size="19" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b37">・</text><text x="671.0" y="194.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">アクセント：単語の中の</text><text x="671.0" y="219.7" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">音の高い・低い。</text><text x="671.0" y="245.3" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">「はし（橋）」と「はし</text><text x="671.0" y="271.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">（箸）」をちがう音の高</text><text x="671.0" y="296.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">さで言い分ける地域があ</text><text x="671.0" y="322.3" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">る。</text><text x="652.0" y="354.6" font-size="19" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b37">・</text><text x="671.0" y="354.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">（？）：文の終わりの上</text><text x="671.0" y="380.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">げ下げ。「行く？」</text><text x="671.0" y="405.9" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">（上がる＝質問）</text><text x="671.0" y="431.5" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b37">と「行く。」（下がる）。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
