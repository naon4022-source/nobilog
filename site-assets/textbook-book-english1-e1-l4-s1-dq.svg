<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：三人称単数の文（She likes 〜.）"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：三人称単数の文（She likes 〜.）</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">人称とは</text><text x="40.0" y="162.3" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="162.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">一人称：I（わたし）</text><text x="61.0" y="190.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">・we（わたしたち）</text><text x="40.0" y="226.3" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="226.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">二人称：you（あなた</text><text x="61.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">・あなたたち）</text><text x="40.0" y="290.4" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="290.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">三人称：それ以外ぜん</text><text x="61.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">ぶ（he・she・it・</text><text x="61.0" y="347.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">Ken・my mother・</text><text x="61.0" y="375.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">they など）</text><text x="40.0" y="411.1" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="411.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">三人称で一人（一つ）</text><text x="61.0" y="439.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">のとき＝三人称単数。</text></g><g data-id="b22"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b22">s / es のつけ方</text><text x="346.0" y="182.3" font-size="20" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b22">・</text><text x="366.0" y="182.3" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">ふつうは s：（？）s・</text><text x="366.0" y="209.3" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">（？）。</text><text x="346.0" y="243.3" font-size="20" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b22">・</text><text x="366.0" y="243.3" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">s・sh・ch・o・x</text><text x="366.0" y="270.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">で終わる語は es：（？）</text><text x="366.0" y="297.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">・goes・washes。</text><text x="346.0" y="331.2" font-size="20" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b22">・</text><text x="366.0" y="331.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">子音字＋y は y を i</text><text x="366.0" y="358.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">にして es：study →</text><text x="366.0" y="385.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">studies。</text><text x="346.0" y="419.2" font-size="20" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b22">・</text><text x="366.0" y="419.2" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b22">have は has になる。</text></g><g data-id="b41"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b41">否定文</text><text x="652.0" y="226.3" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b41">・</text><text x="673.0" y="226.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">（？） ＋ 動詞のもと</text><text x="673.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">の形：（？）</text><text x="673.0" y="283.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">doesn&#x27;t play （？）.</text><text x="652.0" y="318.7" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b41">・</text><text x="673.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">doesn&#x27;t が出てきた</text><text x="673.0" y="347.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">ら、s は動詞からなく</text><text x="673.0" y="375.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b41">なる。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
