<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="御恩と奉公の関係"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">御恩と奉公：将軍と御家人の関係</text><g data-id="b2"><rect x="330.0" y="82.0" width="300.0" height="100.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="480.0" y="136.9" font-size="34" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b2">将軍</text></g><g data-id="b6"><rect x="330.0" y="312.0" width="300.0" height="100.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="480.0" y="366.9" font-size="34" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b6">御家人</text></g><path d="M330,132 C150,152 150,342 325,362" fill="none" stroke="#e07a1f" stroke-width="6"/><line x1="300.0" y1="358.0" x2="312.4" y2="360.0" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/><polygon points="325.0,362.0 309.7,366.6 311.9,352.9" fill="#e07a1f"/><path d="M630,362 C810,342 810,152 635,132" fill="none" stroke="#2a8a5b" stroke-width="6"/><line x1="660.0" y1="134.0" x2="647.8" y2="133.0" stroke="#2a8a5b" stroke-width="6" stroke-linecap="round"/><polygon points="635.0,132.0 649.9,126.2 648.8,140.1" fill="#2a8a5b"/><g data-id="b16"><rect x="20.0" y="202.0" width="230.0" height="110.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="20.0" y="202.0" width="230.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="20.0" y="241.7" width="230.0" height="8.0" rx="0" fill="#e07a1f"/><text x="135.0" y="225.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b16">御恩</text><text x="135.0" y="269.6" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b16">領地を保護し、新しい領地</text><text x="135.0" y="291.2" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b16">を与える</text></g><g data-id="b24"><rect x="710.0" y="202.0" width="230.0" height="110.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="710.0" y="202.0" width="230.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="710.0" y="241.7" width="230.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="825.0" y="225.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b24">奉公</text><text x="825.0" y="269.6" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b24">戦いで命がけで戦い、</text><text x="825.0" y="291.2" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b24">警備をする</text></g><g data-id="b32"><rect x="30.0" y="445.0" width="900.0" height="80.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="480.0" y="475.5" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b32">国ごとに守護、荘園・公領ごとに地頭を置いた。元寇のあと恩賞（新しい領地）が足りず、</text><text x="480.0" y="499.8" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b32">御家人の不満が高まった。</text></g></svg>
