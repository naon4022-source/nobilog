<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>半球の表面</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="852.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">半球の表面 ＝ 曲面 ＋ 切り口の円</text><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="3" fill="#e07a1f"/></pattern><pattern id="hatch" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="20" stroke="#1f5fa8" stroke-width="5"/></pattern></defs><path d="M240 560 A320 320 0 0 1 880 560 A320 96.0 0 0 1 240 560Z" fill="url(#hatch)" stroke="#203348" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="560.0" cy="560.0" rx="320.0" ry="96.0" fill="url(#dots)" stroke="#203348" stroke-width="5"/><rect x="1080.0" y="300.0" width="60.0" height="60.0" rx="0" fill="url(#hatch)" stroke="#203348" stroke-width="3"/><text x="1160.0" y="345.0" font-size="38" fill="#1f5fa8" text-anchor="start" font-weight="700">曲面（球の半分）</text><rect x="1080.0" y="420.0" width="60.0" height="60.0" rx="0" fill="url(#dots)" stroke="#203348" stroke-width="3"/><text x="1160.0" y="465.0" font-size="38" fill="#e07a1f" text-anchor="start" font-weight="700">切り口の円</text></g></svg>