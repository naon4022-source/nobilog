<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="練習問題の手がかり：地震のゆれと伝わり方"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">練習問題の手がかり：地震のゆれと伝わり方</text><rect x="20.0" y="66.0" width="400.0" height="416.0" rx="14" fill="#fff" stroke="#c9d6e8" stroke-width="2"/><text x="40.0" y="98.0" font-size="22" font-weight="800" fill="#1f5fa8" text-anchor="start">考える順番</text><circle cx="52.0" cy="199.5" r="17.0" fill="#e07a1f"/><text x="52.0" y="206.6" font-size="19.549999999999997" font-weight="800" fill="#fff" text-anchor="middle">1</text><g data-id="b6"><rect x="78.0" y="112.0" width="330.0" height="175.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="2"/><text x="92.0" y="202.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b6">速さ＝距離 ÷ 時間。</text></g><circle cx="52.0" cy="384.5" r="17.0" fill="#e07a1f"/><text x="52.0" y="391.6" font-size="19.549999999999997" font-weight="800" fill="#fff" text-anchor="middle">2</text><g data-id="b12"><rect x="78.0" y="297.0" width="330.0" height="175.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="2"/><text x="92.0" y="387.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b12">70 ÷ 10 を計算する。</text></g><g data-id="b16"><rect x="432.0" y="66.0" width="508.0" height="416.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="432.0" y="66.0" width="508.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="432.0" y="105.7" width="508.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="686.0" y="89.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b16">かんたんにやる方法</text><text x="442.0" y="239.5" font-size="21" 