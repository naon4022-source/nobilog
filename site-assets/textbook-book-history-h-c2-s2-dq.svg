<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：室町時代と民衆の成長"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：室町時代と民衆の成長</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">産業と民衆</text><text x="40.0" y="233.2" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="233.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">二毛作の広まり、定期市、</text><text x="59.0" y="258.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">座（商工業者の同業者団</text><text x="59.0" y="284.5" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">体）、馬借・土倉・酒屋。</text><text x="40.0" y="316.8" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="316.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">惣（村の自治）、</text><text x="59.0" y="342.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">土一揆（正長の土一揆）、</text><text x="59.0" y="368.1" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">一向一揆、山城の国一揆。</text></g><g data-id="b16"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b16">室町文化</text><text x="346.0" y="251.4" font-size="16" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="362.0" y="251.4" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">北山文化：金閣（（？））。</text><text x="362.0" y="273.0" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">能（観阿弥・世阿弥）。</text><text x="346.0" y="300.2" font-size="16" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="362.0" y="300.2" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">東山文化：銀閣（足利義政）、</text><text x="362.0" y="321.8" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">書院造、水墨画（雪舟）。</text><text x="346.0" y="349.0" font-size="16" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="362.0" y="349.0" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">民衆の文化：狂言、御伽草子。</text></g><g data-id="b30"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b30">戦国大名</text><text x="652.0" y="268.9" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b30">・</text><text x="673.0" y="268.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b30">分国法で領国を治める。</text><text x="652.0" y="304.6" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b30">・</text><text x="673.0" y="304.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b30">城下町をつくり、</text><text x="673.0" y="332.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b30">商工業を保護。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
