<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：地球の姿と世界の国々"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：地球の姿と世界の国々</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">緯度と経度</text><text x="40.0" y="166.0" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="166.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">緯度：（？）を0度と</text><text x="61.0" y="194.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">し、南北に90度まで</text><text x="61.0" y="222.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（北緯・南緯）。</text><text x="40.0" y="258.4" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="258.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">経度：イギリスの（？）</text><text x="61.0" y="286.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">を通る本初子午線を0</text><text x="61.0" y="315.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">度とし、東西に180度</text><text x="61.0" y="343.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">まで（東経・西経）。</text><text x="40.0" y="379.1" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="379.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">同じ緯度を結んだ線が</text><text x="61.0" y="407.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">緯線、同じ経度を結ん</text><text x="61.0" y="435.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">だ線が経線。</text></g><g data-id="b21"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b21">地球儀と世界地図</text><text x="346.0" y="149.6" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="365.0" y="149.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">地球儀：面積・形・</text><text x="365.0" y="175.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">方位・距離をほぼ正しく</text><text x="365.0" y="200.9" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">表せる。</text><text x="346.0" y="233.2" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="365.0" y="233.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">メルカトル図法：</text><text x="365.0" y="258.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">角度が正しい（航海図）。</text><text x="365.0" y="284.5" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">高緯度ほど面積が大きく</text><text x="365.0" y="310.1" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">表される。</text><text x="346.0" y="342.4" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="365.0" y="342.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">正距方位図法：中心から</text><text x="365.0" y="368.1" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">の距離と方位が正しい</text><text x="365.0" y="393.7" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">（航空図）。</text><text x="346.0" y="426.0" font-size="19" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b21">・</text><text x="365.0" y="426.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">モルワイデ図法など：</text><text x="365.0" y="451.7" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b21">面積が正しい（分布図）。</text></g><g data-id="b43"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b43">世界の国々</text><text x="652.0" y="180.1" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b43">・</text><text x="673.0" y="180.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">世界には190余りの国</text><text x="673.0" y="208.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">がある。</text><text x="652.0" y="244.2" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b43">・</text><text x="673.0" y="244.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">国境：山脈・川などの</text><text x="673.0" y="272.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">自然を利用したもの、</text><text x="673.0" y="300.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">緯線・経線を利用した</text><text x="673.0" y="329.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">もの（アフリカに多い）</text><text x="673.0" y="357.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">がある。</text><text x="652.0" y="393.3" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b43">・</text><text x="673.0" y="393.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">島国（海洋国）と内陸</text><text x="673.0" y="421.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b43">国がある。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
