<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="I am と I like の比べ図"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">「I am 〜.」はイコール、「I like 〜.」は動き</text><text x="240.0" y="102.0" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle">be動詞 am</text><text x="720.0" y="102.0" font-size="26" font-weight="800" fill="#e07a1f" text-anchor="middle">一般動詞 like</text><g data-id="b4"><rect x="60.0" y="122.0" width="140.0" height="90.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="130.0" y="172.8" font-size="40" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b4">I</text></g><text x="240.0" y="182.0" font-size="48" font-weight="800" fill="#1f5fa8" text-anchor="middle">＝</text><g data-id="b9"><rect x="280.0" y="122.0" width="160.0" height="90.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="360.0" y="171.6" font-size="32" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b9">Kenta</text></g><text x="250.0" y="249.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle">わたしは ＝ ケンタ（I と 〜 がイコール）</text><g data-id="b14"><rect x="520.0" y="122.0" width="120.0" height="90.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="580.0" y="172.8" font-size="40" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b14">I</text></g><line x1="650.0" y1="167.0" x2="707.2" y2="167.0" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/><polygon points="720.0,167.0 705.6,174.0 705.6,160.0" fill="#e07a1f"/><rect x="659.4" y="150.2" width="51.3" height="25.6" rx="8" fill="#fff" stroke="#e07a1f" stroke-width="1.5"/><text x="685.0" y="1