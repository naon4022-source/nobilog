<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="練習問題の手がかり：四季のたより 春"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">練習問題の手がかり：四季のたより 春</text><rect x="20.0" y="66.0" width="400.0" height="416.0" rx="14" fill="#fff" stroke="#c9d6e8" stroke-width="2"/><text x="40.0" y="98.0" font-size="22" font-weight="800" fill="#1f5fa8" text-anchor="start">考える順番</text><circle cx="52.0" cy="168.7" r="17.0" fill="#e07a1f"/><text x="52.0" y="175.8" font-size="19.549999999999997" font-weight="800" fill="#fff" text-anchor="middle">1</text><g data-id="b6"><rect x="78.0" y="112.0" width="330.0" height="113.3" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="2"/><text x="92.0" y="144.6" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b6">五・七・五に区切る：</text><text x="92.0" y="171.6" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b6">なのはなや／つきはひがしに</text><text x="92.0" y="198.6" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b6">／ひはにしに。</text></g><circle cx="52.0" cy="292.0" r="17.0" fill="#e07a1f"/><text x="52.0" y="299.1" font-size="19.549999999999997" font-weight="800" fill="#fff" text-anchor="middle">2</text><g data-id="b14"><rect x="78.0" y="235.3" width="330.0" height="113.3" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="2"/><text x="92.0" y="294.9" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b14">季節を表す言葉をさがす。</text></g><circle cx="52.0" cy="415.3" r="17.0" fill="#e07a1f"/><text x="52.0" y="422.5" font-size="19.549999999999997" font-weight="800" fill="#fff" text-anchor="middle">3</text><g data-id="b20"><rect x="78.0" y="358.7" width="330.0" height="113.3" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="2"/><text x="92.0" y="404.7" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">情景を思いうかべる（どこに</text><text x="92.0" y="431.7" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b20">何が見えるか）。</text></g><rect x="432.0" y="178.0" width="329.5" height="64.0" rx="0" fill="#1f5fa8" stroke="#c9d6e8" stroke-width="1.5"/><text x="596.8" y="212.9" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" data-box="t00">作品</text><rect x="761.5" y="178.0" width="98.8" height="64.0" rx="0" fill="#1f5fa8" stroke="#c9d6e8" stroke-width="1.5"/><text x="811.0" y="212.9" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" data-box="t01">音の形</text><rect x="860.4" y="178.0" width="79.6" height="64.0" rx="0" fill="#1f5fa8" stroke="#c9d6e8" stroke-width="1.5"/><text x="900.2" y="203.1" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" data-box="t02">季節を表</text><text x="900.2" y="220.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" data-box="t02">す言葉</text><rect x="432.0" y="242.0" width="329.5" height="64.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="596.8" y="264.5" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t10">石走る垂水の上のさわらびの萌え出</text><text x="596.8" y="288.8" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t10">づる春になりにけるかも（志貴皇子）</text><rect x="761.5" y="242.0" width="98.8" height="64.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="811.0" y="265.0" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t11">和歌（五</text><text x="811.0" y="287.9" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t11">七五七七）</text><rect x="860.4" y="242.0" width="79.6" height="64.0" rx="0" fill="#fff" stroke="#c9d6e8" stroke-width="1.5"/><text x="900.2" y="265.5" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t12">さわら</text><text x="900.2" y="287.1" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t12">び・春</text><rect x="432.0" y="306.0" width="329.5" height="64.0" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="596.8" y="327.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t20">山路来て何やらゆかしすみれ草</text><text x="596.8" y="354.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t20">（松尾芭蕉）</text><rect x="761.5" y="306.0" width="98.8" height="64.0" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="811.0" y="329.0" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t21">俳句（五</text><text x="811.0" y="351.9" font-size="17" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t21">七五）</text><rect x="860.4" y="306.0" width="79.6" height="64.0" rx="0" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.5"/><text x="900.2" y="329.5" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t22">すみれ</text><text x="900.2" y="351.1" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="t22">草（春）</text><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">順番どおりに考えてから、練習問題に答えよう。（？）は自分でうめてみよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
