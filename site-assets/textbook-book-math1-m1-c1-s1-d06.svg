<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>□を逆向きにさがす図</title><desc>着いた所1から左へ4目盛り戻る点線。戻った所には数の代わりに□。答えは表示しない。</desc><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348"><rect x="45" y="35" width="1510" height="120" rx="24" fill="#e8f0fa"/><text x="90" y="113" font-size="48" font-weight="700">□を、逆向きにさがす</text><rect x="65" y="205" width="1470" height="560" rx="25" fill="white"/><path d="M230 525H1410" stroke="#203348" stroke-width="5"/><path d="M310 510V540" stroke="#203348" stroke-width="4"/><path d="M450 510V540" stroke="#203348" stroke-width="4"/><path d="M590 510V540" stroke="#203348" stroke-width="4"/><path d="M730 510V540" stroke="#203348" stroke-width="4"/><path d="M870 510V540" stroke="#203348" stroke-width="4"/><path d="M1010 510V540" stroke="#203348" stroke-width="4"/><path d="M1150 510V540" stroke="#203348" stroke-width="4"/><path d="M1290 510V540" stroke="#203348" stroke-width="4"/><text x="870" y="593" font-size="44" text-anchor="middle">0</text><text x="1010" y="593" font-size="44" text-anchor="middle">1</text><path d="M1010 515V300h240v110h-240" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="4"/><text x="1130" y="367" font-size="40" text-anchor="middle">着いた所</text><circle cx="1010" cy="525" r="13" fill="#1f5fa8"/><path d="M1010 460H450l25 -20M450 460l25 20" fill="none" stroke="#1f5fa8" stroke-width="6" stroke-dasharray="14 9"/><text x="720" y="392" font-size="44" text-anchor="middle">左へ4目盛りもどる</text><rect x="398" y="563" width="104" height="90" rx="14" fill="white" stroke="#203348" stroke-width="4"/><text x="450" y="625" font-size="50" text-anchor="middle">□</text><circle cx="450" cy="525" r="13" fill="#203348"/><text x="800" y="840" font-size="42" text-anchor="middle">着いた所から、動きを逆にたどろう。</text></g></svg>