<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><title>2つの方法で同じ式の値を確かめる</title><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" font-size="40" fill="#203348"><text x="90" y="100" font-size="48">別の方法で確かめる｜x＝−2</text><rect x="330" y="145" width="940" height="100" rx="20" fill="#e9f1fa"/><text x="800" y="210" text-anchor="middle">3(x+4)−2(x−1)</text><rect x="85" y="300" width="670" height="95" rx="20" fill="white" stroke="#386a9a" stroke-width="3"/><text x="420" y="360" text-anchor="middle">そのまま代入</text><rect x="85" y="425" width="670" height="95" rx="20" fill="white" stroke="#386a9a" stroke-width="3"/><text x="420" y="485" text-anchor="middle">3(−2+4)−2(−2−1)</text><rect x="85" y="550" width="670" height="95" rx="20" fill="white" stroke="#386a9a" stroke-width="3"/><text x="420" y="610" text-anchor="middle">6−(−6)＝12</text><path d="M420 405v15l-12 -12m12 12l12 -12" fill="none" stroke="#386a9a" stroke-width="5"/><path d="M420 530v15l-12 -12m12 12l12 -12" fill="none" stroke="#386a9a" stroke-width="5"/><rect x="845" y="300" width="670" height="95" rx="20" fill="white" stroke="#386a9a" stroke-width="3"/><text x="1180" y="360" text-anchor="middle">計算してから代入</text><rect x="845" y="425" width="670" height="95" rx="20" fill="white" stroke="#386a9a" stroke-width="3"/><text x="1180" y="485" text-anchor="middle">3x+12−2x+2＝x+14</text><rect x="845" y="550" width="670" height="95" rx="20" fill="white" stroke="#386a9a" stroke-width="3"/><text x="1180" y="610" text-anchor="middle">−2+14＝12</text><path d="M1180 405v15l-12 -12m12 12l12 -12" fill="none" stroke="#386a9a" stroke-width="5"/><path d="M1180 530v15l-12 -12m12 12l12 -12" fill="none" stroke="#386a9a" stroke-width="5"/><path d="M420 665V700H800M1180 665V700H800V725l-14 -15m14 15l14 -15" fill="none" stroke="#397052" stroke-width="5"/><rect x="520" y="730" width="560" height="100" rx="25" fill="#e6f1e9"/><text x="800" y="795" text-anchor="middle">同じゴール：12</text></g></svg>