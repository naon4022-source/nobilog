<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">0を基準に、温度計と数直線を対応させる</title><desc id="desc">温度計と数直線に同じ間隔の目盛り。0から負の向きの同じ位置に丸と三角の共通印。答えの数字は表示しない。</desc><rect width="1600" height="900" fill="#f6f8fc"/><g font-family="Hiragino Sans,sans-serif" fill="#203348"><rect x="45" y="35" width="1510" height="120" rx="24" fill="#e8f0fa"/><text x="95" y="114" font-size="46" font-weight="700">同じ印は、同じ数を表す</text><rect x="55" y="190" width="500" height="600" rx="25" fill="white"/><rect x="580" y="190" width="960" height="600" rx="25" fill="white"/><text x="310" y="257" font-size="40" text-anchor="middle">温度計（℃）</text><text x="1050" y="257" font-size="40" text-anchor="middle">数直線</text><path d="M310 300V720" stroke="#a0b6ce" stroke-width="24"/><path d="M310 720V699" stroke="#1f5fa8" stroke-width="14"/><circle cx="310" cy="742" r="27" fill="#1f5fa8"/><path d="M660 520H1440" stroke="#203348" stroke-width="4"/><path d="M280 720H340 M670 505V535" stroke="#203348" stroke-width="2"/><path d="M280 699H340 M708 505V535" stroke="#203348" stroke-width="2"/><path d="M280 678H340 M746 505V535" stroke="#203348" stroke-width="2"/><path d="M280 657H340 M784 505V535" stroke="#203348" stroke-width="2"/><path d="M280 636H340 M822 505V535" stroke="#203348" stroke-width="2"/><path d="M280 615H340 M860 505V535" stroke="#203348" stroke-width="2"/><path d="M280 594H340 M898 505V535" stroke="#203348" stroke-width="2"/><path d="M280 573H340 M936 505V535" stroke="#203348" stroke-width="2"/><path d="M280 552H340 M974 505V535" stroke="#203348" stroke-width="2"/><path d="M280 531H340 M1012 505V535" stroke="#203348" stroke-width="2"/><path d="M280 510H340 M1050 505V535" stroke="#1f5fa8" stroke-width="5"/><path d="M280 489H340 M1088 505V535" stroke="#203348" stroke-width="2"/><path d="M280 468H340 M1126 505V535" stroke="#203348" stroke-width="2"/><path d="M280 447H340 M1164 505V535" stroke="#203348" stroke-width="2"/><path d="M280 426H340 M1202 505V535" stroke="#203348" stroke-width="2"/><path d="M280 405H340 M1240 505V535" stroke="#203348" stroke-width="2"/><path d="M280 384H340 M1278 505V535" stroke="#203348" stroke-width="2"/><path d="M280 363H340 M1316 505V535" stroke="#203348" stroke-width="2"/><path d="M280 342H340 M1354 505V535" stroke="#203348" stroke-width="2"/><path d="M280 321H340 M1392 505V535" stroke="#203348" stroke-width="2"/><path d="M280 300H340 M1430 505V535" stroke="#203348" stroke-width="2"/><text x="250" y="522" font-size="40" text-anchor="end">0</text><text x="1050" y="585" font-size="40" text-anchor="middle">0</text><text x="390" y="375" font-size="48">＋</text><text x="390" y="650" font-size="48">−</text><text x="790" y="445" font-size="40">負の数 −</text><text x="1180" y="445" font-size="40">正の数 ＋</text><g fill="#1f5fa8" stroke="white" stroke-width="3"><circle cx="310" cy="699" r="15"/><circle cx="708" cy="520" r="15"/></g><path d="M360 699l18 -28 18 28Z M690 475l18 -28 18 28Z" fill="#1f5fa8"/><text x="800" y="850" font-size="40" text-anchor="middle">0から、負の向きへ。同じ数だけ目盛りをたどろう。</text></g></svg>