" width="440.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="490.0" y="271.7" width="440.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="710.0" y="255.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b37">カタカナ</text><text x="710.0" y="330.9" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b37">漢字の一部分をとって生まれた</text></g><g data-id="b44"><rect x="30.0" y="397.0" width="900.0" height="120.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="30.0" y="397.0" width="900.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="30.0" y="436.7" width="900.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="420.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b44">万葉仮名</text><text x="480.0" y="468.5" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b44">漢字の音を借りて日本語を書き表した（例：「波流」で「はる」）。漢字＝意味を表す（表意文字）、</text><text x="480.0" y="492.8" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b44">仮名＝音を表す（表音文字）。</text></g></svg>
