<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：単語のいろいろ"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：単語のいろいろ</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">自立語と付属語</text><text x="40.0" y="198.0" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="198.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（？）：それだけで意</text><text x="61.0" y="226.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">味がわかり、文節の最</text><text x="61.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">初にくる（山・走る・</text><text x="61.0" y="283.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">白い）。</text><text x="40.0" y="318.7" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">付属語：それだけでは</text><text x="61.0" y="347.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">意味がわからず、</text><text x="61.0" y="375.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">自立語のあとにつく</text><text x="61.0" y="403.8" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">（が・を・た・ない）。</text></g><g data-id="b18"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b18">十の品詞</text><text x="346.0" y="181.6" font-size="14" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b18">・</text><text x="360.0" y="181.6" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">自立語・活用する：動詞（ウ段で終</text><text x="360.0" y="200.5" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">わる：走る）、形容詞（い</text><text x="360.0" y="219.4" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">で終わる：白い）、（？）（だ</text><text x="360.0" y="238.3" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">で終わる：静かだ）。</text><text x="346.0" y="262.1" font-size="14" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b18">・</text><text x="360.0" y="262.1" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">自立語・活用しない：名詞（主語に</text><text x="360.0" y="281.0" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">なる）、副詞（主に用言をくわしく</text><text x="360.0" y="299.9" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">する：ゆっくり）、連体詞（体言だ</text><text x="360.0" y="318.8" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">けをくわしくする：この・大きな）、</text><text x="360.0" y="337.7" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">接続詞（だから・しかし）、</text><text x="360.0" y="356.6" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">感動詞（はい・ああ）。</text><text x="346.0" y="380.4" font-size="14" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b18">・</text><text x="360.0" y="380.4" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">付属語：（？）（活用する：た・</text><text x="360.0" y="399.3" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">ない・れる）、助詞（活用しない：</text><text x="360.0" y="418.2" font-size="14" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b18">が・を・は）。</text></g><g data-id="b40"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b40">用言と体言</text><text x="652.0" y="240.5" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b40">・</text><text x="673.0" y="240.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b40">用言：動詞・形容詞・</text><text x="673.0" y="268.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b40">形容動詞（活用して述</text><text x="673.0" y="297.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b40">語になる）。</text><text x="652.0" y="332.9" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b40">・</text><text x="673.0" y="332.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b40">体言：名詞（主語にな</text><text x="673.0" y="361.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b40">る）。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
