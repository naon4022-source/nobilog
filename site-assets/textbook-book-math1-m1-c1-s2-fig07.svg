<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">自然数・整数・数全体の集合の包含関係</title><desc id="desc">外側から数全体、整数、自然数の枠が入れ子になっている。自然数の枠に4と9、整数の枠に0、−2、−15、数全体の枠に0.6と−3/7。</desc><rect width="1000" height="700" fill="white"/><g font-family="system-ui,sans-serif" fill="#222">
