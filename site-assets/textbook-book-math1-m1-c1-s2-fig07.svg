<rect x="120" y="235" width="820" height="330" rx="16" fill="white" stroke="#222" stroke-width="2" data-region="integer" stroke-dasharray="10 6"/>
<rect x="500" y="350" width="370" height="180" rx="16" fill="white" stroke="#222" stroke-width="2" data-region="natural"/>
<text x="80" y="110" font-size="36" text-anchor="start">数全体</text>
<text x="150" y="290" font-size="36" text-anchor="start">整数</text>
<text x="530" y="405" font-size="36" text-anchor="start">自然数</text>
<text x="90" y="190" font-size="40" text-anchor="start" data-region-value="all">0.6</text>
<g data-stacked-fraction="−3/7" aria-label="−3/7" role="img" font-size="40" data-region-value="all" text-anchor="start"><title>−3/7</title><text x="270" y="190" font-size="40" text-anchor="start">−</text><text x="307.156597328186" y="167.42222328186034" font-size="29.6" text-anchor="middle">3</text><line x1="297.35555534362794" x2="316.9576393127441" y1="180" y2="180" stroke="rgb(34, 34, 34)" stroke-width="1.7999999999999998"/><text x="307.156597328186" y="212.02222328186036" font-size="29.6" text-anchor="middle">7</text></g>
<text x="180" y="365" font-size="40" text-anchor="start" data-region-value="integer">0</text>
<text x="310" y="365" font-size="40" text-anchor="start" data-region-value="integer">−2</text>
<text x="180" y="475" font-size="40" text-anchor="start" data-region-value="integer">−15</text>
<text x="590" y="475" font-size="40" text-anchor="start" data-region-value="natural">4</text>
<text x="770" y="475" font-size="40" text-anchor="start" data-region-value="natural">9</text>
<text x="500" y="669" font-size="32" text-anchor="middle">自然数 ⊂ 整数 ⊂ 数全体</text>
