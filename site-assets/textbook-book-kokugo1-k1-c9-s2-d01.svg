<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="入れ子構造"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">入れ子構造（額縁構造）：少年の日の思い出</text><rect x="40.0" y="72.0" width="880.0" height="330.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="4"/><text x="70.0" y="112.0" font-size="24" font-weight="800" fill="#1f5fa8" text-anchor="start">外側の話＝現在：「私」と「客」の会話</text><rect x="110.0" y="137.0" width="740.0" height="240.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="4"/><text x="140.0" y="177.0" font-size="22" font-weight="800" fill="#e07a1f" text-anchor="start">内側の話＝過去：「客」の少年時代の思い出（「僕」の視点）</text><g data-id="b6"><rect x="150.0" y="212.0" width="200.0" height="110.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="250.0" y="269.9" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b6">ちょうへの熱中</text></g><line x1="352.0" y1="267.0" x2="375.0" y2="267.0" stroke="#e07a1f" stroke-width="4" stroke-linecap="round"/><polygon points="383.0,267.0 374.0,271.3 374.0,262.7" fill="#e07a1f"/><g data-id="b12"><rect x="385.0" y="212.0" width="200.0" height="110.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="485.0" y="256.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b12">エーミールへの</text><text x="485.0" y="283.4" font-size="20" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b12">気持ち</text></g><line x1="587.0" y1="267.0" x2="610.0" y2="267.0" stroke="#e07a1f" stroke-width="4" stroke-linecap="round"/><polygon points="618.0,267.0 609.0,271.3 609.0,262.7" fill="#e07a1f"/><g data-id="b19"><rect x="620.0" y="212.0" width="200.0" height="110.0" rx="14" fill="#fdecee" stroke="#c8414f" stroke-width="3"/><text x="720.0" y="269.3" font-size="16" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b19">出来事のあとの後悔</text></g><g data-id="b23"><rect x="40.0" y="420.0" width="880.0" height="100.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="480.0" y="459.9" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b23">外側の話で、なぜ「客」が思い出を語るのかがわかる。「僕」</text><text x="480.0" y="485.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b23">が最後にした行動の意味を考える。</text></g></svg>
