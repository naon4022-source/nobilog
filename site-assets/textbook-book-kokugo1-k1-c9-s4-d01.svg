<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="熟語・漢字のまとめ"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">熟語・漢字のまとめ：部首と意味で見分ける</text><g data-id="b2"><rect x="30.0" y="72.0" width="288.0" height="448.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="72.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="111.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">形の似た漢字</text><text x="40.0" y="250.8" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="250.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">積（面積）・績（成績）：</text><text x="59.0" y="276.5" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">禾は作物、糸は糸をつむ</text><text x="59.0" y="302.1" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">ぐ仕事</text><text x="40.0" y="334.4" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="334.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">険（危険）・検（検査）</text><text x="59.0" y="360.1" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">・験（試験）</text><text x="40.0" y="392.4" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="392.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">部首の意味で見分ける</text></g><g data-id="b17"><rect x="336.0" y="72.0" width="288.0" height="448.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="72.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="111.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b17">同音異義語</text><text x="346.0" y="250.5" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b17">・</text><text x="367.0" y="250.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">対象：調査の対象</text><text x="346.0" y="286.2" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b17">・</text><text x="367.0" y="286.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">対照：比べる</text><text x="346.0" y="321.9" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b17">・</text><text x="367.0" y="321.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">対称：左右対称</text><text x="346.0" y="357.6" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b17">・</text><text x="367.0" y="357.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">意外な結果／それ以外</text><text x="346.0" y="393.3" font-size="21" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b17">・</text><text x="367.0" y="393.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b17">文の意味から選ぶ</text></g><g data-id="b33"><rect x="642.0" y="72.0" width="288.0" height="448.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="72.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="111.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="95.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b33">一年間の復習</text><text x="652.0" y="275.7" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b33">・</text><text x="673.0" y="275.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b33">まちがえた漢字だけの</text><text x="673.0" y="304.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b33">「自分の漢字ノート」</text><text x="652.0" y="339.7" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b33">・</text><text x="673.0" y="339.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b33">熟語で三つ書けるか確</text><text x="673.0" y="368.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b33">かめる</text></g></svg>
