<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="漢字の練習1"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">漢字の練習1：分けて覚える・送りがな・同じ読みの漢字</text><rect x="90.0" y="92.0" width="100.0" height="100.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><text x="140.0" y="167.0" font-size="70" font-weight="600" fill="#1d2b3a" text-anchor="middle">想</text><text x="216.0" y="162.0" font-size="50" font-weight="700" fill="#8a96a3" text-anchor="middle">＝</text><rect x="250.0" y="92.0" width="100.0" height="100.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><text x="300.0" y="167.0" font-size="70" font-weight="600" fill="#1d2b3a" text-anchor="middle">木</text><rect x="410.0" y="92.0" width="100.0" height="100.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><text x="460.0" y="167.0" font-size="70" font-weight="600" fill="#1d2b3a" text-anchor="middle">目</text><text x="376.0" y="162.0" font-size="50" font-weight="700" fill="#8a96a3" text-anchor="middle">＋</text><rect x="570.0" y="92.0" width="100.0" height="100.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><text x="620.0" y="167.0" font-size="70" font-weight="600" fill="#1d2b3a" text-anchor="middle">心</text><text x="536.0" y="162.0" font-size="50" font-weight="700" fill="#8a96a3" text-anchor="middle">＋</text><text x="800.0" y="152.0" font-size="22" font-weight="700" fill="#1f5fa8" text-anchor="middle">部分に分けて覚える</text><g data-id="b14"><rect x="40.0" y="220.0" width="420.0" height="150.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="40.0" y="220.0" width="420.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="40.0" y="259.7" width="420.0" height="8.0" rx="0" fill="#e07a1f"/><text x="250.0" y="243.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b14">送りがなのきまり</text><text x="250.0" y="294.4" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b14">活用する部分を送る</text><text x="250.0" y="318.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b14">書く・書かない・書きます</text><text x="250.0" y="343.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b14">迷ったら形を変えて、変わる部分から送る</text></g><g data-id="b23"><rect x="490.0" y="220.0" width="140.0" height="150.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="490.0" y="220.0" width="140.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="490.0" y="259.7" width="140.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="560.0" y="243.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b23">計</text><text x="560.0" y="303.3" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b23">時間は</text><text x="560.0" y="335.7" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b23">計る</text></g><g data-id="b31"><rect x="640.0" y="220.0" width="140.0" height="150.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><rect x="640.0" y="220.0" width="140.0" height="47.7" rx="14" fill="#6a4aa0"/><rect x="640.0" y="259.7" width="140.0" height="8.0" rx="0" fill="#6a4aa0"/><text x="710.0" y="243.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b31">測</text><text x="710.0" y="303.3" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b31">長さは</text><text x="710.0" y="335.7" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b31">測る</text></g><g data-id="b39"><rect x="790.0" y="220.0" width="140.0" height="150.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="790.0" y="220.0" width="140.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="790.0" y="259.7" width="140.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="860.0" y="243.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b39">量</text><text x="860.0" y="303.3" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b39">重さは</text><text x="860.0" y="335.7" font-size="24" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b39">量る</text></g><g data-id="b47"><rect x="40.0" y="390.0" width="880.0" height="120.0" rx="14" fill="#f0ebf8" stroke="#6a4aa0" stroke-width="3"/><rect x="40.0" y="390.0" width="880.0" height="47.7" rx="14" fill="#6a4aa0"/><rect x="40.0" y="429.7" width="880.0" height="8.0" rx="0" fill="#6a4aa0"/><text x="480.0" y="413.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b47">覚えるコツ</text><text x="480.0" y="461.5" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b47">一字で覚えるより熟語で覚えると、意味もいっしょに覚えられる。作文や日記で使うと定着する。</text><text x="480.0" y="485.8" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="middle" data-box="b47">「会う・合う」：人に会う、意見が合う。</text></g></svg>
