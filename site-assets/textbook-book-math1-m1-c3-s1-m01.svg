<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>まちがいと正しい考え方</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><text x="800.0" y="90.0" font-size="44" fill="#203348" text-anchor="middle" font-weight="800">よくあるまちがい</text><rect x="60.0" y="140.0" width="700.0" height="640.0" rx="18" fill="white" stroke="#c0392b" stroke-width="6" stroke-dasharray="18 10"/><rect x="840.0" y="140.0" width="700.0" height="640.0" rx="18" fill="white" stroke="#2a8a5b" stroke-width="6"/><text x="410.0" y="240.0" font-size="80" fill="#c0392b" text-anchor="middle" font-weight="700">✗</text><text x="1190.0" y="240.0" font-size="80" fill="#2a8a5b" text-anchor="middle" font-weight="700">○</text><text x="410.0" y="340.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">方程式 2x＋1＝7 で</text><text x="410.0" y="394.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">x＝3 を入れて</text><text x="410.0" y="448.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">左辺 ＝ 7 だけ計算</text><text x="410.0" y="502.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">「7 になったから解」</text><ellipse cx="410.0" cy="488.0" rx="261.0" ry="38.0" fill="none" stroke="#c0392b" stroke-width="6"/><line x1="410.0" y1="690.0" x2="410.0" y2="532.0" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/><polygon points="410.0,532.0 417.8,548.2 402.2,548.2" fill="#c0392b" stroke="none" stroke-width="4" stroke-linejoin="round"/><text x="410.0" y="740.0" font-size="46" fill="#c0392b" text-anchor="middle" font-weight="800">ここ！</text><rect x="880.0" y="320.0" width="620.0" height="90.0" rx="16" fill="#edf5ef" stroke="none" stroke-width="4"/><text x="1190.0" y="380.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">左辺 ＝ 2×3＋1 ＝ 7</text><line x1="1190.0" y1="414.0" x2="1190.0" y2="448.0" stroke="#2a8a5b" stroke-width="6" stroke-linecap="round"/><polygon points="1190.0,448.0 1182.2,431.8 1197.8,431.8" fill="#2a8a5b" stroke="none" stroke-width="4" stroke-linejoin="round"/><rect x="880.0" y="452.0" width="620.0" height="90.0" rx="16" fill="#edf5ef" stroke="none" stroke-width="4"/><text x="1190.0" y="512.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">右辺 ＝ 7</text><line x1="1190.0" y1="546.0" x2="1190.0" y2="580.0" stroke="#2a8a5b" stroke-width="6" stroke-linecap="round"/><polygon points="1190.0,580.0 1182.2,563.8 1197.8,563.8" fill="#2a8a5b" stroke="none" stroke-width="4" stroke-linejoin="round"/><rect x="880.0" y="584.0" width="620.0" height="90.0" rx="16" fill="#edf5ef" stroke="none" stroke-width="4"/><text x="1190.0" y="644.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">左辺 ＝ 右辺 → 解</text><text x="800.0" y="850.0" font-size="40" fill="#203348" text-anchor="middle" font-weight="700">左辺と右辺の両方を計算して、等しいかを見る</text></g></svg>