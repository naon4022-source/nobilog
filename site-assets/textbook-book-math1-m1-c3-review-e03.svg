<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>まちがえやすい所の地図</title><g font-family="Hiragino Sans,Hiragino Kaku Gothic ProN,sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f6f8fc" stroke="none" stroke-width="4"/><rect x="40.0" y="30.0" width="632.0" height="76.0" rx="20" fill="#e8f0fa" stroke="none" stroke-width="4"/><text x="70.0" y="84.0" font-size="44" fill="#1f5fa8" text-anchor="start" font-weight="800">方程式の まちがえやすい所</text><text x="500.0" y="175.0" font-size="44" fill="#c0392b" text-anchor="middle" font-weight="800">✗ のれい</text><text x="1150.0" y="175.0" font-size="44" fill="#2a8a5b" text-anchor="middle" font-weight="800">○ なおし方</text><rect x="150.0" y="210.0" width="700.0" height="120.0" rx="18" fill="white" stroke="#c0392b" stroke-width="4" stroke-dasharray="12 8"/><text x="500.0" y="286.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">移項で符号そのまま</text><line x1="860.0" y1="270.0" x2="920.0" y2="270.0" stroke="#203348" stroke-width="5" stroke-linecap="round"/><polygon points="920.0,270.0 903.8,277.8 903.8,262.2" fill="#203348" stroke="none" stroke-width="4" stroke-linejoin="round"/><rect x="930.0" y="210.0" width="520.0" height="120.0" rx="18" fill="#edf5ef" stroke="#2a8a5b" stroke-width="4"/><text x="1190.0" y="286.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">移すと符号が変わる</text><rect x="150.0" y="360.0" width="700.0" height="120.0" rx="18" fill="white" stroke="#c0392b" stroke-width="4" stroke-dasharray="12 8"/><text x="500.0" y="436.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">かっこの後ろだけにかける</text><line x1="860.0" y1="420.0" x2="920.0" y2="420.0" stroke="#203348" stroke-width="5" stroke-linecap="round"/><polygon points="920.0,420.0 903.8,427.8 903.8,412.2" fill="#203348" stroke="none" stroke-width="4" stroke-linejoin="round"/><rect x="930.0" y="360.0" width="520.0" height="120.0" rx="18" fill="#edf5ef" stroke="#2a8a5b" stroke-width="4"/><text x="1190.0" y="436.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">かっこの中の全部にかける</text><rect x="150.0" y="510.0" width="700.0" height="120.0" rx="18" fill="white" stroke="#c0392b" stroke-width="4" stroke-dasharray="12 8"/><text x="500.0" y="586.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">分母をはらうとき1項かけ忘れ</text><line x1="860.0" y1="570.0" x2="920.0" y2="570.0" stroke="#203348" stroke-width="5" stroke-linecap="round"/><polygon points="920.0,570.0 903.8,577.8 903.8,562.2" fill="#203348" stroke="none" stroke-width="4" stroke-linejoin="round"/><rect x="930.0" y="510.0" width="520.0" height="120.0" rx="18" fill="#edf5ef" stroke="#2a8a5b" stroke-width="4"/><text x="1190.0" y="586.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">すべての項にかける</text><rect x="150.0" y="660.0" width="700.0" height="120.0" rx="18" fill="white" stroke="#c0392b" stroke-width="4" stroke-dasharray="12 8"/><text x="500.0" y="736.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">答えを確かめない</text><line x1="860.0" y1="720.0" x2="920.0" y2="720.0" stroke="#203348" stroke-width="5" stroke-linecap="round"/><polygon points="920.0,720.0 903.8,727.8 903.8,712.2" fill="#203348" stroke="none" stroke-width="4" stroke-linejoin="round"/><rect x="930.0" y="660.0" width="520.0" height="120.0" rx="18" fill="#edf5ef" stroke="#2a8a5b" stroke-width="4"/><text x="1190.0" y="736.0" font-size="38" fill="#203348" text-anchor="middle" font-weight="700">もとの式・問題文に入れる</text></g></svg>