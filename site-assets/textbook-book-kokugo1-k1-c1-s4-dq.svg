<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：言葉の単位"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：言葉の単位</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">五つの単位</text><text x="40.0" y="162.4" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="162.4" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">文章（談話）：まとまっ</text><text x="59.0" y="188.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">た内容を表す全体。</text><text x="59.0" y="213.7" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">話し言葉なら談話。</text><text x="40.0" y="246.0" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="246.0" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">段落：文章の中の、</text><text x="59.0" y="271.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">内容のまとまり。</text><text x="59.0" y="297.3" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">書き出しを一字下げる。</text><text x="40.0" y="329.6" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="329.6" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">文：「。」までのひと続</text><text x="59.0" y="355.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">き。</text><text x="40.0" y="387.5" font-size="19" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="59.0" y="387.5" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">文節：意味がわかる範囲</text><text x="59.0" y="413.2" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">で、文をできるだけ短く</text><text x="59.0" y="438.8" font-size="19" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">区切ったひとまとまり。</text></g><g data-id="b23"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b23">文節の区切り方</text><text x="346.0" y="160.5" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b23">・</text><text x="364.0" y="160.5" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">「ネ」を入れてみて、</text><text x="364.0" y="184.8" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">自然に言えるところで区切</text><text x="364.0" y="209.1" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">る。例：私は（ネ）</text><text x="364.0" y="233.4" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">本を（ネ）読む。→</text><text x="364.0" y="257.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">私は／本を／読む。</text><text x="364.0" y="282.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">（3文節）</text><text x="346.0" y="312.6" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b23">・</text><text x="364.0" y="312.6" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">一つの文節には、自立語</text><text x="364.0" y="336.9" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">（それだけで意味がわかる</text><text x="364.0" y="361.2" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">語）が必ず一つだけある。</text><text x="346.0" y="391.8" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b23">・</text><text x="364.0" y="391.8" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">「読んで／いる」のように、</text><text x="364.0" y="416.1" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">「〜て（で）いる」</text><text x="364.0" y="440.4" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b23">は二つの文節に分ける。</text></g><g data-id="b44"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b44">単語の区切り方</text><text x="652.0" y="212.2" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b44">・</text><text x="673.0" y="212.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">文節をさらに意味のあ</text><text x="673.0" y="240.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">る最小の部分に分ける。</text><text x="673.0" y="268.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">例：私／は／本／を／</text><text x="673.0" y="297.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">読む。（5単語）</text><text x="652.0" y="332.9" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b44">・</text><text x="673.0" y="332.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">「は」「を」「が」</text><text x="673.0" y="361.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">などは、それだけで一</text><text x="673.0" y="389.6" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b44">つの単語。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
