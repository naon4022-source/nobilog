<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif' role="img" aria-label="確認問題を解く手がかり：水溶液と溶解度"><rect width="960" height="540" fill="#ffffff"/><rect x="0.0" y="0.0" width="960.0" height="54.0" rx="0" fill="#e8f0fa"/><text x="480.0" y="30.6" font-size="26" font-weight="800" fill="#1f5fa8" text-anchor="middle" data-box="title">確認問題を解く手がかり：水溶液と溶解度</text><g data-id="b2"><rect x="30.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="3"/><rect x="30.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#1f5fa8"/><rect x="30.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#1f5fa8"/><text x="174.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b2">質量パーセント濃度</text><text x="40.0" y="226.3" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="226.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">濃度〔%〕＝ 溶質の質</text><text x="61.0" y="254.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">量 ÷ 溶液の質量 ×</text><text x="61.0" y="283.0" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">100。</text><text x="40.0" y="318.7" font-size="21" font-weight="700" fill="#1f5fa8" text-anchor="start" data-box="b2">・</text><text x="61.0" y="318.7" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">溶液の質量 ＝</text><text x="61.0" y="347.1" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">溶質の質量 ＋</text><text x="61.0" y="375.4" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b2">溶媒の質量。</text></g><g data-id="b16"><rect x="336.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#fff6e8" stroke="#e07a1f" stroke-width="3"/><rect x="336.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#e07a1f"/><rect x="336.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#e07a1f"/><text x="480.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b16">溶解度と再結晶</text><text x="346.0" y="172.7" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="364.0" y="172.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">溶解度は温度によって変わ</text><text x="364.0" y="197.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">る（硝酸カリウムは温度で</text><text x="364.0" y="221.3" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">大きく変わる、塩化ナトリ</text><text x="364.0" y="245.6" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">ウムはあまり変わらない）。</text><text x="346.0" y="276.2" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="364.0" y="276.2" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">（？）：一度とかした物質</text><text x="364.0" y="300.5" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">を、冷やしたり水を蒸発さ</text><text x="364.0" y="324.8" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">せたりして結晶としてとり</text><text x="364.0" y="349.1" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">出すこと。</text><text x="346.0" y="379.7" font-size="18" font-weight="700" fill="#e07a1f" text-anchor="start" data-box="b16">・</text><text x="364.0" y="379.7" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">冷やしてとり出せる質量＝</text><text x="364.0" y="404.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">高い温度でとけていた量</text><text x="364.0" y="428.3" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b16">− 低い温度での溶解度。</text></g><g data-id="b36"><rect x="642.0" y="68.0" width="288.0" height="414.0" rx="14" fill="#e6f5ec" stroke="#2a8a5b" stroke-width="3"/><rect x="642.0" y="68.0" width="288.0" height="47.7" rx="14" fill="#2a8a5b"/><rect x="642.0" y="107.7" width="288.0" height="8.0" rx="0" fill="#2a8a5b"/><text x="786.0" y="91.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" data-box="b36">ろ過</text><text x="652.0" y="240.5" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b36">・</text><text x="673.0" y="240.5" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b36">ろうとのあしの長いほ</text><text x="673.0" y="268.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b36">うをビーカーのかべに</text><text x="673.0" y="297.2" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b36">つける。</text><text x="652.0" y="332.9" font-size="21" font-weight="700" fill="#2a8a5b" text-anchor="start" data-box="b36">・</text><text x="673.0" y="332.9" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b36">ガラス棒を伝わらせて</text><text x="673.0" y="361.3" font-size="21" font-weight="700" fill="#1d2b3a" text-anchor="start" data-box="b36">液を注ぐ。</text></g><rect x="20.0" y="492.0" width="920.0" height="40.0" rx="12" fill="#fff8d6" stroke="#f6c945" stroke-width="2"/><text x="70.0" y="519.0" font-size="18" font-weight="700" fill="#1d2b3a" text-anchor="start">（？）に入る言葉が、確認問題の答えにつながるよ。本文で見つけよう。</text><g transform="translate(40,520) scale(0.5)"><path d="M0,-30 Q-26,-54 -6,-68 Q4,-48 0,-30Z" fill="#3fa34d"/><path d="M0,-30 Q26,-54 6,-68 Q-4,-48 0,-30Z" fill="#2a7a37"/><ellipse cx="0" cy="0" rx="30" ry="27" fill="#8fd19e" stroke="#2a7a37" stroke-width="3"/><circle cx="-10" cy="-4" r="3.5" fill="#1d2b3a"/><circle cx="10" cy="-4" r="3.5" fill="#1d2b3a"/><path d="M-7,6 Q0,12 7,6" fill="none" stroke="#1d2b3a" stroke-width="2.5" stroke-linecap="round"/></g></svg>
