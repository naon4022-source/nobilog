<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="sans-serif" role="img" aria-label="光軸の上に、物体・凸レンズ・スクリーンが並んでいる。物体は焦点より外側にある。像はかいていない。">
  <title>凸レンズと物体・スクリーンの位置（像はかいていない）</title>
  <!-- 焦点距離 f = 80px。レンズ x=320。焦点 x=240・400。物体 x=120（レンズから2.5f）。 -->
  <line x1="40" y1="150" x2="600" y2="150" stroke="#444" stroke-width="1.5"/>
  <text x="600" y="140" font-size="14" text-anchor="end" fill="#444">光軸</text>
  <path d="M320,60 Q345,150 320,240 Q295,150 320,60 Z" fill="#cfe8ff" stroke="#06c" stroke-width="2"/>
  <text x="320" y="268" font-size="16" text-anchor="middle">凸レンズ</text>
  <g fill="#c00"><circle cx="240" cy="150" r="4"/><circle cx="400" cy="150" r="4"/></g>
  <text x="240" y="174" font-size="16" text-anchor="middle" fill="#c00">焦点</text>
  <text x="400" y="174" font-size="16" text-anchor="middle" fill="#c00">焦点</text>
  <!-- 物体（上向きの矢印） -->
  <line x1="120" y1="150" x2="120" y2="95" stroke="#222" stroke-width="3"/>
  <polygon points="120,85 112,100 128,100" fill="#222"/>
  <text x="120" y="178" font-size="16" text-anchor="middle">物体</text>
  <!-- スクリーン：像がはっきりうつる位置 x=320+400/3≈453（1/f=1/a+1/b で計算）。像はかかない -->
  <rect x="449" y="70" width="8" height="160" fill="#888"/>
  <text x="453" y="256" font-size="16" text-anchor="middle">スクリーン</text>
</svg>
