<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 323" width="340" height="323" role="img">
<title>回転の軸ℓ（点線）が中を通る長方形。ℓの左に1cm、右に3cm、たて4cm。</title>
<rect width="100%" height="100%" fill="#fff"/>
<g fill="none" stroke="#111" stroke-width="1.8" font-family="sans-serif">
<path d="M80.0,251.4 L251.4,251.4 L251.4,80.0 L80.0,80.0 Z" fill="#d9d9d9" stroke="none" fill-rule="evenodd"/>
<polygon points="80.0,251.4 251.4,251.4 251.4,80.0 80.0,80.0"/>
<line x1="122.9" y1="290.0" x2="122.9" y2="37.1" stroke-dasharray="5 4"/>
<text x="134.9" y="37.1" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">ℓ</text>
<text x="101.4" y="265.4" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">1 cm</text>
<text x="187.1" y="265.4" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">3 cm</text>
<text x="275.4" y="165.7" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">4 cm</text>
</g>
</svg>
