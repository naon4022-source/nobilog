<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 340" width="310" height="340" role="img">
<title>三角柱の展開図。たて7cm、横3cm・4cm・5cmに分かれた長方形と、上下の直角三角形。</title>
<rect width="100%" height="100%" fill="#fff"/>
<g fill="none" stroke="#111" stroke-width="1.8" font-family="sans-serif">
<polygon points="38.5,234.8 260.7,234.8 260.7,105.2 38.5,105.2"/>
<line x1="94.1" y1="234.8" x2="94.1" y2="105.2" stroke-dasharray="5 4"/>
<line x1="168.1" y1="234.8" x2="168.1" y2="105.2" stroke-dasharray="5 4"/>
<polygon points="94.1,105.2 168.1,105.2 94.1,49.6"/>
<polygon points="94.1,234.8 168.1,234.8 94.1,290.4"/>
<text x="66.3" y="248.8" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">3 cm</text>
<text x="131.1" y="248.8" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">4 cm</text>
<text x="214.4" y="248.8" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">5 cm</text>
<text x="282.7" y="170.0" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">7 cm</text>
</g>
</svg>
