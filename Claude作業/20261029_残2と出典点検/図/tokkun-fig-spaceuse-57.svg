<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 270" width="220" height="270" role="img">
<title>立方体の展開図。たてに4つ（下から い、う、え、か）が並び、いちばん下の「い」の左に「あ」、下から3つめの「え」の右に「お」がつく。</title>
<rect width="100%" height="100%" fill="#fff"/>
<g fill="none" stroke="#111" stroke-width="1.8" font-family="sans-serif">
<polygon points="35.0,235.0 85.0,235.0 85.0,185.0 35.0,185.0"/>
<text x="60.0" y="210.0" font-size="20" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">あ</text>
<polygon points="85.0,235.0 135.0,235.0 135.0,185.0 85.0,185.0"/>
<text x="110.0" y="210.0" font-size="20" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">い</text>
<polygon points="85.0,185.0 135.0,185.0 135.0,135.0 85.0,135.0"/>
<text x="110.0" y="160.0" font-size="20" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">う</text>
<polygon points="85.0,135.0 135.0,135.0 135.0,85.0 85.0,85.0"/>
<text x="110.0" y="110.0" font-size="20" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">え</text>
<polygon points="135.0,135.0 185.0,135.0 185.0,85.0 135.0,85.0"/>
<text x="160.0" y="110.0" font-size="20" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">お</text>
<polygon points="85.0,85.0 135.0,85.0 135.0,35.0 85.0,35.0"/>
<text x="110.0" y="60.0" font-size="20" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">か</text>
</g>
</svg>
