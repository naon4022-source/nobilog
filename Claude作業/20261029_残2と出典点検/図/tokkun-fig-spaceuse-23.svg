<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 310" width="310" height="310" role="img">
<title>立方体ABCD−EFGHの見取図。上の面ABCD、下の面EFGHで、Aの真下がE、Bの真下がF、Cの真下がG、Dの真下がH。見えない辺は点線。</title>
<rect width="100%" height="100%" fill="#fff"/>
<g fill="none" stroke="#111" stroke-width="1.8" font-family="sans-serif">
<line x1="70.1" y1="114.5" x2="195.5" y2="114.5"/>
<line x1="195.5" y1="114.5" x2="239.9" y2="70.1"/>
<line x1="114.5" y1="70.1" x2="239.9" y2="70.1"/>
<line x1="70.1" y1="114.5" x2="114.5" y2="70.1"/>
<line x1="70.1" y1="239.9" x2="114.5" y2="195.5" stroke-dasharray="5 4"/>
<line x1="239.9" y1="195.5" x2="114.5" y2="195.5" stroke-dasharray="5 4"/>
<line x1="195.5" y1="239.9" x2="239.9" y2="195.5"/>
<line x1="70.1" y1="239.9" x2="195.5" y2="239.9"/>
<line x1="70.1" y1="114.5" x2="70.1" y2="239.9"/>
<line x1="195.5" y1="114.5" x2="195.5" y2="239.9"/>
<line x1="239.9" y1="70.1" x2="239.9" y2="195.5"/>
<line x1="114.5" y1="70.1" x2="114.5" y2="195.5" stroke-dasharray="5 4"/>
<text x="55.1" y="114.5" font-size="17" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111" font-style="italic">A</text>
<text x="187.8" y="101.6" font-size="17" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111" font-style="italic">B</text>
<text x="250.5" y="59.5" font-size="17" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111" font-style="italic">C</text>
<text x="103.9" y="59.5" font-size="17" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111" font-style="italic">D</text>
<text x="59.5" y="250.5" font-size="17" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111" font-style="italic">E</text>
<text x="206.1" y="250.5" font-size="17" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111" font-style="italic">F</text>
<text x="254.9" y="195.5" font-size="17" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111" font-style="italic">G</text>
<text x="125.1" y="184.9" font-size="17" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111" font-style="italic">H</text>
</g>
</svg>
