<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 340" width="304" height="340" role="img">
<title>直角をはさむ辺が3cmと4cmの直角三角形。4cmの辺が回転の軸ℓ（点線）の上にある。</title>
<rect width="100%" height="100%" fill="#fff"/>
<g fill="none" stroke="#111" stroke-width="1.8" font-family="sans-serif">
<path d="M74.5,265.5 L210.9,265.5 L74.5,83.6 Z" fill="#d9d9d9" stroke="none" fill-rule="evenodd"/>
<polygon points="74.5,265.5 210.9,265.5 74.5,83.6"/>
<line x1="74.5" y1="306.4" x2="74.5" y2="38.2" stroke-dasharray="5 4"/>
<text x="86.5" y="38.2" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">ℓ</text>
<text x="142.7" y="279.5" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">3 cm</text>
<text x="50.5" y="174.5" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">4 cm</text>
</g>
</svg>
