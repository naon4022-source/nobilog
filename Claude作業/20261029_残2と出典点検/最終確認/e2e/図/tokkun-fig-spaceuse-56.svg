<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 220" width="270" height="220" role="img">
<title>6つの正方形が階段のようにつながったさいころの展開図。左上から、2、空白、3、?、1、空白の順。</title>
<rect width="100%" height="100%" fill="#fff"/>
<g fill="none" stroke="#111" stroke-width="1.8" font-family="sans-serif">
<polygon points="35.0,85.0 85.0,85.0 85.0,35.0 35.0,35.0"/>
<text x="60.0" y="60.0" font-size="20" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">2</text>
<polygon points="85.0,85.0 135.0,85.0 135.0,35.0 85.0,35.0"/>
<polygon points="85.0,135.0 135.0,135.0 135.0,85.0 85.0,85.0"/>
<text x="110.0" y="110.0" font-size="20" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">3</text>
<polygon points="135.0,135.0 185.0,135.0 185.0,85.0 135.0,85.0"/>
<text x="160.0" y="110.0" font-size="20" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">?</text>
<polygon points="135.0,185.0 185.0,185.0 185.0,135.0 135.0,135.0"/>
<text x="160.0" y="160.0" font-size="20" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">1</text>
<polygon points="185.0,185.0 235.0,185.0 235.0,135.0 185.0,135.0"/>
</g>
</svg>
