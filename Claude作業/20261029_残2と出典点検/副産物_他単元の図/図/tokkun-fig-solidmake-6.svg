<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 294" width="340" height="294" role="img">
<title>回転の軸ℓ（点線）から2cmはなれた、たて4cm、横3cmの長方形。</title>
<rect width="100%" height="100%" fill="#fff"/>
<g fill="none" stroke="#111" stroke-width="1.8" font-family="sans-serif">
<path d="M143.1,227.7 L258.5,227.7 L258.5,73.8 L143.1,73.8 Z" fill="#d9d9d9" stroke="none" fill-rule="evenodd"/>
<polygon points="143.1,227.7 258.5,227.7 258.5,73.8 143.1,73.8"/>
<line x1="66.2" y1="262.3" x2="66.2" y2="35.4" stroke-dasharray="5 4"/>
<text x="78.2" y="35.4" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">ℓ</text>
<text x="104.6" y="241.7" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">2 cm</text>
<text x="200.8" y="241.7" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">3 cm</text>
<text x="282.5" y="150.8" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">4 cm</text>
</g>
</svg>
