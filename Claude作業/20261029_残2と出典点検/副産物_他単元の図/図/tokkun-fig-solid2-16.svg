<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 203 280" width="203" height="280" role="img">
<title>円錐の投影図。立面図は底辺6cmの二等辺三角形、平面図は円で中心に点がある。</title>
<rect width="100%" height="100%" fill="#fff"/>
<g fill="none" stroke="#111" stroke-width="1.8" font-family="sans-serif">
<line x1="23.9" y1="112.9" x2="178.7" y2="112.9"/>
<text x="35.5" y="74.2" font-size="13" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">立面図</text>
<text x="35.5" y="182.6" font-size="13" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">平面図</text>
<polygon points="54.8,105.2 171.0,105.2 112.9,27.7"/>
<circle cx="112.9" cy="182.6" r="58.1"/>
<circle cx="112.9" cy="182.6" r="2.6" fill="#111" stroke="none"/>
<text x="112.9" y="182.6" font-size="17" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111" font-style="italic"></text>
<text x="112.9" y="93.2" font-size="14" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">6 cm</text>
</g>
</svg>
