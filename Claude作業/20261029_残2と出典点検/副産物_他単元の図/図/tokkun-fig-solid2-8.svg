<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280" role="img">
<title>投影図。立面図は三角形（中に点線のたての線）、平面図は正三角形で、中心から3つの頂点へ線がひいてある。</title>
<rect width="100%" height="100%" fill="#fff"/>
<g fill="none" stroke="#111" stroke-width="1.8" font-family="sans-serif">
<line x1="25.3" y1="132.0" x2="174.7" y2="132.0"/>
<text x="41.3" y="86.7" font-size="13" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">立面図</text>
<text x="41.3" y="190.7" font-size="13" text-anchor="middle" dominant-baseline="central" stroke="none" fill="#111">平面図</text>
<polygon points="69.9,121.3 162.1,121.3 116.0,36.0"/>
<line x1="116.0" y1="121.3" x2="116.0" y2="36.0" stroke-dasharray="5 4"/>
<polygon points="116.0,134.7 69.8,214.7 162.2,214.7"/>
<line x1="116.0" y1="188.0" x2="116.0" y2="134.7"/>
<line x1="116.0" y1="188.0" x2="69.8" y2="214.7"/>
<line x1="116.0" y1="188.0" x2="162.2" y2="214.7"/>
</g>
</svg>
